11:{"w": [["अजः", "A-jah", "Never born", "జన్మ లేనివాడు", "अजन्मा"], ["सर्वेश्वरः", "Sar-vesh-va-rah", "Lord of all", "అందరికీ ప్రభువు", "सबके स्वामी"], ["सिद्धः", "Sid-dhah", "Always complete", "ఎప్పుడూ పరిపూర్ణుడు", "सदा पूर्ण"], ["सिद्धिः", "Sid-dhih", "The goal we seek", "మనం కోరే గమ్యం", "हमारा लक्ष्य"], ["सर्वादिः", "Sar-vaa-dih", "The beginning of all", "అన్నిటికీ ఆది", "सबका आरंभ"], ["अच्युतः", "Ach-yu-tah", "Never lets His devotees fall", "భక్తులను ఎప్పుడూ జారనివ్వనివాడు", "भक्तों को कभी गिरने न देने वाले"], ["वृषाकपिः", "Vri-shaa-ka-pih", "Is dharma; lifted the earth as the Boar", "ధర్మమే ఆయన; వరాహుడిగా భూమిని ఎత్తినవాడు", "स्वयं धर्म; वराह बनकर पृथ्वी उठाने वाले"], ["अमेयात्मा", "A-me-yaat-maa", "His greatness cannot be measured", "ఆయన గొప్పతనాన్ని కొలవలేము", "जिनकी महिमा मापी न जा सके"], ["सर्वयोगविनिःसृतः", "Sar-va-yo-ga-vi-nis-sri-tah", "Free from every bond", "అన్ని బంధాల నుండి విముక్తుడు", "हर बंधन से मुक्त"]], "v": ["Vishnu was never born; He is Lord of all, always complete, and the goal we seek. He is the beginning of all and never lets His devotees fall. He is dharma itself, and as the Boar He lifted the earth. His greatness cannot be measured, and He is free from every bond.", "విష్ణువుకు జన్మ లేదు; అందరికీ ప్రభువు, ఎప్పుడూ పరిపూర్ణుడు, మనం కోరే గమ్యం. అన్నిటికీ ఆది, భక్తులను ఎప్పుడూ జారనివ్వడు. ధర్మమే ఆయన; వరాహుడిగా భూమిని ఎత్తాడు. ఆయన గొప్పతనాన్ని కొలవలేము; అన్ని బంధాల నుండి విముక్తుడు.", "विष्णु अजन्मा हैं; वे सबके स्वामी, सदा पूर्ण, और हमारा लक्ष्य हैं। वे सबका आरंभ हैं और भक्तों को कभी गिरने नहीं देते। वे स्वयं धर्म हैं, और वराह बनकर उन्होंने पृथ्वी उठाई। उनकी महिमा मापी नहीं जा सकती, और वे हर बंधन से मुक्त हैं।"]},
12:{"w": [["वसुः", "Va-suh", "Lives in all beings", "అన్ని జీవులలో నివసించేవాడు", "सब प्राणियों में बसने वाले"], ["वसुमनाः", "Va-su-ma-naah", "Has a generous heart", "ఉదారమైన మనసు కలవాడు", "उदार मन वाले"], ["सत्यः", "Sat-yah", "Truth itself", "సత్యమే ఆయన", "स्वयं सत्य"], ["समात्मा", "Sa-maat-maa", "Treats everyone equally", "అందరినీ సమానంగా చూసేవాడు", "सबको समान देखने वाले"], ["सम्मितः", "Sam-mi-tah", "Known through the scriptures", "శాస్త్రాల ద్వారా తెలిసేవాడు", "शास्त्रों से जाने जाने वाले"], ["समः", "Sa-mah", "Always the same, calm", "ఎప్పుడూ ఒకేలా, ప్రశాంతంగా ఉండేవాడు", "सदा एक जैसे, शांत"], ["अमोघः", "A-mo-ghah", "Never fails; His blessings always bear fruit", "ఎప్పుడూ విఫలం కానివాడు; ఆయన వరం ఫలిస్తుంది", "कभी विफल नहीं; जिनकी कृपा सदा फल देती है"], ["पुण्डरीकाक्षः", "Pun-da-ree-kaak-shah", "Has lotus eyes; lives in our heart", "తామర కళ్ళవాడు; మన హృదయంలో ఉండేవాడు", "कमल नयन; हमारे हृदय में बसने वाले"], ["वृषकर्मा", "Vri-sha-kar-maa", "All His actions are dharma", "ఆయన పనులన్నీ ధర్మమే", "जिनके सब कर्म धर्म हैं"], ["वृषाकृतिः", "Vri-shaa-kri-tih", "Takes form to protect dharma", "ధర్మం కోసం రూపం దాల్చేవాడు", "धर्म की रक्षा के लिए रूप धरने वाले"]], "v": ["Vishnu lives in all beings and has a generous heart. He is truth itself and treats everyone equally. We know Him through the scriptures, and He is always calm. He never fails; His blessings always bear fruit. He has lotus eyes and lives in our heart. All His actions are dharma, and He takes form to protect dharma.", "విష్ణువు అన్ని జీవులలో నివసిస్తాడు, ఉదారమైన మనసు కలవాడు. సత్యమే ఆయన, అందరినీ సమానంగా చూస్తాడు. శాస్త్రాల ద్వారా ఆయనను తెలుసుకుంటాము; ఎప్పుడూ ప్రశాంతంగా ఉంటాడు. ఎప్పుడూ విఫలం కాడు; ఆయన వరం తప్పక ఫలిస్తుంది. తామర కళ్ళవాడు, మన హృదయంలో ఉంటాడు. ఆయన పనులన్నీ ధర్మమే; ధర్మం కోసం రూపం దాలుస్తాడు.", "विष्णु सब प्राणियों में बसते हैं और उदार मन वाले हैं। वे स्वयं सत्य हैं और सबको समान देखते हैं। हम उन्हें शास्त्रों से जानते हैं, और वे सदा शांत रहते हैं। वे कभी विफल नहीं होते; उनकी कृपा सदा फल देती है। वे कमल नयन हैं और हमारे हृदय में बसते हैं। उनके सब कर्म धर्म हैं, और वे धर्म की रक्षा के लिए रूप धरते हैं।"]},
13:{"w": [["रुद्रः", "Rud-rah", "Removes sorrow", "దుఃఖాన్ని పోగొట్టేవాడు", "दुख दूर करने वाले"], ["बहुशिराः", "Ba-hu-shi-raah", "Has countless heads", "అసంఖ్యాక తలలు కలవాడు", "अनगिनत सिरों वाले"], ["बभ्रुः", "Ba-bhruh", "Supports the worlds", "లోకాలను భరించేవాడు", "लोकों को धारण करने वाले"], ["विश्वयोनिः", "Vish-va-yo-nih", "The source of the universe", "విశ్వానికి మూలం", "विश्व का मूल"], ["शुचिश्रवाः", "Shu-chi-shra-vaah", "His names are pure to hear", "ఆయన నామాలు వినడం పవిత్రం", "जिनके नाम सुनना पवित्र है"], ["अमृतः", "A-mri-tah", "Never dies", "మరణం లేనివాడు", "अमर"], ["शाश्वतस्थाणुः", "Shaash-va-ta-sthaa-nuh", "Eternal and steady", "శాశ్వతుడు, స్థిరమైనవాడు", "शाश्वत और स्थिर"], ["वरारोहः", "Va-raa-ro-hah", "The best goal to reach", "చేరవలసిన ఉత్తమ గమ్యం", "पहुँचने योग्य सबसे उत्तम लक्ष्य"], ["महातपाः", "Ma-haa-ta-paah", "Of great knowledge and power", "గొప్ప జ్ఞానం, శక్తి కలవాడు", "महान ज्ञान और तेज वाले"]], "v": ["Vishnu removes our sorrow. He has countless heads and supports the worlds; He is the source of the universe. Just hearing His names makes us pure. He never dies; He is eternal and steady. He is the best goal to reach, of great knowledge and power.", "విష్ణువు మన దుఃఖాన్ని పోగొడతాడు. అసంఖ్యాక తలలు కలవాడు, లోకాలను భరిస్తాడు; విశ్వానికి మూలం. ఆయన నామాలు వినడమే మనల్ని పవిత్రం చేస్తుంది. మరణం లేనివాడు, శాశ్వతుడు, స్థిరమైనవాడు. చేరవలసిన ఉత్తమ గమ్యం; గొప్ప జ్ఞానం, శక్తి కలవాడు.", "विष्णु हमारा दुख दूर करते हैं। उनके अनगिनत सिर हैं और वे लोकों को धारण करते हैं; वे विश्व का मूल हैं। उनके नाम सुनना ही हमें पवित्र करता है। वे अमर, शाश्वत और स्थिर हैं। वे पहुँचने योग्य सबसे उत्तम लक्ष्य हैं, महान ज्ञान और तेज वाले।"]},
14:{"w": [["सर्वगः", "Sar-va-gah", "Goes everywhere", "అంతటా ఉన్నవాడు", "सब जगह जाने वाले"], ["सर्वविद्भानुः", "Sar-va-vid-bhaa-nuh", "Knows all and shines", "అన్నీ తెలిసి ప్రకాశించేవాడు", "सब जानने वाले और प्रकाशमान"], ["विष्वक्सेनः", "Vish-vak-se-nah", "His army scatters the wicked", "దుష్టులను చెదరగొట్టే సైన్యం కలవాడు", "दुष्टों को भगाने वाली सेना वाले"], ["जनार्दनः", "Ja-naar-da-nah", "Troubles the wicked; people pray to Him", "దుష్టులను శిక్షించేవాడు; ప్రజలు ప్రార్థించేవాడు", "दुष्टों को दंड देने वाले; जिनसे लोग प्रार्थना करते हैं"], ["वेदः", "Ve-dah", "Is the Veda itself", "వేదమే ఆయన", "स्वयं वेद"], ["वेदवित्", "Ve-da-vit", "Knows the Vedas", "వేదాలు తెలిసినవాడు", "वेदों को जानने वाले"], ["अव्यङ्गः", "Av-yan-gah", "Perfect, with nothing missing", "ఏ లోపమూ లేనివాడు", "पूर्ण, बिना किसी कमी के"], ["वेदाङ्गः", "Ve-daan-gah", "The Vedas are His limbs", "వేదాలే ఆయన అవయవాలు", "वेद जिनके अंग हैं"], ["वेदवित्", "Ve-da-vit", "Understands the true meaning of the Vedas", "వేదాల నిజమైన అర్థం తెలిసినవాడు", "वेदों का सच्चा अर्थ समझने वाले"], ["कविः", "Ka-vih", "Sees everything; the wise poet", "అన్నీ చూసే జ్ఞాని, కవి", "सब देखने वाले ज्ञानी कवि"]], "v": ["Vishnu goes everywhere, knows all and shines. His army scatters the wicked, and people pray to Him for help. He is the Veda itself and knows the Vedas fully. He is perfect, with nothing missing, and the Vedas are His limbs. He is the wise one who sees everything.", "విష్ణువు అంతటా ఉన్నాడు, అన్నీ తెలిసి ప్రకాశిస్తాడు. ఆయన సైన్యం దుష్టులను చెదరగొడుతుంది; ప్రజలు సహాయం కోసం ఆయనను ప్రార్థిస్తారు. వేదమే ఆయన, వేదాలను పూర్తిగా తెలిసినవాడు. ఏ లోపమూ లేనివాడు; వేదాలే ఆయన అవయవాలు. అన్నీ చూసే జ్ఞాని ఆయనే.", "विष्णु सब जगह जाते हैं, सब जानते हैं और प्रकाशमान हैं। उनकी सेना दुष्टों को भगा देती है, और लोग सहायता के लिए उनसे प्रार्थना करते हैं। वे स्वयं वेद हैं और वेदों को पूरी तरह जानते हैं। वे पूर्ण हैं, बिना किसी कमी के, और वेद उनके अंग हैं। वे सब कुछ देखने वाले ज्ञानी हैं।"]},
15:{"w": [["लोकाध्यक्षः", "Lo-kaa-dhyak-shah", "Watches over all the worlds", "లోకాలన్నిటినీ పర్యవేక్షించేవాడు", "सब लोकों की देखरेख करने वाले"], ["सुराध्यक्षः", "Su-raa-dhyak-shah", "Watches over the gods", "దేవతలను పర్యవేక్షించేవాడు", "देवताओं की देखरेख करने वाले"], ["धर्माध्यक्षः", "Dhar-maa-dhyak-shah", "Watches over right and wrong", "ధర్మాధర్మాలను చూసేవాడు", "धर्म-अधर्म को देखने वाले"], ["कृताकृतः", "Kri-taa-kri-tah", "Is both the made world and the unmade", "సృష్టించినదీ, సృష్టించనిదీ ఆయనే", "बना हुआ और न बना हुआ, दोनों वही"], ["चतुरात्मा", "Cha-tu-raat-maa", "Has four forms for the world's work", "లోక కార్యం కోసం నాలుగు రూపాలు కలవాడు", "संसार के कार्य के लिए चार रूपों वाले"], ["चतुर्व्यूहः", "Cha-tur-vyoo-hah", "Appears in four divine forms", "నాలుగు దివ్య రూపాలలో వ్యక్తమయ్యేవాడు", "चार दिव्य रूपों में प्रकट"], ["चतुर्दंष्ट्रः", "Cha-tur-dam-shtrah", "Has four tusks (as Narasimha)", "నాలుగు కోరలు కలవాడు (నరసింహుడిగా)", "चार दाँतों वाले (नरसिंह रूप में)"], ["चतुर्भुजः", "Cha-tur-bhu-jah", "Has four arms", "నాలుగు చేతులు కలవాడు", "चार भुजाओं वाले"]], "v": ["Vishnu watches over all the worlds, the gods, and right and wrong. He is both the made world and what was never made. He takes four forms to do the world's work, and as Narasimha He has four tusks. He has four arms.", "విష్ణువు లోకాలన్నిటినీ, దేవతలను, ధర్మాధర్మాలను పర్యవేక్షిస్తాడు. సృష్టించినదీ, సృష్టించనిదీ ఆయనే. లోక కార్యం కోసం నాలుగు రూపాలు దాలుస్తాడు; నరసింహుడిగా నాలుగు కోరలు కలవాడు. నాలుగు చేతులు కలవాడు.", "विष्णु सब लोकों, देवताओं, और धर्म-अधर्म की देखरेख करते हैं। बना हुआ संसार और जो कभी बना ही नहीं, दोनों वही हैं। संसार के कार्य के लिए वे चार रूप धरते हैं, और नरसिंह रूप में उनके चार दाँत हैं। उनकी चार भुजाएँ हैं।"]},
16:{"w": [["भ्राजिष्णुः", "Bhraa-jish-nuh", "Shines brightly", "ప్రకాశవంతంగా వెలిగేవాడు", "तेज से चमकने वाले"], ["भोजनम्", "Bho-ja-nam", "Is the food we enjoy", "మనం అనుభవించే ఆహారం", "हमारा भोजन"], ["भोक्ता", "Bhok-taa", "Enjoys what is offered", "సమర్పించినది అనుభవించేవాడు", "अर्पित को ग्रहण करने वाले"], ["सहिष्णुः", "Sa-hish-nuh", "Patient and forgiving", "ఓర్పు, క్షమ కలవాడు", "सहनशील और क्षमाशील"], ["जगदादिजः", "Ja-ga-daa-di-jah", "Was there at the start of the world", "లోకం మొదట్లోనే ఉన్నవాడు", "संसार के आरंभ में प्रकट"], ["अनघः", "A-na-ghah", "Without any sin", "ఏ పాపమూ లేనివాడు", "पाप रहित"], ["विजयः", "Vi-ja-yah", "Always victorious", "ఎప్పుడూ విజయం పొందేవాడు", "सदा विजयी"], ["जेता", "Je-taa", "Wins over all", "అందరినీ జయించేవాడు", "सब पर जीतने वाले"], ["विश्वयोनिः", "Vish-va-yo-nih", "The source of the world", "లోకానికి మూలం", "संसार का मूल"], ["पुनर्वसुः", "Pu-nar-va-suh", "Lives in us again and again", "మళ్ళీ మళ్ళీ మనలో నివసించేవాడు", "बार-बार हममें बसने वाले"]], "v": ["Vishnu shines brightly. He is the food we enjoy and the one who enjoys what we offer. He is patient and forgiving, and He was there at the start of the world. He is without sin, always victorious, and wins over all. He is the source of the world and lives in us again and again.", "విష్ణువు ప్రకాశవంతంగా వెలుగుతాడు. మనం అనుభవించే ఆహారం ఆయనే, మనం సమర్పించినది అనుభవించేవాడూ ఆయనే. ఓర్పు, క్షమ కలవాడు; లోకం మొదట్లోనే ఉన్నాడు. ఏ పాపమూ లేనివాడు, ఎప్పుడూ విజయం పొందేవాడు, అందరినీ జయిస్తాడు. లోకానికి మూలం; మళ్ళీ మళ్ళీ మనలో నివసిస్తాడు.", "विष्णु तेज से चमकते हैं। वे हमारा भोजन हैं, और हमारे अर्पण को ग्रहण करने वाले भी। वे सहनशील और क्षमाशील हैं, और संसार के आरंभ में थे। वे पाप रहित, सदा विजयी हैं, और सब पर जीतते हैं। वे संसार का मूल हैं और बार-बार हममें बसते हैं।"]},
17:{"w": [["उपेन्द्रः", "U-pen-drah", "Came as Indra's younger brother (Vamana)", "ఇంద్రుని తమ్ముడిగా (వామనుడిగా) వచ్చినవాడు", "इंद्र के छोटे भाई (वामन) बनकर आने वाले"], ["वामनः", "Vaa-ma-nah", "Came as the small boy Vamana", "చిన్న బాలుడు వామనుడిగా వచ్చినవాడు", "छोटे बालक वामन बनकर आने वाले"], ["प्रांशुः", "Praam-shuh", "Then grew tall to cover the worlds", "తరువాత లోకాలను కప్పేంత పెరిగినవాడు", "फिर लोकों को ढकने जितने बड़े हुए"], ["अमोघः", "A-mo-ghah", "Never fails", "ఎప్పుడూ విఫలం కానివాడు", "कभी विफल न होने वाले"], ["शुचिः", "Shu-chih", "Pure, and makes us pure", "పవిత్రుడు, మనల్ని పవిత్రం చేసేవాడు", "पवित्र, और हमें पवित्र करने वाले"], ["ऊर्जितः", "Oor-ji-tah", "Mighty", "శక్తిమంతుడు", "शक्तिशाली"], ["अतीन्द्रः", "A-teen-drah", "Greater than Indra", "ఇంద్రుని కంటే గొప్పవాడు", "इंद्र से भी बड़े"], ["सङ्ग्रहः", "San-gra-hah", "Holds everything together", "అన్నిటినీ కలిపి ఉంచేవాడు", "सबको एक साथ रखने वाले"], ["सर्गः", "Sar-gah", "Is creation itself", "సృష్టి ఆయనే", "स्वयं सृष्टि"], ["धृतात्मा", "Dhri-taat-maa", "Steady in Himself", "తనలో స్థిరమైనవాడు", "अपने में स्थिर"], ["नियमः", "Ni-ya-mah", "Sets the rules for all", "అందరికీ నియమాలు పెట్టేవాడు", "सबके लिए नियम बनाने वाले"], ["यमः", "Ya-mah", "Guides all from within", "అందరినీ లోపలి నుండి నడిపించేవాడు", "सबको भीतर से चलाने वाले"]], "v": ["Vishnu came as Vamana, the small boy who was Indra's younger brother, and then grew tall to cover the worlds. He never fails. He is pure and makes us pure, and He is mighty, greater than Indra. He holds everything together and is creation itself. He is steady in Himself, sets the rules for all, and guides all from within.", "విష్ణువు ఇంద్రుని తమ్ముడైన చిన్న బాలుడు వామనుడిగా వచ్చి, తరువాత లోకాలను కప్పేంత పెరిగాడు. ఎప్పుడూ విఫలం కాడు. పవిత్రుడు, మనల్ని పవిత్రం చేస్తాడు; శక్తిమంతుడు, ఇంద్రుని కంటే గొప్పవాడు. అన్నిటినీ కలిపి ఉంచుతాడు, సృష్టి ఆయనే. తనలో స్థిరమైనవాడు, అందరికీ నియమాలు పెడతాడు, అందరినీ లోపలి నుండి నడిపిస్తాడు.", "विष्णु इंद्र के छोटे भाई, छोटे बालक वामन बनकर आए, और फिर लोकों को ढकने जितने बड़े हो गए। वे कभी विफल नहीं होते। वे पवित्र हैं और हमें पवित्र करते हैं; वे शक्तिशाली हैं, इंद्र से भी बड़े। वे सबको एक साथ रखते हैं और स्वयं सृष्टि हैं। वे अपने में स्थिर हैं, सबके लिए नियम बनाते हैं, और सबको भीतर से चलाते हैं।"]},
18:{"w": [["वेद्यः", "Ved-yah", "The one worth knowing", "తెలుసుకోవలసినవాడు", "जानने योग्य"], ["वैद्यः", "Vaid-yah", "The doctor who heals the illness of life", "సంసారమనే రోగాన్ని నయం చేసే వైద్యుడు", "संसार रूपी रोग को ठीक करने वाले वैद्य"], ["सदायोगी", "Sa-daa-yo-gee", "Always in yoga, always aware", "ఎప్పుడూ యోగంలో, ఎప్పుడూ జాగ్రత్తగా ఉండేవాడు", "सदा योग में, सदा सजग"], ["वीरहा", "Vee-ra-haa", "Destroys the strong among the wicked", "దుష్టులలోని బలవంతులను నాశనం చేసేవాడు", "दुष्टों में बलवानों का नाश करने वाले"], ["माधवः", "Maa-dha-vah", "Lord of knowledge; husband of Lakshmi", "జ్ఞానానికి ప్రభువు; లక్ష్మీపతి", "ज्ञान के स्वामी; लक्ष्मीपति"], ["मधुः", "Ma-dhuh", "Sweet like honey", "తేనెలా మధురమైనవాడు", "शहद जैसे मधुर"], ["अतीन्द्रियः", "A-teen-dri-yah", "Beyond the senses", "ఇంద్రియాలకు అతీతుడు", "इंद्रियों से परे"], ["महामायः", "Ma-haa-maa-yah", "Master of the great maya", "మహామాయకు అధిపతి", "महामाया के स्वामी"], ["महोत्साहः", "Ma-hot-saa-hah", "Full of great energy", "గొప్ప ఉత్సాహం కలవాడు", "महान उत्साह वाले"], ["महाबलः", "Ma-haa-ba-lah", "Of great strength", "గొప్ప బలం కలవాడు", "महान बल वाले"]], "v": ["Vishnu is the one worth knowing, and the doctor who heals the illness of worldly life. He is always aware, and He destroys the strong among the wicked. He is Madhava, Lord of knowledge, and sweet like honey. He is beyond the senses and master of the great maya. He is full of great energy and great strength.", "విష్ణువు తెలుసుకోవలసినవాడు; సంసారమనే రోగాన్ని నయం చేసే వైద్యుడు. ఎప్పుడూ జాగ్రత్తగా ఉంటాడు; దుష్టులలోని బలవంతులను నాశనం చేస్తాడు. జ్ఞానానికి ప్రభువైన మాధవుడు, తేనెలా మధురమైనవాడు. ఇంద్రియాలకు అతీతుడు, మహామాయకు అధిపతి. గొప్ప ఉత్సాహం, గొప్ప బలం కలవాడు.", "विष्णु जानने योग्य हैं, और संसार रूपी रोग को ठीक करने वाले वैद्य हैं। वे सदा सजग हैं, और दुष्टों में बलवानों का नाश करते हैं। वे ज्ञान के स्वामी माधव हैं, शहद जैसे मधुर। वे इंद्रियों से परे और महामाया के स्वामी हैं। वे महान उत्साह और महान बल वाले हैं।"]},
19:{"w": [["महाबुद्धिः", "Ma-haa-bud-dhih", "Of great wisdom", "గొప్ప బుద్ధి కలవాడు", "महान बुद्धि वाले"], ["महावीर्यः", "Ma-haa-veer-yah", "Of great power", "గొప్ప శక్తి కలవాడు", "महान पराक्रम वाले"], ["महाशक्तिः", "Ma-haa-shak-tih", "Of great strength", "గొప్ప సామర్థ్యం కలవాడు", "महान शक्ति वाले"], ["महाद्युतिः", "Ma-haa-dyu-tih", "Of great brightness", "గొప్ప తేజస్సు కలవాడు", "महान तेज वाले"], ["अनिर्देश्यवपुः", "A-nir-desh-ya-va-puh", "His form is beyond words", "ఆయన రూపం మాటలకు అందనిది", "जिनका रूप शब्दों से परे है"], ["श्रीमान्", "Shree-maan", "Full of glory", "శోభ కలవాడు", "शोभा से भरे"], ["अमेयात्मा", "A-me-yaat-maa", "Beyond all measure", "కొలవలేనంత గొప్పవాడు", "माप से परे"], ["महाद्रिधृक्", "Ma-haa-dri-dhrik", "Held up the great mountain", "గొప్ప పర్వతాన్ని ఎత్తినవాడు", "महान पर्वत उठाने वाले"]], "v": ["Vishnu has great wisdom, great power, great strength and great brightness. His form is beyond words; He is full of glory and beyond all measure. He held up the great mountain: Mandara as the Tortoise, and Govardhana as Krishna.", "విష్ణువు గొప్ప బుద్ధి, గొప్ప శక్తి, గొప్ప సామర్థ్యం, గొప్ప తేజస్సు కలవాడు. ఆయన రూపం మాటలకు అందదు; శోభ కలవాడు, కొలవలేనంత గొప్పవాడు. కూర్మంగా మందర పర్వతాన్ని, కృష్ణుడిగా గోవర్ధన పర్వతాన్ని ఎత్తాడు.", "विष्णु महान बुद्धि, महान पराक्रम, महान शक्ति और महान तेज वाले हैं। उनका रूप शब्दों से परे है; वे शोभा से भरे और माप से परे हैं। उन्होंने महान पर्वत उठाया: कूर्म बनकर मंदराचल, और कृष्ण बनकर गोवर्धन।"]},
20:{"w": [["महेष्वासः", "Ma-hesh-vaa-sah", "Holds a mighty bow", "గొప్ప విల్లు ధరించినవాడు", "महान धनुष धारण करने वाले"], ["महीभर्ता", "Ma-hee-bhar-taa", "Supports the earth", "భూమిని భరించేవాడు", "पृथ्वी को धारण करने वाले"], ["श्रीनिवासः", "Shree-ni-vaa-sah", "Lakshmi lives in His heart", "ఆయన హృదయంలో లక్ష్మి నివసిస్తుంది", "जिनके हृदय में लक्ष्मी बसती हैं"], ["सतां गतिः", "Sa-taam Ga-tih", "The goal of good people", "సజ్జనుల గమ్యం", "सज्जनों का लक्ष्य"], ["अनिरुद्धः", "A-ni-rud-dhah", "No one can stop Him", "ఆయనను ఎవరూ ఆపలేరు", "जिन्हें कोई रोक न सके"], ["सुरानन्दः", "Su-raa-nan-dah", "Brings joy to the gods", "దేవతలకు ఆనందం ఇచ్చేవాడు", "देवताओं को आनंद देने वाले"], ["गोविन्दः", "Go-vin-dah", "Protects the cows and the earth", "గోవులను, భూమిని రక్షించేవాడు", "गायों और पृथ्वी की रक्षा करने वाले"], ["गोविदां पतिः", "Go-vi-daam Pa-tih", "Lord of those who know the Vedas", "వేదం తెలిసినవారికి ప్రభువు", "वेद जानने वालों के स्वामी"]], "v": ["Vishnu holds a mighty bow and supports the earth. Lakshmi lives in His heart, and He is the goal of good people. No one can stop Him, and He brings joy to the gods. He is Govinda, protector of the cows and the earth, and Lord of those who know the Vedas.", "విష్ణువు గొప్ప విల్లు ధరిస్తాడు, భూమిని భరిస్తాడు. ఆయన హృదయంలో లక్ష్మి నివసిస్తుంది; సజ్జనుల గమ్యం ఆయనే. ఆయనను ఎవరూ ఆపలేరు; దేవతలకు ఆనందం ఇస్తాడు. గోవులను, భూమిని రక్షించే గోవిందుడు; వేదం తెలిసినవారికి ప్రభువు.", "विष्णु महान धनुष धारण करते हैं और पृथ्वी को संभालते हैं। उनके हृदय में लक्ष्मी बसती हैं, और वे सज्जनों का लक्ष्य हैं। उन्हें कोई रोक नहीं सकता, और वे देवताओं को आनंद देते हैं। वे गायों और पृथ्वी के रक्षक गोविंद हैं, और वेद जानने वालों के स्वामी।"]},
21:{"w": [["मरीचिः", "Ma-ree-chih", "Bright like a ray of light", "కిరణంలా ప్రకాశించేవాడు", "किरण जैसे उज्ज्वल"], ["दमनः", "Da-ma-nah", "Controls the wicked", "దుష్టులను అదుపు చేసేవాడు", "दुष्टों को वश में करने वाले"], ["हंसः", "Ham-sah", "The swan; removes our fears", "హంస; మన భయాలను పోగొట్టేవాడు", "हंस; हमारे भय दूर करने वाले"], ["सुपर्णः", "Su-par-nah", "Like a bird with beautiful wings", "అందమైన రెక్కల పక్షి వంటివాడు", "सुंदर पंखों वाले पक्षी जैसे"], ["भुजगोत्तमः", "Bhu-ja-got-ta-mah", "Is Adishesha, the best of serpents", "సర్పాలలో శ్రేష్ఠుడైన ఆదిశేషుడు ఆయనే", "सर्पों में श्रेष्ठ आदिशेष"], ["हिरण्यनाभः", "Hi-ran-ya-naa-bhah", "His navel shines like gold", "బంగారంలా మెరిసే నాభి కలవాడు", "सोने जैसी चमकती नाभि वाले"], ["सुतपाः", "Su-ta-paah", "Did great tapas", "గొప్ప తపస్సు చేసినవాడు", "महान तप करने वाले"], ["पद्मनाभः", "Pad-ma-naa-bhah", "A lotus grows from His navel", "నాభి నుండి తామర పుట్టినవాడు", "जिनकी नाभि से कमल निकला"], ["प्रजापतिः", "Pra-jaa-pa-tih", "Father of all beings", "అన్ని జీవులకు తండ్రి", "सब प्राणियों के पिता"]], "v": ["Vishnu is bright like a ray of light and controls the wicked. He is the swan that removes our fears, and like a bird with beautiful wings. He is Adishesha, the best of serpents. His navel shines like gold, and a lotus grows from it. He did great tapas, and He is the father of all beings.", "విష్ణువు కిరణంలా ప్రకాశిస్తాడు, దుష్టులను అదుపు చేస్తాడు. మన భయాలను పోగొట్టే హంస ఆయనే; అందమైన రెక్కల పక్షి వంటివాడు. సర్పాలలో శ్రేష్ఠుడైన ఆదిశేషుడు ఆయనే. బంగారంలా మెరిసే ఆయన నాభి నుండి తామర పుట్టింది. గొప్ప తపస్సు చేశాడు; అన్ని జీవులకు తండ్రి.", "विष्णु किरण जैसे उज्ज्वल हैं और दुष्टों को वश में करते हैं। वे हमारे भय दूर करने वाले हंस हैं, और सुंदर पंखों वाले पक्षी जैसे। वे सर्पों में श्रेष्ठ आदिशेष हैं। उनकी नाभि सोने जैसी चमकती है, और उससे कमल निकला। उन्होंने महान तप किया, और वे सब प्राणियों के पिता हैं।"]},
22:{"w": [["अमृत्युः", "A-mrit-yuh", "Beyond death", "మృత్యువు లేనివాడు", "मृत्यु से परे"], ["सर्वदृक्", "Sar-va-drik", "Sees everything", "అన్నీ చూసేవాడు", "सब कुछ देखने वाले"], ["सिंहः", "Sim-hah", "Brave like a lion", "సింహంలా ధైర్యవంతుడు", "सिंह जैसे वीर"], ["सन्धाता", "San-dhaa-taa", "Joins each one with the fruit of their actions", "ప్రతి ఒక్కరినీ వారి కర్మ ఫలంతో కలిపేవాడు", "हर किसी को कर्मों के फल से जोड़ने वाले"], ["सन्धिमान्", "San-dhi-maan", "Enjoys those fruits Himself", "ఆ ఫలాలను తానే అనుభవించేవాడు", "उन फलों का स्वयं भोग करने वाले"], ["स्थिरः", "Sthi-rah", "Always steady", "ఎప్పుడూ స్థిరంగా ఉండేవాడు", "सदा स्थिर"], ["अजः", "A-jah", "Never born", "జన్మ లేనివాడు", "अजन्मा"], ["दुर्मर्षणः", "Dur-mar-sha-nah", "The wicked cannot bear His power", "దుష్టులు ఆయన శక్తిని భరించలేరు", "जिनकी शक्ति दुष्ट सह न सकें"], ["शास्ता", "Shaas-taa", "Teaches us through the scriptures", "శాస్త్రాల ద్వారా మనకు బోధించేవాడు", "शास्त्रों से हमें सिखाने वाले"], ["विश्रुतात्मा", "Vi-shru-taat-maa", "Famous everywhere", "అంతటా ప్రసిద్ధుడు", "सब जगह प्रसिद्ध"], ["सुरारिहा", "Su-raa-ri-haa", "Destroys the enemies of the gods", "దేవతల శత్రువులను నాశనం చేసేవాడు", "देवताओं के शत्रुओं का नाश करने वाले"]], "v": ["Vishnu is beyond death and sees everything. He is brave like a lion. He joins each one with the fruit of their actions. He is always steady and was never born. The wicked cannot bear His power. He teaches us through the scriptures, is famous everywhere, and destroys the enemies of the gods.", "విష్ణువు మృత్యువు లేనివాడు, అన్నీ చూస్తాడు. సింహంలా ధైర్యవంతుడు. ప్రతి ఒక్కరినీ వారి కర్మ ఫలంతో కలుపుతాడు. ఎప్పుడూ స్థిరంగా ఉంటాడు, జన్మ లేనివాడు. దుష్టులు ఆయన శక్తిని భరించలేరు. శాస్త్రాల ద్వారా మనకు బోధిస్తాడు, అంతటా ప్రసిద్ధుడు, దేవతల శత్రువులను నాశనం చేస్తాడు.", "विष्णु मृत्यु से परे हैं और सब कुछ देखते हैं। वे सिंह जैसे वीर हैं। वे हर किसी को उसके कर्मों के फल से जोड़ते हैं। वे सदा स्थिर और अजन्मा हैं। दुष्ट उनकी शक्ति सह नहीं सकते। वे शास्त्रों से हमें सिखाते हैं, सब जगह प्रसिद्ध हैं, और देवताओं के शत्रुओं का नाश करते हैं।"]},
23:{"w": [["गुरुः", "Gu-ruh", "The teacher of all", "అందరికీ గురువు", "सबके गुरु"], ["गुरुतमः", "Gu-ru-ta-mah", "The greatest teacher", "గురువులలో గొప్పవాడు", "सबसे बड़े गुरु"], ["धाम", "Dhaa-ma", "The light and the home of all", "అందరికీ వెలుగు, నివాసం", "सबका प्रकाश और धाम"], ["सत्यः", "Sat-yah", "Truth itself", "సత్యమే ఆయన", "स्वयं सत्य"], ["सत्यपराक्रमः", "Sat-ya-pa-raak-ra-mah", "His power never fails", "ఆయన పరాక్రమం ఎప్పుడూ తప్పదు", "जिनका पराक्रम कभी विफल नहीं"], ["निमिषः", "Ni-mi-shah", "His eyes are half-closed in yoga", "యోగంలో అరమోడ్పు కళ్ళు కలవాడు", "योग में अधखुली आँखों वाले"], ["अनिमिषः", "A-ni-mi-shah", "Never blinks; always watching over us", "రెప్ప వేయకుండా మనల్ని ఎప్పుడూ కాపాడేవాడు", "पलक झपकाए बिना सदा रक्षा करने वाले"], ["स्रग्वी", "Srag-vee", "Wears a garland", "మాల ధరించినవాడు", "माला पहनने वाले"], ["वाचस्पतिरुदारधीः", "Vaa-chas-pa-ti-ru-daa-ra-dheeh", "Lord of speech, with a vast mind", "వాక్కుకు అధిపతి, విశాలమైన బుద్ధి కలవాడు", "वाणी के स्वामी, विशाल बुद्धि वाले"]], "v": ["Vishnu is the teacher of all, the greatest teacher. He is the light and the home of all. He is truth itself, and His power never fails. In yoga His eyes are half-closed, yet He never blinks in watching over us. He wears a garland. He is Lord of speech, with a vast and generous mind.", "విష్ణువు అందరికీ గురువు, గురువులలో గొప్పవాడు. అందరికీ వెలుగు, నివాసం ఆయనే. సత్యమే ఆయన, ఆయన పరాక్రమం ఎప్పుడూ తప్పదు. యోగంలో అరమోడ్పు కళ్ళతో ఉన్నా, మనల్ని కాపాడటంలో రెప్ప వేయడు. మాల ధరిస్తాడు. వాక్కుకు అధిపతి, విశాలమైన బుద్ధి కలవాడు.", "विष्णु सबके गुरु हैं, सबसे बड़े गुरु। वे सबका प्रकाश और धाम हैं। वे स्वयं सत्य हैं, और उनका पराक्रम कभी विफल नहीं होता। योग में उनकी आँखें अधखुली हैं, फिर भी हमारी रक्षा में वे पलक नहीं झपकाते। वे माला पहनते हैं। वे वाणी के स्वामी हैं, विशाल बुद्धि वाले।"]},
24:{"w": [["अग्रणीः", "Ag-ra-neeh", "Leads us forward to the highest", "మనల్ని అత్యున్నతం వైపు నడిపించేవాడు", "हमें सबसे ऊँचे लक्ष्य तक ले जाने वाले"], ["ग्रामणीः", "Graa-ma-neeh", "Leader of all beings", "అందరికీ నాయకుడు", "सब प्राणियों के नेता"], ["श्रीमान्", "Shree-maan", "Full of glory", "శోభ కలవాడు", "शोभा से भरे"], ["न्यायः", "Nyaa-yah", "Is justice itself", "న్యాయమే ఆయన", "स्वयं न्याय"], ["नेता", "Ne-taa", "Guides the world", "లోకాన్ని నడిపించేవాడు", "संसार को चलाने वाले"], ["समीरणः", "Sa-mee-ra-nah", "Makes all beings breathe and move", "అన్ని జీవులను శ్వాసించేలా, కదిలేలా చేసేవాడు", "सब प्राणियों को साँस और गति देने वाले"], ["सहस्रमूर्धा", "Sa-has-ra-moor-dhaa", "Has a thousand heads", "వేయి తలలు కలవాడు", "हज़ार सिरों वाले"], ["विश्वात्मा", "Vish-vaat-maa", "The soul of the universe", "విశ్వానికి ఆత్మ", "विश्व की आत्मा"], ["सहस्राक्षः", "Sa-has-raak-shah", "Has a thousand eyes", "వేయి కళ్ళు కలవాడు", "हज़ार आँखों वाले"], ["सहस्रपात्", "Sa-has-ra-paat", "Has a thousand feet", "వేయి పాదాలు కలవాడు", "हज़ार पैरों वाले"]], "v": ["Vishnu leads us forward to the highest goal; He is the leader of all beings and full of glory. He is justice itself and guides the world. He makes all beings breathe and move. He has a thousand heads, a thousand eyes and a thousand feet; He is the soul of the universe.", "విష్ణువు మనల్ని అత్యున్నత గమ్యం వైపు నడిపిస్తాడు; అందరికీ నాయకుడు, శోభ కలవాడు. న్యాయమే ఆయన, లోకాన్ని నడిపిస్తాడు. అన్ని జీవులను శ్వాసించేలా, కదిలేలా చేస్తాడు. వేయి తలలు, వేయి కళ్ళు, వేయి పాదాలు కలవాడు; విశ్వానికి ఆత్మ.", "विष्णु हमें सबसे ऊँचे लक्ष्य तक ले जाते हैं; वे सब प्राणियों के नेता और शोभा से भरे हैं। वे स्वयं न्याय हैं और संसार को चलाते हैं। वे सब प्राणियों को साँस और गति देते हैं। उनके हज़ार सिर, हज़ार आँखें और हज़ार पैर हैं; वे विश्व की आत्मा हैं।"]},
25:{"w": [["आवर्तनः", "Aa-var-ta-nah", "Turns the wheel of life", "జీవన చక్రాన్ని తిప్పేవాడు", "जीवन चक्र को घुमाने वाले"], ["निवृत्तात्मा", "Ni-vrit-taat-maa", "Untouched by the world", "లోకానికి అంటనివాడు", "संसार से अछूते"], ["संवृतः", "Sam-vri-tah", "Hidden from those without devotion", "భక్తి లేనివారికి కనిపించనివాడు", "भक्ति रहित लोगों से छिपे"], ["सम्प्रमर्दनः", "Sam-pra-mar-da-nah", "Crushes the wicked", "దుష్టులను అణచివేసేవాడు", "दुष्टों को कुचलने वाले"], ["अहःसंवर्तकः", "A-hah-sam-var-ta-kah", "Makes the days and seasons turn (as the sun)", "సూర్యుడిగా రోజులను, ఋతువులను నడిపించేవాడు", "सूर्य बनकर दिन और ऋतुएँ चलाने वाले"], ["वह्निः", "Vah-nih", "Is the sacred fire", "పవిత్ర అగ్ని ఆయనే", "स्वयं पवित्र अग्नि"], ["अनिलः", "A-ni-lah", "Is the air, the breath of life", "గాలి, ప్రాణవాయువు ఆయనే", "स्वयं वायु, प्राण"], ["धरणीधरः", "Dha-ra-nee-dha-rah", "Holds up the earth", "భూమిని ధరించేవాడు", "पृथ्वी को धारण करने वाले"]], "v": ["Vishnu turns the wheel of life, yet the world does not touch Him. He stays hidden from those without devotion, and He crushes the wicked. As the sun He makes the days and seasons turn. He is the sacred fire and the air we breathe, and He holds up the earth.", "విష్ణువు జీవన చక్రాన్ని తిప్పుతాడు, అయినా లోకం ఆయనను అంటదు. భక్తి లేనివారికి కనిపించడు; దుష్టులను అణచివేస్తాడు. సూర్యుడిగా రోజులను, ఋతువులను నడిపిస్తాడు. పవిత్ర అగ్ని, మనం పీల్చే గాలి ఆయనే; భూమిని ధరిస్తాడు.", "विष्णु जीवन चक्र को घुमाते हैं, फिर भी संसार उन्हें छूता नहीं। वे भक्ति रहित लोगों से छिपे रहते हैं, और दुष्टों को कुचलते हैं। सूर्य बनकर वे दिन और ऋतुएँ चलाते हैं। वे पवित्र अग्नि और हमारी साँस की वायु हैं, और पृथ्वी को धारण करते हैं।"]},
26:{"w": [["सुप्रसादः", "Su-pra-saa-dah", "Very kind and easily pleased", "ఎంతో దయగలవాడు, సులభంగా ప్రసన్నమయ్యేవాడు", "बहुत कृपालु, आसानी से प्रसन्न होने वाले"], ["प्रसन्नात्मा", "Pra-san-naat-maa", "Always cheerful and calm", "ఎప్పుడూ ప్రసన్నంగా, ప్రశాంతంగా ఉండేవాడు", "सदा प्रसन्न और शांत"], ["विश्वधृक्", "Vish-va-dhrik", "Holds up the universe", "విశ్వాన్ని ధరించేవాడు", "विश्व को धारण करने वाले"], ["विश्वभुक्", "Vish-va-bhuk", "Enjoys and protects the universe", "విశ్వాన్ని అనుభవించి రక్షించేవాడు", "विश्व का भोग और रक्षा करने वाले"], ["विभुः", "Vi-bhuh", "Takes many forms", "అనేక రూపాలు దాల్చేవాడు", "अनेक रूप धरने वाले"], ["सत्कर्ता", "Sat-kar-taa", "Honours good people", "మంచివారిని గౌరవించేవాడు", "सज्जनों का सम्मान करने वाले"], ["सत्कृतः", "Sat-kri-tah", "Honoured by all", "అందరిచే గౌరవించబడేవాడు", "सबसे सम्मानित"], ["साधुः", "Saa-dhuh", "Good and righteous", "మంచివాడు, ధర్మాత్ముడు", "सज्जन और धर्मात्मा"], ["जह्नुः", "Jah-nuh", "Takes all beings into Himself at the end", "చివరికి అన్ని జీవులను తనలో చేర్చుకునేవాడు", "अंत में सब प्राणियों को अपने में समेटने वाले"], ["नारायणः", "Naa-raa-ya-nah", "The home of all beings", "అన్ని జీవులకు నిలయం", "सब प्राणियों का आश्रय"], ["नरः", "Na-rah", "The eternal guide of all", "అందరినీ నడిపించే శాశ్వతుడు", "सबके शाश्वत मार्गदर्शक"]], "v": ["Vishnu is very kind and easily pleased; He is always cheerful and calm. He holds up the universe, enjoys and protects it, and takes many forms. He honours good people and is honoured by all; He is good and righteous. At the end He takes all beings into Himself. He is Narayana, the home of all beings, and the eternal guide of all.", "విష్ణువు ఎంతో దయగలవాడు, సులభంగా ప్రసన్నమవుతాడు; ఎప్పుడూ ప్రసన్నంగా, ప్రశాంతంగా ఉంటాడు. విశ్వాన్ని ధరిస్తాడు, అనుభవించి రక్షిస్తాడు, అనేక రూపాలు దాలుస్తాడు. మంచివారిని గౌరవిస్తాడు, అందరూ ఆయనను గౌరవిస్తారు; మంచివాడు, ధర్మాత్ముడు. చివరికి అన్ని జీవులను తనలో చేర్చుకుంటాడు. అన్ని జీవులకు నిలయమైన నారాయణుడు; అందరినీ నడిపించే శాశ్వతుడు.", "विष्णु बहुत कृपालु हैं और आसानी से प्रसन्न होते हैं; वे सदा प्रसन्न और शांत रहते हैं। वे विश्व को धारण करते हैं, उसका भोग और रक्षा करते हैं, और अनेक रूप धरते हैं। वे सज्जनों का सम्मान करते हैं और सबसे सम्मानित हैं; वे सज्जन और धर्मात्मा हैं। अंत में वे सब प्राणियों को अपने में समेट लेते हैं। वे सब प्राणियों के आश्रय नारायण हैं, और सबके शाश्वत मार्गदर्शक।"]},
27:{"w": [["असङ्ख्येयः", "A-san-khye-yah", "His names and qualities cannot be counted", "ఆయన నామాలు, గుణాలు లెక్కించలేము", "जिनके नाम और गुण गिने न जा सकें"], ["अप्रमेयात्मा", "Ap-ra-me-yaat-maa", "Beyond all measure", "కొలవలేనివాడు", "माप से परे"], ["विशिष्टः", "Vi-shish-tah", "The most special of all", "అందరిలో విశిష్టుడు", "सबसे विशिष्ट"], ["शिष्टकृत्", "Shish-ta-krit", "Guides us to do right", "సరైనది చేసేలా మనల్ని నడిపించేవాడు", "हमें सही करने की राह दिखाने वाले"], ["शुचिः", "Shu-chih", "Pure", "పవిత్రుడు", "पवित्र"], ["सिद्धार्थः", "Sid-dhaar-thah", "Has everything He wants", "కోరినదంతా కలవాడు", "जिनकी हर इच्छा पूर्ण है"], ["सिद्धसङ्कल्पः", "Sid-dha-san-kal-pah", "Whatever He wills comes true", "ఆయన సంకల్పించినది జరుగుతుంది", "जिनका हर संकल्प सिद्ध होता है"], ["सिद्धिदः", "Sid-dhi-dah", "Gives success", "విజయాన్ని ఇచ్చేవాడు", "सफलता देने वाले"], ["सिद्धिसाधनः", "Sid-dhi-saa-dha-nah", "Shows the way to success", "విజయానికి మార్గం చూపేవాడు", "सफलता का मार्ग दिखाने वाले"]], "v": ["Vishnu's names and qualities cannot be counted; He is beyond all measure and the most special of all. He guides us to do right and is pure. He has everything He wants, and whatever He wills comes true. He gives success and shows us the way to reach it.", "విష్ణువు నామాలు, గుణాలు లెక్కించలేము; కొలవలేనివాడు, అందరిలో విశిష్టుడు. సరైనది చేసేలా మనల్ని నడిపిస్తాడు, పవిత్రుడు. కోరినదంతా ఆయనకు ఉంది; ఆయన సంకల్పించినది జరుగుతుంది. విజయాన్ని ఇస్తాడు, దానికి మార్గం చూపిస్తాడు.", "विष्णु के नाम और गुण गिने नहीं जा सकते; वे माप से परे और सबसे विशिष्ट हैं। वे हमें सही करने की राह दिखाते हैं और पवित्र हैं। उनकी हर इच्छा पूर्ण है, और उनका हर संकल्प सिद्ध होता है। वे सफलता देते हैं और उस तक पहुँचने का मार्ग दिखाते हैं।"]},
28:{"w": [["वृषाही", "Vri-shaa-hee", "Lord of all sacred rites", "అన్ని పవిత్ర కర్మలకు అధిపతి", "सभी पवित्र कर्मों के स्वामी"], ["वृषभः", "Vri-sha-bhah", "Showers blessings on devotees", "భక్తులపై వరాల వర్షం కురిపించేవాడు", "भक्तों पर कृपा बरसाने वाले"], ["विष्णुः", "Vish-nuh", "Present everywhere", "అంతటా వ్యాపించినవాడు", "सब जगह व्याप्त"], ["वृषपर्वा", "Vri-sha-par-vaa", "Dharma is the ladder to Him", "ధర్మమే ఆయనను చేరే మెట్లు", "धर्म जिन तक पहुँचने की सीढ़ी है"], ["वृषोदरः", "Vri-sho-da-rah", "Holds all beings within Him", "అన్ని జీవులను తనలో ధరించేవాడు", "सब प्राणियों को अपने भीतर रखने वाले"], ["वर्धनः", "Var-dha-nah", "Helps His devotees grow", "భక్తులను వృద్ధి చేసేవాడు", "भक्तों को बढ़ाने वाले"], ["वर्धमानः", "Var-dha-maa-nah", "Grows into the whole world", "లోకమంతా విస్తరించేవాడు", "पूरे संसार में फैलने वाले"], ["विविक्तः", "Vi-vik-tah", "Stays apart, untouched", "అంటకుండా వేరుగా ఉండేవాడు", "अछूते, अलग रहने वाले"], ["श्रुतिसागरः", "Shru-ti-saa-ga-rah", "Like an ocean of the Vedas", "వేదాల సముద్రం వంటివాడు", "वेदों के सागर जैसे"]], "v": ["Vishnu is Lord of all sacred rites and showers blessings on His devotees. He is present everywhere. Dharma is the ladder to reach Him, and He holds all beings within Him. He helps His devotees grow and grows into the whole world, yet stays untouched. He is like an ocean of the Vedas.", "విష్ణువు అన్ని పవిత్ర కర్మలకు అధిపతి, భక్తులపై వరాల వర్షం కురిపిస్తాడు. అంతటా ఉన్నాడు. ధర్మమే ఆయనను చేరే మెట్లు; అన్ని జీవులను తనలో ధరిస్తాడు. భక్తులను వృద్ధి చేస్తాడు, లోకమంతా విస్తరిస్తాడు, అయినా దేనినీ అంటడు. వేదాల సముద్రం వంటివాడు.", "विष्णु सभी पवित्र कर्मों के स्वामी हैं और भक्तों पर कृपा बरसाते हैं। वे सब जगह व्याप्त हैं। धर्म उन तक पहुँचने की सीढ़ी है, और वे सब प्राणियों को अपने भीतर रखते हैं। वे भक्तों को बढ़ाते हैं और पूरे संसार में फैलते हैं, फिर भी अछूते रहते हैं। वे वेदों के सागर जैसे हैं।"]},
29:{"w": [["सुभुजः", "Su-bhu-jah", "Has beautiful, strong arms", "అందమైన, బలమైన భుజాలు కలవాడు", "सुंदर, बलवान भुजाओं वाले"], ["दुर्धरः", "Dur-dha-rah", "Hard to hold in the mind, yet holds all", "మనసులో పట్టుకోవడం కష్టం, అయినా అందరినీ భరించేవాడు", "मन में पकड़ना कठिन, फिर भी सबको धारण करने वाले"], ["वाग्मी", "Vaag-mee", "Speaks beautifully", "అందంగా మాట్లాడేవాడు", "सुंदर वाणी वाले"], ["महेन्द्रः", "Ma-hen-drah", "Lord even of Indra", "ఇంద్రునికి కూడా ప్రభువు", "इंद्र के भी स्वामी"], ["वसुदः", "Va-su-dah", "Gives wealth", "సంపదను ఇచ్చేవాడు", "धन देने वाले"], ["वसुः", "Va-suh", "Is the true wealth", "నిజమైన సంపద ఆయనే", "स्वयं सच्चा धन"], ["नैकरूपः", "Nai-ka-roo-pah", "Has many forms", "అనేక రూపాలు కలవాడు", "अनेक रूपों वाले"], ["बृहद्रूपः", "Bri-had-roo-pah", "Has a vast form", "విశాలమైన రూపం కలవాడు", "विशाल रूप वाले"], ["शिपिविष्टः", "Shi-pi-vish-tah", "Lives in the rays of light", "కిరణాలలో నివసించేవాడు", "किरणों में बसने वाले"], ["प्रकाशनः", "Pra-kaa-sha-nah", "Makes everything shine", "అన్నిటినీ ప్రకాశింపజేసేవాడు", "सबको प्रकाशित करने वाले"]], "v": ["Vishnu has beautiful, strong arms. He is hard to hold in the mind, yet He holds up everything. He speaks beautifully and is Lord even of Indra. He gives wealth and is the true wealth. He has many forms and a vast form. He lives in the rays of light and makes everything shine.", "విష్ణువు అందమైన, బలమైన భుజాలు కలవాడు. మనసులో పట్టుకోవడం కష్టం, అయినా అన్నిటినీ భరిస్తాడు. అందంగా మాట్లాడతాడు, ఇంద్రునికి కూడా ప్రభువు. సంపదను ఇస్తాడు; నిజమైన సంపద ఆయనే. అనేక రూపాలు, విశాలమైన రూపం కలవాడు. కిరణాలలో నివసిస్తాడు, అన్నిటినీ ప్రకాశింపజేస్తాడు.", "विष्णु सुंदर, बलवान भुजाओं वाले हैं। उन्हें मन में पकड़ना कठिन है, फिर भी वे सबको धारण करते हैं। उनकी वाणी सुंदर है और वे इंद्र के भी स्वामी हैं। वे धन देते हैं और स्वयं सच्चा धन हैं। उनके अनेक रूप और विशाल रूप हैं। वे किरणों में बसते हैं और सबको प्रकाशित करते हैं।"]},
30:{"w": [["ओजस्तेजोद्युतिधरः", "O-jas-te-jo-dyu-ti-dha-rah", "Full of strength, power and brightness", "బలం, తేజస్సు, కాంతి నిండినవాడు", "बल, तेज और कांति से भरे"], ["प्रकाशात्मा", "Pra-kaa-shaat-maa", "His nature is light", "ఆయన స్వభావమే వెలుగు", "जिनका स्वभाव ही प्रकाश है"], ["प्रतापनः", "Pra-taa-pa-nah", "Gives warmth, like the sun", "సూర్యుడిలా వేడిని ఇచ్చేవాడు", "सूर्य की तरह ताप देने वाले"], ["ऋद्धः", "Rid-dhah", "Full of every good thing", "అన్ని మంచి విషయాలతో నిండినవాడు", "हर अच्छी चीज़ से भरे"], ["स्पष्टाक्षरः", "Spash-taak-sha-rah", "Is the clear sound of Om", "స్పష్టమైన ఓంకార నాదం ఆయనే", "ॐ की स्पष्ट ध्वनि"], ["मन्त्रः", "Man-trah", "Is the sacred mantra", "పవిత్ర మంత్రం ఆయనే", "स्वयं पवित्र मंत्र"], ["चन्द्रांशुः", "Chan-draam-shuh", "Cool like moonlight", "వెన్నెలలా చల్లనివాడు", "चाँदनी जैसे शीतल"], ["भास्करद्युतिः", "Bhaas-ka-ra-dyu-tih", "Bright like the sun", "సూర్యుడిలా ప్రకాశించేవాడు", "सूर्य जैसे उज्ज्वल"]], "v": ["Vishnu is full of strength, power and brightness; His very nature is light. Like the sun, He gives warmth. He is full of every good thing. He is the clear sound of Om and the sacred mantra. He is cool like moonlight and bright like the sun.", "విష్ణువు బలం, తేజస్సు, కాంతి నిండినవాడు; ఆయన స్వభావమే వెలుగు. సూర్యుడిలా వేడిని ఇస్తాడు. అన్ని మంచి విషయాలతో నిండినవాడు. స్పష్టమైన ఓంకార నాదం, పవిత్ర మంత్రం ఆయనే. వెన్నెలలా చల్లనివాడు, సూర్యుడిలా ప్రకాశించేవాడు.", "विष्णु बल, तेज और कांति से भरे हैं; उनका स्वभाव ही प्रकाश है। सूर्य की तरह वे ताप देते हैं। वे हर अच्छी चीज़ से भरे हैं। वे ॐ की स्पष्ट ध्वनि और पवित्र मंत्र हैं। वे चाँदनी जैसे शीतल और सूर्य जैसे उज्ज्वल हैं।"]},
31:{"w": [["अमृतांशूद्भवः", "A-mri-taam-shood-bha-vah", "The moon was born from Him", "చంద్రుడు ఆయన నుండి పుట్టాడు", "चंद्रमा जिनसे उत्पन्न हुआ"], ["भानुः", "Bhaa-nuh", "Shines brightly", "ప్రకాశించేవాడు", "चमकने वाले"], ["शशबिन्दुः", "Sha-sha-bin-duh", "Like the moon, nourishes all plants", "చంద్రుడిలా మొక్కలను పోషించేవాడు", "चंद्रमा की तरह पौधों का पोषण करने वाले"], ["सुरेश्वरः", "Su-resh-va-rah", "Lord of the gods", "దేవతలకు ప్రభువు", "देवताओं के स्वामी"], ["औषधम्", "Au-sha-dham", "The medicine for the illness of life", "సంసార రోగానికి ఔషధం", "संसार रूपी रोग की औषधि"], ["जगतः सेतुः", "Ja-ga-tas Se-tuh", "The bridge that takes the world across", "లోకాన్ని దాటించే వంతెన", "संसार को पार कराने वाला पुल"], ["सत्यधर्मपराक्रमः", "Sat-ya-dhar-ma-pa-raak-ra-mah", "True in His goodness and His deeds", "గుణాలలో, పనులలో సత్యమైనవాడు", "जिनके गुण और कर्म सच्चे हैं"]], "v": ["The moon was born from Vishnu. He shines brightly and, like the moon, nourishes all plants. He is Lord of the gods. He is the medicine for the illness of worldly life and the bridge that takes the world across. He is true in His goodness and in all His deeds.", "చంద్రుడు విష్ణువు నుండి పుట్టాడు. ఆయన ప్రకాశిస్తాడు; చంద్రుడిలా మొక్కలను పోషిస్తాడు. దేవతలకు ప్రభువు. సంసార రోగానికి ఔషధం, లోకాన్ని దాటించే వంతెన ఆయనే. గుణాలలో, పనులలో సత్యమైనవాడు.", "चंद्रमा विष्णु से उत्पन्न हुआ। वे चमकते हैं और चंद्रमा की तरह पौधों का पोषण करते हैं। वे देवताओं के स्वामी हैं। वे संसार रूपी रोग की औषधि और संसार को पार कराने वाला पुल हैं। उनके गुण और सब कर्म सच्चे हैं।"]},
32:{"w": [["भूतभव्यभवन्नाथः", "Bhoo-ta-bhav-ya-bha-van-naa-thah", "Lord of the past, future and present", "గతం, భవిష్యత్తు, వర్తమానాలకు నాథుడు", "भूत, भविष्य और वर्तमान के नाथ"], ["पवनः", "Pa-va-nah", "Purifies like the wind", "గాలిలా పవిత్రం చేసేవాడు", "वायु की तरह पवित्र करने वाले"], ["पावनः", "Paa-va-nah", "Makes us pure", "మనల్ని పవిత్రం చేసేవాడు", "हमें पवित्र करने वाले"], ["अनलः", "A-na-lah", "Never satisfied in giving to devotees", "భక్తులకు ఇవ్వడంలో తృప్తి చెందనివాడు", "भक्तों को देने में कभी न थकने वाले"], ["कामहा", "Kaa-ma-haa", "Removes selfish desires", "స్వార్థ కోరికలను పోగొట్టేవాడు", "स्वार्थी इच्छाओं को दूर करने वाले"], ["कामकृत्", "Kaa-ma-krit", "Fulfils good wishes", "మంచి కోరికలు తీర్చేవాడు", "अच्छी इच्छाएँ पूरी करने वाले"], ["कान्तः", "Kaan-tah", "Charming and lovely", "మనోహరుడు, అందమైనవాడు", "मनोहर और सुंदर"], ["कामः", "Kaa-mah", "The one everyone longs for", "అందరూ కోరుకునేవాడు", "जिन्हें सब चाहते हैं"], ["कामप्रदः", "Kaa-ma-pra-dah", "Gives what we wish for", "మనం కోరినది ఇచ్చేవాడు", "मनचाहा देने वाले"], ["प्रभुः", "Pra-bhuh", "The Lord", "ప్రభువు", "प्रभु"]], "v": ["Vishnu is Lord of the past, the future and the present. Like the wind He purifies, and He makes us pure. He is never satisfied in giving to His devotees. He removes selfish desires and fulfils good wishes. He is charming and lovely, the one everyone longs for. He gives what we wish for; He is the Lord.", "విష్ణువు గతం, భవిష్యత్తు, వర్తమానాలకు నాథుడు. గాలిలా పవిత్రం చేస్తాడు, మనల్ని పవిత్రులను చేస్తాడు. భక్తులకు ఇవ్వడంలో తృప్తి చెందడు. స్వార్థ కోరికలను పోగొడతాడు, మంచి కోరికలు తీరుస్తాడు. మనోహరుడు, అందమైనవాడు, అందరూ కోరుకునేవాడు. మనం కోరినది ఇస్తాడు; ఆయనే ప్రభువు.", "विष्णु भूत, भविष्य और वर्तमान के नाथ हैं। वायु की तरह वे पवित्र करते हैं, और हमें पवित्र बनाते हैं। भक्तों को देने में वे कभी नहीं थकते। वे स्वार्थी इच्छाओं को दूर करते हैं और अच्छी इच्छाएँ पूरी करते हैं। वे मनोहर और सुंदर हैं, जिन्हें सब चाहते हैं। वे मनचाहा देते हैं; वही प्रभु हैं।"]},
33:{"w": [["युगादिकृत्", "Yu-gaa-di-krit", "Begins each age of time", "ప్రతి యుగాన్ని ఆరంభించేవాడు", "हर युग का आरंभ करने वाले"], ["युगावर्तः", "Yu-gaa-var-tah", "Makes the ages turn", "యుగాలను తిప్పేవాడు", "युगों को घुमाने वाले"], ["नैकमायः", "Nai-ka-maa-yah", "Has many wonderful powers", "అనేక అద్భుత శక్తులు కలవాడు", "अनेक अद्भुत शक्तियों वाले"], ["महाशनः", "Ma-haa-sha-nah", "Swallows everything at the end", "చివరికి అన్నిటినీ మింగేవాడు", "अंत में सबको निगलने वाले"], ["अदृश्यः", "A-drish-yah", "Cannot be seen", "కనిపించనివాడు", "जिन्हें देखा न जा सके"], ["व्यक्तरूपः", "Vyak-ta-roo-pah", "Yet shows His form to devotees", "అయినా భక్తులకు రూపం చూపేవాడు", "फिर भी भक्तों को रूप दिखाने वाले"], ["सहस्रजित्", "Sa-has-ra-jit", "Wins over thousands", "వేలమందిని జయించేవాడు", "हज़ारों को जीतने वाले"], ["अनन्तजित्", "A-nan-ta-jit", "Wins over countless foes", "లెక్కలేనంతమందిని జయించేవాడు", "अनगिनत शत्रुओं को जीतने वाले"]], "v": ["Vishnu begins each age of time and makes the ages turn. He has many wonderful powers, and at the end He swallows everything. He cannot be seen, yet He shows His form to His devotees. He wins over thousands, over countless foes.", "విష్ణువు ప్రతి యుగాన్ని ఆరంభిస్తాడు, యుగాలను తిప్పుతాడు. అనేక అద్భుత శక్తులు కలవాడు; చివరికి అన్నిటినీ మింగేస్తాడు. కనిపించడు, అయినా భక్తులకు తన రూపం చూపిస్తాడు. వేలమందిని, లెక్కలేనంత శత్రువులను జయిస్తాడు.", "विष्णु हर युग का आरंभ करते हैं और युगों को घुमाते हैं। उनकी अनेक अद्भुत शक्तियाँ हैं, और अंत में वे सबको निगल लेते हैं। उन्हें देखा नहीं जा सकता, फिर भी वे भक्तों को अपना रूप दिखाते हैं। वे हज़ारों को, अनगिनत शत्रुओं को जीतते हैं।"]},
34:{"w": [["इष्टः", "Ish-tah", "Dear to all; worshipped in yajnas", "అందరికీ ప్రియుడు; యజ్ఞాలలో పూజించబడేవాడు", "सबके प्रिय; यज्ञों में पूजे जाने वाले"], ["अविशिष्टः", "A-vi-shish-tah", "Lives equally in all", "అందరిలో సమానంగా ఉండేవాడు", "सबमें समान रूप से बसने वाले"], ["शिष्टेष्टः", "Shish-tesh-tah", "Dear to good people", "మంచివారికి ప్రియుడు", "सज्जनों के प्रिय"], ["शिखण्डी", "Shi-khan-dee", "Wears a peacock feather", "నెమలి పింఛం ధరించినవాడు", "मोरपंख धारण करने वाले"], ["नहुषः", "Na-hu-shah", "Binds all beings with His maya", "మాయతో అన్ని జీవులను బంధించేవాడు", "माया से सब प्राणियों को बाँधने वाले"], ["वृषः", "Vri-shah", "Is dharma itself", "ధర్మమే ఆయన", "स्वयं धर्म"], ["क्रोधहा", "Kro-dha-haa", "Removes anger", "కోపాన్ని పోగొట్టేవాడు", "क्रोध को दूर करने वाले"], ["क्रोधकृत्कर्ता", "Kro-dha-krit-kar-taa", "Shows anger to the wicked; the doer of all", "దుష్టులపై కోపం చూపేవాడు; అన్నీ చేసేవాడు", "दुष्टों पर क्रोध करने वाले; सबके कर्ता"], ["विश्वबाहुः", "Vish-va-baa-huh", "His arms reach everywhere", "ఆయన చేతులు అంతటా చేరుతాయి", "जिनकी भुजाएँ सब जगह पहुँचती हैं"], ["महीधरः", "Ma-hee-dha-rah", "Holds up the earth", "భూమిని ధరించేవాడు", "पृथ्वी को धारण करने वाले"]], "v": ["Vishnu is dear to all and worshipped in every yajna. He lives equally in all, and good people love Him. He wears a peacock feather. He binds all beings with His maya, and He is dharma itself. He removes our anger, yet shows anger to the wicked; He is the doer of all. His arms reach everywhere, and He holds up the earth.", "విష్ణువు అందరికీ ప్రియుడు, ప్రతి యజ్ఞంలో పూజించబడతాడు. అందరిలో సమానంగా ఉంటాడు; మంచివారు ఆయనను ప్రేమిస్తారు. నెమలి పింఛం ధరిస్తాడు. మాయతో అన్ని జీవులను బంధిస్తాడు; ధర్మమే ఆయన. మన కోపాన్ని పోగొడతాడు, కానీ దుష్టులపై కోపం చూపిస్తాడు; అన్నీ చేసేవాడు ఆయనే. ఆయన చేతులు అంతటా చేరుతాయి; భూమిని ధరిస్తాడు.", "विष्णु सबके प्रिय हैं और हर यज्ञ में पूजे जाते हैं। वे सबमें समान रूप से बसते हैं, और सज्जन उनसे प्रेम करते हैं। वे मोरपंख धारण करते हैं। वे माया से सब प्राणियों को बाँधते हैं, और स्वयं धर्म हैं। वे हमारा क्रोध दूर करते हैं, फिर भी दुष्टों पर क्रोध करते हैं; वे सबके कर्ता हैं। उनकी भुजाएँ सब जगह पहुँचती हैं, और वे पृथ्वी को धारण करते हैं।"]},
35:{"w": [["अच्युतः", "Ach-yu-tah", "Never slips from His glory", "తన స్థితి నుండి ఎప్పుడూ జారనివాడు", "अपनी महिमा से कभी न डिगने वाले"], ["प्रथितः", "Pra-thi-tah", "Famous everywhere", "అంతటా ప్రసిద్ధుడు", "सब जगह प्रसिद्ध"], ["प्राणः", "Praa-nah", "Is life itself", "ప్రాణమే ఆయన", "स्वयं प्राण"], ["प्राणदः", "Praa-na-dah", "Gives life", "ప్రాణం ఇచ్చేవాడు", "प्राण देने वाले"], ["वासवानुजः", "Vaa-sa-vaa-nu-jah", "Indra's younger brother (Vamana)", "ఇంద్రుని తమ్ముడు (వామనుడు)", "इंद्र के छोटे भाई (वामन)"], ["अपांनिधिः", "A-paam-ni-dhih", "Like the ocean, deep and full", "సముద్రంలా లోతైన, నిండినవాడు", "सागर जैसे गहरे और पूर्ण"], ["अधिष्ठानम्", "A-dhish-thaa-nam", "The base on which all rests", "అన్నిటికీ ఆధారం", "सबका आधार"], ["अप्रमत्तः", "Ap-ra-mat-tah", "Never careless", "ఎప్పుడూ ఏమరుపాటు లేనివాడు", "कभी असावधान नहीं"], ["प्रतिष्ठितः", "Pra-tish-thi-tah", "Stands firm in Himself", "తనలో స్థిరంగా నిలిచినవాడు", "अपने में दृढ़ स्थित"]], "v": ["Vishnu never slips from His glory and is famous everywhere. He is life itself and gives life. He came as Vamana, Indra's younger brother. He is deep and full like the ocean, and everything rests on Him. He is never careless, and He stands firm in Himself.", "విష్ణువు తన స్థితి నుండి ఎప్పుడూ జారడు; అంతటా ప్రసిద్ధుడు. ప్రాణమే ఆయన, ప్రాణం ఇస్తాడు. ఇంద్రుని తమ్ముడైన వామనుడిగా వచ్చాడు. సముద్రంలా లోతైనవాడు, నిండినవాడు; అన్నీ ఆయనపైనే నిలిచి ఉన్నాయి. ఎప్పుడూ ఏమరుపాటు లేదు; తనలో స్థిరంగా నిలిచినవాడు.", "विष्णु अपनी महिमा से कभी नहीं डिगते और सब जगह प्रसिद्ध हैं। वे स्वयं प्राण हैं और प्राण देते हैं। वे इंद्र के छोटे भाई वामन बनकर आए। वे सागर जैसे गहरे और पूर्ण हैं, और सब कुछ उन्हीं पर टिका है। वे कभी असावधान नहीं होते, और अपने में दृढ़ स्थित हैं।"]},
36:{"w": [["स्कन्दः", "Skan-dah", "Flows like nectar; leads the army of the gods", "అమృతంలా ప్రవహించేవాడు; దేవ సేనకు నాయకుడు", "अमृत की तरह बहने वाले; देव सेना के नायक"], ["स्कन्दधरः", "Skan-da-dha-rah", "Upholds the path of dharma", "ధర్మ మార్గాన్ని నిలిపేవాడు", "धर्म मार्ग को धारण करने वाले"], ["धुर्यः", "Dhur-yah", "Carries the load of the world", "లోక భారాన్ని మోసేవాడు", "संसार का भार उठाने वाले"], ["वरदः", "Va-ra-dah", "Grants boons", "వరాలు ఇచ్చేవాడు", "वरदान देने वाले"], ["वायुवाहनः", "Vaa-yu-vaa-ha-nah", "Makes the winds move", "గాలులను నడిపించేవాడు", "वायु को चलाने वाले"], ["वासुदेवः", "Vaa-su-de-vah", "Lives in all, and all live in Him", "అందరిలో ఉండేవాడు, అందరూ ఆయనలో ఉంటారు", "सबमें बसने वाले, सब जिनमें बसते हैं"], ["बृहद्भानुः", "Bri-had-bhaa-nuh", "Shines with great light", "గొప్ప కాంతితో ప్రకాశించేవాడు", "महान प्रकाश से चमकने वाले"], ["आदिदेवः", "Aa-di-de-vah", "The first God", "ఆది దేవుడు", "आदि देव"], ["पुरन्दरः", "Pu-ran-da-rah", "Destroys the cities of the wicked", "దుష్టుల పురాలను నాశనం చేసేవాడు", "दुष्टों के नगरों का नाश करने वाले"]], "v": ["Vishnu flows like nectar and leads the army of the gods. He upholds the path of dharma and carries the load of the world. He grants boons and makes the winds move. He is Vasudeva, who lives in all and in whom all live. He shines with great light; He is the first God, who destroys the cities of the wicked.", "విష్ణువు అమృతంలా ప్రవహిస్తాడు, దేవ సేనకు నాయకుడు. ధర్మ మార్గాన్ని నిలుపుతాడు, లోక భారాన్ని మోస్తాడు. వరాలు ఇస్తాడు, గాలులను నడిపిస్తాడు. అందరిలో ఉండే, అందరూ తనలో ఉండే వాసుదేవుడు ఆయనే. గొప్ప కాంతితో ప్రకాశిస్తాడు; దుష్టుల పురాలను నాశనం చేసే ఆది దేవుడు.", "विष्णु अमृत की तरह बहते हैं और देव सेना के नायक हैं। वे धर्म मार्ग को धारण करते हैं और संसार का भार उठाते हैं। वे वरदान देते हैं और वायु को चलाते हैं। वे वासुदेव हैं, जो सबमें बसते हैं और जिनमें सब बसते हैं। वे महान प्रकाश से चमकते हैं; वे दुष्टों के नगरों का नाश करने वाले आदि देव हैं।"]},
37:{"w": [["अशोकः", "A-sho-kah", "Free from sorrow", "దుఃఖం లేనివాడు", "शोक रहित"], ["तारणः", "Taa-ra-nah", "Takes us across the sea of life", "సంసారాన్ని దాటించేవాడు", "संसार सागर से पार कराने वाले"], ["तारः", "Taa-rah", "Saves us from fear", "భయం నుండి కాపాడేవాడు", "भय से बचाने वाले"], ["शूरः", "Shoo-rah", "Brave", "వీరుడు", "वीर"], ["शौरिः", "Shau-rih", "Born in the family of Shura (as Krishna)", "శూరుని వంశంలో పుట్టినవాడు (కృష్ణుడిగా)", "शूर के वंश में जन्मे (कृष्ण रूप में)"], ["जनेश्वरः", "Ja-nesh-va-rah", "Lord of all people", "అందరు ప్రజలకు ప్రభువు", "सब लोगों के स्वामी"], ["अनुकूलः", "A-nu-koo-lah", "Always on our side", "ఎప్పుడూ మనకు అనుకూలంగా ఉండేవాడు", "सदा हमारे पक्ष में"], ["शतावर्तः", "Sha-taa-var-tah", "Came again and again in many avatars", "అనేక అవతారాలుగా మళ్ళీ మళ్ళీ వచ్చినవాడు", "अनेक अवतारों में बार-बार आने वाले"], ["पद्मी", "Pad-mee", "Holds a lotus", "తామర పట్టుకున్నవాడు", "कमल धारण करने वाले"], ["पद्मनिभेक्षणः", "Pad-ma-ni-bhek-sha-nah", "Has eyes like lotuses", "తామరల వంటి కళ్ళు కలవాడు", "कमल जैसे नेत्रों वाले"]], "v": ["Vishnu is free from sorrow. He takes us across the sea of life and saves us from fear. He is brave; as Krishna He was born in the family of Shura. He is Lord of all people and always on our side. He came again and again in many avatars. He holds a lotus, and His eyes are like lotuses.", "విష్ణువుకు దుఃఖం లేదు. సంసారాన్ని దాటిస్తాడు, భయం నుండి కాపాడుతాడు. వీరుడు; కృష్ణుడిగా శూరుని వంశంలో పుట్టాడు. అందరు ప్రజలకు ప్రభువు, ఎప్పుడూ మనకు అనుకూలంగా ఉంటాడు. అనేక అవతారాలుగా మళ్ళీ మళ్ళీ వచ్చాడు. తామర పట్టుకుంటాడు; ఆయన కళ్ళు తామరల వంటివి.", "विष्णु शोक रहित हैं। वे हमें संसार सागर से पार कराते हैं और भय से बचाते हैं। वे वीर हैं; कृष्ण रूप में वे शूर के वंश में जन्मे। वे सब लोगों के स्वामी हैं और सदा हमारे पक्ष में हैं। वे अनेक अवतारों में बार-बार आए। वे कमल धारण करते हैं, और उनके नेत्र कमल जैसे हैं।"]},
38:{"w": [["पद्मनाभः", "Pad-ma-naa-bhah", "A lotus grows from His navel", "నాభి నుండి తామర పుట్టినవాడు", "जिनकी नाभि से कमल निकला"], ["अरविन्दाक्षः", "A-ra-vin-daak-shah", "Has lotus eyes", "తామర కళ్ళవాడు", "कमल नयन"], ["पद्मगर्भः", "Pad-ma-gar-bhah", "Lives in the lotus of our heart", "మన హృదయ కమలంలో నివసించేవాడు", "हमारे हृदय कमल में बसने वाले"], ["शरीरभृत्", "Sha-ree-ra-bhrit", "Supports every body", "ప్రతి శరీరాన్ని పోషించేవాడు", "हर शरीर का पोषण करने वाले"], ["महर्द्धिः", "Ma-har-dhih", "Of great wealth and glory", "గొప్ప ఐశ్వర్యం కలవాడు", "महान ऐश्वर्य वाले"], ["ऋद्धः", "Rid-dhah", "Grows into the whole world", "లోకమంతా విస్తరించేవాడు", "पूरे संसार में फैले"], ["वृद्धात्मा", "Vrid-dhaat-maa", "Ancient and wise", "ప్రాచీనుడు, జ్ఞాని", "प्राचीन और ज्ञानी"], ["महाक्षः", "Ma-haak-shah", "Has great eyes", "గొప్ప కళ్ళు కలవాడు", "विशाल नेत्रों वाले"], ["गरुडध्वजः", "Ga-ru-da-dhva-jah", "Garuda is on His flag", "ఆయన జెండాపై గరుడుడు", "जिनके ध्वज पर गरुड़ हैं"]], "v": ["A lotus grows from Vishnu's navel, and His eyes are like lotuses. He lives in the lotus of our heart and supports every body. He has great wealth and glory and grows into the whole world. He is ancient and wise, with great eyes, and Garuda is on His flag.", "విష్ణువు నాభి నుండి తామర పుట్టింది; ఆయన కళ్ళు తామరల వంటివి. మన హృదయ కమలంలో నివసిస్తాడు, ప్రతి శరీరాన్ని పోషిస్తాడు. గొప్ప ఐశ్వర్యం కలవాడు, లోకమంతా విస్తరిస్తాడు. ప్రాచీనుడు, జ్ఞాని, గొప్ప కళ్ళు కలవాడు; ఆయన జెండాపై గరుడుడు ఉంటాడు.", "विष्णु की नाभि से कमल निकला, और उनके नेत्र कमल जैसे हैं। वे हमारे हृदय कमल में बसते हैं और हर शरीर का पोषण करते हैं। वे महान ऐश्वर्य वाले हैं और पूरे संसार में फैले हैं। वे प्राचीन और ज्ञानी हैं, विशाल नेत्रों वाले, और उनके ध्वज पर गरुड़ हैं।"]},
39:{"w": [["अतुलः", "A-tu-lah", "No one can compare with Him", "ఆయనతో ఎవరూ సాటిరారు", "जिनकी कोई तुलना नहीं"], ["शरभः", "Sha-ra-bhah", "Shines in every body", "ప్రతి శరీరంలో ప్రకాశించేవాడు", "हर शरीर में चमकने वाले"], ["भीमः", "Bhee-mah", "Fearsome to the wicked", "దుష్టులకు భయంకరుడు", "दुष्टों के लिए भयंकर"], ["समयज्ञः", "Sa-ma-yaj-nah", "Knows the right time for everything", "అన్నిటికీ సరైన సమయం తెలిసినవాడు", "हर काम का सही समय जानने वाले"], ["हविर्हरिः", "Ha-vir-ha-rih", "Receives the offerings; removes sins", "హవిస్సు స్వీకరించేవాడు; పాపాలను తొలగించేవాడు", "आहुति ग्रहण करने वाले; पाप हरने वाले"], ["सर्वलक्षणलक्षण्यः", "Sar-va-lak-sha-na-lak-shan-yah", "Has every good sign and quality", "అన్ని శుభ లక్షణాలు కలవాడు", "सभी शुभ लक्षणों वाले"], ["लक्ष्मीवान्", "Lak-shmee-vaan", "Lakshmi is always with Him", "లక్ష్మి ఎప్పుడూ ఆయనతో ఉంటుంది", "लक्ष्मी सदा जिनके साथ हैं"], ["समितिञ्जयः", "Sa-mi-tin-ja-yah", "Wins every battle", "ప్రతి యుద్ధంలో గెలిచేవాడు", "हर युद्ध जीतने वाले"]], "v": ["No one can compare with Vishnu. He shines in every body and is fearsome to the wicked. He knows the right time for everything. He receives our offerings and removes our sins. He has every good sign and quality, Lakshmi is always with Him, and He wins every battle.", "విష్ణువుతో ఎవరూ సాటిరారు. ప్రతి శరీరంలో ప్రకాశిస్తాడు, దుష్టులకు భయంకరుడు. అన్నిటికీ సరైన సమయం తెలిసినవాడు. మన హవిస్సు స్వీకరిస్తాడు, పాపాలను తొలగిస్తాడు. అన్ని శుభ లక్షణాలు కలవాడు; లక్ష్మి ఎప్పుడూ ఆయనతో ఉంటుంది; ప్రతి యుద్ధంలో గెలుస్తాడు.", "विष्णु की कोई तुलना नहीं। वे हर शरीर में चमकते हैं और दुष्टों के लिए भयंकर हैं। वे हर काम का सही समय जानते हैं। वे हमारी आहुति ग्रहण करते हैं और पाप हरते हैं। उनमें सभी शुभ लक्षण हैं, लक्ष्मी सदा उनके साथ हैं, और वे हर युद्ध जीतते हैं।"]},
40:{"w": [["विक्षरः", "Vik-sha-rah", "Never decays", "ఎప్పుడూ క్షీణించనివాడు", "कभी क्षीण न होने वाले"], ["रोहितः", "Ro-hi-tah", "Took the form of the red fish", "ఎర్రని చేప రూపం దాల్చినవాడు", "लाल मछली का रूप धरने वाले"], ["मार्गः", "Maar-gah", "Is the path to freedom", "ముక్తికి మార్గం ఆయనే", "मुक्ति का मार्ग"], ["हेतुः", "He-tuh", "The cause of everything", "అన్నిటికీ కారణం", "सबका कारण"], ["दामोदरः", "Daa-mo-da-rah", "Tied with a rope at the waist (as baby Krishna)", "బాలకృష్ణుడిగా నడుముకు తాడుతో కట్టబడినవాడు", "बाल कृष्ण रूप में कमर पर रस्सी से बँधे"], ["सहः", "Sa-hah", "Patient with all", "అందరినీ సహించేవాడు", "सबको सहने वाले"], ["महीधरः", "Ma-hee-dha-rah", "Holds up the earth", "భూమిని ధరించేవాడు", "पृथ्वी को धारण करने वाले"], ["महाभागः", "Ma-haa-bhaa-gah", "Most blessed", "మహా భాగ్యశాలి", "महाभाग्यशाली"], ["वेगवान्", "Ve-ga-vaan", "Swift", "వేగం కలవాడు", "वेगवान"], ["अमिताशनः", "A-mi-taa-sha-nah", "At the end, takes in the whole world", "చివరికి లోకమంతా తనలో చేర్చుకునేవాడు", "अंत में पूरे संसार को समा लेने वाले"]], "v": ["Vishnu never decays. He took the form of a red fish. He is the path to freedom and the cause of everything. As baby Krishna He let Yashoda tie Him with a rope at the waist. He is patient with all and holds up the earth. He is most blessed and swift, and at the end He takes in the whole world.", "విష్ణువు ఎప్పుడూ క్షీణించడు. ఎర్రని చేప రూపం దాల్చాడు. ముక్తికి మార్గం, అన్నిటికీ కారణం ఆయనే. బాలకృష్ణుడిగా యశోద తన నడుముకు తాడు కట్టనిచ్చాడు. అందరినీ సహిస్తాడు, భూమిని ధరిస్తాడు. మహా భాగ్యశాలి, వేగం కలవాడు; చివరికి లోకమంతా తనలో చేర్చుకుంటాడు.", "विष्णु कभी क्षीण नहीं होते। उन्होंने लाल मछली का रूप धरा। वे मुक्ति का मार्ग और सबका कारण हैं। बाल कृष्ण रूप में उन्होंने यशोदा को अपनी कमर पर रस्सी बाँधने दी। वे सबको सहते हैं और पृथ्वी को धारण करते हैं। वे महाभाग्यशाली और वेगवान हैं, और अंत में पूरे संसार को अपने में समा लेते हैं।"]},
41:{"w": [["उद्भवः", "Ud-bha-vah", "The source from which all things arise", "అన్నీ పుట్టే మూలం", "जिनसे सब उत्पन्न होता है"], ["क्षोभणः", "Ksho-bha-nah", "Sets creation in motion", "సృష్టిని కదిలించేవాడు", "सृष्टि को गति देने वाले"], ["देवः", "De-vah", "Shines and plays", "ప్రకాశించేవాడు, లీలలు చేసేవాడు", "प्रकाशमान, लीला करने वाले"], ["श्रीगर्भः", "Shree-gar-bhah", "Holds Lakshmi in His heart", "హృదయంలో లక్ష్మిని ధరించేవాడు", "हृदय में लक्ष्मी को धारण करने वाले"], ["परमेश्वरः", "Pa-ra-mesh-va-rah", "The Supreme Lord", "పరమేశ్వరుడు", "परमेश्वर"], ["करणम्", "Ka-ra-nam", "The tool through which all is made", "సృష్టికి సాధనం", "सृष्टि का साधन"], ["कारणम्", "Kaa-ra-nam", "The cause of all", "అన్నిటికీ కారణం", "सबका कारण"], ["कर्ता", "Kar-taa", "The doer", "చేసేవాడు", "कर्ता"], ["विकर्ता", "Vi-kar-taa", "Makes the world so varied", "లోకాన్ని వైవిధ్యంగా చేసేవాడు", "संसार को विविध बनाने वाले"], ["गहनः", "Ga-ha-nah", "Deep, hard to understand", "లోతైనవాడు, అర్థం చేసుకోవడం కష్టం", "गहन, समझने में कठिन"], ["गुहः", "Gu-hah", "Hides in our heart and protects us", "మన హృదయంలో దాగి కాపాడేవాడు", "हमारे हृदय में छिपकर रक्षा करने वाले"]], "v": ["All things arise from Vishnu, and He sets creation in motion. He shines and plays, holds Lakshmi in His heart, and is the Supreme Lord. He is the tool, the cause and the doer of creation, and He makes the world so varied. He is deep and hard to understand, and He hides in our heart to protect us.", "విష్ణువు నుండే అన్నీ పుడతాయి; సృష్టిని కదిలిస్తాడు. ప్రకాశిస్తాడు, లీలలు చేస్తాడు, హృదయంలో లక్ష్మిని ధరిస్తాడు; పరమేశ్వరుడు. సృష్టికి సాధనం, కారణం, కర్త ఆయనే; లోకాన్ని వైవిధ్యంగా చేస్తాడు. లోతైనవాడు, అర్థం చేసుకోవడం కష్టం; మన హృదయంలో దాగి కాపాడుతాడు.", "सब कुछ विष्णु से उत्पन्न होता है, और वे सृष्टि को गति देते हैं। वे प्रकाशमान हैं, लीला करते हैं, हृदय में लक्ष्मी को धारण करते हैं, और परमेश्वर हैं। वे सृष्टि के साधन, कारण और कर्ता हैं, और संसार को विविध बनाते हैं। वे गहन और समझने में कठिन हैं, और हमारे हृदय में छिपकर हमारी रक्षा करते हैं।"]},
42:{"w": [["व्यवसायः", "Vya-va-saa-yah", "Is firm wisdom", "స్థిరమైన జ్ఞానం ఆయనే", "स्वयं दृढ़ ज्ञान"], ["व्यवस्थानः", "Vya-va-sthaa-nah", "Keeps everything in order", "అన్నిటినీ క్రమంలో ఉంచేవాడు", "सबको व्यवस्था में रखने वाले"], ["संस्थानः", "Sam-sthaa-nah", "Where everything rests at the end", "చివరికి అన్నీ చేరే స్థానం", "अंत में सबका ठिकाना"], ["स्थानदः", "Sthaa-na-dah", "Gives each one their rightful place", "ప్రతి ఒక్కరికీ తగిన స్థానం ఇచ్చేవాడు", "हर किसी को उचित स्थान देने वाले"], ["ध्रुवः", "Dhru-vah", "Firm and unchanging", "స్థిరమైనవాడు, మారనివాడు", "अटल और अपरिवर्तनीय"], ["परर्द्धिः", "Pa-rar-dhih", "Of the highest glory", "అత్యున్నత వైభవం కలవాడు", "सर्वोच्च वैभव वाले"], ["परमस्पष्टः", "Pa-ra-mas-pash-tah", "Very clear to the devoted", "భక్తులకు స్పష్టంగా కనిపించేవాడు", "भक्तों को स्पष्ट दिखने वाले"], ["तुष्टः", "Tush-tah", "Always content", "ఎప్పుడూ తృప్తిగా ఉండేవాడు", "सदा संतुष्ट"], ["पुष्टः", "Push-tah", "Full and complete", "పరిపూర్ణుడు", "पूर्ण"], ["शुभेक्षणः", "Shu-bhek-sha-nah", "His glance brings blessings", "ఆయన చూపు శుభం కలిగిస్తుంది", "जिनकी दृष्टि मंगल करती है"]], "v": ["Vishnu is firm wisdom and keeps everything in order. At the end, everything rests in Him. He gives each one their rightful place and is firm and unchanging. He has the highest glory and is very clear to the devoted. He is always content and complete, and His glance brings blessings.", "విష్ణువు స్థిరమైన జ్ఞానం, అన్నిటినీ క్రమంలో ఉంచుతాడు. చివరికి అన్నీ ఆయనలోనే చేరతాయి. ప్రతి ఒక్కరికీ తగిన స్థానం ఇస్తాడు; స్థిరమైనవాడు, మారనివాడు. అత్యున్నత వైభవం కలవాడు, భక్తులకు స్పష్టంగా కనిపిస్తాడు. ఎప్పుడూ తృప్తిగా, పరిపూర్ణంగా ఉంటాడు; ఆయన చూపు శుభం కలిగిస్తుంది.", "विष्णु दृढ़ ज्ञान हैं और सबको व्यवस्था में रखते हैं। अंत में सब कुछ उन्हीं में ठहरता है। वे हर किसी को उचित स्थान देते हैं और अटल हैं। वे सर्वोच्च वैभव वाले हैं और भक्तों को स्पष्ट दिखते हैं। वे सदा संतुष्ट और पूर्ण हैं, और उनकी दृष्टि मंगल करती है।"]},
43:{"w": [["रामः", "Raa-mah", "Gives joy; came as Rama", "ఆనందం ఇచ్చేవాడు; రాముడిగా వచ్చినవాడు", "आनंद देने वाले; राम रूप में आए"], ["विरामः", "Vi-raa-mah", "Where all beings find rest", "అన్ని జీవులు విశ్రమించే చోటు", "जहाँ सब प्राणी विश्राम पाते हैं"], ["विरजः", "Vi-ra-jah", "Free from all impurity", "ఏ మాలిన్యమూ లేనివాడు", "हर मलिनता से रहित"], ["मार्गः", "Maar-gah", "Is the way to Him", "ఆయనను చేరే మార్గం ఆయనే", "उन तक पहुँचने का मार्ग"], ["नेयः", "Ne-yah", "Can be led by love", "ప్రేమకు లొంగేవాడు", "प्रेम से वश में होने वाले"], ["नयः", "Na-yah", "Leads us", "మనల్ని నడిపించేవాడు", "हमें ले चलने वाले"], ["अनयः", "A-na-yah", "No one can lead Him", "ఆయనను ఎవరూ నడిపించలేరు", "जिन्हें कोई चला न सके"], ["वीरः", "Vee-rah", "Brave", "వీరుడు", "वीर"], ["शक्तिमतां श्रेष्ठः", "Shak-ti-ma-taam Shresh-thah", "The strongest of the strong", "బలవంతులలో శ్రేష్ఠుడు", "बलवानों में श्रेष्ठ"], ["धर्मः", "Dhar-mah", "Is dharma itself", "ధర్మమే ఆయన", "स्वयं धर्म"], ["धर्मविदुत्तमः", "Dhar-ma-vi-dut-ta-mah", "The best of those who know dharma", "ధర్మం తెలిసినవారిలో ఉత్తముడు", "धर्म जानने वालों में श्रेष्ठ"]], "v": ["Vishnu gives joy and came as Rama. All beings find rest in Him. He is free from all impurity and is the way to reach Him. He can be led by love, He leads us, yet no one can lead Him by force. He is brave, the strongest of the strong. He is dharma itself and the best of those who know dharma.", "విష్ణువు ఆనందం ఇస్తాడు, రాముడిగా వచ్చాడు. అన్ని జీవులు ఆయనలో విశ్రమిస్తాయి. ఏ మాలిన్యమూ లేనివాడు; ఆయనను చేరే మార్గం ఆయనే. ప్రేమకు లొంగుతాడు, మనల్ని నడిపిస్తాడు, కానీ బలవంతంగా ఆయనను ఎవరూ నడిపించలేరు. వీరుడు, బలవంతులలో శ్రేష్ఠుడు. ధర్మమే ఆయన, ధర్మం తెలిసినవారిలో ఉత్తముడు.", "विष्णु आनंद देते हैं और राम रूप में आए। सब प्राणी उनमें विश्राम पाते हैं। वे हर मलिनता से रहित हैं और उन तक पहुँचने का मार्ग स्वयं हैं। वे प्रेम से वश में होते हैं, हमें ले चलते हैं, पर उन्हें कोई बलपूर्वक नहीं चला सकता। वे वीर हैं, बलवानों में श्रेष्ठ। वे स्वयं धर्म हैं और धर्म जानने वालों में श्रेष्ठ।"]},
44:{"w": [["वैकुण्ठः", "Vai-kun-thah", "Brings the world together in harmony", "లోకాన్ని సామరస్యంగా కలిపేవాడు", "संसार को एकता में जोड़ने वाले"], ["पुरुषः", "Pu-ru-shah", "Was there before all", "అందరికంటే ముందు ఉన్నవాడు", "सबसे पहले विद्यमान"], ["प्राणः", "Praa-nah", "Is the breath of life", "ప్రాణవాయువు ఆయనే", "स्वयं प्राण वायु"], ["प्राणदः", "Praa-na-dah", "Gives life", "ప్రాణం ఇచ్చేవాడు", "प्राण देने वाले"], ["प्रणवः", "Pra-na-vah", "Is Om", "ఓంకారం ఆయనే", "स्वयं ॐ"], ["पृथुः", "Pri-thuh", "Vast, spread everywhere", "విశాలమైనవాడు, అంతటా వ్యాపించినవాడు", "विशाल, सब जगह फैले"], ["हिरण्यगर्भः", "Hi-ran-ya-gar-bhah", "The golden source of creation", "సృష్టికి బంగారు మూలం", "सृष्टि का स्वर्णिम मूल"], ["शत्रुघ्नः", "Sha-trugh-nah", "Destroys enemies", "శత్రువులను నాశనం చేసేవాడు", "शत्रुओं का नाश करने वाले"], ["व्याप्तः", "Vyaap-tah", "Fills everything", "అన్నిటిలో నిండినవాడు", "सबमें व्याप्त"], ["वायुः", "Vaa-yuh", "Moves like the wind", "గాలిలా కదిలేవాడు", "वायु की तरह चलने वाले"], ["अधोक्षजः", "A-dhok-sha-jah", "Beyond the reach of the senses", "ఇంద్రియాలకు అందనివాడు", "इंद्रियों की पहुँच से परे"]], "v": ["Vishnu brings the world together in harmony, and He was there before all. He is the breath of life and gives life; He is Om. He is vast and spread everywhere, the golden source of creation. He destroys enemies, fills everything, and moves like the wind. He is beyond the reach of our senses.", "విష్ణువు లోకాన్ని సామరస్యంగా కలుపుతాడు; అందరికంటే ముందు ఉన్నాడు. ప్రాణవాయువు ఆయనే, ప్రాణం ఇస్తాడు; ఓంకారం ఆయనే. విశాలమైనవాడు, అంతటా వ్యాపించినవాడు, సృష్టికి బంగారు మూలం. శత్రువులను నాశనం చేస్తాడు, అన్నిటిలో నిండి ఉన్నాడు, గాలిలా కదులుతాడు. మన ఇంద్రియాలకు అందడు.", "विष्णु संसार को एकता में जोड़ते हैं, और वे सबसे पहले थे। वे प्राण वायु हैं और प्राण देते हैं; वे स्वयं ॐ हैं। वे विशाल, सब जगह फैले, सृष्टि के स्वर्णिम मूल हैं। वे शत्रुओं का नाश करते हैं, सबमें व्याप्त हैं, और वायु की तरह चलते हैं। वे हमारी इंद्रियों की पहुँच से परे हैं।"]},
45:{"w": [["ऋतुः", "Ri-tuh", "Is the seasons", "ఋతువులు ఆయనే", "स्वयं ऋतुएँ"], ["सुदर्शनः", "Su-dar-sha-nah", "Lovely to see; holds the Sudarshana discus", "చూడటానికి అందమైనవాడు; సుదర్శన చక్రధారి", "देखने में सुंदर; सुदर्शन चक्रधारी"], ["कालः", "Kaa-lah", "Is time", "కాలం ఆయనే", "स्वयं काल"], ["परमेष्ठी", "Pa-ra-mesh-thee", "Lives in the highest place", "అత్యున్నత స్థానంలో ఉండేవాడు", "सबसे ऊँचे स्थान में रहने वाले"], ["परिग्रहः", "Pa-ri-gra-hah", "Accepts whatever we offer", "మనం సమర్పించినది స్వీకరించేవాడు", "हमारा हर अर्पण स्वीकार करने वाले"], ["उग्रः", "Ug-rah", "Fierce to the wicked", "దుష్టులకు ఉగ్రుడు", "दुष्टों के लिए उग्र"], ["संवत्सरः", "Sam-vat-sa-rah", "Is the year; all beings live in Him", "సంవత్సరం ఆయనే; అందరూ ఆయనలో నివసిస్తారు", "स्वयं वर्ष; सब उनमें बसते हैं"], ["दक्षः", "Dak-shah", "Quick and skilful", "చురుకైనవాడు, నేర్పరి", "फुर्तीले और कुशल"], ["विश्रामः", "Vish-raa-mah", "Gives rest to the weary", "అలసినవారికి విశ్రాంతి ఇచ్చేవాడు", "थके हुओं को विश्राम देने वाले"], ["विश्वदक्षिणः", "Vish-va-dak-shi-nah", "Most generous to all", "అందరిపట్ల అత్యంత ఉదారుడు", "सबके प्रति अत्यंत उदार"]], "v": ["Vishnu is the seasons and time itself. He is lovely to see and holds the Sudarshana discus. He lives in the highest place, yet accepts whatever we offer. He is fierce to the wicked. He is the year, and all beings live in Him. He is quick and skilful, gives rest to the weary, and is most generous to all.", "విష్ణువే ఋతువులు, కాలం. చూడటానికి అందమైనవాడు, సుదర్శన చక్రధారి. అత్యున్నత స్థానంలో ఉంటాడు, అయినా మనం సమర్పించినది స్వీకరిస్తాడు. దుష్టులకు ఉగ్రుడు. సంవత్సరం ఆయనే; అందరూ ఆయనలో నివసిస్తారు. చురుకైనవాడు, నేర్పరి, అలసినవారికి విశ్రాంతి ఇస్తాడు, అందరిపట్ల అత్యంత ఉదారుడు.", "विष्णु स्वयं ऋतुएँ और काल हैं। वे देखने में सुंदर हैं और सुदर्शन चक्र धारण करते हैं। वे सबसे ऊँचे स्थान में रहते हैं, फिर भी हमारा हर अर्पण स्वीकार करते हैं। वे दुष्टों के लिए उग्र हैं। वे स्वयं वर्ष हैं, और सब उनमें बसते हैं। वे फुर्तीले और कुशल हैं, थके हुओं को विश्राम देते हैं, और सबके प्रति अत्यंत उदार हैं।"]},
46:{"w": [["विस्तारः", "Vis-taa-rah", "The whole world spreads out from Him", "లోకమంతా ఆయన నుండి విస్తరిస్తుంది", "पूरा संसार जिनसे फैलता है"], ["स्थावरस्थाणुः", "Sthaa-va-ra-sthaa-nuh", "Firm and steady", "స్థిరమైనవాడు, అచలుడు", "स्थिर और अचल"], ["प्रमाणम्", "Pra-maa-nam", "The final proof of truth", "సత్యానికి అంతిమ ప్రమాణం", "सत्य का अंतिम प्रमाण"], ["बीजमव्ययम्", "Bee-ja-mav-ya-yam", "The seed that never perishes", "ఎప్పటికీ నశించని బీజం", "कभी नष्ट न होने वाला बीज"], ["अर्थः", "Ar-thah", "The one everyone seeks", "అందరూ వెతికేవాడు", "जिन्हें सब खोजते हैं"], ["अनर्थः", "A-nar-thah", "Needs nothing from anyone", "ఎవరి నుండీ ఏదీ అవసరం లేనివాడు", "जिन्हें किसी से कुछ नहीं चाहिए"], ["महाकोशः", "Ma-haa-ko-shah", "A great treasure house", "గొప్ప నిధి గృహం", "महान खज़ाना"], ["महाभोगः", "Ma-haa-bho-gah", "Gives great joys", "గొప్ప సుఖాలు ఇచ్చేవాడు", "महान सुख देने वाले"], ["महाधनः", "Ma-haa-dha-nah", "Of great wealth", "గొప్ప సంపద కలవాడు", "महान धन वाले"]], "v": ["The whole world spreads out from Vishnu, yet He is firm and steady. He is the final proof of truth and the seed that never perishes. Everyone seeks Him, yet He needs nothing from anyone. He is a great treasure house; He gives great joys and has great wealth.", "లోకమంతా విష్ణువు నుండి విస్తరిస్తుంది, అయినా ఆయన స్థిరంగా, అచలంగా ఉంటాడు. సత్యానికి అంతిమ ప్రమాణం, ఎప్పటికీ నశించని బీజం. అందరూ ఆయనను వెతుకుతారు, కానీ ఆయనకు ఎవరి నుండీ ఏదీ అవసరం లేదు. గొప్ప నిధి గృహం; గొప్ప సుఖాలు ఇస్తాడు, గొప్ప సంపద కలవాడు.", "पूरा संसार विष्णु से फैलता है, फिर भी वे स्थिर और अचल हैं। वे सत्य का अंतिम प्रमाण और कभी नष्ट न होने वाला बीज हैं। सब उन्हें खोजते हैं, पर उन्हें किसी से कुछ नहीं चाहिए। वे महान खज़ाना हैं; वे महान सुख देते हैं और महान धन वाले हैं।"]},
47:{"w": [["अनिर्विण्णः", "A-nir-vin-nah", "Never tired or discouraged", "ఎప్పుడూ అలసిపోనివాడు, నిరుత్సాహపడనివాడు", "कभी न थकने, न निराश होने वाले"], ["स्थविष्ठः", "Stha-vish-thah", "Vast", "అతి విశాలమైనవాడు", "अत्यंत विशाल"], ["अभूः", "A-bhooh", "Never born", "జన్మ లేనివాడు", "अजन्मा"], ["धर्मयूपः", "Dhar-ma-yoo-pah", "Dharma is tied to Him like a sacred post", "పవిత్ర స్తంభంలా ధర్మం ఆయనకు కట్టబడి ఉంది", "पवित्र स्तंभ की तरह धर्म जिनसे बँधा है"], ["महामखः", "Ma-haa-ma-khah", "The great yajna", "మహా యజ్ఞం ఆయనే", "महान यज्ञ"], ["नक्षत्रनेमिः", "Nak-sha-tra-ne-mih", "The centre around which the stars turn", "నక్షత్రాలు చుట్టూ తిరిగే కేంద్రం", "जिनके चारों ओर तारे घूमते हैं"], ["नक्षत्री", "Nak-sha-tree", "Shines as the moon among the stars", "నక్షత్రాలలో చంద్రుడిలా ప్రకాశించేవాడు", "तारों के बीच चंद्रमा जैसे चमकने वाले"], ["क्षमः", "Ksha-mah", "Able to do everything", "అన్నీ చేయగలవాడు", "सब कुछ करने में समर्थ"], ["क्षामः", "Kshaa-mah", "Remains when all else is gone", "అన్నీ పోయినా మిగిలి ఉండేవాడు", "सब मिट जाने पर भी शेष रहने वाले"], ["समीहनः", "Sa-mee-ha-nah", "Wishes well for all", "అందరి మేలు కోరేవాడు", "सबका भला चाहने वाले"]], "v": ["Vishnu never gets tired or discouraged. He is vast and was never born. Dharma is tied to Him like a sacred post, and He is the great yajna. The stars turn around Him, and He shines like the moon among them. He is able to do everything, He remains when all else is gone, and He wishes well for all.", "విష్ణువు ఎప్పుడూ అలసిపోడు, నిరుత్సాహపడడు. అతి విశాలమైనవాడు, జన్మ లేనివాడు. పవిత్ర స్తంభంలా ధర్మం ఆయనకు కట్టబడి ఉంది; మహా యజ్ఞం ఆయనే. నక్షత్రాలు ఆయన చుట్టూ తిరుగుతాయి; వాటిలో చంద్రుడిలా ప్రకాశిస్తాడు. అన్నీ చేయగలవాడు, అన్నీ పోయినా మిగిలి ఉంటాడు, అందరి మేలు కోరతాడు.", "विष्णु कभी नहीं थकते, न निराश होते हैं। वे अत्यंत विशाल और अजन्मा हैं। पवित्र स्तंभ की तरह धर्म उनसे बँधा है, और वे महान यज्ञ हैं। तारे उनके चारों ओर घूमते हैं, और वे उनके बीच चंद्रमा जैसे चमकते हैं। वे सब कुछ करने में समर्थ हैं, सब मिट जाने पर भी शेष रहते हैं, और सबका भला चाहते हैं।"]},
48:{"w": [["यज्ञः", "Yaj-nah", "Is the yajna", "యజ్ఞం ఆయనే", "स्वयं यज्ञ"], ["इज्यः", "Ij-yah", "Worthy of worship", "పూజించదగినవాడు", "पूजा के योग्य"], ["महेज्यः", "Ma-hej-yah", "The most worthy of worship", "అత్యంత పూజనీయుడు", "सबसे अधिक पूजनीय"], ["क्रतुः", "Kra-tuh", "Is the sacred rite", "పవిత్ర క్రతువు ఆయనే", "स्वयं पवित्र अनुष्ठान"], ["सत्रम्", "Sat-ram", "Protects good people", "మంచివారిని కాపాడేవాడు", "सज्जनों की रक्षा करने वाले"], ["सतां गतिः", "Sa-taam Ga-tih", "The refuge of good people", "సజ్జనులకు ఆశ్రయం", "सज्जनों का आश्रय"], ["सर्वदर्शी", "Sar-va-dar-shee", "Sees everything", "అన్నీ చూసేవాడు", "सब कुछ देखने वाले"], ["विमुक्तात्मा", "Vi-muk-taat-maa", "Ever free", "ఎప్పుడూ విముక్తుడు", "सदा मुक्त"], ["सर्वज्ञः", "Sar-vaj-nah", "Knows everything", "అన్నీ తెలిసినవాడు", "सब कुछ जानने वाले"], ["ज्ञानमुत्तमम्", "Jnaa-na-mut-ta-mam", "The highest knowledge", "అత్యుత్తమ జ్ఞానం", "सर्वोत्तम ज्ञान"]], "v": ["Vishnu is the yajna; He is worthy of worship, the most worthy of all. He is the sacred rite. He protects good people and is their refuge. He sees everything, is ever free, and knows everything. He is the highest knowledge.", "విష్ణువే యజ్ఞం; పూజించదగినవాడు, అత్యంత పూజనీయుడు. పవిత్ర క్రతువు ఆయనే. మంచివారిని కాపాడుతాడు, వారికి ఆశ్రయం. అన్నీ చూస్తాడు, ఎప్పుడూ విముక్తుడు, అన్నీ తెలిసినవాడు. అత్యుత్తమ జ్ఞానం ఆయనే.", "विष्णु स्वयं यज्ञ हैं; वे पूजा के योग्य, सबसे अधिक पूजनीय हैं। वे स्वयं पवित्र अनुष्ठान हैं। वे सज्जनों की रक्षा करते हैं और उनका आश्रय हैं। वे सब देखते हैं, सदा मुक्त हैं, और सब जानते हैं। वे सर्वोत्तम ज्ञान हैं।"]},
49:{"w": [["सुव्रतः", "Su-vra-tah", "Keeps His vow to protect", "రక్షించే వ్రతాన్ని పాటించేవాడు", "रक्षा का व्रत निभाने वाले"], ["सुमुखः", "Su-mu-khah", "Has a beautiful, kind face", "అందమైన, దయగల ముఖం కలవాడు", "सुंदर, दयालु मुख वाले"], ["सूक्ष्मः", "Sook-shmah", "Very subtle", "అతి సూక్ష్మమైనవాడు", "अत्यंत सूक्ष्म"], ["सुघोषः", "Su-gho-shah", "His voice is sweet and deep", "మధురమైన, గంభీరమైన స్వరం కలవాడు", "मधुर और गंभीर स्वर वाले"], ["सुखदः", "Su-kha-dah", "Gives happiness", "సుఖాన్ని ఇచ్చేవాడు", "सुख देने वाले"], ["सुहृत्", "Su-hrit", "Our true friend", "మన నిజమైన మిత్రుడు", "हमारे सच्चे मित्र"], ["मनोहरः", "Ma-no-ha-rah", "Steals our heart", "మన మనసును దోచేవాడు", "मन को हर लेने वाले"], ["जितक्रोधः", "Ji-ta-kro-dhah", "Has conquered anger", "కోపాన్ని జయించినవాడు", "क्रोध को जीतने वाले"], ["वीरबाहुः", "Vee-ra-baa-huh", "Has mighty arms", "బలమైన భుజాలు కలవాడు", "पराक्रमी भुजाओं वाले"], ["विदारणः", "Vi-daa-ra-nah", "Tears apart the wicked", "దుష్టులను చీల్చేవాడు", "दुष्टों को चीर डालने वाले"]], "v": ["Vishnu keeps His vow to protect us. His face is beautiful and kind, He is very subtle, and His voice is sweet and deep. He gives happiness and is our true friend. He steals our heart. He has conquered anger, has mighty arms, and tears apart the wicked.", "విష్ణువు మనల్ని రక్షించే వ్రతాన్ని పాటిస్తాడు. ఆయన ముఖం అందమైనది, దయగలది; అతి సూక్ష్మమైనవాడు; మధురమైన, గంభీరమైన స్వరం కలవాడు. సుఖాన్ని ఇస్తాడు, మన నిజమైన మిత్రుడు. మన మనసును దోచేస్తాడు. కోపాన్ని జయించాడు, బలమైన భుజాలు కలవాడు, దుష్టులను చీల్చేస్తాడు.", "विष्णु हमारी रक्षा का व्रत निभाते हैं। उनका मुख सुंदर और दयालु है, वे अत्यंत सूक्ष्म हैं, और उनका स्वर मधुर और गंभीर है। वे सुख देते हैं और हमारे सच्चे मित्र हैं। वे हमारा मन हर लेते हैं। उन्होंने क्रोध को जीत लिया है, उनकी भुजाएँ पराक्रमी हैं, और वे दुष्टों को चीर डालते हैं।"]},
50:{"w": [["स्वापनः", "Svaa-pa-nah", "Puts beings to sleep with His maya", "మాయతో జీవులను నిద్రపుచ్చేవాడు", "माया से प्राणियों को सुलाने वाले"], ["स्ववशः", "Sva-va-shah", "Answers to no one but Himself", "తనకు తానే అధీనుడు", "केवल अपने वश में"], ["व्यापी", "Vyaa-pee", "Present everywhere", "అంతటా వ్యాపించినవాడు", "सब जगह व्याप्त"], ["नैकात्मा", "Nai-kaat-maa", "Takes many forms", "అనేక రూపాలు కలవాడు", "अनेक रूपों वाले"], ["नैककर्मकृत्", "Nai-ka-kar-ma-krit", "Does countless deeds", "లెక్కలేనన్ని పనులు చేసేవాడు", "अनगिनत कर्म करने वाले"], ["वत्सरः", "Vat-sa-rah", "All beings live in Him", "అన్ని జీవులు ఆయనలో నివసిస్తాయి", "सब प्राणी जिनमें बसते हैं"], ["वत्सलः", "Vat-sa-lah", "Loves His devotees like a mother", "తల్లిలా భక్తులను ప్రేమించేవాడు", "माँ की तरह भक्तों से प्रेम करने वाले"], ["वत्सी", "Vat-see", "Protects all like His children", "అందరినీ తన పిల్లల్లా కాపాడేవాడు", "सबको अपने बच्चों की तरह पालने वाले"], ["रत्नगर्भः", "Rat-na-gar-bhah", "Holds all jewels, like the ocean", "సముద్రంలా రత్నాలను ధరించేవాడు", "सागर की तरह रत्नों को धारण करने वाले"], ["धनेश्वरः", "Dha-nesh-va-rah", "Lord of all wealth", "సంపదలకు ప్రభువు", "धन के स्वामी"]], "v": ["With His maya, Vishnu puts beings to sleep, and He answers to no one but Himself. He is present everywhere, takes many forms, and does countless deeds. All beings live in Him. He loves His devotees like a mother and protects all like His children. Like the ocean He holds all jewels; He is Lord of all wealth.", "విష్ణువు తన మాయతో జీవులను నిద్రపుచ్చుతాడు; తనకు తానే అధీనుడు. అంతటా ఉన్నాడు, అనేక రూపాలు దాలుస్తాడు, లెక్కలేనన్ని పనులు చేస్తాడు. అన్ని జీవులు ఆయనలో నివసిస్తాయి. తల్లిలా భక్తులను ప్రేమిస్తాడు, అందరినీ తన పిల్లల్లా కాపాడుతాడు. సముద్రంలా రత్నాలను ధరిస్తాడు; సంపదలకు ప్రభువు.", "विष्णु अपनी माया से प्राणियों को सुलाते हैं, और केवल अपने वश में हैं। वे सब जगह व्याप्त हैं, अनेक रूप धरते हैं, और अनगिनत कर्म करते हैं। सब प्राणी उनमें बसते हैं। वे माँ की तरह भक्तों से प्रेम करते हैं और सबको अपने बच्चों की तरह पालते हैं। सागर क 51:{"w": [["धर्मगुप्", "Dhar-ma-gup", "Protects dharma", "ధర్మాన్ని రక్షించేవాడు", "धर्म की रक्षा करने वाले"], ["धर्मकृत्", "Dhar-ma-krit", "Practises dharma", "ధర్మాన్ని ఆచరించేవాడు", "धर्म का पालन करने वाले"], ["धर्मी", "Dhar-mee", "Upholds dharma", "ధర్మాన్ని నిలిపేవాడు", "धर्म को धारण करने वाले"], ["सत्", "Sat", "Is the real, what truly exists", "నిజంగా ఉన్నది ఆయనే", "जो सचमुच है"], ["असत्", "A-sat", "Is also the changing world", "మారే లోకం కూడా ఆయనే", "बदलता संसार भी वही"], ["क्षरम्", "Ksha-ram", "Is all that perishes", "నశించేదంతా ఆయనే", "नश्वर सब कुछ"], ["अक्षरम्", "Ak-sha-ram", "Is what never perishes", "ఎప్పుడూ నశించనిది ఆయనే", "कभी नष्ट न होने वाला"], ["अविज्ञाता", "A-vij-naa-taa", "Untouched by our limited knowing", "మన పరిమిత జ్ఞానానికి అంటనివాడు", "हमारी सीमित समझ से अछूते"], ["सहस्रांशुः", "Sa-has-raam-shuh", "Shines with a thousand rays", "వేల కిరణాలతో ప్రకాశించేవాడు", "हज़ार किरणों से चमकने वाले"], ["विधाता", "Vi-dhaa-taa", "Supports all", "అందరినీ ఆదుకునేవాడు", "सबको संभालने वाले"], ["कृतलक्षणः", "Kri-ta-lak-sha-nah", "Wears the sacred mark on His chest", "వక్షంపై పవిత్ర చిహ్నం ధరించినవాడు", "वक्ष पर पवित्र चिह्न धारण करने वाले"]], "v": ["Vishnu protects dharma, practises it and upholds it. He is what truly exists and also the changing world; He is all that perishes and what never perishes. He is untouched by our limited knowing. He shines with a thousand rays, supports all, and wears the sacred mark on His chest.", "విష్ణువు ధర్మాన్ని రక్షిస్తాడు, ఆచరిస్తాడు, నిలుపుతాడు. నిజంగా ఉన్నది, మారే లోకం కూడా ఆయనే; నశించేదంతా, ఎప్పుడూ నశించనిదీ ఆయనే. మన పరిమిత జ్ఞానానికి అంటడు. వేల కిరణాలతో ప్రకాశిస్తాడు, అందరినీ ఆదుకుంటాడు, వక్షంపై పవిత్ర చిహ్నం ధరిస్తాడు.", "विष्णु धर्म की रक्षा करते हैं, उसका पालन करते हैं और उसे धारण करते हैं। जो सचमुच है वह भी वही हैं, और बदलता संसार भी; नश्वर सब कुछ भी वही हैं, और जो कभी नष्ट नहीं होता वह भी। वे हमारी सीमित समझ से अछूते हैं। वे हज़ार किरणों से चमकते हैं, सबको संभालते हैं, और वक्ष पर पवित्र चिह्न धारण करते हैं।"]},
52:{"w": [["गभस्तिनेमिः", "Ga-bhas-ti-ne-mih", "At the centre of the wheel of light", "కాంతి చక్రానికి కేంద్రం", "प्रकाश चक्र के केंद्र में"], ["सत्त्वस्थः", "Sat-tva-sthah", "Lives in the hearts of all", "అందరి హృదయాలలో నివసించేవాడు", "सबके हृदय में बसने वाले"], ["सिंहः", "Sim-hah", "Mighty like a lion", "సింహంలా బలవంతుడు", "सिंह जैसे बलवान"], ["भूतमहेश्वरः", "Bhoo-ta-ma-hesh-va-rah", "Great Lord of all beings", "అన్ని జీవులకు మహా ప్రభువు", "सब प्राणियों के महान स्वामी"], ["आदिदेवः", "Aa-di-de-vah", "The first God", "ఆది దేవుడు", "आदि देव"], ["महादेवः", "Ma-haa-de-vah", "The great God", "మహా దేవుడు", "महादेव"], ["देवेशः", "De-ve-shah", "Lord of the gods", "దేవతలకు ప్రభువు", "देवताओं के स्वामी"], ["देवभृद्गुरुः", "De-va-bhrid-gu-ruh", "Supports the gods and teaches them", "దేవతలను ఆదుకుని బోధించే గురువు", "देवताओं को संभालने और सिखाने वाले गुरु"]], "v": ["Vishnu is at the centre of the wheel of light. He lives in the hearts of all and is mighty like a lion; He is the great Lord of all beings. He is the first God, the great God, Lord of the gods, who supports and teaches them.", "విష్ణువు కాంతి చక్రానికి కేంద్రం. అందరి హృదయాలలో నివసిస్తాడు, సింహంలా బలవంతుడు; అన్ని జీవులకు మహా ప్రభువు. ఆది దేవుడు, మహా దేవుడు, దేవతలకు ప్రభువు; వారిని ఆదుకుని బోధించే గురువు.", "विष्णु प्रकाश चक्र के केंद्र में हैं। वे सबके हृदय में बसते हैं और सिंह जैसे बलवान हैं; वे सब प्राणियों के महान स्वामी हैं। वे आदि देव, महादेव, देवताओं के स्वामी हैं, जो उन्हें संभालते और सिखाते हैं।"]},
53:{"w": [["उत्तरः", "Ut-ta-rah", "Lifts us out of the sea of life", "సంసారం నుండి మనల్ని పైకి లేపేవాడు", "संसार से हमें उबारने वाले"], ["गोपतिः", "Go-pa-tih", "Protector of cows (as Krishna)", "గోవులను కాపాడేవాడు (కృష్ణుడిగా)", "गायों के रक्षक (कृष्ण रूप में)"], ["गोप्ता", "Gop-taa", "Protects all", "అందరినీ రక్షించేవాడు", "सबकी रक्षा करने वाले"], ["ज्ञानगम्यः", "Jnaa-na-gam-yah", "Reached through knowledge", "జ్ఞానం ద్వారా అందేవాడు", "ज्ञान से प्राप्त होने वाले"], ["पुरातनः", "Pu-raa-ta-nah", "Most ancient", "అతి ప్రాచీనుడు", "सबसे प्राचीन"], ["शरीरभूतभृत्", "Sha-ree-ra-bhoo-ta-bhrit", "Supports the elements that make the body", "శరీరాన్ని ఏర్పరిచే భూతాలను పోషించేవాడు", "शरीर बनाने वाले तत्वों को संभालने वाले"], ["भोक्ता", "Bhok-taa", "Enjoys what is offered", "సమర్పించినది అనుభవించేవాడు", "अर्पित को ग्रहण करने वाले"], ["कपीन्द्रः", "Ka-peen-drah", "Lord of the monkeys (as Rama)", "వానరులకు ప్రభువు (రాముడిగా)", "वानरों के स्वामी (राम रूप में)"], ["भूरिदक्षिणः", "Bhoo-ri-dak-shi-nah", "Gives generously", "ఉదారంగా ఇచ్చేవాడు", "उदारता से देने वाले"]], "v": ["Vishnu lifts us out of the sea of worldly life. As Krishna He protected the cows, and He protects all. He is reached through knowledge and is most ancient. He supports the elements that make up the body and enjoys what we offer. As Rama He was Lord of the monkey army, and He gives generously.", "విష్ణువు సంసార సముద్రం నుండి మనల్ని పైకి లేపుతాడు. కృష్ణుడిగా గోవులను కాపాడాడు; అందరినీ రక్షిస్తాడు. జ్ఞానం ద్వారా అందుతాడు, అతి ప్రాచీనుడు. శరీరాన్ని ఏర్పరిచే భూతాలను పోషిస్తాడు, మనం సమర్పించినది అనుభవిస్తాడు. రాముడిగా వానర సేనకు ప్రభువు; ఉదారంగా ఇస్తాడు.", "विष्णु हमें संसार सागर से उबारते हैं। कृष्ण रूप में उन्होंने गायों की रक्षा की, और वे सबकी रक्षा करते हैं। वे ज्ञान से प्राप्त होते हैं और सबसे प्राचीन हैं। वे शरीर बनाने वाले तत्वों को संभालते हैं और हमारे अर्पण को ग्रहण करते हैं। राम रूप में वे वानर सेना के स्वामी थे, और उदारता से देते हैं।"]},
