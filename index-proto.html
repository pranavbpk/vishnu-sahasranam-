{n:1,sa:["विश्वं विष्णुर्वषट्कारो भूतभव्यभवत्प्रभुः ।", "भूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः ॥१॥"],pr:["Vish-vam Vish-nur Va-shat-kaa-ro Bhoo-ta-bhav-ya-bha-vat-pra-bhuh", "Bhoo-ta-krid Bhoo-ta-bhrid Bhaa-vo Bhoo-taat-maa Bhoo-ta-bhaa-va-nah"],en:["Vishvam Vishnur Vashatkaro Bhutabhavyabhavatprabhuh", "Bhutakrid Bhutabhrid Bhavo Bhutatma Bhutabhavanah"],te:["విశ్వం విష్ణుర్వషట్కారో భూతభవ్యభవత్ప్రభుః |", "భూతకృద్భూతభృద్భావో భూతాత్మా భూతభావనః ||"],tip:"Va-shat-kaa-ro: say the sh softly, then a short t. Bhoo is a breathy b with a long oo."},
{n:2,sa:["पूतात्मा परमात्मा च मुक्तानां परमा गतिः ।", "अव्ययः पुरुषः साक्षी क्षेत्रज्ञोऽक्षर एव च ॥२॥"],pr:["Poo-taat-maa Pa-ra-maat-maa Cha Muk-taa-naam Pa-ra-maa Ga-tih", "Av-ya-yaf Pu-ru-shas Saak-shee Kshet-raj-no Ksha-ra E-va Cha"],en:["Putatma Paramatma Cha Muktanam Parama Gatih", "Avyayah Purushah Sakshi Kshetrajno Akshara Eva Cha"],te:["పూతాత్మా పరమాత్మా చ ముక్తానాం పరమా గతిః |", "అవ్యయః పురుషః సాక్షీ క్షేత్రజ్ఞోఽక్షర ఏవ చ ||"],tip:"Av-ya-yaf: a soft f before Pu-ru-shas. Kshet-raj-no Ksha-ra: ksh is k and sh together, and the a of Akshara is not said."},
{n:3,sa:["योगो योगविदां नेता प्रधानपुरुषेश्वरः ।", "नारसिंहवपुः श्रीमान् केशवः पुरुषोत्तमः ॥३॥"],pr:["Yo-go Yo-ga-vi-daam Ne-taa Pra-dhaa-na-pu-ru-shesh-va-rah", "Naa-ra-sim-ha-va-push Shree-maan Ke-sha-vaf Pu-ru-shot-ta-mah"],en:["Yogo Yogavidam Neta Pradhanapurusheshvarah", "Narasimhavapuh Shriman Keshavah Purushottamah"],te:["యోగో యోగవిదాం నేతా ప్రధానపురుషేశ్వరః |", "నారసింహవపుః శ్రీమాన్ కేశవః పురుషోత్తమః ||"],tip:"Sim-ha: keep the h soft. Shree-maan has a long ee and a long aa. Ke-sha-vaf: a soft f before Pu-ru-shot-ta-mah."},
{n:4,sa:["सर्वः शर्वः शिवः स्थाणुर्भूतादिर्निधिरव्ययः ।", "सम्भवो भावनो भर्ता प्रभवः प्रभुरीश्वरः ॥४॥"],pr:["Sar-vash Shar-vash Shi-vas Sthaa-nur Bhoo-taa-dir Ni-dhi-rav-ya-yah", "Sam-bha-vo Bhaa-va-no Bhar-taa Pra-bha-vaf Pra-bhu-reesh-va-rah"],en:["Sarvah Sharvah Shivah Sthanur Bhutadir Nidhiravyayah", "Sambhavo Bhavano Bharta Prabhavah Prabhurishvarah"],te:["సర్వః శర్వః శివః స్థాణుర్భూతాదిర్నిధిరవ్యయః |", "సమ్భవో భావనో భర్తా ప్రభవః ప్రభురీశ్వరః ||"],tip:"Sar-vash and Shar-vash differ: s versus sh. Sthaa-nur: s, then a breathy t, then a long aa."},
{n:5,sa:["स्वयम्भूः शम्भुरादित्यः पुष्कराक्षो महास्वनः ।", "अनादिनिधनो धाता विधाता धातुरुत्तमः ॥५॥"],pr:["Sva-yam-bhoosh Sham-bhu-raa-dit-yaf Push-ka-raak-sho Ma-haa-sva-nah", "A-naa-di-ni-dha-no Dhaa-taa Vi-dhaa-taa Dhaa-tu-rut-ta-mah"],en:["Svayambhuh Shambhuradityah Pushkaraksho Mahasvanah", "Anadinidhano Dhata Vidhata Dhaturuttamah"],te:["స్వయమ్భూః శమ్భురాదిత్యః పుష్కరాక్షో మహాస్వనః |", "అనాదినిధనో ధాతా విధాతా ధాతురుత్తమః ||"],tip:"Push-ka-raak-sho: ksh, then a long o. Dhaa is a breathy d. Sham-bhu-raa-dit-yaf: a soft f before Push."},
{n:6,sa:["अप्रमेयो हृषीकेशः पद्मनाभोऽमरप्रभुः ।", "विश्वकर्मा मनुस्त्वष्टा स्थविष्ठः स्थविरो ध्रुवः ॥६॥"],pr:["Ap-ra-me-yo Hri-shee-ke-shaf Pad-ma-naa-bho Ma-ra-pra-bhuh", "Vish-va-kar-maa Ma-nus-tvash-taa Stha-vish-thas Stha-vi-ro Dhru-vah"],en:["Aprameyo Hrishikeshah Padmanabho Amaraprabhuh", "Vishvakarma Manustvashta Sthavishthah Sthaviro Dhruvah"],te:["అప్రమేయో హృషీకేశః పద్మనాభోఽమరప్రభుః |", "విశ్వకర్మా మనుస్త్వష్టా స్థవిష్ఠః స్థవిరో ధ్రువః ||"],tip:"Hri-shee-ke-shaf: hri is a short tap, then a soft f before Pad-ma. Pad-ma-naa-bho Ma-ra: the a of Amara is not said."},
{n:7,sa:["अग्राह्यः शाश्वतः कृष्णो लोहिताक्षः प्रतर्दनः ।", "प्रभूतस्त्रिककुब्धाम पवित्रं मङ्गलं परम् ॥७॥"],pr:["Ag-raah-yash Shaash-va-tah Krish-no Lo-hi-taak-shaf Pra-tar-da-nah", "Pra-bhoo-tas Tri-ka-kub-dhaa-ma Pa-vit-ram Man-ga-lam Pa-ram"],en:["Agrahyah Shashvatah Krishno Lohitakshah Pratardanah", "Prabhutas Trikakubdhama Pavitram Mangalam Param"],te:["అగ్రాహ్యః శాశ్వతః కృష్ణో లోహితాక్షః ప్రతర్దనః |", "ప్రభూతస్త్రికకుబ్ధామ పవిత్రం మఙ్గలం పరమ్ ||"],tip:"Ag-raah-yash: a soft h before y. Tri-ka-kub-dhaa-ma: a clear b, then a breathy dh."},
{n:8,sa:["ईशानः प्राणदः प्राणो ज्येष्ठः श्रेष्ठः प्रजापतिः ।", "हिरण्यगर्भो भूगर्भो माधवो मधुसूदनः ॥८॥"],pr:["Ee-shaa-naf Praa-na-daf Praa-no Jyesh-thash Shresh-thaf Pra-jaa-pa-tih", "Hi-ran-ya-gar-bho Bhoo-gar-bho Maa-dha-vo Ma-dhu-soo-da-nah"],en:["Eeshanah Pranadah Prano Jyeshthah Shreshthah Prajapatih", "Hiranyagarbho Bhugarbho Madhavo Madhusudanah"],te:["ఈశానః ప్రాణదః ప్రాణో జ్యేష్ఠః శ్రేష్ఠః ప్రజాపతిః |", "హిరణ్యగర్భో భూగర్భో మాధవో మధుసూదనః ||"],tip:"Jyesh-thash Shresh-thaf: th is t with a puff of air. Two soft f sounds come before p in line 1."},
{n:9,sa:["ईश्वरो विक्रमी धन्वी मेधावी विक्रमः क्रमः ।", "अनुत्तमो दुराधर्षः कृतज्ञः कृतिरात्मवान् ॥९॥"],pr:["Eesh-va-ro Vik-ra-mee Dhan-vee Me-dhaa-vee Vik-ra-mah Kra-mah", "A-nut-ta-mo Du-raa-dhar-shah Kri-taj-nah Kri-ti-raat-ma-vaan"],en:["Eeshvaro Vikrami Dhanvi Medhavi Vikramah Kramah", "Anuttamo Duradharshah Kritajnah Kritiratmavan"],te:["ఈశ్వరో విక్రమీ ధన్వీ మేధావీ విక్రమః క్రమః |", "అనుత్తమో దురాధర్షః కృతజ్ఞః కృతిరాత్మవాన్ ||"],tip:"Vik-ra-mee and Vik-ra-mah: k, then a light tap of r. jn in Kri-taj-nah is usually chanted as gy."},
{n:10,sa:["सुरेशः शरणं शर्म विश्वरेताः प्रजाभवः ।", "अहः संवत्सरो व्यालः प्रत्ययः सर्वदर्शनः ॥१०॥"],pr:["Su-re-shash Sha-ra-nam Shar-ma Vish-va-re-taaf Pra-jaa-bha-vah", "A-has Sam-vat-sa-ro Vyaa-laf Prat-ya-yas Sar-va-dar-sha-nah"],en:["Sureshah Sharanam Sharma Vishvaretah Prajabhavah", "Ahah Samvatsaro Vyalah Pratyayah Sarvadarshanah"],te:["సురేశః శరణం శర్మ విశ్వరేతాః ప్రజాభవః |", "అహః సంవత్సరో వ్యాలః ప్రత్యయః సర్వదర్శనః ||"],tip:"Vish-va-re-taaf and Vyaa-laf: a soft f before p. A-has Sam-vat-sa-ro: the visarga becomes s."},
{n:11,sa:["अजः सर्वेश्वरः सिद्धः सिद्धिः सर्वादिरच्युतः ।", "वृषाकपिरमेयात्मा सर्वयोगविनिःसृतः ॥११॥"],pr:["A-jas Sar-vesh-va-ras Sid-dhas Sid-dhis Sar-vaa-di-rach-yu-tah", "Vri-shaa-ka-pi-ra-me-yaat-maa Sar-va-yo-ga-vi-nis-sri-tah"],en:["Ajah Sarveshvarah Siddhah Siddhih Sarvadirachyutah", "Vrishakapirameyatma Sarvayogavinissritah"],te:["అజః సర్వేశ్వరః సిద్ధః సిద్ధిః సర్వాదిరచ్యుతః |", "వృషాకపిరమేయాత్మా సర్వయోగవినిఃసృతః ||"],tip:"Sid-dhas Sid-dhis: hold the d, then a breathy dh. Vi-nis-sri-tah: the s is said twice."},
{n:12,sa:["वसुर्वसुमनाः सत्यः समात्मा सम्मितः समः ।", "अमोघः पुण्डरीकाक्षो वृषकर्मा वृषाकृतिः ॥१२॥"],pr:["Va-sur Va-su-ma-naas Sat-yas Sa-maat-maa Sam-mi-tas Sa-mah", "A-mo-ghaf Pun-da-ree-kaak-sho Vri-sha-kar-maa Vri-shaa-kri-tih"],en:["Vasur Vasumanah Satyah Samatma Sammitah Samah", "Amoghah Pundarikaksho Vrishakarma Vrishakritih"],te:["వసుర్వసుమనాః సత్యః సమాత్మా సమ్మితః సమః |", "అమోఘః పుణ్డరీకాక్షో వృషకర్మా వృషాకృతిః ||"],tip:"A-mo-ghaf: gh is g with a puff of air, then a soft f before Pun. Sam-mi-tas holds the m twice."},
{n:13,sa:["रुद्रो बहुशिरा बभ्रुर्विश्वयोनिः शुचिश्रवाः ।", "अमृतः शाश्वतः स्थाणुर्वरारोहो महातपाः ॥१३॥"],pr:["Rud-ro Ba-hu-shi-raa Ba-bhrur Vish-va-yo-nish Shu-chi-shra-vaah", "A-mri-tash Shaash-va-ta Sthaa-nur Va-raa-ro-ho Ma-haa-ta-paah"],en:["Rudro Bahushira Babhrur Vishvayonih Shuchishravah", "Amritah Shashvata Sthanur Vararoho Mahatapah"],te:["రుద్రో బహుశిరా బభ్రుర్విశ్వయోనిః శుచిశ్రవాః |", "అమృతః శాశ్వతః స్థాణుర్వరారోహో మహాతపాః ||"],tip:"Rud-ro: hold the d, then a light r. Shaash-va-ta Sthaa-nur: the visarga drops before sth, as marked in the booklet."},
{n:14,sa:["सर्वगः सर्वविद्भानुर्विष्वक्सेनो जनार्दनः ।", "वेदो वेदविदव्यङ्गो वेदाङ्गो वेदवित् कविः ॥१४॥"],pr:["Sar-va-gas Sar-va-vid-bhaa-nur Vish-vak-se-no Ja-naar-da-nah", "Ve-do Ve-da-vi-dav-yan-go Ve-daan-go Ve-da-vit Ka-vih"],en:["Sarvagah Sarvavidbhanur Vishvakseno Janardanah", "Vedo Vedavidavyango Vedango Vedavit Kavih"],te:["సర్వగః సర్వవిద్భానుర్విష్వక్సేనో జనార్దనః |", "వేదో వేదవిదవ్యఙ్గో వేదాఙ్గో వేదవిత్ కవిః ||"],tip:"Vish-vak-se-no: k, then s, said quickly. Ve-da-vi-dav-yan-go runs Vedavit and Avyanga together."},
{n:15,sa:["लोकाध्यक्षः सुराध्यक्षो धर्माध्यक्षः कृताकृतः ।", "चतुरात्मा चतुर्व्यूहश्चतुर्दंष्ट्रश्चतुर्भुजः ॥१५॥"],pr:["Lo-kaa-dhyak-shas Su-raa-dhyak-sho Dhar-maa-dhyak-shah Kri-taa-kri-tah", "Cha-tu-raat-maa Cha-tur-vyoo-hash Cha-tur-dam-shtrash Cha-tur-bhu-jah"],en:["Lokadhyakshah Suradhyaksho Dharmadhyakshah Kritakritah", "Chaturatma Chaturvyuhah Chaturdamshtrah Chaturbhujah"],te:["లోకాధ్యక్షః సురాధ్యక్షో ధర్మాధ్యక్షః కృతాకృతః |", "చతురాత్మా చతుర్వ్యూహశ్చతుర్దంష్ట్రశ్చతుర్భుజః ||"],tip:"Dhyak-sha: dhy said together, then ksh. Cha-tur, meaning four, comes four times in line 2."},
{n:16,sa:["भ्राजिष्णुर्भोजनं भोक्ता सहिष्णुर्जगदादिजः ।", "अनघो विजयो जेता विश्वयोनिः पुनर्वसुः ॥१६॥"],pr:["Bhraa-jish-nur Bho-ja-nam Bhok-taa Sa-hish-nur Ja-ga-daa-di-jah", "A-na-gho Vi-ja-yo Je-taa Vish-va-yo-nif Pu-nar-va-suh"],en:["Bhrajishnur Bhojanam Bhokta Sahishnur Jagadadijah", "Anagho Vijayo Jeta Vishvayonih Punarvasuh"],te:["భ్రాజిష్ణుర్భోజనం భోక్తా సహిష్ణుర్జగదాదిజః |", "అనఘో విజయో జేతా విశ్వయోనిః పునర్వసుః ||"],tip:"Bhraa-jish-nur: bhr said together. Vish-va-yo-nif: a soft f before Pu-nar-va-suh."},
{n:17,sa:["उपेन्द्रो वामनः प्रांशुरमोघः शुचिरूर्जितः ।", "अतीन्द्रः सङ्ग्रहः सर्गो धृतात्मा नियमो यमः ॥१७॥"],pr:["U-pen-dro Vaa-ma-naf Praam-shu-ra-mo-ghash Shu-chi-roor-ji-tah", "A-teen-dras San-gra-has Sar-go Dhri-taat-maa Ni-ya-mo Ya-mah"],en:["Upendro Vamanah Pramshuramoghah Shuchirurjitah", "Atindrah Sangrahah Sargo Dhritatma Niyamo Yamah"],te:["ఉపేన్ద్రో వామనః ప్రాంశురమోఘః శుచిరూర్జితః |", "అతీన్ద్రః సఙ్గ్రహః సర్గో ధృతాత్మా నియమో యమః ||"],tip:"Vaa-ma-naf: a soft f before Praam-shu. A-teen-dras San-gra-has: each visarga becomes s."},
{n:18,sa:["वेद्यो वैद्यः सदायोगी वीरहा माधवो मधुः ।", "अतीन्द्रियो महामायो महोत्साहो महाबलः ॥१८॥"],pr:["Ved-yo Vaid-yas Sa-daa-yo-gee Vee-ra-haa Maa-dha-vo Ma-dhuh", "A-teen-dri-yo Ma-haa-maa-yo Ma-hot-saa-ho Ma-haa-ba-lah"],en:["Vedyo Vaidyah Sadayogi Viraha Madhavo Madhuh", "Atindriyo Mahamayo Mahotsaho Mahabalah"],te:["వేద్యో వైద్యః సదాయోగీ వీరహా మాధవో మధుః |", "అతీన్ద్రియో మహామాయో మహోత్సాహో మహాబలః ||"],tip:"Ved-yo and Vaid-yas: dy said together; ai like eye. Ma-hot-saa-ho: hold the t before s."},
{n:19,sa:["महाबुद्धिर्महावीर्यो महाशक्तिर्महाद्युतिः ।", "अनिर्देश्यवपुः श्रीमानमेयात्मा महाद्रिधृक् ॥१९॥"],pr:["Ma-haa-bud-dhir Ma-haa-veer-yo Ma-haa-shak-tir Ma-haa-dyu-tih", "A-nir-desh-ya-va-push Shree-maa-na-me-yaat-maa Ma-haa-dri-dhrik"],en:["Mahabuddhir Mahaviryo Mahashaktir Mahadyutih", "Anirdeshyavapuh Shrimanameyatma Mahadridhrik"],te:["మహాబుద్ధిర్మహావీర్యో మహాశక్తిర్మహాద్యుతిః |", "అనిర్దేశ్యవపుః శ్రీమానమేయాత్మా మహాద్రిధృక్ ||"],tip:"Ma-haa, meaning great, opens four names in line 1. Dhrik ends with a light r and k, no vowel after."},
{n:20,sa:["महेष्वासो महीभर्ता श्रीनिवासः सतां गतिः ।", "अनिरुद्धः सुरानन्दो गोविन्दो गोविदां पतिः ॥२०॥"],pr:["Ma-hesh-vaa-so Ma-hee-bhar-taa Shree-ni-vaa-sas Sa-taam Ga-tih", "A-ni-rud-dhas Su-raa-nan-do Go-vin-do Go-vi-daam Pa-tih"],en:["Maheshvaso Mahibharta Shrinivasah Satam Gatih", "Aniruddhah Suranando Govindo Govidam Patih"],te:["మహేష్వాసో మహీభర్తా శ్రీనివాసః సతాం గతిః |", "అనిరుద్ధః సురానన్దో గోవిన్దో గోవిదాం పతిః ||"],tip:"Ma-hesh-vaa-so: sh, then v, said together. Go-vin-do Go-vi-daam: keep the n and m clear."},
{n:21,sa:["मरीचिर्दमनो हंसः सुपर्णो भुजगोत्तमः ।", "हिरण्यनाभः सुतपाः पद्मनाभः प्रजापतिः ॥२१॥"],pr:["Ma-ree-chir Da-ma-no Ham-sas Su-par-no Bhu-ja-got-ta-mah", "Hi-ran-ya-naa-bhas Su-ta-paaf Pad-ma-naa-bhaf Pra-jaa-pa-tih"],en:["Marichir Damano Hamsah Suparno Bhujagottamah", "Hiranyanabhah Sutapah Padmanabhah Prajapatih"],te:["మరీచిర్దమనో హంసః సుపర్ణో భుజగోత్తమః |", "హిరణ్యనాభః సుతపాః పద్మనాభః ప్రజాపతిః ||"],tip:"Ham-sas: the dot is said as m. Su-ta-paaf Pad-ma-naa-bhaf: two soft f sounds before p."},
{n:22,sa:["अमृत्युः सर्वदृक् सिंहः सन्धाता सन्धिमान् स्थिरः ।", "अजो दुर्मर्षणः शास्ता विश्रुतात्मा सुरारिहा ॥२२॥"],pr:["A-mrit-yus Sar-va-drik Sim-has San-dhaa-taa San-dhi-maan Sthi-rah", "A-jo Dur-mar-sha-nash Shaas-taa Vi-shru-taat-maa Su-raa-ri-haa"],en:["Amrityuh Sarvadrik Simhah Sandhata Sandhiman Sthirah", "Ajo Durmarshanah Shasta Vishrutatma Surariha"],te:["అమృత్యుః సర్వదృక్ సింహః సన్ధాతా సన్ధిమాన్ స్థిరః |", "అజో దుర్మర్షణః శాస్తా విశ్రుతాత్మా సురారిహా ||"],tip:"A-mrit-yus: mri is a short tap. Sar-va-drik ends with a clean k."},
{n:23,sa:["गुरुर्गुरुतमो धाम सत्यः सत्यपराक्रमः ।", "निमिषोऽनिमिषः स्रग्वी वाचस्पतिरुदारधीः ॥२३॥"],pr:["Gu-rur Gu-ru-ta-mo Dhaa-ma Sat-yas Sat-ya-pa-raak-ra-mah", "Ni-mi-sho Ni-mi-shas Srag-vee Vaa-chas-pa-ti-ru-daa-ra-dheeh"],en:["Gurur Gurutamo Dhama Satyah Satyaparakramah", "Nimisho Animishah Sragvi Vachaspatirudaradhih"],te:["గురుర్గురుతమో ధామ సత్యః సత్యపరాక్రమః |", "నిమిషోఽనిమిషః స్రగ్వీ వాచస్పతిరుదారధీః ||"],tip:"Ni-mi-sho Ni-mi-shas: the a of Animisha is not said. Srag-vee: s and r said together."},
{n:24,sa:["अग्रणीर्ग्रामणीः श्रीमान् न्यायो नेता समीरणः ।", "सहस्रमूर्धा विश्वात्मा सहस्राक्षः सहस्रपात् ॥२४॥"],pr:["Ag-ra-neer Graa-ma-neesh Shree-maan Nyaa-yo Ne-taa Sa-mee-ra-nah", "Sa-has-ra-moor-dhaa Vish-vaat-maa Sa-has-raak-shas Sa-has-ra-paat"],en:["Agranir Gramanih Shriman Nyayo Neta Samiranah", "Sahasramurdha Vishvatma Sahasrakshah Sahasrapat"],te:["అగ్రణీర్గ్రామణీః శ్రీమాన్ న్యాయో నేతా సమీరణః |", "సహస్రమూర్ధా విశ్వాత్మా సహస్రాక్షః సహస్రపాత్ ||"],tip:"Graa-ma-neesh Shree-maan: the visarga becomes sh. Sa-has-ra comes three times in line 2."},
{n:25,sa:["आवर्तनो निवृत्तात्मा संवृतः सम्प्रमर्दनः ।", "अहः संवर्तको वह्निरनिलो धरणीधरः ॥२५॥"],pr:["Aa-var-ta-no Ni-vrit-taat-maa Sam-vri-tas Sam-pra-mar-da-nah", "A-has Sam-var-ta-ko Vah-ni-ra-ni-lo Dha-ra-nee-dha-rah"],en:["Aavartano Nivrittatma Samvritah Sampramardanah", "Ahah Samvartako Vahniranilo Dharanidharah"],te:["ఆవర్తనో నివృత్తాత్మా సంవృతః సమ్ప్రమర్దనః |", "అహః సంవర్తకో వహ్నిరనిలో ధరణీధరః ||"],tip:"Vah-ni: a soft h before n. Sam-vri-tas Sam-pra: the dot is said as m."},
{n:26,sa:["सुप्रसादः प्रसन्नात्मा विश्वधृग्विश्वभुग्विभुः ।", "सत्कर्ता सत्कृतः साधुर्जह्नुर्नारायणो नरः ॥२६॥"],pr:["Su-pra-saa-daf Pra-san-naat-maa Vish-va-dhrig Vish-va-bhug Vi-bhuh", "Sat-kar-taa Sat-kri-tas Saa-dhur Jah-nur Naa-raa-ya-no Na-rah"],en:["Suprasadah Prasannatma Vishvadhrig Vishvabhug Vibhuh", "Satkarta Satkritah Sadhur Jahnur Narayano Narah"],te:["సుప్రసాదః ప్రసన్నాత్మా విశ్వధృగ్విశ్వభుగ్విభుః |", "సత్కర్తా సత్కృతః సాధుర్జహ్నుర్నారాయణో నరః ||"],tip:"Su-pra-saa-daf: a soft f before Pra-san-naat-maa. Jah-nur: a soft h before n."},
{n:27,sa:["असङ्ख्येयोऽप्रमेयात्मा विशिष्टः शिष्टकृच्छुचिः ।", "सिद्धार्थः सिद्धसङ्कल्पः सिद्धिदः सिद्धिसाधनः ॥२७॥"],pr:["A-san-khye-yo Pra-me-yaat-maa Vi-shish-tash Shish-ta-krich-chhu-chih", "Sid-dhaar-thas Sid-dha-san-kal-pas Sid-dhi-das Sid-dhi-saa-dha-nah"],en:["Asankhyeyo Aprameyatma Vishishtah Shishtakrichchhuchih", "Siddharthah Siddhasankalpah Siddhidah Siddhisadhanah"],te:["అసఙ్ఖ్యేయోఽప్రమేయాత్మా విశిష్టః శిష్టకృచ్ఛుచిః |", "సిద్ధార్థః సిద్ధసఙ్కల్పః సిద్ధిదః సిద్ధిసాధనః ||"],tip:"A-san-khye-yo Pra-me-yaat-maa: the a of Aprameya is not said. Sid-dhi comes four times: hold the d."},
{n:28,sa:["वृषाही वृषभो विष्णुर्वृषपर्वा वृषोदरः ।", "वर्धनो वर्धमानश्च विविक्तः श्रुतिसागरः ॥२८॥"],pr:["Vri-shaa-hee Vri-sha-bho Vish-nur Vri-sha-par-vaa Vri-sho-da-rah", "Var-dha-no Var-dha-maa-nash-cha Vi-vik-tash Shru-ti-saa-ga-rah"],en:["Vrishahi Vrishabho Vishnur Vrishaparva Vrishodarah", "Vardhano Vardhamanashcha Viviktah Shrutisagarah"],te:["వృషాహీ వృషభో విష్ణుర్వృషపర్వా వృషోదరః |", "వర్ధనో వర్ధమానశ్చ వివిక్తః శ్రుతిసాగరః ||"],tip:"Vri-sha comes five times: vri is a short tap. Vi-vik-tash Shru-ti: the visarga becomes sh."},
{n:29,sa:["सुभुजो दुर्धरो वाग्मी महेन्द्रो वसुदो वसुः ।", "नैकरूपो बृहद्रूपः शिपिविष्टः प्रकाशनः ॥२९॥"],pr:["Su-bhu-jo Dur-dha-ro Vaag-mee Ma-hen-dro Va-su-do Va-suh", "Nai-ka-roo-po Bri-had-roo-pash Shi-pi-vish-taf Pra-kaa-sha-nah"],en:["Subhujo Durdharo Vagmi Mahendro Vasudo Vasuh", "Naikarupo Brihadrupah Shipivishtah Prakashanah"],te:["సుభుజో దుర్ధరో వాగ్మీ మహేన్ద్రో వసుదో వసుః |", "నైకరూపో బృహద్రూపః శిపివిష్టః ప్రకాశనః ||"],tip:"Vaag-mee: a clear g, then m. Shi-pi-vish-taf: a soft f before Pra-kaa-sha-nah."},
{n:30,sa:["ओजस्तेजोद्युतिधरः प्रकाशात्मा प्रतापनः ।", "ऋद्धः स्पष्टाक्षरो मन्त्रश्चन्द्रांशुर्भास्करद्युतिः ॥३०॥"],pr:["O-jas-te-jo-dyu-ti-dha-raf Pra-kaa-shaat-maa Pra-taa-pa-nah", "Rid-dhas Spash-taak-sha-ro Man-trash Chan-draam-shur Bhaas-ka-ra-dyu-tih"],en:["Ojastejodyutidharah Prakashatma Pratapanah", "Riddhah Spashtaksharo Mantrah Chandramshur Bhaskaradyutih"],te:["ఓజస్తేజోద్యుతిధరః ప్రకాశాత్మా ప్రతాపనః |", "ఋద్ధః స్పష్టాక్షరో మన్త్రశ్చన్ద్రాంశుర్భాస్కరద్యుతిః ||"],tip:"Rid-dhas: ri is a short tap, then a held breathy dh. Man-trash Chan-draam-shur: the visarga becomes sh before ch."},
{n:31,sa:["अमृतांशूद्भवो भानुः शशबिन्दुः सुरेश्वरः ।", "औषधं जगतः सेतुः सत्यधर्मपराक्रमः ॥३१॥"],pr:["A-mri-taam-shood-bha-vo Bhaa-nush Sha-sha-bin-dus Su-resh-va-rah", "Au-sha-dham Ja-ga-tas Se-tus Sat-ya-dhar-ma-pa-raak-ra-mah"],en:["Amritamshudbhavo Bhanuh Shashabinduh Sureshvarah", "Aushadham Jagatah Setuh Satyadharmaparakramah"],te:["అమృతాంశూద్భవో భానుః శశబిన్దుః సురేశ్వరః |", "ఔషధం జగతః సేతుః సత్యధర్మపరాక్రమః ||"],tip:"A-mri-taam-shood-bha-vo: the dot is said as m before sh. Au-sha-dham: au like ow in cow."},
{n:32,sa:["भूतभव्यभवन्नाथः पवनः पावनोऽनलः ।", "कामहा कामकृत्कान्तः कामः कामप्रदः प्रभुः ॥३२॥"],pr:["Bhoo-ta-bhav-ya-bha-van-naa-thaf Pa-va-naf Paa-va-no Na-lah", "Kaa-ma-haa Kaa-ma-krit Kaan-tah Kaa-mah Kaa-ma-pra-daf Pra-bhuh"],en:["Bhutabhavyabhavannathah Pavanah Pavano Analah", "Kamaha Kamakrit Kantah Kamah Kamapradah Prabhuh"],te:["భూతభవ్యభవన్నాథః పవనః పావనోఽనలః |", "కామహా కామకృత్కాన్తః కామః కామప్రదః ప్రభుః ||"],tip:"Paa-va-no Na-lah: the a of Anala is not said. Kaa-ma comes five times in line 2, with a long aa."},
{n:33,sa:["युगादिकृद्युगावर्तो नैकमायो महाशनः ।", "अदृश्यो व्यक्तरूपश्च सहस्रजिदनन्तजित् ॥३३॥"],pr:["Yu-gaa-di-krid Yu-gaa-var-to Nai-ka-maa-yo Ma-haa-sha-nah", "A-drish-yo Vyak-ta-roo-pash-cha Sa-has-ra-ji-da-nan-ta-jit"],en:["Yugadikrid Yugavarto Naikamayo Mahashanah", "Adrishyo Vyaktarupashcha Sahasrajidanantajit"],te:["యుగాదికృద్యుగావర్తో నైకమాయో మహాశనః |", "అదృశ్యో వ్యక్తరూపశ్చ సహస్రజిదనన్తజిత్ ||"],tip:"Nai-ka: ai like eye. Sa-has-ra-ji-da-nan-ta-jit runs Sahasrajit and Anantajit together."},
{n:34,sa:["इष्टोऽविशिष्टः शिष्टेष्टः शिखण्डी नहुषो वृषः ।", "क्रोधहा क्रोधकृत्कर्ता विश्वबाहुर्महीधरः ॥३४॥"],pr:["Ish-to Vi-shish-tash Shish-tesh-tash Shi-khan-dee Na-hu-sho Vri-shah", "Kro-dha-haa Kro-dha-krit Kar-taa Vish-va-baa-hur Ma-hee-dha-rah"],en:["Ishto Avishishtah Shishteshtah Shikhandi Nahusho Vrishah", "Krodhaha Krodhakrit Karta Vishvabahur Mahidharah"],te:["ఇష్టోఽవిశిష్టః శిష్టేష్టః శిఖణ్డీ నహుషో వృషః |", "క్రోధహా క్రోధకృత్కర్తా విశ్వబాహుర్మహీధరః ||"],tip:"Ish-to Vi-shish-tash: the a of Avishishta is not said. Shi-khan-dee: kh is k with a puff of air."},
{n:35,sa:["अच्युतः प्रथितः प्राणः प्राणदो वासवानुजः ।", "अपांनिधिरधिष्ठानमप्रमत्तः प्रतिष्ठितः ॥३५॥"],pr:["Ach-yu-taf Pra-thi-taf Praa-naf Praa-na-do Vaa-sa-vaa-nu-jah", "A-paam-ni-dhi-ra-dhish-thaa-na-ma-pra-mat-taf Pra-tish-thi-tah"],en:["Achyutah Prathitah Pranah Pranado Vasavanujah", "Apamnidhiradhishthanamapramattah Pratishthitah"],te:["అచ్యుతః ప్రథితః ప్రాణః ప్రాణదో వాసవానుజః |", "అపాంనిధిరధిష్ఠానమప్రమత్తః ప్రతిష్ఠితః ||"],tip:"Line 1 has three soft f sounds before p. Ach-yu-taf: ch as in chair."},
{n:36,sa:["स्कन्दः स्कन्दधरो धुर्यो वरदो वायुवाहनः ।", "वासुदेवो बृहद्भानुरादिदेवः पुरन्दरः ॥३६॥"],pr:["Skan-das Skan-da-dha-ro Dhur-yo Va-ra-do Vaa-yu-vaa-ha-nah", "Vaa-su-de-vo Bri-had-bhaa-nu-raa-di-de-vaf Pu-ran-da-rah"],en:["Skandah Skandadharo Dhuryo Varado Vayuvahanah", "Vasudevo Brihadbhanuradidevah Purandarah"],te:["స్కన్దః స్కన్దధరో ధుర్యో వరదో వాయువాహనః |", "వాసుదేవో బృహద్భానురాదిదేవః పురన్దరః ||"],tip:"Skan-das: sk said together at the start. Aa-di-de-vaf: a soft f before Pu-ran-da-rah."},
{n:37,sa:["अशोकस्तारणस्तारः शूरः शौरिर्जनेश्वरः ।", "अनुकूलः शतावर्तः पद्मी पद्मनिभेक्षणः ॥३७॥"],pr:["A-sho-kas-taa-ra-nas-taa-rash Shoo-rash Shau-rir Ja-nesh-va-rah", "A-nu-koo-lash Sha-taa-var-taf Pad-mee Pad-ma-ni-bhek-sha-nah"],en:["Ashokastaranastarah Shurah Shaurir Janeshvarah", "Anukulah Shatavartah Padmi Padmanibhekshanah"],te:["అశోకస్తారణస్తారః శూరః శౌరిర్జనేశ్వరః |", "అనుకూలః శతావర్తః పద్మీ పద్మనిభేక్షణః ||"],tip:"Shau-rir: au like ow in cow. Sha-taa-var-taf: a soft f before Pad-mee."},
{n:38,sa:["पद्मनाभोऽरविन्दाक्षः पद्मगर्भः शरीरभृत् ।", "महर्द्धिरृद्धो वृद्धात्मा महाक्षो गरुडध्वजः ॥३८॥"],pr:["Pad-ma-naa-bho Ra-vin-daak-shaf Pad-ma-gar-bhash Sha-ree-ra-bhrit", "Ma-har-dhir Rid-dho Vrid-dhaat-maa Ma-haak-sho Ga-ru-da-dhva-jah"],en:["Padmanabho Aravindakshah Padmagarbhah Sharirabhrit", "Mahardhir Riddho Vriddhatma Mahaksho Garudadhvajah"],te:["పద్మనాభోఽరవిన్దాక్షః పద్మగర్భః శరీరభృత్ |", "మహర్ద్ధిరృద్ధో వృద్ధాత్మా మహాక్షో గరుడధ్వజః ||"],tip:"Pad-ma-naa-bho Ra-vin-daak-shaf: the a of Aravinda is not said. Ga-ru-da-dhva-jah: dhv said together."},
{n:39,sa:["अतुलः शरभो भीमः समयज्ञो हविर्हरिः ।", "सर्वलक्षणलक्षण्यो लक्ष्मीवान् समितिञ्जयः ॥३९॥"],pr:["A-tu-lash Sha-ra-bho Bhee-mas Sa-ma-yaj-no Ha-vir-ha-rih", "Sar-va-lak-sha-na-lak-shan-yo Lak-shmee-vaan Sa-mi-tin-ja-yah"],en:["Atulah Sharabho Bhimah Samayajno Havirharih", "Sarvalakshanalakshanyo Lakshmivan Samitinjayah"],te:["అతులః శరభో భీమః సమయజ్ఞో హవిర్హరిః |", "సర్వలక్షణలక్షణ్యో లక్ష్మీవాన్ సమితిఞ్జయః ||"],tip:"Ha-vir-ha-rih: say the r, then a clear h. Lak-sha comes three times in line 2: ksh is k and sh together."},
{n:40,sa:["विक्षरो रोहितो मार्गो हेतुर्दामोदरः सहः ।", "महीधरो महाभागो वेगवानमिताशनः ॥४०॥"],pr:["Vik-sha-ro Ro-hi-to Maar-go He-tur Daa-mo-da-ras Sa-hah", "Ma-hee-dha-ro Ma-haa-bhaa-go Ve-ga-vaa-na-mi-taa-sha-nah"],en:["Viksharo Rohito Margo Hetur Damodarah Sahah", "Mahidharo Mahabhago Vegavanamitashanah"],te:["విక్షరో రోహితో మార్గో హేతుర్దామోదరః సహః |", "మహీధరో మహాభాగో వేగవానమితాశనః ||"],tip:"Daa-mo-da-ras Sa-hah: the visarga becomes s. Ve-ga-vaa-na-mi-taa-sha-nah runs Vegavan and Amitashana together."},
{n:41,sa:["उद्भवः क्षोभणो देवः श्रीगर्भः परमेश्वरः ।", "करणं कारणं कर्ता विकर्ता गहनो गुहः ॥४१॥"],pr:["Ud-bha-vah Ksho-bha-no De-vash Shree-gar-bhaf Pa-ra-mesh-va-rah", "Ka-ra-nam Kaa-ra-nam Kar-taa Vi-kar-taa Ga-ha-no Gu-hah"],en:["Udbhavah Kshobhano Devah Shrigarbhah Parameshvarah", "Karanam Karanam Karta Vikarta Gahano Guhah"],te:["ఉద్భవః క్షోభణో దేవః శ్రీగర్భః పరమేశ్వరః |", "కరణం కారణం కర్తా వికర్తా గహనో గుహః ||"],tip:"Ka-ra-nam and Kaa-ra-nam differ: short a versus long aa. Shree-gar-bhaf: a soft f before Pa-ra-mesh-va-rah."},
{n:42,sa:["व्यवसायो व्यवस्थानः संस्थानः स्थानदो ध्रुवः ।", "परर्द्धिः परमस्पष्टस्तुष्टः पुष्टः शुभेक्षणः ॥४२॥"],pr:["Vya-va-saa-yo Vya-va-sthaa-nas Sam-sthaa-nas Sthaa-na-do Dhru-vah", "Pa-rar-dhif Pa-ra-mas-pash-tas-tush-taf Push-tash Shu-bhek-sha-nah"],en:["Vyavasayo Vyavasthanah Samsthanah Sthanado Dhruvah", "Parardhih Paramaspashtastushtah Pushtah Shubhekshanah"],te:["వ్యవసాయో వ్యవస్థానః సంస్థానః స్థానదో ధ్రువః |", "పరర్ద్ధిః పరమస్పష్టస్తుష్టః పుష్టః శుభేక్షణః ||"],tip:"Sthaa: s, then a breathy t. Pa-rar-dhif and Tush-taf: a soft f before p."},
{n:43,sa:["रामो विरामो विरजो मार्गो नेयो नयोऽनयः ।", "वीरः शक्तिमतां श्रेष्ठो धर्मो धर्मविदुत्तमः ॥४३॥"],pr:["Raa-mo Vi-raa-mo Vi-ra-jo Maar-go Ne-yo Na-yo Na-yah", "Vee-rash Shak-ti-ma-taam Shresh-tho Dhar-mo Dhar-ma-vi-dut-ta-mah"],en:["Ramo Viramo Virajo Margo Neyo Nayo Anayah", "Virah Shaktimatam Shreshtho Dharmo Dharmaviduttamah"],te:["రామో విరామో విరజో మార్గో నేయో నయోఽనయః |", "వీరః శక్తిమతాం శ్రేష్ఠో ధర్మో ధర్మవిదుత్తమః ||"],tip:"Na-yo Na-yah: the a of Anaya is not said. Shresh-tho: shr together, then th with a puff of air."},
{n:44,sa:["वैकुण्ठः पुरुषः प्राणः प्राणदः प्रणवः पृथुः ।", "हिरण्यगर्भः शत्रुघ्नो व्याप्तो वायुरधोक्षजः ॥४४॥"],pr:["Vai-kun-thaf Pu-ru-shaf Praa-naf Praa-na-daf Pra-na-vaf Pri-thuh", "Hi-ran-ya-gar-bhash Sha-trugh-no Vyaap-to Vaa-yu-ra-dhok-sha-jah"],en:["Vaikunthah Purushah Pranah Pranadah Pranavah Prithuh", "Hiranyagarbhah Shatrughno Vyapto Vayuradhokshajah"],te:["వైకుణ్ఠః పురుషః ప్రాణః ప్రాణదః ప్రణవః పృథుః |", "హిరణ్యగర్భః శత్రుఘ్నో వ్యాప్తో వాయురధోక్షజః ||"],tip:"Line 1 has five soft f sounds, each before p. Sha-trugh-no: gh, then n, said together."},
{n:45,sa:["ऋतुः सुदर्शनः कालः परमेष्ठी परिग्रहः ।", "उग्रः संवत्सरो दक्षो विश्रामो विश्वदक्षिणः ॥४५॥"],pr:["Ri-tus Su-dar-sha-nah Kaa-laf Pa-ra-mesh-thee Pa-ri-gra-hah", "Ug-ras Sam-vat-sa-ro Dak-sho Vish-raa-mo Vish-va-dak-shi-nah"],en:["Rituh Sudarshanah Kalah Parameshthi Parigrahah", "Ugrah Samvatsaro Daksho Vishramo Vishvadakshinah"],te:["ఋతుః సుదర్శనః కాలః పరమేష్ఠీ పరిగ్రహః |", "ఉగ్రః సంవత్సరో దక్షో విశ్రామో విశ్వదక్షిణః ||"],tip:"Ri-tus: ri is a short tap. Kaa-laf: a soft f before Pa-ra-mesh-thee."},
{n:46,sa:["विस्तारः स्थावरस्थाणुः प्रमाणं बीजमव्ययम् ।", "अर्थोऽनर्थो महाकोशो महाभोगो महाधनः ॥४६॥"],pr:["Vis-taa-ras Sthaa-va-ra-sthaa-nuf Pra-maa-nam Bee-ja-mav-ya-yam", "Ar-tho Nar-tho Ma-haa-ko-sho Ma-haa-bho-go Ma-haa-dha-nah"],en:["Vistarah Sthavarasthanuh Pramanam Bijamavyayam", "Artho Anartho Mahakosho Mahabhogo Mahadhanah"],te:["విస్తారః స్థావరస్థాణుః ప్రమాణం బీజమవ్యయమ్ |", "అర్థోఽనర్థో మహాకోశో మహాభోగో మహాధనః ||"],tip:"Ar-tho Nar-tho: the a of Anartha is not said. Sthaa-nuf: a soft f before Pra-maa-nam."},
{n:47,sa:["अनिर्विण्णः स्थविष्ठोऽभूर्धर्मयूपो महामखः ।", "नक्षत्रनेमिर्नक्षत्री क्षमः क्षामः समीहनः ॥४७॥"],pr:["A-nir-vin-nas Stha-vish-tho Bhoor Dhar-ma-yoo-po Ma-haa-ma-khah", "Nak-sha-tra-ne-mir Nak-sha-tree Ksha-mah Kshaa-mas Sa-mee-ha-nah"],en:["Anirvinnah Sthavishtho Abhur Dharmayupo Mahamakhah", "Nakshatranemir Nakshatri Kshamah Kshamah Samihanah"],te:["అనిర్విణ్ణః స్థవిష్ఠోఽభూర్ధర్మయూపో మహామఖః |", "నక్షత్రనేమిర్నక్షత్రీ క్షమః క్షామః సమీహనః ||"],tip:"Stha-vish-tho Bhoor: the a of Abhu is not said. Ksha-mah and Kshaa-mas differ: short a versus long aa."},
{n:48,sa:["यज्ञ इज्यो महेज्यश्च क्रतुः सत्रं सतां गतिः ।", "सर्वदर्शी विमुक्तात्मा सर्वज्ञो ज्ञानमुत्तमम् ॥४८॥"],pr:["Yaj-na Ij-yo Ma-hej-yash-cha Kra-tus Sat-ram Sa-taam Ga-tih", "Sar-va-dar-shee Vi-muk-taat-maa Sar-vaj-no Jnaa-na-mut-ta-mam"],en:["Yajna Ijyo Mahejyashcha Kratuh Satram Satam Gatih", "Sarvadarshi Vimuktatma Sarvajno Jnanamuttamam"],te:["యజ్ఞ ఇజ్యో మహేజ్యశ్చ క్రతుః సత్రం సతాం గతిః |", "సర్వదర్శీ విముక్తాత్మా సర్వజ్ఞో జ్ఞానముత్తమమ్ ||"],tip:"jn in Yaj-na, Sar-vaj-no and Jnaa-na is usually chanted as gy. Kra-tus Sat-ram: the visarga becomes s."},
{n:49,sa:["सुव्रतः सुमुखः सूक्ष्मः सुघोषः सुखदः सुहृत् ।", "मनोहरो जितक्रोधो वीरबाहुर्विदारणः ॥४९॥"],pr:["Su-vra-tas Su-mu-khas Sook-shmas Su-gho-shas Su-kha-das Su-hrit", "Ma-no-ha-ro Ji-ta-kro-dho Vee-ra-baa-hur Vi-daa-ra-nah"],en:["Suvratah Sumukhah Sukshmah Sughoshah Sukhadah Suhrit", "Manoharo Jitakrodho Virabahur Vidaranah"],te:["సువ్రతః సుముఖః సూక్ష్మః సుఘోషః సుఖదః సుహృత్ |", "మనోహరో జితక్రోధో వీరబాహుర్విదారణః ||"],tip:"Six names start with Su, meaning good. Sook-shmas: ksh, then m, said together."},
{n:50,sa:["स्वापनः स्ववशो व्यापी नैकात्मा नैककर्मकृत् ।", "वत्सरो वत्सलो वत्सी रत्नगर्भो धनेश्वरः ॥५०॥"],pr:["Svaa-pa-nas Sva-va-sho Vyaa-pee Nai-kaat-maa Nai-ka-kar-ma-krit", "Vat-sa-ro Vat-sa-lo Vat-see Rat-na-gar-bho Dha-nesh-va-rah"],en:["Svapanah Svavasho Vyapi Naikatma Naikakarmakrit", "Vatsaro Vatsalo Vatsi Ratnagarbho Dhaneshvarah"],te:["స్వాపనః స్వవశో వ్యాపీ నైకాత్మా నైకకర్మకృత్ |", "వత్సరో వత్సలో వత్సీ రత్నగర్భో ధనేశ్వరః ||"],tip:"Svaa-pa-nas: sv said together. Vat-sa comes three times: hold the t before s."},
{n:51,sa:["धर्मगुब्धर्मकृद्धर्मी सदसत्क्षरमक्षरम् ।", "अविज्ञाता सहस्रांशुर्विधाता कृतलक्षणः ॥५१॥"],pr:["Dhar-ma-gub Dhar-ma-krid Dhar-mee Sa-da-sat Ksha-ra-mak-sha-ram", "A-vij-naa-taa Sa-has-raam-shur Vi-dhaa-taa Kri-ta-lak-sha-nah"],en:["Dharmagub Dharmakrid Dharmi Sadasat Ksharamaksharam", "Avijnata Sahasramshur Vidhata Kritalakshanah"],te:["ధర్మగుబ్ధర్మకృద్ధర్మీ సదసత్క్షరమక్షరమ్ |", "అవిజ్ఞాతా సహస్రాంశుర్విధాతా కృతలక్షణః ||"],tip:"Dhar-ma comes three times: dh is a breathy d. Ksha-ra-mak-sha-ram runs Kshara and Akshara together."},
{n:52,sa:["गभस्तिनेमिः सत्त्वस्थः सिंहो भूतमहेश्वरः ।", "आदिदेवो महादेवो देवेशो देवभृद्गुरुः ॥५२॥"],pr:["Ga-bhas-ti-ne-mis Sat-tva-sthas Sim-ho Bhoo-ta-ma-hesh-va-rah", "Aa-di-de-vo Ma-haa-de-vo De-ve-sho De-va-bhrid Gu-ruh"],en:["Gabhastinemih Sattvasthah Simho Bhutamaheshvarah", "Aadidevo Mahadevo Devesho Devabhrid Guruh"],te:["గభస్తినేమిః సత్త్వస్థః సింహో భూతమహేశ్వరః |", "ఆదిదేవో మహాదేవో దేవేశో దేవభృద్గురుః ||"],tip:"Ga-bhas-ti: a breathy bh. Sat-tva-sthas: hold the t, then tv together."},
{n:53,sa:["उत्तरो गोपतिर्गोप्ता ज्ञानगम्यः पुरातनः ।", "शरीरभूतभृद्भोक्ता कपीन्द्रो भूरिदक्षिणः ॥५३॥"],pr:["Ut-ta-ro Go-pa-tir Gop-taa Jnaa-na-gam-yaf Pu-raa-ta-nah", "Sha-ree-ra-bhoo-ta-bhrid Bhok-taa Ka-peen-dro Bhoo-ri-dak-shi-nah"],en:["Uttaro Gopatir Gopta Jnanagamyah Puratanah", "Sharirabhutabhrid Bhokta Kapindro Bhuridakshinah"],te:["ఉత్తరో గోపతిర్గోప్తా జ్ఞానగమ్యః పురాతనః |", "శరీరభూతభృద్భోక్తా కపీన్ద్రో భూరిదక్షిణః ||"],tip:"Jnaa-na-gam-yaf: jn is usually chanted as gy, then a soft f before Pu-raa-ta-nah."},
{n:54,sa:["सोमपोऽमृतपः सोमः पुरुजित्पुरुसत्तमः ।", "विनयो जयः सत्यसन्धो दाशार्हः सात्वतां पतिः ॥५४॥"],pr:["So-ma-po Mri-ta-pas So-maf Pu-ru-jit Pu-ru-sat-ta-mah", "Vi-na-yo Ja-yas Sat-ya-san-dho Daa-shaar-has Saat-va-taam Pa-tih"],en:["Somapo Amritapah Somah Purujit Purusattamah", "Vinayo Jayah Satyasandho Dasharhah Satvatam Patih"],te:["సోమపోఽమృతపః సోమః పురుజిత్పురుసత్తమః |", "వినయో జయః సత్యసన్ధో దాశార్హః సాత్వతాం పతిః ||"],tip:"So-ma-po Mri-ta-pas: the a of Amrita is not said. So-maf: a soft f before Pu-ru-jit."},
{n:55,sa:["जीवो विनयिता साक्षी मुकुन्दोऽमितविक्रमः ।", "अम्भोनिधिरनन्तात्मा महोदधिशयोऽन्तकः ॥५५॥"],pr:["Jee-vo Vi-na-yi-taa Saak-shee Mu-kun-do Mi-ta-vik-ra-mah", "Am-bho-ni-dhi-ra-nan-taat-maa Ma-ho-da-dhi-sha-yon-ta-kah"],en:["Jivo Vinayita Sakshi Mukundo Amitavikramah", "Ambhonidhiranantatma Mahodadhishayontakah"],te:["జీవో వినయితా సాక్షీ ముకున్దోఽమితవిక్రమః |", "అమ్భోనిధిరనన్తాత్మా మహోదధిశయోఽన్తకః ||"],tip:"Mu-kun-do Mi-ta: the a of Amita is not said. Ma-ho-da-dhi-sha-yon-ta-kah is one long flow."},
{n:56,sa:["अजो महार्हः स्वाभाव्यो जितामित्रः प्रमोदनः ।", "आनन्दो नन्दनो नन्दः सत्यधर्मा त्रिविक्रमः ॥५६॥"],pr:["A-jo Ma-haar-has Svaa-bhaav-yo Ji-taa-mit-raf Pra-mo-da-nah", "Aa-nan-do Nan-da-no Nan-das Sat-ya-dhar-maa Tri-vik-ra-mah"],en:["Ajo Maharhah Svabhavyo Jitamitrah Pramodanah", "Aanando Nandano Nandah Satyadharma Trivikramah"],te:["అజో మహార్హః స్వాభావ్యో జితామిత్రః ప్రమోదనః |", "ఆనన్దో నన్దనో నన్దః సత్యధర్మా త్రివిక్రమః ||"],tip:"Ma-haar-has: r, then a soft h. Ji-taa-mit-raf: a soft f before Pra-mo-da-nah."},
{n:57,sa:["महर्षिः कपिलाचार्यः कृतज्ञो मेदिनीपतिः ।", "त्रिपदस्त्रिदशाध्यक्षो महाशृङ्गः कृतान्तकृत् ॥५७॥"],pr:["Ma-har-shih Ka-pi-laa-chaar-yah Kri-taj-no Me-di-nee-pa-tih", "Tri-pa-das Tri-da-shaa-dhyak-sho Ma-haa-shrin-gah Kri-taan-ta-krit"],en:["Maharshih Kapilacharyah Kritajno Medinipatih", "Tripadas Tridashadhyaksho Mahashringah Kritantakrit"],te:["మహర్షిః కపిలాచార్యః కృతజ్ఞో మేదినీపతిః |", "త్రిపదస్త్రిదశాధ్యక్షో మహాశృఙ్గః కృతాన్తకృత్ ||"],tip:"Ma-har-shih: r, then sh. Ma-haa-shrin-gah: shr said together, then a nasal before g."},
{n:58,sa:["महावराहो गोविन्दः सुषेणः कनकाङ्गदी ।", "गुह्यो गभीरो गहनो गुप्तश्चक्रगदाधरः ॥५८॥"],pr:["Ma-haa-va-raa-ho Go-vin-das Su-she-nah Ka-na-kaan-ga-dee", "Guh-yo Ga-bhee-ro Ga-ha-no Gup-tash Chak-ra-ga-daa-dha-rah"],en:["Mahavaraho Govindah Sushenah Kanakangadi", "Guhyo Gabhiro Gahano Guptah Chakragadadharah"],te:["మహావరాహో గోవిన్దః సుషేణః కనకాఙ్గదీ |", "గుహ్యో గభీరో గహనో గుప్తశ్చక్రగదాధరః ||"],tip:"Guh-yo: a soft h before y. Gup-tash Chak-ra: the visarga becomes sh before ch."},
{n:59,sa:["वेधाः स्वाङ्गोऽजितः कृष्णो दृढः सङ्कर्षणोऽच्युतः ।", "वरुणो वारुणो वृक्षः पुष्कराक्षो महामनाः ॥५९॥"],pr:["Ve-dhaas Svaan-go Ji-tah Krish-no Dri-dhas San-kar-sha-no Chyu-tah", "Va-ru-no Vaa-ru-no Vrik-shaf Push-ka-raak-sho Ma-haa-ma-naah"],en:["Vedhah Svango Ajitah Krishno Dridhah Sankarshano Achyutah", "Varuno Varuno Vrikshah Pushkaraksho Mahamanah"],te:["వేధాః స్వాఙ్గోఽజితః కృష్ణో దృఢః సఙ్కర్షణోఽచ్యుతః |", "వరుణో వారుణో వృక్షః పుష్కరాక్షో మహామనాః ||"],tip:"Svaan-go Ji-tah and San-kar-sha-no Chyu-tah: the a of Ajita and Achyuta is not said. Va-ru-no and Vaa-ru-no differ: short a versus long aa."},
{n:60,sa:["भगवान् भगहानन्दी वनमाली हलायुधः ।", "आदित्यो ज्योतिरादित्यः सहिष्णुर्गतिसत्तमः ॥६०॥"],pr:["Bha-ga-vaan Bha-ga-haa-nan-dee Va-na-maa-lee Ha-laa-yu-dhah", "Aa-dit-yo Jyo-ti-raa-dit-yas Sa-hish-nur Ga-ti-sat-ta-mah"],en:["Bhagavan Bhagahanandi Vanamali Halayudhah", "Aadityo Jyotiradityah Sahishnur Gatisattamah"],te:["భగవాన్ భగహానన్దీ వనమాలీ హలాయుధః |", "ఆదిత్యో జ్యోతిరాదిత్యః సహిష్ణుర్గతిసత్తమః ||"],tip:"Bha-ga-haa-nan-dee runs Bhagaha and Anandi together. Jyo-ti: jy said together."},
{n:61,sa:["सुधन्वा खंडपरशुर् दारुणो द्रविणप्रदः ।","दिवस्पृक् सर्वदृग् व्यासो वाचस्पतिरयोनिजः ॥६१॥"],pr:["Su-dhan-vaa Khan-da-pa-ra-shur Daa-ru-no Dra-vi-na-pra-dah","Di-vas-prik Sar-va-drig Vyaa-so Vaa-chas-pa-ti-ra-yo-ni-jah"],en:["Sudhanva Khandaparashur Daruno Dravinapradah","Divasprik Sarvadrig Vyaso Vachaspatir Ayonijah"],te:["సుధన్వా ఖండపరశుర్ దారుణో ద్రవిణప్రదః |","దివస్పృక్ సర్వదృగ్ వ్యాసో వాచస్పతిరయోనిజః ||"],tip:"Dra-vi-na: the r is a light tap. Vyaa-so: vy is said together, like vya. Vaa-chas-pa-ti: ch like the ch in chair."},
{n:62,sa:["त्रिसामा सामगस् साम निर्वाणं भेषजं भिषक् ।","संन्यासकृच् छमश् शांतो निष्ठा शांतिः परायणम् ॥६२॥"],pr:["Tri-saa-maa Saa-ma-gas Saa-ma Nir-vaa-nam Bhe-sha-jam Bhi-shak","San-nyaa-sa-krich Chha-mash Shaan-to Nish-thaa Shaan-tif Pa-raa-ya-nam"],en:["Trisama Samagas Sama Nirvanam Bheshajam Bhishak","Sannyasakrich Chhamash Shanto Nishtha Shantih Parayanam"],te:["త్రిసామా సామగస్ సామ నిర్వాణం భేషజం భిషక్ |","సంన్యాసకృచ్ ఛమశ్ శాంతో నిష్ఠా శాంతిః పరాయణమ్ ||"],tip:"San-nyaa-sa: the n is said twice (san-nya). Chha is ch with a puff of air. Shaan-tih: sh like ship, with a long aa."},
{n:63,sa:["शुभांगश् शांतिदस् स्रष्टा कुमुदः कुवलेशयः ।","गोहितो गोपतिर् गोप्ता वृषभाक्षो वृषप्रियः ॥६३॥"],pr:["Shu-bhaan-gash Shaan-ti-das Srash-taa Ku-mu-dah Ku-va-le-sha-yah","Go-hi-to Go-pa-tir Gop-taa Vri-sha-bhaak-sho Vri-sha-pri-yah"],en:["Shubhangash Shantidas Srashta Kumudah Kuvaleshayah","Gohito Gopatir Gopta Vrishabhaksho Vrishapriyah"],te:["శుభాంగశ్ శాంతిదస్ స్రష్టా కుముదః కువలేశయః |","గోహితో గోపతిర్ గోప్తా వృషభాక్షో వృషప్రియః ||"],tip:"Srash-taa: s and r run together, then sh. Vri-sha-bhaak-sho: bh is a breathy b, ksh is k and sh together. Shu-bhaan-gash ends with sh, not s."},
{n:64,sa:["अनिवर्ती निवृत्तात्मा संक्षेप्ता क्षेमकृच्छिवः ।","श्रीवत्सवक्षाः श्रीवासः श्रीपतिः श्रीमतां वरः ॥६४॥"],pr:["A-ni-var-tee Ni-vrit-taat-maa San-kshep-taa Kshe-ma-krich-chhi-vah","Shree-vat-sa-vak-shaash Shree-vaa-sash Shree-pa-tish Shree-ma-taam Va-rah"],en:["Anivarti Nivrittatma Sankshepta Kshemakrichchhivah","Shrivatsavakshah Shrivasah Shripatih Shrimatam Varah"],te:["అనివర్తీ నివృత్తాత్మా సంక్షేప్తా క్షేమకృచ్ఛివః |","శ్రీవత్సవక్షాః శ్రీవాసః శ్రీపతిః శ్రీమతాం వరః ||"],tip:"San-kshep-taa: ksh is k and sh said together. The Shree lines hold a long ee. chh is ch with a puff of air."},
{n:65,sa:["श्रीदः श्रीशः श्रीनिवासः श्रीनिधिः श्रीविभावनः ।","श्रीधरः श्रीकरः श्रेयः श्रीमाँल्लोकत्रयाश्रयः ॥६५॥"],pr:["Shree-dash Shree-shash Shree-ni-vaa-sash Shree-ni-dhish Shree-vi-bhaa-va-nah","Shree-dha-rash Shree-ka-rash Shre-yash Shree-maan Lo-ka-tra-yaa-shra-yah"],en:["Shridah Shrishah Shrinivasah Shrinidhih Shrivibhavanah","Shridharah Shrikarah Shreyah Shrimaan Lokatrayashrayah"],te:["శ్రీదః శ్రీశః శ్రీనివాసః శ్రీనిధిః శ్రీవిభావనః |","శ్రీధరః శ్రీకరః శ్రేయః శ్రీమాఁల్లోకత్రయాశ్రయః ||"],tip:"Many names here begin with Shree, each time with a long ee. Shre-yah is short, not Shree-yah."},
{n:66,sa:["स्वक्षः स्वङ्गः शतानन्दो नन्दिर्ज्योतिर्गणेश्वरः ।","विजितात्मा विधेयात्मा सत्कीर्तिश्छिन्नसंशयः ॥६६॥"],pr:["Svak-shas Svan-gash Sha-taa-nan-do Nan-dir Jyo-tir Ga-ne-shva-rah","Vi-ji-taat-maa Vi-dhe-yaat-maa Sat-keer-tish Chhin-na-sam-sha-yah"],en:["Svakshah Svangah Shatanando Nandir Jyotir Ganeshvarah","Vijitatma Vidheyatma Satkirtish Chhinnasamshayah"],te:["స్వక్షః స్వఙ్గః శతానన్దో నన్దిర్జ్యోతిర్గణేశ్వరః |","విజితాత్మా విధేయాత్మా సత్కీర్తిశ్ఛిన్నసంశయః ||"],tip:"Jyo-tir: jy said together in one breath, like jyo. Chhin-na: ch with a puff of air, then a held n."},
{n:67,sa:["उदीर्णः सर्वतश्चक्षुरनीशः शाश्वतस्थिरः ।","भूशयो भूषणो भूतिर्विशोकः शोकनाशनः ॥६७॥"],pr:["U-deer-nas Sar-va-tash Chak-shu-ra-nee-shash Shaash-va-ta-sthi-rah","Bhoo-sha-yo Bhoo-sha-no Bhoo-tir Vi-sho-kash Sho-ka-naa-sha-nah"],en:["Udirnah Sarvatash Chakshuranishah Shashvatasthirah","Bhushayo Bhushano Bhutir Vishokah Shokanashanah"],te:["ఉదీర్ణః సర్వతశ్చక్షురనీశః శాశ్వతస్థిరః |","భూశయో భూషణో భూతిర్విశోకః శోకనాశనః ||"],tip:"Chak-shu-ra-nee-shah is chakshu (eye) joined with anishah. The Bhoo names are a breathy b with a long oo."},
{n:68,sa:["अर्चिष्मानर्चितः कुम्भो विशुद्धात्मा विशोधनः ।","अनिरुद्धोऽप्रतिरथः प्रद्युम्नोऽमितविक्रमः ॥६८॥"],pr:["Ar-chish-maan Ar-chi-tah Kum-bho Vi-shud-dhaat-maa Vi-sho-dha-nah","A-ni-rud-dho Pra-ti-ra-thaf Pra-dyum-no Mi-ta-vik-ra-mah"],en:["Archishman Architah Kumbho Vishuddhatma Vishodhanah","Aniruddho Apratirathah Pradyumno Amitavikramah"],te:["అర్చిష్మానర్చితః కుమ్భో విశుద్ధాత్మా విశోధనః |","అనిరుద్ధోఽప్రతిరథః ప్రద్యుమ్నోఽమితవిక్రమః ||"],tip:"dd in Shud-dhaat-maa and Rud-dho is a breathy d held a moment. Pra-dyum-no: dy said together."},
{n:69,sa:["कालनेमिनिहा वीरः शौरिः शूरजनेश्वरः ।","त्रिलोकात्मा त्रिलोकेशः केशवः केशिहा हरिः ॥६९॥"],pr:["Kaa-la-ne-mi-ni-haa Vee-rash Shau-rish Shoo-ra-ja-ne-shva-rah","Tri-lo-kaat-maa Tri-lo-ke-shah Ke-sha-vah Ke-shi-haa Ha-rih"],en:["Kalaneminiha Virah Shaurih Shurajaneshvarah","Trilokatma Trilokeshah Keshavah Keshiha Harih"],te:["కాలనేమినిహా వీరః శౌరిః శూరజనేశ్వరః |","త్రిలోకాత్మా త్రిలోకేశః కేశవః కేశిహా హరిః ||"],tip:"Shau-rih: sh then an ow sound, like shout without the t. Tri-lo-kaat-maa: tri said quickly as one beat."},
{n:70,sa:["कामदेवः कामपालः कामी कान्तः कृतागमः ।","अनिर्देश्यवपुर्विष्णुर्वीरोऽनन्तो धनञ्जयः ॥७०॥"],pr:["Kaa-ma-de-vah Kaa-ma-paa-lah Kaa-mee Kaan-tah Kri-taa-ga-mah","A-nir-de-shya-va-pur Vish-nur Vee-ro Nan-to Dha-nan-ja-yah"],en:["Kamadevah Kamapalah Kami Kantah Kritagamah","Anirdeshyavapur Vishnur Viro Ananto Dhananjayah"],te:["కామదేవః కామపాలః కామీ కాన్తః కృతాగమః |","అనిర్దేశ్యవపుర్విష్ణుర్వీరోఽనన్తో ధనఞ్జయః ||"],tip:"Kri-taa-ga-mah: kri is a short tap, not kree. Dha-nan-ja-yah: j as in jam."},
{n:71,sa:["ब्रह्मण्यो ब्रह्मकृद् ब्रह्मा ब्रह्म ब्रह्मविवर्धनः ।","ब्रह्मविद् ब्राह्मणो ब्रह्मी ब्रह्मज्ञो ब्राह्मणप्रियः ॥७१॥"],pr:["Brah-man-yo Brah-ma-krid Brah-maa Brah-ma Brah-ma-vi-var-dha-nah","Brah-ma-vid Braah-ma-no Brah-mee Brah-ma-jno Braah-ma-na-pri-yah"],en:["Brahmanyo Brahmakrid Brahma Brahma Brahmavivardhanah","Brahmavid Brahmano Brahmi Brahmajno Brahmanapriyah"],te:["బ్రహ్మణ్యో బ్రహ్మకృద్ బ్రహ్మా బ్రహ్మ బ్రహ్మవివర్ధనః |","బ్రహ్మవిద్ బ్రాహ్మణో బ్రహ్మీ బ్రహ్మజ్ఞో బ్రాహ్మణప్రియః ||"],tip:"Brah is one syllable: b, r and h blended together. jno is usually chanted as gyo."},
{n:72,sa:["महाक्रमो महाकर्मा महातेजा महोरगः ।","महाक्रतुर्महायज्वा महायज्ञो महाहविः ॥७२॥"],pr:["Ma-haa-kra-mo Ma-haa-kar-maa Ma-haa-te-jaa Ma-ho-ra-gah","Ma-haa-kra-tur Ma-haa-yaj-vaa Ma-haa-yaj-no Ma-haa-ha-vih"],en:["Mahakramo Mahakarma Mahateja Mahoragah","Mahakratur Mahayajva Mahayajno Mahahavih"],te:["మహాక్రమో మహాకర్మా మహాతేజా మహోరగః |","మహాక్రతుర్మహాయజ్వా మహాయజ్ఞో మహాహవిః ||"],tip:"Every name here starts with Ma-haa, meaning great, held with a long aa."},
{n:73,sa:["स्तव्यः स्तवप्रियः स्तोत्रं स्तुतिः स्तोता रणप्रियः ।","पूर्णः पूरयिता पुण्यः पुण्यकीर्तिरनामयः ॥७३॥"],pr:["Stav-yas Sta-va-pri-yas Sto-tram Stu-tis Sto-taa Ra-na-pri-yah","Poor-naf Poo-ra-yi-taa Pun-yaf Pun-ya-keer-tir A-naa-ma-yah"],en:["Stavyah Stavapriyah Stotram Stutih Stota Ranapriyah","Purnah Purayita Punyah Punyakirtir Anamayah"],te:["స్తవ్యః స్తవప్రియః స్తోత్రం స్తుతిః స్తోతా రణప్రియః |","పూర్ణః పూరయితా పుణ్యః పుణ్యకీర్తిరనామయః ||"],tip:"St is said together at the start, like st in stop. Poor-nah holds a long oo."},
{n:74,sa:["मनोजवस्तीर्थकरो वसुरेता वसुप्रदः ।","वसुप्रदो वासुदेवो वसुर्वसुमना हविः ॥७४॥"],pr:["Ma-no-ja-vas Teer-tha-ka-ro Va-su-re-taa Va-su-pra-dah","Va-su-pra-do Vaa-su-de-vo Va-sur Va-su-ma-naa Ha-vih"],en:["Manojavas Tirthakaro Vasureta Vasupradah","Vasuprado Vasudevo Vasur Vasumana Havih"],te:["మనోజవస్తీర్థకరో వసురేతా వసుప్రదః |","వసుప్రదో వాసుదేవో వసుర్వసుమనా హవిః ||"],tip:"Teer-tha-ka-ro: th is t with a puff of air. Vaa-su-de-vo has its long aa only in the first syllable."},
{n:75,sa:["सद्गतिः सत्कृतिः सत्ता सद्भूतिः सत्परायणः ।","शूरसेनो यदुश्रेष्ठः सन्निवासः सुयामुनः ॥७५॥"],pr:["Sad-ga-tis Sat-kri-tis Sat-taa Sad-bhoo-tis Sat-pa-raa-ya-nah","Shoo-ra-se-no Ya-du-shresh-thas San-ni-vaa-sas Su-yaa-mu-nah"],en:["Sadgatih Satkritih Satta Sadbhutih Satparayanah","Shuraseno Yadushreshthah Sannivasah Suyamunah"],te:["సద్గతిః సత్కృతిః సత్తా సద్భూతిః సత్పరాయణః |","శూరసేనో యదుశ్రేష్ఠః సన్నివాసః సుయామునః ||"],tip:"Shresh-thah: sh then t with a puff of air. San-ni-vaa-sah holds the n twice."},
{n:76,sa:["भूतावासो वासुदेवः सर्वासुनिलयोऽनलः ।","दर्पहा दर्पदो दृप्तो दुर्धरोऽथापराजितः ॥७६॥"],pr:["Bhoo-taa-vaa-so Vaa-su-de-vas Sar-vaa-su-ni-la-yo Na-lah","Dar-pa-haa Dar-pa-do Drip-to Dur-dha-ro Thaa-pa-raa-ji-tah"],en:["Bhutavaso Vasudevah Sarvasunilayo Analah","Darpaha Darpado Dripto Durdharo Athaparajitah"],te:["భూతావాసో వాసుదేవః సర్వాసునిలయోఽనలః |","దర్పహా దర్పదో దృప్తో దుర్ధరోఽథాపరాజితః ||"],tip:"Drip-to: dr is a soft blend, then a short i. A-thaa-pa-raa-ji-tah is a-thaa joined with parajitah."},
{n:77,sa:["विश्वमूर्तिर्महामूर्तिर्दीप्तमूर्तिरमूर्तिमान् ।","अनेकमूर्तिरव्यक्तः शतमूर्तिः शताननः ॥७७॥"],pr:["Vish-va-moor-tir Ma-haa-moor-tir Deep-ta-moor-tir A-moor-ti-maan","A-ne-ka-moor-tir A-vyak-tash Sha-ta-moor-tish Sha-taa-na-nah"],en:["Vishvamurtir Mahamurtir Diptamurtir Amurtiman","Anekamurtir Avyaktah Shatamurtih Shatananah"],te:["విశ్వమూర్తిర్మహామూర్తిర్దీప్తమూర్తిరమూర్తిమాన్ |","అనేకమూర్తిరవ్యక్తః శతమూర్తిః శతాననః ||"],tip:"Moor-tir repeats through this verse: a long oo, then a light tir. Deep-ta holds only a short e."},
{n:78,sa:["एको नैकः सवः कः किं यत्तत्पदमनुत्तमम् ।","लोकबन्धुर्लोकनाथो माधवो भक्तवत्सलः ॥७८॥"],pr:["E-ko Nai-kas Sa-vah Kah Kim Yat-tat-pa-da-ma-nut-ta-mam","Lo-ka-ban-dhur Lo-ka-naa-tho Maa-dha-vo Bhak-ta-vat-sa-lah"],en:["Eko Naikah Savah Kah Kim Yattatpadamanuttamam","Lokabandhur Lokanatho Madhavo Bhaktavatsalah"],te:["ఏకో నైకః సవః కః కిం యత్తత్పదమనుత్తమమ్ |","లోకబన్ధుర్లోకనాథో మాధవో భక్తవత్సలః ||"],tip:"Nai-kah: ai is one long sound, like eye. Bhak-ta-vat-sa-lah: bh is a breathy b."},
{n:79,sa:["सुवर्णवर्णो हेमाङ्गो वराङ्गश्चन्दनाङ्गदी ।","वीरहा विषमः शून्यो घृताशीरचलश्चलः ॥७९॥"],pr:["Su-var-na-var-no He-maan-go Va-raan-gash Chan-da-naan-ga-dee","Vee-ra-haa Vi-sha-mash Shoon-yo Ghri-taa-sheer A-cha-lash Cha-lah"],en:["Suvarnavarno Hemango Varangash Chandanangadi","Viraha Vishamah Shunyo Ghritashir Achalash Chalah"],te:["సువర్ణవర్ణో హేమాఙ్గో వరాఙ్గశ్చన్దనాఙ్గదీ |","వీరహా విషమః శూన్యో ఘృతాశీరచలశ్చలః ||"],tip:"He-maan-go holds a long aa in the middle. Ghri-taa-sheer: gh is g with a puff of air."},
{n:80,sa:["अमानी मानदो मान्यो लोकस्वामी त्रिलोकधृक् ।","सुमेधा मेधजो धन्यः सत्यमेधा धराधरः ॥८०॥"],pr:["A-maa-nee Maa-na-do Maan-yo Lo-ka-svaa-mee Tri-lo-ka-dhrik","Su-me-dhaa Me-dha-jo Dhan-yas Sat-ya-me-dhaa Dha-raa-dha-rah"],en:["Amani Manado Manyo Lokasvami Trilokadhrik","Sumedha Medhajo Dhanyah Satyamedha Dharadharah"],te:["అమానీ మానదో మాన్యో లోకస్వామీ త్రిలోకధృక్ |","సుమేధా మేధజో ధన్యః సత్యమేధా ధరాధరః ||"],tip:"Dhrik ends in a light tap of r plus k, no vowel after. Dha-raa-dha-rah repeats a breathy dh twice."},
{n:81,sa:["तेजोवृषो द्युतिधरः सर्वशस्त्रभृतां वरः ।","प्रग्रहो निग्रहो व्यग्रो नैकशृङ्गो गदाग्रजः ॥८१॥"],pr:["Te-jo-vri-sho Dyu-ti-dha-ras Sar-va-shas-tra-bhri-taam Va-rah","Pra-gra-ho Ni-gra-ho Vyag-ro Nai-ka-shrin-go Ga-daa-gra-jah"],en:["Tejovrisho Dyutidharah Sarvashastrabhritam Varah","Pragraho Nigraho Vyagro Naikashringo Gadagrajah"],te:["తేజోవృషో ద్యుతిధరః సర్వశస్త్రభృతాం వరః |","ప్రగ్రహో నిగ్రహో వ్యగ్రో నైకశృఙ్గో గదాగ్రజః ||"],tip:"Dyu-ti-dha-rah: dy said together, like dyu in one go. Shrin-go blends shr, then a nasal before g."},
{n:82,sa:["चतुर्मूर्तिश्चतुर्बाहुश्चतुर्व्यूहश्चतुर्गतिः ।","चतुरात्मा चतुर्भावश्चतुर्वेदविदेकपात् ॥८२॥"],pr:["Cha-tur-moor-tish Cha-tur-baa-hush Cha-tur-vyoo-hash Cha-tur-ga-tih","Cha-tu-raat-maa Cha-tur-bhaa-vash Cha-tur-ve-da-vi-de-ka-paat"],en:["Chaturmurtish Chaturbahush Chaturvyuhash Chaturgatih","Chaturatma Chaturbhavash Chaturvedavidekapat"],te:["చతుర్మూర్తిశ్చతుర్బాహుశ్చతుర్వ్యూహశ్చతుర్గతిః |","చతురాత్మా చతుర్భావశ్చతుర్వేదవిదేకపాత్ ||"],tip:"Chatur, meaning four, repeats through this verse. Vyoo-hash: vy said together, then a long oo."},
{n:83,sa:["समावर्तोऽनिवृत्तात्मा दुर्जयो दुरतिक्रमः ।","दुर्लभो दुर्गमो दुर्गो दुरावासो दुरारिहा ॥८३॥"],pr:["Sa-maa-var-to Ni-vrit-taat-maa Dur-ja-yo Du-ra-ti-kra-mah","Dur-la-bho Dur-ga-mo Dur-go Du-raa-vaa-so Du-raa-ri-haa"],en:["Samavarto Anivrittatma Durjayo Duratikramah","Durlabho Durgamo Durgo Duravaso Durariha"],te:["సమావర్తోఽనివృత్తాత్మా దుర్జయో దురతిక్రమః |","దుర్లభో దుర్గమో దుర్గో దురావాసో దురారిహా ||"],tip:"Dur, meaning hard to, repeats through this verse, said with a light tap of r."},
{n:84,sa:["शुभाङ्गो लोकसारङ्गः सुतन्तुस्तन्तुवर्धनः ।","इन्द्रकर्मा महाकर्मा कृतकर्मा कृतागमः ॥८४॥"],pr:["Shu-bhaan-go Lo-ka-saa-ran-gas Su-tan-tus Tan-tu-var-dha-nah","In-dra-kar-maa Ma-haa-kar-maa Kri-ta-kar-maa Kri-taa-ga-mah"],en:["Shubhango Lokasarangah Sutantus Tantuvardhanah","Indrakarma Mahakarma Kritakarma Kritagamah"],te:["శుభాఙ్గో లోకసారఙ్గః సుతన్తుస్తన్తువర్ధనః |","ఇన్ద్రకర్మా మహాకర్మా కృతకర్మా కృతాగమః ||"],tip:"In-dra-kar-maa blends dr together. The three -kar-maa names keep one steady rhythm."},
{n:85,sa:["उद्भवः सुन्दरः सुन्दो रत्ननाभः सुलोचनः ।", "अर्को वाजसनः शृङ्गी जयन्तः सर्वविज्जयी ॥८५॥"],pr:["Ud-bha-vas Sun-da-ras Sun-do Rat-na-naa-bhas Su-lo-cha-nah", "Ar-ko Vaa-ja-sa-nash Shrin-gee Ja-yan-tas Sar-va-vij-ja-yee"],en:["Udbhavah Sundarah Sundo Ratnanabhah Sulochanah", "Arko Vajasanah Shringi Jayantah Sarvavijjayi"],te:["ఉద్భవః సున్దరః సున్దో రత్ననాభః సులోచనః |", "అర్కో వాజసనః శృఙ్గీ జయన్తః సర్వవిజ్జయీ ||"],tip:"Ud-bha-vas: a clear d, then a breathy bh. Shrin-gee: shr said together, then a nasal before g. Sar-va-vij-ja-yee holds the j twice."},
{n:86,sa:["सुवर्णबिन्दुरक्षोभ्यः सर्ववागीश्वरेश्वरः ।", "महाह्रदो महागर्तो महाभूतो महानिधिः ॥८६॥"],pr:["Su-var-na-bin-du Rak-sho-bhyas Sar-va-vaa-geesh-va-resh-va-rah", "Ma-haa-hra-do Ma-haa-gar-to Ma-haa-bhoo-to Ma-haa-ni-dhih"],en:["Suvarnabindur Akshobhyah Sarvavagishvareshvarah", "Mahahrado Mahagarto Mahabhuto Mahanidhih"],te:["సువర్ణబిన్దురక్షోభ్యః సర్వవాగీశ్వరేశ్వరః |", "మహాహ్రదో మహాగర్తో మహాభూతో మహానిధిః ||"],tip:"Rak-sho-bhyas: ksh is k and sh together, and bhy is said in one go. Ma-haa-hra-do: h then r, said quickly."},
{n:87,sa:["कुमुदः कुन्दरः कुन्दः पर्जन्यः पावनोऽनिलः ।", "अमृताशोऽमृतवपुः सर्वज्ञः सर्वतोमुखः ॥८७॥"],pr:["Ku-mu-dah Kun-da-rah Kun-daf Par-jan-yaf Paa-va-no Ni-lah", "A-mri-taa-sho Mri-ta-va-pus Sar-vaj-nas Sar-va-to-mu-khah"],en:["Kumudah Kundarah Kundah Parjanyah Pavano Anilah", "Amritasho Amritavapuh Sarvajnah Sarvatomukhah"],te:["కుముదః కున్దరః కున్దః పర్జన్యః పావనోఽనిలః |", "అమృతాశోఽమృతవపుః సర్వజ్ఞః సర్వతోముఖః ||"],tip:"Kun-daf Par-jan-yaf: a soft f before p. Paa-va-no Ni-lah: the a of Anilah is not said. jn in Sar-vaj-nas is usually chanted as gy."},
{n:88,sa:["सुलभः सुव्रतः सिद्धः शत्रुजिच्छत्रुतापनः ।", "न्यग्रोधोदुम्बरोऽश्वत्थश्चाणूरान्ध्रनिषूदनः ॥८८॥"],pr:["Su-la-bhas Su-vra-tas Sid-dhash Sha-tru-jich Chha-tru-taa-pa-nah", "Nyag-ro-dho Dum-ba-ro Shvat-thash Chaa-noo-raan-dhra-ni-shoo-da-nah"],en:["Sulabhah Suvratah Siddhah Shatrujich Chhatrutapanah", "Nyagrodho Dumbaro Ashvatthash Chanurandhranishudanah"],te:["సులభః సువ్రతః సిద్ధః శత్రుజిచ్ఛత్రుతాపనః |", "న్యగ్రోధోదుమ్బరోఽశ్వత్థశ్చాణూరాన్ధ్రనిషూదనః ||"],tip:"Chha-tru: ch with a puff of air. Shvat-thash: the a of Ashvattha is not said, and tth is a held t with a puff of air."},
{n:89,sa:["सहस्रार्चिः सप्तजिह्वः सप्तैधाः सप्तवाहनः ।", "अमूर्तिरनघोऽचिन्त्यो भयकृद्भयनाशनः ॥८९॥"],pr:["Sa-has-raar-chis Sap-ta-jih-vas Sap-tai-dhaas Sap-ta-vaa-ha-nah", "A-moor-ti-ra-na-gho Chin-tyo Bha-ya-krid Bha-ya-naa-sha-nah"],en:["Sahasrarchih Saptajihvah Saptaidhah Saptavahanah", "Amurtir Anagho Achintyo Bhayakrid Bhayanashanah"],te:["సహస్రార్చిః సప్తజిహ్వః సప్తైధాః సప్తవాహనః |", "అమూర్తిరనఘోఽచిన్త్యో భయకృద్భయనాశనః ||"],tip:"Sap-ta-jih-vas: j, then a soft h with v. Sap-tai-dhaas: ai like eye. A-na-gho Chin-tyo: the a of Achintyo is not said."},
{n:90,sa:["अणुर्बृहत्कृशः स्थूलो गुणभृन्निर्गुणो महान् ।", "अधृतः स्वधृतः स्वास्यः प्राग्वंशो वंशवर्धनः ॥९०॥"],pr:["A-nur Bri-hat Kri-shas Sthoo-lo Gu-na-bhrin Nir-gu-no Ma-haan", "A-dhri-tas Sva-dhri-tas Svaas-yaf Praag-vam-sho Vam-sha-var-dha-nah"],en:["Anur Brihat Krishah Sthulo Gunabhrin Nirguno Mahan", "Adhritah Svadhritah Svasyah Pragvamsho Vamshavardhanah"],te:["అణుర్బృహత్కృశః స్థూలో గుణభృన్నిర్గుణో మహాన్ |", "అధృతః స్వధృతః స్వాస్యః ప్రాగ్వంశో వంశవర్ధనః ||"],tip:"Bri-hat and Kri: ri is a short tap, not ree. Svaas-yaf: a soft f before Praag. In Vam-sho the dot is said as m."},
{n:91,sa:["भारभृत् कथितो योगी योगीशः सर्वकामदः ।", "आश्रमः श्रमणः क्षामः सुपर्णो वायुवाहनः ॥९१॥"],pr:["Bhaa-ra-bhrit Ka-thi-to Yo-gee Yo-gee-shas Sar-va-kaa-ma-dah", "Aa-shra-mash Shra-ma-nah Kshaa-mas Su-par-no Vaa-yu-vaa-ha-nah"],en:["Bharabhrit Kathito Yogi Yogishah Sarvakamadah", "Ashramah Shramanah Kshamah Suparno Vayuvahanah"],te:["భారభృత్ కథితో యోగీ యోగీశః సర్వకామదః |", "ఆశ్రమః శ్రమణః క్షామః సుపర్ణో వాయువాహనః ||"],tip:"Ka-thi-to: th is t with a puff of air. Aa-shra-mash Shra-ma-nah: shr is said together. Kshaa-mas: ksh is k and sh together."},
{n:92,sa:["धनुर्धरो धनुर्वेदो दण्डो दमयिता दमः ।", "अपराजितः सर्वसहो नियन्ताऽनियमोऽयमः ॥९२॥"],pr:["Dha-nur-dha-ro Dha-nur-ve-do Dan-do Da-ma-yi-taa Da-mah", "A-pa-raa-ji-tas Sar-va-sa-ho Ni-yan-taa Ni-ya-mo Ya-mah"],en:["Dhanurdharo Dhanurvedo Dando Damayita Damah", "Aparajitah Sarvasaho Niyanta Aniyamo Ayamah"],te:["ధనుర్ధరో ధనుర్వేదో దణ్డో దమయితా దమః |", "అపరాజితః సర్వసహో నియన్తాఽనియమోఽయమః ||"],tip:"Dha-nur: dh is a breathy d. In Ni-yan-taa Ni-ya-mo Ya-mah, the a after the long aa and after -mo is not said."},
{n:93,sa:["सत्त्ववान् सात्त्विकः सत्यः सत्यधर्मपरायणः ।", "अभिप्रायः प्रियार्होऽर्हः प्रियकृत् प्रीतिवर्धनः ॥९३॥"],pr:["Sat-tva-vaan Saat-tvi-kas Sat-yas Sat-ya-dhar-ma-pa-raa-ya-nah", "A-bhi-praa-yaf Pri-yaar-hor-haf Pri-ya-krit Pree-ti-var-dha-nah"],en:["Sattvavan Sattvikah Satyah Satyadharmaparayanah", "Abhiprayah Priyarho Arhah Priyakrit Pritivardhanah"],te:["సత్త్వవాన్ సాత్త్వికః సత్యః సత్యధర్మపరాయణః |", "అభిప్రాయః ప్రియార్హోఽర్హః ప్రియకృత్ ప్రీతివర్ధనః ||"],tip:"Sat-tva: hold the t, then tv together. Pri-yaar-hor-haf: the a of Arhah is not said, and a soft f comes before Pri-ya-krit."},
{n:94,sa:["विहायसगतिर्ज्योतिः सुरुचिर्हुतभुग्विभुः ।", "रविर्विरोचनः सूर्यः सविता रविलोचनः ॥९४॥"],pr:["Vi-haa-ya-sa-ga-tir Jyo-tis Su-ru-chir Hu-ta-bhug Vi-bhuh", "Ra-vir Vi-ro-cha-nas Soor-yas Sa-vi-taa Ra-vi-lo-cha-nah"],en:["Vihayasagatir Jyotih Suruchir Hutabhug Vibhuh", "Ravir Virochanah Suryah Savita Ravilochanah"],te:["విహాయసగతిర్జ్యోతిః సురుచిర్హుతభుగ్విభుః |", "రవిర్విరోచనః సూర్యః సవితా రవిలోచనః ||"],tip:"Jyo-tis: jy said together. Hu-ta-bhug ends with a clear g. Soor-yas holds a long oo."},
{n:95,sa:["अनन्तो हुतभुग्भोक्ता सुखदो नैकजोऽग्रजः ।", "अनिर्विण्णः सदामर्षी लोकाधिष्ठानमद्भुतः ॥९५॥"],pr:["A-nan-to Hu-ta-bhug Bhok-taa Su-kha-do Nai-ka-jo Gra-jah", "A-nir-vin-nas Sa-daa-mar-shee Lo-kaa-dhish-thaa-na-mad-bhu-tah"],en:["Ananto Hutabhug Bhokta Sukhado Naikajo Agrajah", "Anirvinnah Sadamarshi Lokadhishthanam Adbhutah"],te:["అనన్తో హుతభుగ్భోక్తా సుఖదో నైకజోఽగ్రజః |", "అనిర్విణ్ణః సదామర్షీ లోకాధిష్ఠానమద్భుతః ||"],tip:"Nai-ka-jo Gra-jah: the a of Agrajah is not said. Lo-kaa-dhish-thaa-na-mad-bhu-tah is one long flow, with a breathy th."},
{n:96,sa:["सनात्सनातनतमः कपिलः कपिरव्ययः ।", "स्वस्तिदः स्वस्तिकृत्स्वस्ति स्वस्तिभुक्स्वस्तिदक्षिणः ॥९६॥"],pr:["Sa-naat Sa-naa-ta-na-ta-mah Ka-pi-lah Ka-pi-rav-ya-yah", "Svas-ti-das Svas-ti-krit Svas-ti Svas-ti-bhuk Svas-ti-dak-shi-nah"],en:["Sanat Sanatanatamah Kapilah Kapir Avyayah", "Svastidah Svastikrit Svasti Svastibhuk Svastidakshinah"],te:["సనాత్సనాతనతమః కపిలః కపిరవ్యయః |", "స్వస్తిదః స్వస్తికృత్స్వస్తి స్వస్తిభుక్స్వస్తిదక్షిణః ||"],tip:"Svas-ti comes five times: sv said together, then a clear st. Ka-pi-rav-ya-yah runs Kapih and Avyayah together."},
{n:97,sa:["अरौद्रः कुण्डली चक्री विक्रम्यूर्जितशासनः ।", "शब्दातिगः शब्दसहः शिशिरः शर्वरीकरः ॥९७॥"],pr:["A-rau-drah Kun-da-lee Chak-ree Vik-ram-yoor-ji-ta-shaa-sa-nah", "Shab-daa-ti-gash Shab-da-sa-hash Shi-shi-rash Shar-va-ree-ka-rah"],en:["Araudrah Kundali Chakri Vikramy Urjitashasanah", "Shabdatigah Shabdasahah Shishirah Sharvarikarah"],te:["అరౌద్రః కుణ్డలీ చక్రీ విక్రమ్యూర్జితశాసనః |", "శబ్దాతిగః శబ్దసహః శిశిరః శర్వరీకరః ||"],tip:"A-rau-drah: au like ow in cow. Vik-ram-yoor: Vikrami and Urjita run together as -myoor-."},
{n:98,sa:["अक्रूरः पेशलो दक्षो दक्षिणः क्षमिणां वरः ।", "विद्वत्तमो वीतभयः पुण्यश्रवणकीर्तनः ॥९८॥"],pr:["Ak-roo-raf Pe-sha-lo Dak-sho Dak-shi-nah Ksha-mi-naam Va-rah", "Vid-vat-ta-mo Vee-ta-bha-yaf Pun-ya-shra-va-na-keer-ta-nah"],en:["Akrurah Peshalo Daksho Dakshinah Kshaminam Varah", "Vidvattamo Vitabhayah Punyashravanakirtanah"],te:["అక్రూరః పేశలో దక్షో దక్షిణః క్షమిణాం వరః |", "విద్వత్తమో వీతభయః పుణ్యశ్రవణకీర్తనః ||"],tip:"Ak-roo-raf: a soft f before Pe-sha-lo. Dak-sho and Ksha-mi-naam: ksh is k and sh together."},
{n:99,sa:["उत्तारणो दुष्कृतिहा पुण्यो दुःस्वप्ननाशनः ।", "वीरहा रक्षणः सन्तो जीवनः पर्यवस्थितः ॥९९॥"],pr:["Ut-taa-ra-no Dush-kri-ti-haa Pun-yo Dus-svap-na-naa-sha-nah", "Vee-ra-haa Rak-sha-nas San-to Jee-va-naf Par-ya-vas-thi-tah"],en:["Uttarano Dushkritiha Punyo Duhsvapnanashanah", "Viraha Rakshanah Santo Jivanah Paryavasthitah"],te:["ఉత్తారణో దుష్కృతిహా పుణ్యో దుఃస్వప్ననాశనః |", "వీరహా రక్షణః సన్తో జీవనః పర్యవస్థితః ||"],tip:"Dus-svap-na: the visarga becomes s, so the s is said twice. Jee-va-naf: a soft f before Par-ya."},
{n:100,sa:["अनन्तरूपोऽनन्तश्रीर्जितमन्युर्भयापहः ।", "चतुरश्रो गभीरात्मा विदिशो व्यादिशो दिशः ॥१००॥"],pr:["A-nan-ta-roo-po Nan-ta-shreer Ji-ta-man-yur Bha-yaa-pa-hah", "Cha-tu-rash-ro Ga-bhee-raat-maa Vi-di-sho Vyaa-di-sho Di-shah"],en:["Anantarupo Anantashrir Jitamanyur Bhayapahah", "Chaturashro Gabhiratma Vidisho Vyadisho Dishah"],te:["అనన్తరూపోఽనన్తశ్రీర్జితమన్యుర్భయాపహః |", "చతురశ్రో గభీరాత్మా విదిశో వ్యాదిశో దిశః ||"],tip:"Roo-po Nan-ta-shreer: the first a of the second Ananta is not said. Vyaa-di-sho: vy said together."},
{n:101,sa:["अनादिर्भूर्भुवो लक्ष्मीः सुवीरो रुचिराङ्गदः ।", "जननो जनजन्मादिर्भीमो भीमपराक्रमः ॥१०१॥"],pr:["A-naa-dir Bhoor-bhu-vo Lak-shmees Su-vee-ro Ru-chi-raan-ga-dah", "Ja-na-no Ja-na-jan-maa-dir Bhee-mo Bhee-ma-pa-raak-ra-mah"],en:["Anadir Bhurbhuvo Lakshmih Suviro Ruchirangadah", "Janano Janajanmadir Bhimo Bhimaparakramah"],te:["అనాదిర్భూర్భువో లక్ష్మీః సువీరో రుచిరాఙ్గదః |", "జననో జనజన్మాదిర్భీమో భీమపరాక్రమః ||"],tip:"Bhoor-bhu-vo: a breathy bh twice. Lak-shmees: ksh, then m, said together."},
{n:102,sa:["आधारनिलयोऽधाता पुष्पहासः प्रजागरः ।", "ऊर्ध्वगः सत्पथाचारः प्राणदः प्रणवः पणः ॥१०२॥"],pr:["Aa-dhaa-ra-ni-la-yo Dhaa-taa Push-pa-haa-saf Pra-jaa-ga-rah", "Oor-dhva-gas Sat-pa-thaa-chaa-raf Praa-na-daf Pra-na-vaf Pa-nah"],en:["Adharanilayo Adhata Pushpahasah Prajagarah", "Urdhvagah Satpathacharah Pranadah Pranavah Panah"],te:["ఆధారనిలయోఽధాతా పుష్పహాసః ప్రజాగరః |", "ఊర్ధ్వగః సత్పథాచారః ప్రాణదః ప్రణవః పణః ||"],tip:"Ni-la-yo Dhaa-taa: the a of Adhata is not said. Line 2 has three soft f sounds, each before a p."},
{n:103,sa:["प्रमाणं प्राणनिलयः प्राणभृत्प्राणजीवनः ।", "तत्त्वं तत्त्वविदेकात्मा जन्ममृत्युजरातिगः ॥१०३॥"],pr:["Pra-maa-nam Praa-na-ni-la-yaf Praa-na-bhrit Praa-na-jee-va-nah", "Tat-tvam Tat-tva-vi-de-kaat-maa Jan-ma-mrit-yu-ja-raa-ti-gah"],en:["Pramanam Prananilayah Pranabhrit Pranajivanah", "Tattvam Tattvavid Ekatma Janmamrityujaratigah"],te:["ప్రమాణం ప్రాణనిలయః ప్రాణభృత్ప్రాణజీవనః |", "తత్త్వం తత్త్వవిదేకాత్మా జన్మమృత్యుజరాతిగః ||"],tip:"Praa-na-ni-la-yaf: a soft f before Praa-na-bhrit. Jan-ma-mrit-yu: mri is a short tap."},
{n:104,sa:["भूर्भुवःस्वस्तरुस्तारः सविता प्रपितामहः ।", "यज्ञो यज्ञपतिर्यज्वा यज्ञाङ्गो यज्ञवाहनः ॥१०४॥"],pr:["Bhoor-bhu-vas-svas-ta-rus Taa-ras Sa-vi-taa Pra-pi-taa-ma-hah", "Yaj-no Yaj-na-pa-tir Yaj-vaa Yaj-naan-go Yaj-na-vaa-ha-nah"],en:["Bhurbhuvahsvastarus Tarah Savita Prapitamahah", "Yajno Yajnapatir Yajva Yajnango Yajnavahanah"],te:["భూర్భువఃస్వస్తరుస్తారః సవితా ప్రపితామహః |", "యజ్ఞో యజ్ఞపతిర్యజ్వా యజ్ఞాఙ్గో యజ్ఞవాహనః ||"],tip:"Bhoor-bhu-vas-svas: the s is said twice. jn in Yaj-no is usually chanted as gy."},
{n:105,sa:["यज्ञभृद्यज्ञकृद्यज्ञी यज्ञभुग्यज्ञसाधनः ।", "यज्ञान्तकृद्यज्ञगुह्यमन्नमन्नाद एव च ॥१०५॥"],pr:["Yaj-na-bhrid Yaj-na-krid Yaj-nee Yaj-na-bhug Yaj-na-saa-dha-nah", "Yaj-naan-ta-krid Yaj-na-guh-ya-man-na-man-naa-da E-va Cha"],en:["Yajnabhrid Yajnakrid Yajni Yajnabhug Yajnasadhanah", "Yajnantakrid Yajnaguhyam Annam Annada eva cha"],te:["యజ్ఞభృద్యజ్ఞకృద్యజ్ఞీ యజ్ఞభుగ్యజ్ఞసాధనః |", "యజ్ఞాన్తకృద్యజ్ఞగుహ్యమన్నమన్నాద ఏవ చ ||"],tip:"Yaj-na-guh-yam: a soft h before y. Man-na-man-naa-da: hold the n twice each time."},
{n:106,sa:["आत्मयोनिः स्वयञ्जातो वैखानः सामगायनः ।", "देवकीनन्दनः स्रष्टा क्षितीशः पापनाशनः ॥१०६॥"],pr:["Aat-ma-yo-nis Sva-yan-jaa-to Vai-khaa-nas Saa-ma-gaa-ya-nah", "De-va-kee-nan-da-nas Srash-taa Kshi-tee-shaf Paa-pa-naa-sha-nah"],en:["Atmayonih Svayamjato Vaikhanah Samagayanah", "Devakinandanah Srashta Kshitishah Papanashanah"],te:["ఆత్మయోనిః స్వయఞ్జాతో వైఖానః సామగాయనః |", "దేవకీనన్దనః స్రష్టా క్షితీశః పాపనాశనః ||"],tip:"Vai-khaa-nas: ai like eye, then kh with a puff of air. Srash-taa: s and r together. Kshi-tee-shaf: a soft f before Paa-pa."},
{n:107,sa:["शङ्खभृन्नन्दकी चक्री शार्ङ्गधन्वा गदाधरः ।", "रथाङ्गपाणिरक्षोभ्यः सर्वप्रहरणायुधः ॥१०७॥"],pr:["Shan-kha-bhrin Nan-da-kee Chak-ree Shaarn-ga-dhan-vaa Ga-daa-dha-rah", "Ra-thaan-ga-paa-ni-rak-sho-bhyas Sar-va-pra-ha-ra-naa-yu-dhah"],en:["Shankhabhrin Nandaki Chakri Sharngadhanva Gadadharah", "Rathangapanir Akshobhyah Sarvapraharanayudhah"],te:["శఙ్ఖభృన్నన్దకీ చక్రీ శార్ఙ్గధన్వా గదాధరః |", "రథాఙ్గపాణిరక్షోభ్యః సర్వప్రహరణాయుధః ||"],tip:"Shaarn-ga: a long aa, then rn said together before g. Traditionally this verse is chanted twice."},
{n:108,sa:["वनमाली गदी शार्ङ्गी शङ्खी चक्री च नन्दकी ।", "श्रीमान्नारायणो विष्णुर्वासुदेवोऽभिरक्षतु ॥१०८॥"],pr:["Va-na-maa-lee Ga-dee Shaarn-gee Shan-khee Chak-ree Cha Nan-da-kee", "Shree-maan-naa-raa-ya-no Vish-nur Vaa-su-de-vo Bhi-rak-sha-tu"],en:["Vanamali Gadi Sharngi Shankhi Chakri cha Nandaki", "Shriman Narayano Vishnur Vasudevo Abhirakshatu"],te:["వనమాలీ గదీ శార్ఙ్గీ శఙ్ఖీ చక్రీ చ నన్దకీ |", "శ్రీమాన్నారాయణో విష్ణుర్వాసుదేవోఽభిరక్షతు ||"],tip:"Vaa-su-de-vo Bhi-rak-sha-tu: the a of Abhi is not said. Traditionally this verse is chanted three times."}
];

var T={
why:{en:"Vishnu Sahasranamam is the thousand names of Lord Vishnu, taught by Bhishma to Yudhishthira in the Mahabharata. Each name describes a quality of the Lord. Chanting or listening to it daily is traditionally said to bring peace, strength, freedom from fear, and wellbeing.",
te:"విష్ణు సహస్రనామం మహాభారతంలో భీష్ముడు ధర్మరాజుకు ఉపదేశించిన విష్ణువు యొక్క వెయ్యి నామాలు. ప్రతి నామం భగవంతుని ఒక గుణాన్ని తెలియజేస్తుంది. ప్రతిరోజూ పఠించడం లేదా వినడం వల్ల శాంతి, బలం, భయం నుండి విముక్తి, శ్రేయస్సు కలుగుతాయని సంప్రదాయం చెబుతుంది.",
hi:"विष्णु सहस्रनाम महाभारत में भीष्म द्वारा युधिष्ठिर को बताए गए भगवान विष्णु के एक हज़ार नाम हैं। हर नाम प्रभु के एक गुण को बताता है। रोज़ पाठ करने या सुनने से शांति, बल, भय से मुक्ति और कल्याण मिलता है, ऐसी परंपरागत मान्यता है।"},
whyT:{en:"Why chant it?",te:"ఎందుకు పఠించాలి?",hi:"क्यों पाठ करें?"},
gen:{en:"The closing verses of the stotram say that whoever hears or recites it with faith meets no harm and is freed from fear, finds strength and brightness, the sick are freed from illness, the troubled from trouble, and the sorrowful from sorrow. This is a traditional belief, not medical advice.",
te:"స్తోత్రం చివరి శ్లోకాలు (ఫలశ్రుతి) ఇలా చెబుతాయి: భక్తితో వినేవారికి లేదా పఠించేవారికి అశుభం కలగదు, భయం తొలగుతుంది, బలం, తేజస్సు కలుగుతాయి; రోగులు రోగం నుండి, ఆపదలో ఉన్నవారు ఆపద నుండి విముక్తులవుతారు. ఇది సంప్రదాయ విశ్వాసం, వైద్య సలహా కాదు.",
hi:"स्तोत्र के अंतिम श्लोक (फलश्रुति) कहते हैं कि श्रद्धा से सुनने या पाठ करने वाले को अशुभ नहीं मिलता, भय दूर होता है, बल और तेज मिलता है, रोगी रोग से और संकट में पड़े संकट से मुक्त होते हैं। यह परंपरागत मान्यता है, चिकित्सा सलाह नहीं।"},
none:{en:"No special purpose is listed for this verse. The general benefits below apply.",te:"ఈ శ్లోకానికి ప్రత్యేక ప్రయోజనం ఇవ్వబడలేదు. కింది సాధారణ ఫలాలు వర్తిస్తాయి.",hi:"इस श्लोक का कोई विशेष प्रयोजन नहीं दिया गया है। नीचे दिए सामान्य फल लागू होते हैं।"},
soon:{en:"Meaning for this verse is coming soon.",te:"ఈ శ్లోకం యొక్క అర్థం త్వరలో చేర్చబడుతుంది.",hi:"इस श्लोक का अर्थ जल्द जोड़ा जाएगा।"},
draft:{en:"Draft meanings. Please check with a guru before relying on them.",te:"ఇవి ముసాయిదా అర్థాలు. ఆధారపడే ముందు గురువుతో సరిచూసుకోండి.",hi:"ये प्रारूप अर्थ हैं। भरोसा करने से पहले गुरु से जाँच लें।"}
};

1:{"w": [["विश्वम्", "Vish-vam", "Is the whole universe", "విశ్వమంతా ఆయనే", "स्वयं पूरा विश्व"], ["विष्णुः", "Vish-nuh", "Present everywhere", "అంతటా వ్యాపించినవాడు", "सब जगह व्याप्त"], ["वषट्कारः", "Va-shat-kaa-rah", "Worshipped with the sacred call in yajnas", "యజ్ఞాలలో 'వషట్' అని పూజించబడేవాడు", "यज्ञों में 'वषट्' से पूजे जाने वाले"], ["भूतभव्यभवत्प्रभुः", "Bhoo-ta-bhav-ya-bha-vat-pra-bhuh", "Lord of the past, the future and the present", "గతం, భవిష్యత్తు, వర్తమానాలకు ప్రభువు", "भूत, भविष्य और वर्तमान के स्वामी"], ["भूतकृत्", "Bhoo-ta-krit", "Creates all beings", "అన్ని జీవులను సృష్టించేవాడు", "सब प्राणियों को रचने वाले"], ["भूतभृत्", "Bhoo-ta-bhrit", "Looks after all beings", "అన్ని జీవులను పోషించేవాడు", "सब प्राणियों का पालन करने वाले"], ["भावः", "Bhaa-vah", "Is everything that exists", "ఉన్నదంతా ఆయనే", "जो कुछ है, वही हैं"], ["भूतात्मा", "Bhoo-taat-maa", "The soul inside every being", "ప్రతి జీవిలోని ఆత్మ", "हर प्राणी के भीतर की आत्मा"], ["भूतभावनः", "Bhoo-ta-bhaa-va-nah", "Helps every being grow", "ప్రతి జీవినీ వృద్ధి చేసేవాడు", "हर प्राणी को बढ़ाने वाले"]], "v": ["Vishnu is the whole universe and is present everywhere. He is worshipped in every yajna. He is Lord of the past, the future and the present. He creates all beings, looks after them and helps them grow. He is everything that exists, and the soul inside every being.", "విష్ణువే విశ్వమంతా, ఆయన అంతటా ఉన్నాడు. ప్రతి యజ్ఞంలో ఆయనను పూజిస్తారు. గతం, భవిష్యత్తు, వర్తమానాలకు ఆయనే ప్రభువు. అన్ని జీవులను సృష్టించి, పోషించి, వృద్ధి చేస్తాడు. ఉన్నదంతా ఆయనే; ప్రతి జీవిలోని ఆత్మ ఆయనే.", "विष्णु ही पूरा विश्व हैं और सब जगह व्याप्त हैं। हर यज्ञ में उनकी पूजा होती है। वे भूत, भविष्य और वर्तमान के स्वामी हैं। वे सब प्राणियों को रचते, पालते और बढ़ाते हैं। जो कुछ है, वही हैं, और हर प्राणी के भीतर की आत्मा भी वही हैं।"]},
2:{"w": [["पूतात्मा", "Poo-taat-maa", "Completely pure", "పూర్తిగా పవిత్రుడు", "पूरी तरह पवित्र"], ["परमात्मा", "Pa-ra-maat-maa", "The Supreme Soul", "పరమాత్మ", "परमात्मा"], ["मुक्तानां परमा गतिः", "Muk-taa-naam Pa-ra-maa Ga-tih", "The final goal of the freed souls", "ముక్తులు చేరే అంతిమ గమ్యం", "मुक्त आत्माओं का अंतिम लक्ष्य"], ["अव्ययः", "Av-ya-yah", "Never changes or wears away", "ఎప్పుడూ మారనివాడు, క్షీణించనివాడు", "कभी न बदलने, न घटने वाले"], ["पुरुषः", "Pu-ru-shah", "Lives in every body", "ప్రతి శరీరంలో నివసించేవాడు", "हर शरीर में बसने वाले"], ["साक्षी", "Saak-shee", "Sees everything we do", "మనం చేసేదంతా చూసేవాడు", "हमारा सब कुछ देखने वाले"], ["क्षेत्रज्ञः", "Kshet-raj-nah", "Knows the body and all it does", "శరీరాన్ని, దాని పనులన్నీ తెలిసినవాడు", "शरीर और उसके सब कर्म जानने वाले"], ["अक्षरः", "Ak-sha-rah", "Never perishes", "ఎప్పుడూ నశించనివాడు", "कभी नष्ट न होने वाले"]], "v": ["Vishnu is completely pure; He is the Supreme Soul and the final goal of freed souls. He never changes or wears away. He lives in every body and sees everything we do. He knows the body and all it does, and He never perishes.", "విష్ణువు పూర్తిగా పవిత్రుడు; పరమాత్మ, ముక్తులు చేరే అంతిమ గమ్యం. ఎప్పుడూ మారడు, క్షీణించడు. ప్రతి శరీరంలో నివసిస్తూ మనం చేసేదంతా చూస్తాడు. శరీరాన్ని, దాని పనులన్నీ తెలిసినవాడు; ఎప్పుడూ నశించడు.", "विष्णु पूरी तरह पवित्र हैं; वे परमात्मा और मुक्त आत्माओं का अंतिम लक्ष्य हैं। वे कभी नहीं बदलते, न घटते हैं। वे हर शरीर में बसते हैं और हमारा सब कुछ देखते हैं। वे शरीर और उसके सब कर्म जानते हैं, और कभी नष्ट नहीं होते।"]},
3:{"w": [["योगः", "Yo-gah", "The way to reach Him; yoga itself", "ఆయనను చేరే మార్గం; యోగమే ఆయన", "उन तक पहुँचने का मार्ग; स्वयं योग"], ["योगविदां नेता", "Yo-ga-vi-daam Ne-taa", "Leader of those who know yoga", "యోగం తెలిసినవారికి నాయకుడు", "योग जानने वालों के नेता"], ["प्रधानपुरुषेश्वरः", "Pra-dhaa-na-pu-ru-shesh-va-rah", "Lord of nature and of all souls", "ప్రకృతికి, జీవులకు ప్రభువు", "प्रकृति और सब जीवों के स्वामी"], ["नारसिंहवपुः", "Naa-ra-sim-ha-va-puh", "Took the form of Narasimha, half man, half lion", "సగం మనిషి, సగం సింహం అయిన నరసింహ రూపం దాల్చినవాడు", "आधे मनुष्य, आधे सिंह नरसिंह रूप वाले"], ["श्रीमान्", "Shree-maan", "Always with Lakshmi; full of glory", "ఎప్పుడూ లక్ష్మితో ఉండేవాడు; శోభ కలవాడు", "सदा लक्ष्मी सहित; शोभा से भरे"], ["केशवः", "Ke-sha-vah", "Has beautiful hair", "అందమైన కేశాలు కలవాడు", "सुंदर केशों वाले"], ["पुरुषोत्तमः", "Pu-ru-shot-ta-mah", "The highest of all beings", "అందరిలో ఉత్తముడు", "सबसे उत्तम पुरुष"]], "v": ["Vishnu is yoga itself, the way to reach Him, and the leader of those who know yoga. He is Lord of nature and of all souls. He took the form of Narasimha to save His devotee. He is always with Lakshmi, has beautiful hair, and is the highest of all beings.", "విష్ణువే యోగం, ఆయనను చేరే మార్గం; యోగం తెలిసినవారికి నాయకుడు. ప్రకృతికి, జీవులకు ప్రభువు. భక్తుని కాపాడటానికి నరసింహ రూపం దాల్చాడు. ఎప్పుడూ లక్ష్మితో ఉంటాడు, అందమైన కేశాలు కలవాడు, అందరిలో ఉత్తముడు.", "विष्णु स्वयं योग हैं, उन तक पहुँचने का मार्ग, और योग जानने वालों के नेता हैं। वे प्रकृति और सब जीवों के स्वामी हैं। भक्त को बचाने के लिए उन्होंने नरसिंह रूप धरा। वे सदा लक्ष्मी सहित हैं, सुंदर केशों वाले, और सबसे उत्तम पुरुष हैं।"]},
4:{"w": [["सर्वः", "Sar-vah", "Is everything", "అన్నీ ఆయనే", "सब कुछ वही"], ["शर्वः", "Shar-vah", "Takes everything back at the end", "చివరికి అన్నిటినీ తనలో చేర్చుకునేవాడు", "अंत में सबको समेटने वाले"], ["शिवः", "Shi-vah", "Pure and auspicious", "పవిత్రుడు, మంగళకరుడు", "पवित्र और मंगलमय"], ["स्थाणुः", "Sthaa-nuh", "Steady and unmoving", "స్థిరంగా ఉండేవాడు", "स्थिर और अचल"], ["भूतादिः", "Bhoo-taa-dih", "The source of all beings", "అన్ని జీవులకు మూలం", "सब प्राणियों का मूल"], ["निधिरव्ययः", "Ni-dhi-rav-ya-yah", "A treasure that never runs out", "ఎప్పటికీ తరగని నిధి", "कभी खत्म न होने वाला खज़ाना"], ["सम्भवः", "Sam-bha-vah", "Comes down to us by His own wish", "తన ఇష్టంతో మన దగ్గరకు వచ్చేవాడు", "अपनी इच्छा से हमारे बीच आने वाले"], ["भावनः", "Bhaa-va-nah", "Gives us what we need", "మనకు కావలసినది ఇచ్చేవాడు", "हमें ज़रूरत की चीज़ें देने वाले"], ["भर्ता", "Bhar-taa", "Supports the whole world", "లోకమంతటినీ భరించేవాడు", "पूरे संसार को संभालने वाले"], ["प्रभवः", "Pra-bha-vah", "Where everything begins", "అన్నీ పుట్టే చోటు", "जहाँ से सब शुरू होता है"], ["प्रभुः", "Pra-bhuh", "The all-powerful Lord", "సర్వ శక్తిమంతుడైన ప్రభువు", "सर्वशक्तिमान प्रभु"], ["ईश्वरः", "Eesh-va-rah", "Rules over all", "అందరినీ పాలించేవాడు", "सब पर शासन करने वाले"]], "v": ["Vishnu is everything, and at the end He takes everything back into Himself. He is pure and auspicious, and steady like a rock. He is the source of all beings and a treasure that never runs out. He comes down to us by His own wish and gives us what we need. He supports the whole world; everything begins in Him. He is the all-powerful Lord who rules over all.", "విష్ణువే అన్నీ; చివరికి అన్నిటినీ తనలో చేర్చుకుంటాడు. పవిత్రుడు, మంగళకరుడు, బండలా స్థిరమైనవాడు. అన్ని జీవులకు మూలం, ఎప్పటికీ తరగని నిధి. తన ఇష్టంతో మన దగ్గరకు వచ్చి మనకు కావలసినది ఇస్తాడు. లోకమంతటినీ భరిస్తాడు; అన్నీ ఆయనలోనే మొదలవుతాయి. అందరినీ పాలించే సర్వ శక్తిమంతుడైన ప్రభువు.", "विष्णु ही सब कुछ हैं, और अंत में सबको अपने में समेट लेते हैं। वे पवित्र और मंगलमय हैं, चट्टान की तरह स्थिर। वे सब प्राणियों का मूल और कभी खत्म न होने वाला खज़ाना हैं। वे अपनी इच्छा से हमारे बीच आते हैं और हमें ज़रूरत की चीज़ें देते हैं। वे पूरे संसार को संभालते हैं; सब कुछ उन्हीं से शुरू होता है। वे सब पर शासन करने वाले सर्वशक्तिमान प्रभु हैं।"]},
5:{"w": [["स्वयम्भूः", "Sva-yam-bhooh", "Exists by Himself; no one made Him", "తనంతట తానే ఉన్నవాడు; ఎవరూ సృష్టించలేదు", "स्वयं प्रकट; किसी ने नहीं बनाया"], ["शम्भुः", "Sham-bhuh", "Brings happiness", "సుఖాన్ని కలిగించేవాడు", "सुख देने वाले"], ["आदित्यः", "Aa-dit-yah", "Shines like the sun", "సూర్యుడిలా ప్రకాశించేవాడు", "सूर्य जैसे चमकने वाले"], ["पुष्कराक्षः", "Push-ka-raak-shah", "Has eyes like lotus petals", "తామర రేకుల వంటి కళ్ళు కలవాడు", "कमल की पंखुड़ियों जैसी आँखों वाले"], ["महास्वनः", "Ma-haa-sva-nah", "His voice is the Vedas", "వేదాలే ఆయన గొంతు", "वेद जिनकी वाणी हैं"], ["अनादिनिधनः", "A-naa-di-ni-dha-nah", "Has no beginning and no end", "ఆది, అంతం లేనివాడు", "जिनका न आदि है, न अंत"], ["धाता", "Dhaa-taa", "Holds up the world", "లోకాన్ని నిలిపేవాడు", "संसार को धारण करने वाले"], ["विधाता", "Vi-dhaa-taa", "Gives each one the fruit of their actions", "ప్రతి ఒక్కరికీ వారి కర్మ ఫలం ఇచ్చేవాడు", "हर किसी को कर्मों का फल देने वाले"], ["धातुरुत्तमः", "Dhaa-tu-rut-ta-mah", "Greater even than Brahma the creator", "సృష్టికర్త బ్రహ్మ కంటే కూడా గొప్పవాడు", "सृष्टिकर्ता ब्रह्मा से भी श्रेष्ठ"]], "v": ["No one made Vishnu; He exists by Himself. He brings happiness and shines like the sun. His eyes are like lotus petals, and His voice is the Vedas. He has no beginning and no end. He holds up the world and gives each one the fruit of their actions. He is greater even than Brahma the creator.", "విష్ణువును ఎవరూ సృష్టించలేదు; తనంతట తానే ఉన్నాడు. సుఖాన్ని ఇస్తాడు, సూర్యుడిలా ప్రకాశిస్తాడు. ఆయన కళ్ళు తామర రేకుల వంటివి, వేదాలే ఆయన గొంతు. ఆది, అంతం లేనివాడు. లోకాన్ని నిలుపుతాడు, ప్రతి ఒక్కరికీ వారి కర్మ ఫలం ఇస్తాడు. సృష్టికర్త బ్రహ్మ కంటే కూడా గొప్పవాడు.", "विष्णु को किसी ने नहीं बनाया; वे स्वयं प्रकट हैं। वे सुख देते हैं और सूर्य जैसे चमकते हैं। उनकी आँखें कमल की पंखुड़ियों जैसी हैं, और वेद उनकी वाणी हैं। उनका न आदि है, न अंत। वे संसार को धारण करते हैं और हर किसी को कर्मों का फल देते हैं। वे सृष्टिकर्ता ब्रह्मा से भी श्रेष्ठ हैं।"]},
6:{"w": [["अप्रमेयः", "Ap-ra-me-yah", "Cannot be measured", "కొలవలేనివాడు", "जिन्हें मापा न जा सके"], ["हृषीकेशः", "Hri-shee-ke-shah", "Lord of our senses", "మన ఇంద్రియాలకు ప్రభువు", "हमारी इंद्रियों के स्वामी"], ["पद्मनाभः", "Pad-ma-naa-bhah", "A lotus grows from His navel", "నాభి నుండి తామర పుట్టినవాడు", "जिनकी नाभि से कमल निकला"], ["अमरप्रभुः", "A-ma-ra-pra-bhuh", "Lord of the gods", "దేవతలకు ప్రభువు", "देवताओं के स्वामी"], ["विश्वकर्मा", "Vish-va-kar-maa", "Made the whole world", "లోకమంతా సృష్టించినవాడు", "पूरे संसार को बनाने वाले"], ["मनुः", "Ma-nuh", "Thinks for the good of all", "అందరి మేలు కోసం ఆలోచించేవాడు", "सबके भले का विचार करने वाले"], ["त्वष्टा", "Tvash-taa", "Shapes all things", "అన్నిటికీ రూపం ఇచ్చేవాడు", "सब चीज़ों को आकार देने वाले"], ["स्थविष्ठः", "Stha-vish-thah", "Vast beyond measure", "అతి విశాలమైనవాడు", "अत्यंत विशाल"], ["स्थविरो ध्रुवः", "Stha-vi-ro Dhru-vah", "Ancient and unchanging", "ప్రాచీనుడు, ఎప్పుడూ మారనివాడు", "प्राचीन और अटल"]], "v": ["Vishnu cannot be measured. He is Lord of our senses, a lotus grows from His navel, and He is Lord of the gods. He made the whole world, thinks for the good of all, and gives everything its shape. He is vast beyond measure, ancient and unchanging.", "విష్ణువును కొలవలేము. మన ఇంద్రియాలకు ప్రభువు, ఆయన నాభి నుండి తామర పుట్టింది, దేవతలకు ప్రభువు. లోకమంతా సృష్టించాడు, అందరి మేలు కోసం ఆలోచిస్తాడు, అన్నిటికీ రూపం ఇస్తాడు. అతి విశాలమైనవాడు, ప్రాచీనుడు, ఎప్పుడూ మారనివాడు.", "विष्णु को मापा नहीं जा सकता। वे हमारी इंद्रियों के स्वामी हैं, उनकी नाभि से कमल निकला, और वे देवताओं के स्वामी हैं। उन्होंने पूरा संसार बनाया, सबके भले का विचार करते हैं, और हर चीज़ को आकार देते हैं। वे अत्यंत विशाल, प्राचीन और अटल हैं।"]},
7:{"w": [["अग्राह्यः", "Ag-raah-yah", "Cannot be grasped by the senses", "ఇంద్రియాలకు అందనివాడు", "इंद्रियों की पकड़ से परे"], ["शाश्वतः", "Shaash-va-tah", "Eternal", "శాశ్వతుడు", "शाश्वत"], ["कृष्णः", "Krish-nah", "Dark and beautiful; full of bliss", "నల్లని అందమైనవాడు; ఆనందమయుడు", "साँवले और सुंदर; आनंदमय"], ["लोहिताक्षः", "Lo-hi-taak-shah", "Has reddish eyes", "ఎర్రని కళ్ళు కలవాడు", "लाल आभा वाली आँखों वाले"], ["प्रतर्दनः", "Pra-tar-da-nah", "Destroys evil", "చెడును నాశనం చేసేవాడు", "बुराई का नाश करने वाले"], ["प्रभूतः", "Pra-bhoo-tah", "Full of every good quality", "అన్ని మంచి గుణాలతో నిండినవాడు", "हर अच्छे गुण से भरे"], ["त्रिककुब्धाम", "Tri-ka-kub-dhaa-ma", "The support of all directions", "అన్ని దిక్కులకు ఆధారం", "सभी दिशाओं के आधार"], ["पवित्रम्", "Pa-vit-ram", "Makes everything holy", "అన్నిటినీ పవిత్రం చేసేవాడు", "सबको पवित्र करने वाले"], ["मङ्गलं परम्", "Man-ga-lam Pa-ram", "The highest blessing", "అత్యున్నత మంగళం", "सबसे बड़ा मंगल"]], "v": ["Vishnu cannot be grasped by our senses; He is eternal. He is Krishna, dark and beautiful and full of bliss, with reddish eyes, and He destroys evil. He is full of every good quality and supports all directions. He makes everything holy, and He is the highest blessing.", "విష్ణువు మన ఇంద్రియాలకు అందడు; శాశ్వతుడు. నల్లని అందమైన, ఆనందమయుడైన కృష్ణుడు ఆయనే; ఎర్రని కళ్ళు కలవాడు, చెడును నాశనం చేస్తాడు. అన్ని మంచి గుణాలతో నిండినవాడు, అన్ని దిక్కులకు ఆధారం. అన్నిటినీ పవిత్రం చేస్తాడు; అత్యున్నత మంగళం ఆయనే.", "विष्णु हमारी इंद्रियों की पकड़ से परे हैं; वे शाश्वत हैं। वे साँवले, सुंदर, आनंदमय कृष्ण हैं, लाल आभा वाली आँखों वाले, और बुराई का नाश करते हैं। वे हर अच्छे गुण से भरे हैं और सभी दिशाओं के आधार हैं। वे सबको पवित्र करते हैं, और सबसे बड़ा मंगल वही हैं।"]},
8:{"w": [["ईशानः", "Ee-shaa-nah", "Rules over all", "అందరినీ పాలించేవాడు", "सब पर शासन करने वाले"], ["प्राणदः", "Praa-na-dah", "Gives life", "ప్రాణం ఇచ్చేవాడు", "प्राण देने वाले"], ["प्राणः", "Praa-nah", "Is life itself", "ప్రాణమే ఆయన", "स्वयं प्राण"], ["ज्येष्ठः", "Jyesh-thah", "The eldest of all", "అందరికంటే పెద్దవాడు", "सबसे बड़े"], ["श्रेष्ठः", "Shresh-thah", "The best of all", "అందరికంటే శ్రేష్ఠుడు", "सबसे श्रेष्ठ"], ["प्रजापतिः", "Pra-jaa-pa-tih", "Lord of all beings", "అన్ని జీవులకు ప్రభువు", "सब प्राणियों के स्वामी"], ["हिरण्यगर्भः", "Hi-ran-ya-gar-bhah", "Lives in the golden egg of creation", "బంగారు అండంలో ఉన్నవాడు", "सृष्टि के स्वर्ण अंड में बसने वाले"], ["भूगर्भः", "Bhoo-gar-bhah", "Holds the earth within Him", "భూమిని తనలో ధరించేవాడు", "पृथ्वी को अपने भीतर धारण करने वाले"], ["माधवः", "Maa-dha-vah", "Husband of Lakshmi", "లక్ష్మీదేవి భర్త", "लक्ष्मी के पति"], ["मधुसूदनः", "Ma-dhu-soo-da-nah", "Defeated the demon Madhu", "మధు అనే రాక్షసుని సంహరించినవాడు", "मधु राक्षस का वध करने वाले"]], "v": ["Vishnu rules over all. He gives life and is life itself. He is the eldest and the best of all, the Lord of all beings. He lives in the golden egg of creation and holds the earth within Him. He is Madhava, husband of Lakshmi, and He defeated the demon Madhu.", "విష్ణువు అందరినీ పాలిస్తాడు. ప్రాణం ఇస్తాడు, ప్రాణమే ఆయన. అందరికంటే పెద్దవాడు, శ్రేష్ఠుడు, అన్ని జీవులకు ప్రభువు. సృష్టి బంగారు అండంలో ఉన్నాడు, భూమిని తనలో ధరిస్తాడు. లక్ష్మీదేవి భర్త మాధవుడు; మధు రాక్షసుని సంహరించాడు.", "विष्णु सब पर शासन करते हैं। वे प्राण देते हैं और स्वयं प्राण हैं। वे सबसे बड़े और सबसे श्रेष्ठ, सब प्राणियों के स्वामी हैं। वे सृष्टि के स्वर्ण अंड में बसते हैं और पृथ्वी को अपने भीतर धारण करते हैं। वे लक्ष्मी के पति माधव हैं, और उन्होंने मधु राक्षस का वध किया।"]},
9:{"w": [["ईश्वरः", "Eesh-va-rah", "All-powerful", "సర్వ శక్తిమంతుడు", "सर्वशक्तिमान"], ["विक्रमी", "Vik-ra-mee", "Full of courage", "ధైర్యం నిండినవాడు", "साहस से भरे"], ["धन्वी", "Dhan-vee", "Holds the bow", "విల్లు ధరించినవాడు", "धनुष धारण करने वाले"], ["मेधावी", "Me-dhaa-vee", "Wise and clever", "తెలివైనవాడు, జ్ఞాని", "बुद्धिमान"], ["विक्रमः", "Vik-ra-mah", "Measured the worlds in great strides (as Vamana)", "వామనుడిగా లోకాలను అడుగులతో కొలిచినవాడు", "वामन रूप में लोकों को पगों से नापने वाले"], ["क्रमः", "Kra-mah", "Keeps order in everything", "అన్నిటిలో క్రమం ఉంచేవాడు", "हर चीज़ में व्यवस्था रखने वाले"], ["अनुत्तमः", "A-nut-ta-mah", "No one is greater than Him", "ఆయనకంటే గొప్పవారు లేరు", "जिनसे बड़ा कोई नहीं"], ["दुराधर्षः", "Du-raa-dhar-shah", "No one can defeat Him", "ఎవరూ ఓడించలేనివాడు", "जिन्हें कोई हरा न सके"], ["कृतज्ञः", "Kri-taj-nah", "Remembers even small acts of love", "చిన్న సేవను కూడా గుర్తుంచుకునేవాడు", "छोटी सी सेवा भी याद रखने वाले"], ["कृतिः", "Kri-tih", "Is every good action", "ప్రతి మంచి పనీ ఆయనే", "हर अच्छा कर्म वही"], ["आत्मवान्", "Aat-ma-vaan", "Rests in Himself", "తనలో తానే నిలిచినవాడు", "अपने आप में स्थित"]], "v": ["Vishnu is all-powerful, full of courage, holds the bow, and is wise. As Vamana He measured the worlds in great strides, and He keeps order in everything. No one is greater than Him, and no one can defeat Him. He remembers even our small acts of love. He is every good action, and He rests in Himself.", "విష్ణువు సర్వ శక్తిమంతుడు, ధైర్యం నిండినవాడు, విల్లు ధరిస్తాడు, జ్ఞాని. వామనుడిగా లోకాలను అడుగులతో కొలిచాడు, అన్నిటిలో క్రమం ఉంచుతాడు. ఆయనకంటే గొప్పవారు లేరు, ఆయనను ఎవరూ ఓడించలేరు. మనం చేసే చిన్న సేవను కూడా గుర్తుంచుకుంటాడు. ప్రతి మంచి పనీ ఆయనే; తనలో తానే నిలిచినవాడు.", "विष्णु सर्वशक्तिमान, साहस से भरे, धनुषधारी और बुद्धिमान हैं। वामन रूप में उन्होंने लोकों को पगों से नापा, और वे हर चीज़ में व्यवस्था रखते हैं। उनसे बड़ा कोई नहीं, और उन्हें कोई हरा नहीं सकता। वे हमारी छोटी सी सेवा भी याद रखते हैं। हर अच्छा कर्म वही हैं, और वे अपने आप में स्थित हैं।"]},
10:{"w": [["सुरेशः", "Su-re-shah", "Lord of the gods", "దేవతలకు ప్రభువు", "देवताओं के स्वामी"], ["शरणम्", "Sha-ra-nam", "Our refuge", "మనకు శరణం", "हमारी शरण"], ["शर्म", "Shar-ma", "Pure joy", "స్వచ్ఛమైన ఆనందం", "शुद्ध आनंद"], ["विश्वरेताः", "Vish-va-re-taah", "The seed of the universe", "విశ్వానికి బీజం", "विश्व का बीज"], ["प्रजाभवः", "Pra-jaa-bha-vah", "All beings come from Him", "అన్ని జీవులు ఆయన నుండే పుట్టాయి", "सब प्राणी जिनसे उत्पन्न हुए"], ["अहः", "A-hah", "Bright like the day", "పగలులా ప్రకాశించేవాడు", "दिन की तरह उज्ज्वल"], ["संवत्सरः", "Sam-vat-sa-rah", "Is time, the year", "కాలమే, సంవత్సరమే ఆయన", "स्वयं काल, वर्ष"], ["व्यालः", "Vyaa-lah", "Cannot be caught, like a great serpent", "పెద్ద సర్పంలా పట్టుకోలేనివాడు", "बड़े सर्प की तरह पकड़ से बाहर"], ["प्रत्ययः", "Prat-ya-yah", "Is knowledge and trust", "జ్ఞానం, నమ్మకం ఆయనే", "स्वयं ज्ञान और विश्वास"], ["सर्वदर्शनः", "Sar-va-dar-sha-nah", "Sees everything", "అన్నీ చూసేవాడు", "सब कुछ देखने वाले"]], "v": ["Vishnu is Lord of the gods, our refuge and our joy. He is the seed of the universe, and all beings come from Him. He is bright like the day and is time itself. Like a great serpent, no one can catch hold of Him. He is knowledge and trust, and He sees everything.", "విష్ణువు దేవతలకు ప్రభువు, మనకు శరణం, ఆనందం. విశ్వానికి బీజం; అన్ని జీవులు ఆయన నుండే పుట్టాయి. పగలులా ప్రకాశిస్తాడు, కాలమే ఆయన. పెద్ద సర్పంలా ఎవరూ ఆయనను పట్టుకోలేరు. జ్ఞానం, నమ్మకం ఆయనే; అన్నీ చూస్తాడు.", "विष्णु देवताओं के स्वामी, हमारी शरण और हमारा आनंद हैं। वे विश्व का बीज हैं, और सब प्राणी उन्हीं से उत्पन्न हुए। वे दिन की तरह उज्ज्वल हैं और स्वयं काल हैं। बड़े सर्प की तरह उन्हें कोई पकड़ नहीं सकता। वे ज्ञान और विश्वास हैं, और सब कुछ देखते हैं।"]},
