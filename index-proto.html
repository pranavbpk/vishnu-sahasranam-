54:{"w": [["सोमपः", "So-ma-pah", "Receives the soma offered in yajnas", "యజ్ఞాలలో సోమాన్ని స్వీకరించేవాడు", "यज्ञों में सोम ग्रहण करने वाले"], ["अमृतपः", "A-mri-ta-pah", "Enjoys the nectar of His own bliss", "తన ఆనంద అమృతాన్ని ఆస్వాదించేవాడు", "अपने आनंद रूपी अमृत का पान करने वाले"], ["सोमः", "So-mah", "Cool and gentle like the moon", "చంద్రుడిలా చల్లనివాడు, సౌమ్యుడు", "चंद्रमा जैसे शीतल और सौम्य"], ["पुरुजित्", "Pu-ru-jit", "Wins over many", "అనేకులను జయించేవాడు", "अनेकों को जीतने वाले"], ["पुरुसत्तमः", "Pu-ru-sat-ta-mah", "The best of the great", "గొప్పవారిలో ఉత్తముడు", "महानों में श्रेष्ठ"], ["विनयः", "Vi-na-yah", "Disciplines the wicked", "దుష్టులను శిక్షించేవాడు", "दुष्टों को दंड देने वाले"], ["जयः", "Ja-yah", "Victorious", "విజయుడు", "विजयी"], ["सत्यसन्धः", "Sat-ya-san-dhah", "Always keeps His word", "ఎప్పుడూ మాట నిలబెట్టుకునేవాడు", "सदा वचन निभाने वाले"], ["दाशार्हः", "Daa-shaar-hah", "Born in the Dasharha family (as Krishna)", "దాశార్హ వంశంలో పుట్టినవాడు (కృష్ణుడిగా)", "दाशार्ह वंश में जन्मे (कृष्ण रूप में)"], ["सात्वतां पतिः", "Saat-va-taam Pa-tih", "Lord of His devotees", "భక్తులకు ప్రభువు", "भक्तों के स्वामी"]], "v": ["Vishnu receives the soma offered in yajnas and enjoys the nectar of His own bliss. He is cool and gentle like the moon. He wins over many and is the best of the great. He disciplines the wicked and is always victorious. He always keeps His word. As Krishna He was born in the Dasharha family, and He is Lord of His devotees.", "విష్ణువు యజ్ఞాలలో సోమాన్ని స్వీకరిస్తాడు, తన ఆనంద అమృతాన్ని ఆస్వాదిస్తాడు. చంద్రుడిలా చల్లనివాడు, సౌమ్యుడు. అనేకులను జయిస్తాడు, గొప్పవారిలో ఉత్తముడు. దుష్టులను శిక్షిస్తాడు, ఎప్పుడూ విజయుడు. ఎప్పుడూ మాట నిలబెట్టుకుంటాడు. కృష్ణుడిగా దాశార్హ వంశంలో పుట్టాడు; భక్తులకు ప్రభువు.", "विष्णु यज्ञों में सोम ग्रहण करते हैं और अपने आनंद रूपी अमृत का पान करते हैं। वे चंद्रमा जैसे शीतल और सौम्य हैं। वे अनेकों को जीतते हैं और महानों में श्रेष्ठ हैं। वे दुष्टों को दंड देते हैं और सदा विजयी हैं। वे सदा अपना वचन निभाते हैं। कृष्ण रूप में वे दाशार्ह वंश में जन्मे, और वे भक्तों के स्वामी हैं।"]},
55:{"w": [["जीवः", "Jee-vah", "Gives life to all beings", "అన్ని జీవులకు జీవం ఇచ్చేవాడు", "सब प्राणियों को जीवन देने वाले"], ["विनयिता", "Vi-na-yi-taa", "Teaches good conduct", "మంచి నడవడిక నేర్పేవాడు", "अच्छा आचरण सिखाने वाले"], ["साक्षी", "Saak-shee", "Sees everything", "అన్నీ చూసేవాడు", "सब कुछ देखने वाले"], ["मुकुन्दः", "Mu-kun-dah", "Gives freedom (moksha)", "మోక్షం ఇచ్చేవాడు", "मोक्ष देने वाले"], ["अमितविक्रमः", "A-mi-ta-vik-ra-mah", "His strides and strength are endless", "అపారమైన అడుగులు, పరాక్రమం కలవాడు", "अनंत पग और पराक्रम वाले"], ["अम्भोनिधिः", "Am-bho-ni-dhih", "Like the ocean", "సముద్రం వంటివాడు", "सागर जैसे"], ["अनन्तात्मा", "A-nan-taat-maa", "Endless; is Adishesha too", "అనంతుడు; ఆదిశేషుడు కూడా ఆయనే", "अनंत; आदिशेष भी वही"], ["महोदधिशयः", "Ma-ho-da-dhi-sha-yah", "Rests on the great ocean", "మహా సముద్రంపై శయనించేవాడు", "महासागर पर शयन करने वाले"], ["अन्तकः", "An-ta-kah", "Brings everything to its end", "అన్నిటికీ అంతం తెచ్చేవాడు", "सबका अंत करने वाले"]], "v": ["Vishnu gives life to all beings and teaches good conduct. He sees everything. He is Mukunda, who gives freedom, and His strides and strength are endless. He is like the ocean. He is endless, rests on the great ocean, and brings everything to its end.", "విష్ణువు అన్ని జీవులకు జీవం ఇస్తాడు, మంచి నడవడిక నేర్పుతాడు. అన్నీ చూస్తాడు. మోక్షం ఇచ్చే ముకుందుడు ఆయనే; ఆయన అడుగులు, పరాక్రమం అపారం. సముద్రం వంటివాడు. అనంతుడు, మహా సముద్రంపై శయనిస్తాడు, అన్నిటికీ అంతం తెస్తాడు.", "विष्णु सब प्राणियों को जीवन देते हैं और अच्छा आचरण सिखाते हैं। वे सब कुछ देखते हैं। वे मोक्ष देने वाले मुकुंद हैं, और उनके पग और पराक्रम अनंत हैं। वे सागर जैसे हैं। वे अनंत हैं, महासागर पर शयन करते हैं, और सबका अंत करते हैं।"]},
56:{"w": [["अजः", "A-jah", "Never born", "జన్మ లేనివాడు", "अजन्मा"], ["महार्हः", "Ma-haar-hah", "Most worthy of worship", "అత్యంత పూజనీయుడు", "सबसे अधिक पूजनीय"], ["स्वाभाव्यः", "Svaa-bhaav-yah", "Lord by His very nature", "స్వభావంతోనే ప్రభువు", "स्वभाव से ही स्वामी"], ["जितामित्रः", "Ji-taa-mit-rah", "Has conquered all enemies", "శత్రువులందరినీ జయించినవాడు", "सब शत्रुओं को जीतने वाले"], ["प्रमोदनः", "Pra-mo-da-nah", "Fills us with joy", "మనల్ని ఆనందంతో నింపేవాడు", "हमें आनंद से भरने वाले"], ["आनन्दः", "Aa-nan-dah", "Is bliss itself", "ఆనందమే ఆయన", "स्वयं आनंद"], ["नन्दनः", "Nan-da-nah", "Makes others happy", "ఇతరులను సంతోషపెట్టేవాడు", "दूसरों को प्रसन्न करने वाले"], ["नन्दः", "Nan-dah", "Full of every joy", "అన్ని ఆనందాలతో నిండినవాడు", "हर आनंद से भरे"], ["सत्यधर्मा", "Sat-ya-dhar-maa", "His ways are true", "ఆయన గుణాలు సత్యమైనవి", "जिनके गुण सच्चे हैं"], ["त्रिविक्रमः", "Tri-vik-ra-mah", "Covered the three worlds in three steps", "మూడు అడుగులలో మూడు లోకాలను కొలిచినవాడు", "तीन पगों में तीनों लोक नापने वाले"]], "v": ["Vishnu was never born and is most worthy of worship. He is Lord by His very nature and has conquered all enemies. He fills us with joy; He is bliss itself, makes others happy, and is full of every joy. His ways are true. As Trivikrama He covered the three worlds in three steps.", "విష్ణువుకు జన్మ లేదు; అత్యంత పూజనీయుడు. స్వభావంతోనే ప్రభువు, శత్రువులందరినీ జయించాడు. మనల్ని ఆనందంతో నింపుతాడు; ఆనందమే ఆయన, ఇతరులను సంతోషపెడతాడు, అన్ని ఆనందాలతో నిండినవాడు. ఆయన గుణాలు సత్యమైనవి. త్రివిక్రముడిగా మూడు అడుగులలో మూడు లోకాలను కొలిచాడు.", "विष्णु अजन्मा हैं और सबसे अधिक पूजनीय हैं। वे स्वभाव से ही स्वामी हैं और उन्होंने सब शत्रुओं को जीत लिया है। वे हमें आनंद से भरते हैं; वे स्वयं आनंद हैं, दूसरों को प्रसन्न करते हैं, और हर आनंद से भरे हैं। उनके गुण सच्चे हैं। त्रिविक्रम रूप में उन्होंने तीन पगों में तीनों लोक नाप लिए।"]},
57:{"w": [["महर्षिः कपिलाचार्यः", "Ma-har-shih Ka-pi-laa-chaar-yah", "The great sage and teacher Kapila", "గొప్ప ఋషి, ఆచార్యుడైన కపిలుడు", "महान ऋषि और आचार्य कपिल"], ["कृतज्ञः", "Kri-taj-nah", "Knows and remembers all we do", "మనం చేసేదంతా తెలిసి గుర్తుంచుకునేవాడు", "हमारा किया सब जानने और याद रखने वाले"], ["मेदिनीपतिः", "Me-di-nee-pa-tih", "Lord of the earth", "భూమికి ప్రభువు", "पृथ्वी के स्वामी"], ["त्रिपदः", "Tri-pa-dah", "Took three steps (as Vamana)", "మూడు అడుగులు వేసినవాడు (వామనుడిగా)", "तीन पग रखने वाले (वामन रूप में)"], ["त्रिदशाध्यक्षः", "Tri-da-shaa-dhyak-shah", "Lord of the gods", "దేవతలకు అధిపతి", "देवताओं के स्वामी"], ["महाशृङ्गः", "Ma-haa-shrin-gah", "Had a great horn (as the fish Matsya)", "గొప్ప కొమ్ము కలవాడు (మత్స్యుడిగా)", "बड़े सींग वाले (मत्स्य रूप में)"], ["कृतान्तकृत्", "Kri-taan-ta-krit", "Ends even death", "మృత్యువుకు కూడా అంతం చేసేవాడు", "मृत्यु का भी अंत करने वाले"]], "v": ["Vishnu came as Kapila, the great sage and teacher. He knows and remembers all we do, and He is Lord of the earth. As Vamana He took three steps; He is Lord of the gods. As the fish Matsya He had a great horn, and He ends even death.", "విష్ణువు గొప్ప ఋషి, ఆచార్యుడైన కపిలుడిగా వచ్చాడు. మనం చేసేదంతా తెలిసి గుర్తుంచుకుంటాడు; భూమికి ప్రభువు. వామనుడిగా మూడు అడుగులు వేశాడు; దేవతలకు అధిపతి. మత్స్యుడిగా గొప్ప కొమ్ము కలవాడు; మృత్యువుకు కూడా అంతం చేస్తాడు.", "विष्णु महान ऋषि और आचार्य कपिल बनकर आए। वे हमारा किया सब जानते और याद रखते हैं, और पृथ्वी के स्वामी हैं। वामन रूप में उन्होंने तीन पग रखे; वे देवताओं के स्वामी हैं। मत्स्य रूप में उनका बड़ा सींग था, और वे मृत्यु का भी अंत करते हैं।"]},
58:{"w": [["महावराहः", "Ma-haa-va-raa-hah", "The great Boar who lifted the earth", "భూమిని ఎత్తిన మహా వరాహుడు", "पृथ्वी उठाने वाले महावराह"], ["गोविन्दः", "Go-vin-dah", "Found the earth and brought it back", "భూమిని కనుగొని తిరిగి తెచ్చినవాడు", "पृथ्वी को खोजकर वापस लाने वाले"], ["सुषेणः", "Su-she-nah", "Has a fine army", "మంచి సైన్యం కలవాడు", "उत्तम सेना वाले"], ["कनकाङ्गदी", "Ka-na-kaan-ga-dee", "Wears golden armlets", "బంగారు భుజకీర్తులు ధరించినవాడు", "सोने के बाजूबंद पहनने वाले"], ["गुह्यः", "Guh-yah", "Secret, known only by inner wisdom", "రహస్యమైనవాడు, అంతర జ్ఞానంతో తెలిసేవాడు", "गुप्त, केवल अंतर्ज्ञान से जाने जाने वाले"], ["गभीरः", "Ga-bhee-rah", "Deep", "లోతైనవాడు", "गहरे"], ["गहनः", "Ga-ha-nah", "Hard to enter", "ప్రవేశించడం కష్టమైనవాడు", "जिनमें प्रवेश कठिन है"], ["गुप्तः", "Gup-tah", "Hidden", "దాగి ఉన్నవాడు", "छिपे हुए"], ["चक्रगदाधरः", "Chak-ra-ga-daa-dha-rah", "Holds the discus and the mace", "చక్రం, గద ధరించినవాడు", "चक्र और गदा धारण करने वाले"]], "v": ["Vishnu is the great Boar who lifted the earth; as Govinda He found it and brought it back. He has a fine army and wears golden armlets. He is secret, deep, hard to enter and hidden, known only by inner wisdom. He holds the discus and the mace.", "విష్ణువు భూమిని ఎత్తిన మహా వరాహుడు; గోవిందుడిగా భూమిని కనుగొని తిరిగి తెచ్చాడు. మంచి సైన్యం కలవాడు, బంగారు భుజకీర్తులు ధరిస్తాడు. రహస్యమైనవాడు, లోతైనవాడు, ప్రవేశించడం కష్టమైనవాడు, దాగి ఉన్నవాడు; అంతర జ్ఞానంతోనే తెలుస్తాడు. చక్రం, గద ధరిస్తాడు.", "विष्णु पृथ्वी उठाने वाले महावराह हैं; गोविंद रूप में उन्होंने पृथ्वी को खोजकर वापस लाया। उनकी सेना उत्तम है और वे सोने के बाजूबंद पहनते हैं। वे गुप्त, गहरे, कठिन प्रवेश वाले और छिपे हुए हैं, केवल अंतर्ज्ञान से जाने जाते हैं। वे चक्र और गदा धारण करते हैं।"]},
59:{"w": [["वेधाः", "Ve-dhaah", "The creator", "సృష్టికర్త", "सृष्टिकर्ता"], ["स्वाङ्गः", "Svaan-gah", "Does all His work Himself", "తన పనులన్నీ తానే చేసేవాడు", "अपने सब कार्य स्वयं करने वाले"], ["अजितः", "A-ji-tah", "Never conquered", "ఎప్పుడూ జయించబడనివాడు", "कभी न जीते जाने वाले"], ["कृष्णः", "Krish-nah", "Dark and beautiful; Krishna", "నల్లని అందమైనవాడు; కృష్ణుడు", "साँवले और सुंदर; कृष्ण"], ["दृढः", "Dri-dhah", "Firm and steady", "దృఢమైనవాడు", "दृढ़ और स्थिर"], ["सङ्कर्षणोऽच्युतः", "San-kar-sha-no Ach-yu-tah", "Draws all to Himself, and never falls", "అందరినీ తనవైపు లాగేవాడు, ఎప్పుడూ జారనివాడు", "सबको अपनी ओर खींचने वाले, कभी न डिगने वाले"], ["वरुणः", "Va-ru-nah", "Like the evening sun, gathers in His rays", "సాయంకాల సూర్యుడిలా కిరణాలను ఉపసంహరించేవాడు", "शाम के सूर्य की तरह किरणें समेटने वाले"], ["वारुणः", "Vaa-ru-nah", "Son of Varuna (the sage Vasishtha)", "వరుణుని కుమారుడు (వసిష్ఠుడు)", "वरुण के पुत्र (वसिष्ठ)"], ["वृक्षः", "Vrik-shah", "Firm like a tree, giving shelter", "చెట్టులా స్థిరంగా నీడ ఇచ్చేవాడు", "वृक्ष की तरह स्थिर, छाया देने वाले"], ["पुष्कराक्षः", "Push-ka-raak-shah", "Has lotus eyes", "తామర కళ్ళవాడు", "कमल नयन"], ["महामनाः", "Ma-haa-ma-naah", "Has a great mind", "గొప్ప మనసు కలవాడు", "महान मन वाले"]], "v": ["Vishnu is the creator, and He does all His work Himself. He is never conquered. He is Krishna, dark and beautiful, firm and steady. He draws all to Himself and never falls. Like the evening sun He gathers in His rays, and He came as Vasishtha, son of Varuna. He is firm like a tree that gives shelter. He has lotus eyes and a great mind.", "విష్ణువు సృష్టికర్త; తన పనులన్నీ తానే చేస్తాడు. ఎప్పుడూ జయించబడడు. నల్లని అందమైన కృష్ణుడు, దృఢమైనవాడు. అందరినీ తనవైపు లాగుతాడు, ఎప్పుడూ జారడు. సాయంకాల సూర్యుడిలా కిరణాలను ఉపసంహరిస్తాడు; వరుణుని కుమారుడైన వసిష్ఠుడిగా వచ్చాడు. నీడ ఇచ్చే చెట్టులా స్థిరమైనవాడు. తామర కళ్ళవాడు, గొప్ప మనసు కలవాడు.", "विष्णु सृष्टिकर्ता हैं, और अपने सब कार्य स्वयं करते हैं। उन्हें कभी जीता नहीं जा सकता। वे साँवले, सुंदर कृष्ण हैं, दृढ़ और स्थिर। वे सबको अपनी ओर खींचते हैं और कभी नहीं डिगते। शाम के सूर्य की तरह वे किरणें समेटते हैं, और वरुण के पुत्र वसिष्ठ बनकर आए। वे छाया देने वाले वृक्ष की तरह स्थिर हैं। वे कमल नयन और महान मन वाले हैं।"]},
60:{"w": [["भगवान्", "Bha-ga-vaan", "Has every divine quality", "అన్ని దివ్య గుణాలు కలవాడు", "सभी दिव्य गुणों वाले"], ["भगहा", "Bha-ga-haa", "Takes back all glory at the end", "చివరికి అన్ని వైభవాలను ఉపసంహరించేవాడు", "अंत में सारा वैभव समेटने वाले"], ["आनन्दी", "Aa-nan-dee", "Full of bliss", "ఆనందంతో నిండినవాడు", "आनंद से भरे"], ["वनमाली", "Va-na-maa-lee", "Wears a garland of forest flowers", "వనమాల ధరించినవాడు", "वनमाला पहनने वाले"], ["हलायुधः", "Ha-laa-yu-dhah", "Holds the plough (as Balarama)", "నాగలి ఆయుధంగా కలవాడు (బలరాముడిగా)", "हल धारण करने वाले (बलराम रूप में)"], ["आदित्यः", "Aa-dit-yah", "Born of Aditi (as Vamana)", "అదితి కుమారుడు (వామనుడిగా)", "अदिति के पुत्र (वामन रूप में)"], ["ज्योतिरादित्यः", "Jyo-ti-raa-dit-yah", "The light within the sun", "సూర్యునిలోని వెలుగు", "सूर्य के भीतर का प्रकाश"], ["सहिष्णुः", "Sa-hish-nuh", "Patient, bears all", "ఓర్పుతో అన్నీ భరించేవాడు", "धैर्य से सब सहने वाले"], ["गतिसत्तमः", "Ga-ti-sat-ta-mah", "The best refuge", "ఉత్తమ ఆశ్రయం", "सबसे उत्तम आश्रय"]], "v": ["Vishnu has every divine quality, and at the end He takes back all glory. He is full of bliss and wears a garland of forest flowers. As Balarama He holds the plough, and as Vamana He was born of Aditi. He is the light within the sun. He is patient and bears all, and He is our best refuge.", "విష్ణువు అన్ని దివ్య గుణాలు కలవాడు; చివరికి అన్ని వైభవాలను ఉపసంహరిస్తాడు. ఆనందంతో నిండినవాడు, వనమాల ధరిస్తాడు. బలరాముడిగా నాగలి పట్టుకుంటాడు; వామనుడిగా అదితికి పుట్టాడు. సూర్యునిలోని వెలుగు ఆయనే. ఓర్పుతో అన్నీ భరిస్తాడు; మనకు ఉత్తమ ఆశ్రయం.", "विष्णु सभी दिव्य गुणों वाले हैं, और अंत में सारा वैभव समेट लेते हैं। वे आनंद से भरे हैं और वनमाला पहनते हैं। बलराम रूप में वे हल धारण करते हैं, और वामन रूप में अदिति से जन्मे। वे सूर्य के भीतर का प्रकाश हैं। वे धैर्य से सब सहते हैं, और हमारे सबसे उत्तम आश्रय हैं।"]},
61:{w:[["सुधन्वा","Su-dhan-vaa","One with the excellent bow (Sharnga)","మంచి ధనుస్సు (శార్ఙ్గం) కలవాడు","उत्तम धनुष (शार्ङ्ग) वाले"],
["खंडपरशुः","Khan-da-pa-ra-shuh","Wielder of the cutting axe","ఖండించే గొడ్డలిని ధరించినవాడు","खंडन करने वाला परशु धारण करने वाले"],
["दारुणः","Daa-ru-nah","Stern toward the wicked","దుష్టులకు కఠినుడు","दुष्टों के लिए कठोर"],
["द्रविणप्रदः","Dra-vi-na-pra-dah","Giver of wealth","సంపదను ఇచ్చువాడు","धन देने वाले"],
["दिवस्पृक्","Di-vas-prik","One who touches the heavens","ఆకాశాన్ని (స్వర్గాన్ని) స్పృశించువాడు","आकाश को छूने वाले"],
["सर्वदृक्","Sar-va-drik","The all-seeing","సర్వము చూచువాడు","सब कुछ देखने वाले"],
["व्यासः","Vyaa-sah","Vyasa, who arranged the Vedas","వేదాలను విభజించిన వ్యాసుడు","वेदों का विभाजन करने वाले व्यास"],
["वाचस्पतिः","Vaa-chas-pa-tih","Lord of speech","వాక్కుకు అధిపతి","वाणी के स्वामी"],
["अयोनिजः","A-yo-ni-jah","Not born from a womb","గర్భం నుండి జన్మించనివాడు","योनि से जन्म न लेने वाले"]],
v:["Vishnu holds a mighty bow and an axe. He is stern with evil, but gives wealth to the good. He reaches up to the heavens and sees everything. As Vyasa, He gave us the Vedas. He is the master of all speech, and He was never born like us.", "విష్ణువు గొప్ప విల్లు, గొడ్డలి ధరిస్తాడు. చెడుపై కఠినంగా ఉంటాడు, మంచివారికి సంపద ఇస్తాడు. ఆకాశాన్ని అందుకునేంత గొప్పవాడు, అన్నీ చూసేవాడు. వ్యాసుడిగా మనకు వేదాలను ఇచ్చాడు. మాటలన్నింటికీ ఆయనే అధిపతి; మనలా పుట్టినవాడు కాదు.", "विष्णु महान धनुष और फरसा धारण करते हैं। वे बुराई पर कठोर हैं, पर अच्छों को धन देते हैं। वे आकाश तक व्याप्त हैं और सब देखते हैं। व्यास बनकर उन्होंने हमें वेद दिए। वे सारी वाणी के स्वामी हैं और हमारी तरह जन्म नहीं लेते।"]},
62:{w:[["त्रिसामा","Tri-saa-maa","Praised by the three Sama chants","మూడు సామాలతో స్తుతింపబడువాడు","तीन सामों से स्तुत"],
["सामगः","Saa-ma-gah","The singer of Sama","సామగానం చేయువాడు","सामगान करने वाले"],
["साम","Saa-ma","The Sama Veda itself","సామవేద స్వరూపుడు","सामवेद स्वरूप"],
["निर्वाणम्","Nir-vaa-nam","Liberation, final peace","నిర్వాణం (మోక్షం)","निर्वाण (मोक्ष)"],
["भेषजम्","Bhe-sha-jam","The medicine for worldly suffering","సంసార బాధకు ఔషధం","संसार के कष्ट की औषधि"],
["भिषक्","Bhi-shak","The physician","వైద్యుడు","वैद्य"],
["संन्यासकृत्","San-nyaa-sa-krit","Who set up the path of renunciation","సన్యాసాశ్రమాన్ని నిర్దేశించినవాడు","संन्यास के प्रवर्तक"],
["शमः","Sha-mah","Who gives calm to the mind","మనశ్శాంతిని ఇచ్చువాడు","मन को शांति देने वाले"],
["शान्तः","Shaan-tah","The peaceful one","శాంతస్వరూపుడు","शांत"],
["निष्ठा","Nish-thaa","The final resting place of all","అందరికీ అంతిమ ఆధారం","सबका अंतिम आधार"],
["शान्तिः","Shaan-tih","Peace itself","శాంతి స్వరూపం","शांति स्वरूप"],
["परायणम्","Pa-raa-ya-nam","The highest refuge","పరమాశ్రయం","परम आश्रय"]],
v:["Vishnu is praised in the sacred Sama chants, and He is that music too. He is both the doctor and the medicine for the sickness of worldly life. He is calm and peaceful, gives peace to others, and is the final place where every soul finds rest.", "పవిత్రమైన సామగానాలు విష్ణువునే స్తుతిస్తాయి; ఆ గానం కూడా ఆయనే. సంసారం అనే రోగానికి ఆయనే వైద్యుడు, ఆయనే ఔషధం. ఆయన ప్రశాంతుడు, ఇతరులకు శాంతినిస్తాడు; ప్రతి జీవికి చివరికి విశ్రాంతినిచ్చే ఆశ్రయం ఆయనే.", "पवित्र साम-गान विष्णु की ही स्तुति करते हैं, और वह संगीत भी वही हैं। संसार रूपी रोग के वे डॉक्टर भी हैं और दवा भी। वे शांत हैं, दूसरों को शांति देते हैं, और हर जीव को अंत में विश्राम देने वाला आश्रय वही हैं।"]},
63:{w:[["शुभांगः","Shu-bhaan-gah","Of beautiful form","సుందర రూపుడు","सुंदर अंगों वाले"],
["शान्तिदः","Shaan-ti-dah","Giver of peace","శాంతిని ఇచ్చువాడు","शांति देने वाले"],
["स्रष्टा","Srash-taa","The Creator","సృష్టికర్త","सृष्टिकर्ता"],
["कुमुदः","Ku-mu-dah","Who rejoices on the earth","భూమిపై ఆనందించువాడు","पृथ्वी पर आनंद करने वाले"],
["कुवलेशयः","Ku-va-le-sha-yah","Who rests on the waters","నీటిపై శయనించువాడు","जल पर शयन करने वाले"],
["गोहितः","Go-hi-tah","Friend of the cows and all beings","గోవులకు, జీవులకు హితుడు","गायों का हित करने वाले"],
["गोपतिः","Go-pa-tih","Lord of the cows","గోవులకు అధిపతి","गायों के स्वामी"],
["गोप्ता","Gop-taa","The protector","రక్షకుడు","रक्षक"],
["वृषभाक्षः","Vri-sha-bhaak-shah","Whose gaze showers blessings","కోరికలను వర్షించు చూపు కలవాడు","इच्छाओं की वर्षा करने वाली दृष्टि वाले"],
["वृषप्रियः","Vri-sha-pri-yah","Lover of dharma","ధర్మాన్ని ప్రేమించువాడు","धर्म से प्रेम करने वाले"]],
v:["Vishnu has a beautiful form, gives peace, and created the world. He delights in the earth and rests on the cosmic waters. Like a loving cowherd, He cares for and protects all beings. His eyes shower blessings, and He loves those who do right.", "విష్ణువు అందమైన రూపం కలవాడు, శాంతినిచ్చేవాడు, లోకాన్ని సృష్టించినవాడు. భూమిపై ఆనందిస్తాడు, నీటిపై శయనిస్తాడు. ప్రేమగల గోపాలుడిలా అన్ని జీవులను చూసుకుని కాపాడతాడు. ఆయన చూపు దీవెనలు కురిపిస్తుంది; ధర్మం చేసేవారిని ప్రేమిస్తాడు.", "विष्णु सुंदर रूप वाले हैं, शांति देते हैं और उन्होंने संसार रचा। वे धरती पर आनंद लेते हैं और जल पर शयन करते हैं। प्रेमी ग्वाले की तरह वे सब जीवों का ध्यान रखते और रक्षा करते हैं। उनकी दृष्टि आशीर्वाद बरसाती है, और वे धर्म करने वालों से प्रेम करते हैं।"]},
64:{"w": [["अनिवर्ती", "A-ni-var-tee", "Lets those who want worldly life return to it", "లోక సుఖాలు కోరేవారిని మళ్ళీ ఈ లోకానికి రానిచ్చేవాడు", "संसार चाहने वालों को फिर संसार में लौटने देने वाले"], ["निवृत्तात्मा", "Ni-vrit-taat-maa", "Dear as life to those who give up worldly wants", "లోక వాంఛలు వదిలినవారికి ప్రాణమైనవాడు", "संसार की इच्छा छोड़ने वालों के प्राण-प्रिय"], ["संक्षेप्ता", "San-kshep-taa", "Keeps the wisdom of the worldly-minded small, until they are ready", "ఫలాలు మాత్రమే కోరేవారి జ్ఞానాన్ని పరిమితం చేసేవాడు", "केवल फल चाहने वालों के ज्ञान को सीमित रखने वाले"], ["क्षेमकृत्", "Kshe-ma-krit", "Does good to seekers by removing their obstacles", "మోక్షం కోరేవారి అడ్డంకులు తొలగించి మేలు చేసేవాడు", "मोक्ष चाहने वालों की बाधाएँ हटाकर कल्याण करने वाले"], ["शिवः", "Shi-vah", "The auspicious one, good to all", "అందరికీ శుభం చేసేవాడు", "सबका मंगल करने वाले"], ["श्रीवत्सवक्षाः", "Shree-vat-sa-vak-shaah", "Has the Shrivatsa mark on His chest, sign of Lakshmi's love", "వక్షస్థలంపై శ్రీవత్స చిహ్నం కలవాడు", "वक्षस्थल पर श्रीवत्स चिह्न वाले"], ["श्रीवासः", "Shree-vaa-sah", "Lakshmi's home; she lives with Him always", "లక్ష్మీదేవికి నివాసమైనవాడు", "लक्ष्मी जी के निवास"], ["श्रीपतिः", "Shree-pa-tih", "Lakshmi's husband and Lord", "లక్ష్మీదేవికి పతి", "लक्ष्मी जी के पति"], ["श्रीमतां वरः", "Shree-ma-taam Va-rah", "The greatest among all who are blessed", "ఐశ్వర్యవంతులలో శ్రేష్ఠుడు", "ऐश्वर्यवानों में श्रेष्ठ"]], "v": ["Vishnu gives each person what they truly want: worldly happiness to those who wish for it, and freedom to those who seek Him. He brings good to everyone. Goddess Lakshmi lives on His chest, and He is the greatest of all.", "విష్ణువు ఎవరికి ఏది నిజంగా కావాలో అదే ఇస్తాడు: లోక సుఖాలు కోరేవారికి అవి, ఆయనను కోరేవారికి మోక్షం. ఆయన అందరికీ మంచి చేస్తాడు. లక్ష్మీదేవి ఆయన హృదయంలో ఉంటుంది. ఆయనే అందరికంటే గొప్పవాడు.", "विष्णु हर किसी को वही देते हैं जो उसे सच में चाहिए: सांसारिक सुख चाहने वालों को सुख, और उन्हें चाहने वालों को मोक्ष। वे सबका भला करते हैं। लक्ष्मी जी उनके हृदय में रहती हैं, और वे सबसे महान हैं।"]},
65:{"w": [["श्रीदः", "Shree-dah", "Gives Lakshmi her glory", "లక్ష్మీదేవికి వైభవం ఇచ్చేవాడు", "लक्ष्मी जी को शोभा देने वाले"], ["श्रीशः", "Shree-shah", "Lord of Lakshmi", "లక్ష్మీదేవికి ప్రభువు", "लक्ष्मी जी के स्वामी"], ["श्रीनिवासः", "Shree-ni-vaa-sah", "The one in whom Lakshmi always lives", "లక్ష్మి ఎప్పుడూ నివసించేవాడు", "जिनमें लक्ष्मी जी सदा रहती हैं"], ["श्रीनिधिः", "Shree-ni-dhih", "Treasure-house of Lakshmi", "లక్ష్మికి నిధి వంటివాడు", "लक्ष्मी जी के खजाने"], ["श्रीविभावनः", "Shree-vi-bhaa-va-nah", "Whose greatness shines through Lakshmi", "లక్ష్మి ద్వారా వైభవం ప్రకాశించేవాడు", "जिनकी महिमा लक्ष्मी जी से चमकती है"], ["श्रीधरः", "Shree-dha-rah", "Holds Lakshmi close, as the moon holds moonlight", "చంద్రుడు వెన్నెలను వలె లక్ష్మిని ధరించేవాడు", "चाँद जैसे चाँदनी, वैसे लक्ष्मी जी को धारण करने वाले"], ["श्रीकरः", "Shree-ka-rah", "Brings Lakshmi with Him in every avatar", "ప్రతి అవతారంలో లక్ష్మిని తనతో ఉంచుకునేవాడు", "हर अवतार में लक्ष्मी जी को साथ रखने वाले"], ["श्रेयः", "Shre-yah", "The highest good", "పరమ శ్రేయస్సు", "परम कल्याण"], ["श्रीमान्", "Shree-maan", "Rich with Lakshmi", "లక్ష్మీ సంపన్నుడు", "लक्ष्मी जी से युक्त"], ["लोकत्रयाश्रयः", "Lo-ka-tra-yaa-shra-yah", "Shelter of the three worlds", "మూడు లోకాలకు ఆశ్రయం", "तीनों लोकों के आश्रय"]], "v": ["Vishnu and Goddess Lakshmi are never apart. He gives her glory; she lives in Him and comes with Him in every avatar, like moonlight with the moon. He is the greatest good we can have, and the shelter of all three worlds.", "విష్ణువు, లక్ష్మీదేవి ఎప్పుడూ విడిపోరు. ఆమెకు వైభవం ఇచ్చేది ఆయనే; చంద్రుడితో వెన్నెలలా, ఆమె ఆయనలో ఉంటూ ప్రతి అవతారంలో ఆయనతో వస్తుంది. మనకు దొరికే గొప్ప మేలు ఆయనే; మూడు లోకాలకు ఆశ్రయం ఆయనే.", "विष्णु और लक्ष्मी जी कभी अलग नहीं होते। उन्हें शोभा विष्णु ही देते हैं; चाँद के साथ चाँदनी की तरह, वे उनमें रहती हैं और हर अवतार में साथ आती हैं। हमारे लिए सबसे बड़ा भला वही हैं, और तीनों लोकों का आश्रय भी वही।"]},
66:{"w": [["स्वक्षः", "Svak-shah", "With beautiful eyes", "అందమైన కన్నులు కలవాడు", "सुंदर नेत्रों वाले"], ["स्वङ्गः", "Svan-gah", "With a beautiful body", "అందమైన శరీరం కలవాడు", "सुंदर शरीर वाले"], ["शतानन्दः", "Sha-taa-nan-dah", "Full of endless joy", "అంతులేని ఆనందం కలవాడు", "असीम आनंद वाले"], ["नन्दिः", "Nan-dih", "Always happy", "ఎప్పుడూ సంతోషంగా ఉండేవాడు", "सदा प्रसन्न"], ["ज्योतिर्गणेश्वरः", "Jyo-tir-ga-ne-shva-rah", "Lord of the shining heavenly beings", "ప్రకాశించే దివ్యుల సమూహానికి ప్రభువు", "प्रकाशमान दिव्य जनों के स्वामी"], ["विजितात्मा", "Vi-ji-taat-maa", "Whose heart is won by devotees", "భక్తులు గెలుచుకున్న మనసు కలవాడు", "भक्तों ने जिनका मन जीत लिया"], ["विधेयात्मा", "Vi-dhe-yaat-maa", "Lovingly does what devotees ask", "భక్తులు చెప్పినట్లు ప్రేమతో చేసేవాడు", "भक्तों की बात प्रेम से मानने वाले"], ["सत्कीर्तिः", "Sat-keer-tih", "Of true, good fame", "నిజమైన మంచి కీర్తి కలవాడు", "सच्ची कीर्ति वाले"], ["छिन्नसंशयः", "Chhin-na-sam-sha-yah", "Removes all doubts", "అన్ని సందేహాలు తొలగించేవాడు", "सभी संदेह दूर करने वाले"]], "v": ["Vishnu has beautiful eyes and a beautiful form, and He is always full of joy. He is Lord of the heavenly beings, yet anyone who loves Him wins His heart, and He gladly does what they ask. His good name is true, and He clears all our doubts.", "విష్ణువు అందమైన కన్నులు, అందమైన రూపం కలవాడు; ఎప్పుడూ ఆనందంగా ఉంటాడు. దివ్యులకు ప్రభువైనా, ప్రేమించేవారు ఆయన మనసు గెలుచుకుంటారు; వారు అడిగినది సంతోషంగా చేస్తాడు. ఆయన మంచి పేరు నిజమైనది; మన సందేహాలన్నీ తొలగిస్తాడు.", "विष्णु के नेत्र और रूप सुंदर हैं, और वे सदा आनंद में रहते हैं। वे दिव्य जनों के स्वामी हैं, फिर भी जो उनसे प्रेम करता है वह उनका मन जीत लेता है, और वे खुशी से उसकी बात मानते हैं। उनका यश सच्चा है, और वे हमारे सारे संदेह दूर करते हैं।"]},
67:{"w": [["उदीर्णः", "U-deer-nah", "Clearly seen by all", "అందరికీ స్పష్టంగా కనిపించేవాడు", "सबको स्पष्ट दिखने वाले"], ["सर्वतश्चक्षुः", "Sar-va-tash-chak-shuh", "Visible to everyone's eyes", "అందరి కళ్ళకూ కనిపించేవాడు", "सबकी आँखों को दिखने वाले"], ["अनीशः", "A-nee-shah", "Does not act as master over His devotees", "భక్తులపై యజమానిలా ఉండనివాడు", "भक्तों पर स्वामी बनकर न रहने वाले"], ["शाश्वतस्थिरः", "Shaash-va-ta-sthi-rah", "Always present and steady", "ఎల్లప్పుడూ స్థిరంగా ఉండేవాడు", "सदा स्थिर रहने वाले"], ["भूशयः", "Bhoo-sha-yah", "Stays on earth, in temples, to bless us", "మనల్ని దీవించడానికి భూమిపై, ఆలయాలలో ఉండేవాడు", "आशीर्वाद देने धरती पर, मंदिरों में रहने वाले"], ["भूषणः", "Bhoo-sha-nah", "Brings beauty to every home He visits", "తాను వెళ్ళిన ప్రతి ఇంటికీ అలంకారమయ్యేవాడు", "जिस घर जाएँ उसे शोभा देने वाले"], ["भूतिः", "Bhoo-tih", "The true wealth of His devotees", "భక్తుల నిజమైన సంపద", "भक्तों के सच्चे धन"], ["विशोकः", "Vi-sho-kah", "Free from sorrow", "దుఃఖం లేనివాడు", "शोक रहित"], ["शोकनाशनः", "Sho-ka-naa-sha-nah", "Destroys sorrow", "దుఃఖాన్ని నాశనం చేసేవాడు", "शोक का नाश करने वाले"]], "v": ["Vishnu makes Himself easy to see, as Rama and Krishna, and in temples, where He stays for us always. He never acts like a master over those who love Him. He is their real wealth; He has no sorrow, and He takes away ours.", "విష్ణువు రాముడిగా, కృష్ణుడిగా, ఆలయాలలో మనకు సులభంగా కనిపిస్తాడు; మన కోసం అక్కడ ఎప్పుడూ ఉంటాడు. ప్రేమించేవారిపై ఎప్పుడూ యజమానిలా ఉండడు. వారి నిజమైన సంపద ఆయనే; ఆయనకు దుఃఖం లేదు, మన దుఃఖం తొలగిస్తాడు.", "विष्णु राम और कृष्ण के रूप में, और मंदिरों में, आसानी से दिखते हैं, जहाँ वे हमारे लिए सदा रहते हैं। जो उनसे प्रेम करते हैं, उन पर वे कभी स्वामी नहीं बनते। वही उनका असली धन हैं; उन्हें कोई दुख नहीं, और वे हमारा दुख दूर करते हैं।"]},
68:{"w": [["अर्चिष्मान्", "Ar-chish-maan", "Full of divine light", "దివ్య కాంతి కలవాడు", "दिव्य तेज वाले"], ["अर्चितः", "Ar-chi-tah", "Worshipped in holy shrines", "పుణ్యక్షేత్రాలలో పూజింపబడేవాడు", "तीर्थों में पूजे जाने वाले"], ["कुम्भः", "Kum-bhah", "Loved and longed for by all", "అందరూ కోరుకునేవాడు", "सबके चाहे जाने वाले"], ["विशुद्धात्मा", "Vi-shud-dhaat-maa", "Pure; forgives all who come to Him", "శుద్ధుడు; శరణు వచ్చినవారి తప్పులు మన్నించేవాడు", "शुद्ध; शरण आए सबको क्षमा करने वाले"], ["विशोधनः", "Vi-sho-dha-nah", "Makes us pure", "మనల్ని పవిత్రం చేసేవాడు", "हमें शुद्ध करने वाले"], ["अनिरुद्धः", "A-ni-rud-dhah", "No one can stop Him", "ఎవరూ ఆపలేనివాడు", "जिन्हें कोई रोक न सके"], ["अप्रतिरथः", "A-pra-ti-ra-thah", "Has no equal", "సాటిలేనివాడు", "जिनका कोई जोड़ नहीं"], ["प्रद्युम्नः", "Pra-dyum-nah", "Makes souls shine", "జీవులను ప్రకాశింపజేసేవాడు", "जीवों को प्रकाशित करने वाले"], ["अमितविक्रमः", "A-mi-ta-vik-ra-mah", "Of boundless steps (Trivikrama)", "అపరిమిత అడుగులు కలవాడు (త్రివిక్రముడు)", "असीम पग वाले (त्रिविक्रम)"]], "v": ["Vishnu shines with divine light and is worshipped in holy temples; everyone longs for Him. When we come to Him, He forgives us and makes us pure. No one can stop Him or match Him. He makes every soul shine, and He measured the whole world in three steps.", "విష్ణువు దివ్య కాంతితో ప్రకాశిస్తాడు, పవిత్ర ఆలయాలలో పూజింపబడతాడు; అందరూ ఆయనను కోరుకుంటారు. మనం ఆయన దగ్గరకు వెళ్తే, మన్నించి పవిత్రం చేస్తాడు. ఆయనను ఎవరూ ఆపలేరు, ఎవరూ సాటిరారు. ప్రతి జీవిని ప్రకాశింపజేస్తాడు; మూడు అడుగులతో లోకమంతా కొలిచాడు.", "विष्णु दिव्य तेज से चमकते हैं और पवित्र मंदिरों में पूजे जाते हैं; सब उन्हें चाहते हैं। जब हम उनके पास जाते हैं, वे क्षमा कर हमें शुद्ध कर देते हैं। उन्हें कोई रोक नहीं सकता, कोई उनकी बराबरी नहीं कर सकता। वे हर जीव को प्रकाशित करते हैं, और उन्होंने तीन पग में पूरा संसार नाप लिया।"]},
69:{"w": [["कालनेमिनिहा", "Kaa-la-ne-mi-ni-haa", "Destroyer of the demon Kalanemi, and of ignorance", "కాలనేమి రాక్షసుడిని, అజ్ఞానాన్ని నాశనం చేసేవాడు", "कालनेमि राक्षस और अज्ञान का नाश करने वाले"], ["वीरः", "Vee-rah", "The brave hero", "వీరుడు", "वीर"], ["शौरिः", "Shau-rih", "Krishna, born in Shura's family", "శూరుని వంశంలో పుట్టిన కృష్ణుడు", "शूर वंश में जन्मे कृष्ण"], ["शूरजनेश्वरः", "Shoo-ra-ja-ne-shva-rah", "Lord of the brave", "వీరులకు ప్రభువు", "वीरों के स्वामी"], ["त्रिलोकात्मा", "Tri-lo-kaat-maa", "Moves through the three worlds to bless", "దీవించడానికి మూడు లోకాలలో సంచరించేవాడు", "आशीर्वाद देने तीनों लोकों में विचरने वाले"], ["त्रिलोकेशः", "Tri-lo-ke-shah", "Ruler of the three worlds", "మూడు లోకాలకు ఈశ్వరుడు", "तीनों लोकों के स्वामी"], ["केशवः", "Ke-sha-vah", "With beautiful hair; removes our distress", "అందమైన కేశాలు కలవాడు; కష్టాలు తొలగించేవాడు", "सुंदर केशों वाले; कष्ट हरने वाले"], ["केशिहा", "Ke-shi-haa", "Slayer of the demon Keshi", "కేశి రాక్షసుడిని సంహరించినవాడు", "केशी राक्षस का वध करने वाले"], ["हरिः", "Ha-rih", "Hari, who takes away our troubles", "మన కష్టాలను హరించే హరి", "हमारे कष्ट हरने वाले हरि"]], "v": ["Vishnu is the brave hero who destroyed the demon Kalanemi. He was born as Krishna and leads all the brave. He moves through the three worlds to bless them, and rules them all. As Keshava He defeated the demon Keshi, and as Hari He takes away our troubles.", "కాలనేమి రాక్షసుడిని సంహరించిన వీరుడు విష్ణువు. కృష్ణుడిగా పుట్టి, వీరులందరికీ నాయకుడయ్యాడు. మూడు లోకాలను దీవిస్తూ సంచరిస్తాడు, వాటన్నింటినీ పాలిస్తాడు. కేశవుడిగా కేశి రాక్షసుడిని ఓడించాడు; హరిగా మన కష్టాలు తీసివేస్తాడు.", "विष्णु वह वीर हैं जिन्होंने कालनेमि राक्षस का नाश किया। वे कृष्ण बनकर जन्मे और सब वीरों के नायक हैं। वे तीनों लोकों में आशीर्वाद देते घूमते हैं और उन पर राज करते हैं। केशव बनकर उन्होंने केशी राक्षस को हराया, और हरि बनकर वे हमारे कष्ट दूर करते हैं।"]},
70:{"w": [["कामदेवः", "Kaa-ma-de-vah", "Grants all good wishes", "అన్ని మంచి కోరికలు తీర్చేవాడు", "सभी अच्छी इच्छाएँ पूरी करने वाले"], ["कामपालः", "Kaa-ma-paa-lah", "Protects what He has given", "తాను ఇచ్చినదాన్ని కాపాడేవాడు", "अपने दिए हुए की रक्षा करने वाले"], ["कामी", "Kaa-mee", "Has everything, to give to others", "ఇతరులకు ఇవ్వడానికి అన్నీ కలవాడు", "दूसरों को देने के लिए सब कुछ रखने वाले"], ["कान्तः", "Kaan-tah", "Charming and lovely", "మనోహరుడు", "मनोहर"], ["कृतागमः", "Kri-taa-ga-mah", "Gave us the holy scriptures", "పవిత్ర శాస్త్రాలను మనకు ఇచ్చినవాడు", "हमें पवित्र शास्त्र देने वाले"], ["अनिर्देश्यवपुः", "A-nir-de-shya-va-puh", "Takes forms beyond description", "వర్ణించలేని రూపాలు ధరించేవాడు", "अवर्णनीय रूप धारण करने वाले"], ["विष्णुः", "Vish-nuh", "Present everywhere", "అంతటా వ్యాపించినవాడు", "सर्वत्र व्याप्त"], ["वीरः", "Vee-rah", "Valiant; protects the good", "సజ్జనులను కాపాడే వీరుడు", "सज्जनों की रक्षा करने वाले वीर"], ["अनन्तः", "A-nan-tah", "Without any end", "అంతం లేనివాడు", "अनंत"], ["धनञ्जयः", "Dha-nan-ja-yah", "Greater than all wealth", "అన్ని సంపదల కంటే గొప్పవాడు", "सभी धन से बढ़कर"]], "v": ["Vishnu fulfils our good wishes and keeps safe what He gives us. He is lovely to see, and He gave us the holy scriptures. His forms are beyond words. He is everywhere, brave, without end, and worth more than all the wealth in the world.", "విష్ణువు మన మంచి కోరికలు తీర్చి, ఇచ్చినదాన్ని భద్రంగా కాపాడతాడు. చూడటానికి మనోహరుడు; పవిత్ర శాస్త్రాలను మనకు ఇచ్చాడు. ఆయన రూపాలు మాటలకు అందవు. ఆయన అంతటా ఉంటాడు, వీరుడు, అంతం లేనివాడు; లోకంలోని సంపద అంతటి కంటే విలువైనవాడు.", "विष्णु हमारी अच्छी इच्छाएँ पूरी करते हैं और जो देते हैं उसे संभालकर रखते हैं। वे देखने में मनोहर हैं, और उन्होंने हमें पवित्र शास्त्र दिए। उनके रूप शब्दों से परे हैं। वे सर्वत्र हैं, वीर हैं, अनंत हैं, और दुनिया के सारे धन से अधिक मूल्यवान हैं।"]},
71:{"w": [["ब्रह्मण्यः", "Brah-man-yah", "Good to all beings", "అన్ని జీవులకు మేలు చేసేవాడు", "सब जीवों का भला करने वाले"], ["ब्रह्मकृत्", "Brah-ma-krit", "Guides even Brahma, the creator", "సృష్టికర్త బ్రహ్మను కూడా నడిపించేవాడు", "सृष्टिकर्ता ब्रह्मा को भी चलाने वाले"], ["ब्रह्मा", "Brah-maa", "The great one who makes everything grow", "అన్నింటినీ పెంచే మహనీయుడు", "सबको बढ़ाने वाले महान"], ["ब्रह्म", "Brah-ma", "The Supreme Reality", "పరబ్రహ్మం", "परब्रह्म"], ["ब्रह्मविवर्धनः", "Brah-ma-vi-var-dha-nah", "Makes goodness (dharma) grow", "ధర్మాన్ని పెంచేవాడు", "धर्म को बढ़ाने वाले"], ["ब्रह्मवित्", "Brah-ma-vit", "Knows the Vedas fully", "వేదాలను పూర్తిగా తెలిసినవాడు", "वेदों को पूरा जानने वाले"], ["ब्राह्मणः", "Braah-ma-nah", "The teacher of the Vedas", "వేదాలను బోధించేవాడు", "वेदों के शिक्षक"], ["ब्रह्मी", "Brah-mee", "Owner of all knowledge and all things", "జ్ఞానం, సమస్తం తనవే అయినవాడు", "सारा ज्ञान और सब कुछ जिनका है"], ["ब्रह्मज्ञः", "Brah-ma-jnah", "Knows the true meaning of the Vedas", "వేదాల అసలు అర్థం తెలిసినవాడు", "वेदों का सच्चा अर्थ जानने वाले"], ["ब्राह्मणप्रियः", "Braah-ma-na-pri-yah", "Loves the wise and the good", "జ్ఞానులను, సజ్జనులను ప్రేమించేవాడు", "ज्ञानियों और सज्जनों से प्रेम करने वाले"]], "v": ["Vishnu is good to all beings. He guides even Brahma, the creator, and He is the Supreme Reality that makes everything grow. He makes goodness grow in the world. He knows the Vedas and their true meaning, teaches them to us, and loves the wise and the good.", "విష్ణువు అన్ని జీవులకు మేలు చేస్తాడు. సృష్టికర్త బ్రహ్మను కూడా నడిపిస్తాడు; అన్నింటినీ పెంచే పరబ్రహ్మం ఆయనే. లోకంలో ధర్మాన్ని పెంచుతాడు. వేదాలను, వాటి అసలు అర్థాన్ని తెలిసినవాడు, మనకు బోధిస్తాడు; జ్ఞానులను, సజ్జనులను ప్రేమిస్తాడు.", "विष्णु सब जीवों का भला करते हैं। वे सृष्टिकर्ता ब्रह्मा को भी चलाते हैं, और सबको बढ़ाने वाला परब्रह्म वही हैं। वे संसार में धर्म को बढ़ाते हैं। वे वेदों और उनके सच्चे अर्थ को जानते हैं, हमें सिखाते हैं, और ज्ञानियों व सज्जनों से प्रेम करते हैं।"]},
72:{"w": [["महाक्रमः", "Ma-haa-kra-mah", "Lifts us up step by step", "మనల్ని మెట్టు మెట్టుగా పైకి తీసుకువెళ్ళేవాడు", "हमें कदम-कदम ऊपर उठाने वाले"], ["महाकर्मा", "Ma-haa-kar-maa", "Of wonderful deeds", "అద్భుతమైన పనులు చేసేవాడు", "अद्भुत कर्म करने वाले"], ["महातेजाः", "Ma-haa-te-jaah", "Of great light that removes ignorance", "అజ్ఞానాన్ని తొలగించే గొప్ప వెలుగు కలవాడు", "अज्ञान दूर करने वाले महान तेज वाले"], ["महोरगः", "Ma-ho-ra-gah", "Great, yet enters our heart", "గొప్పవాడైనా మన హృదయంలోకి వచ్చేవాడు", "महान होकर भी हमारे हृदय में आने वाले"], ["महाक्रतुः", "Ma-haa-kra-tuh", "Easily pleased by a sincere heart", "నిజమైన మనసుకు సులభంగా సంతోషించేవాడు", "सच्चे मन से आसानी से प्रसन्न होने वाले"], ["महायज्वा", "Ma-haa-yaj-vaa", "Has the most devoted worshippers", "అత్యంత భక్తిగల ఆరాధకులు కలవాడు", "सबसे भक्त उपासकों वाले"], ["महायज्ञः", "Ma-haa-yaj-nah", "Worshipping Him is the greatest worship", "ఆయన ఆరాధనే గొప్ప ఆరాధన", "जिनकी पूजा सबसे बड़ी पूजा है"], ["महाहविः", "Ma-haa-ha-vih", "Accepts the offering of a loving heart", "ప్రేమగల హృదయ సమర్పణను స్వీకరించేవాడు", "प्रेम भरे हृदय की भेंट स्वीकारने वाले"]], "v": ["Vishnu lifts us up step by step, like a mother who slowly moves her baby from milk to food. His deeds are wonderful and His light removes ignorance. Though so great, He enters our hearts. He is pleased by a sincere heart, and worshipping Him is the greatest worship.", "తల్లి బిడ్డకు పాలు నుండి మెల్లగా అన్నం అలవాటు చేసినట్లు, విష్ణువు మనల్ని మెట్టు మెట్టుగా పైకి తీసుకువెళ్తాడు. ఆయన పనులు అద్భుతం; ఆయన వెలుగు అజ్ఞానాన్ని తొలగిస్తుంది. అంత గొప్పవాడైనా మన హృదయంలోకి వస్తాడు. నిజమైన మనసుకు సంతోషిస్తాడు; ఆయన ఆరాధనే గొప్ప ఆరాధన.", "जैसे माँ बच्चे को धीरे-धीरे दूध से खाने तक ले जाती है, वैसे विष्णु हमें कदम-कदम ऊपर उठाते हैं। उनके कर्म अद्भुत हैं और उनका तेज अज्ञान दूर करता है। इतने महान होकर भी वे हमारे हृदय में आते हैं। वे सच्चे मन से प्रसन्न होते हैं, और उनकी पूजा सबसे बड़ी पूजा है।"]},
73:{"w": [["स्तव्यः", "Stav-yah", "Worthy of praise", "స్తుతికి అర్హుడు", "स्तुति के योग्य"], ["स्तवप्रियः", "Sta-va-pri-yah", "Loves praise in any words", "ఏ మాటలలో స్తుతించినా ఇష్టపడేవాడు", "किसी भी शब्दों में स्तुति से प्रसन्न"], ["स्तोत्रम्", "Sto-tram", "The praise itself", "స్తోత్రం తానే అయినవాడు", "स्वयं स्तोत्र"], ["स्तुतिः", "Stu-tih", "Praised by all", "అందరిచే స్తుతింపబడేవాడు", "सबके द्वारा स्तुत"], ["स्तोता", "Sto-taa", "Praises those who praise Him", "తనను స్తుతించేవారిని తానే పొగిడేవాడు", "अपनी स्तुति करने वालों की प्रशंसा करने वाले"], ["रणप्रियः", "Ra-na-pri-yah", "Fights gladly to protect His friends", "స్నేహితులను కాపాడటానికి సంతోషంగా యుద్ధం చేసేవాడు", "मित्रों की रक्षा के लिए खुशी से लड़ने वाले"], ["पूर्णः", "Poor-nah", "Complete; needs nothing", "పరిపూర్ణుడు; ఏదీ అవసరం లేనివాడు", "पूर्ण; जिन्हें कुछ नहीं चाहिए"], ["पूरयिता", "Poo-ra-yi-taa", "Fulfils the wishes of others", "ఇతరుల కోరికలు తీర్చేవాడు", "दूसरों की इच्छाएँ पूरी करने वाले"], ["पुण्यः", "Pun-yah", "Makes us pure", "మనల్ని పవిత్రం చేసేవాడు", "हमें पवित्र करने वाले"], ["पुण्यकीर्तिः", "Pun-ya-keer-tih", "Singing His glory makes us pure", "ఆయన కీర్తి పాడితే పవిత్రులమవుతాం", "जिनकी महिमा गाने से हम पवित्र होते हैं"], ["अनामयः", "A-naa-ma-yah", "Heals the illness of worldly life", "సంసారం అనే రోగాన్ని నయం చేసేవాడు", "संसार रूपी रोग को ठीक करने वाले"]], "v": ["Vishnu is worthy of all praise, and He loves praise in any words, even simple ones. He even praises those who praise Him. He fights gladly to protect His friends. He needs nothing, yet fulfils everyone's wishes. Singing His glory makes us pure and heals the sorrow of life.", "విష్ణువు అన్ని స్తుతులకు అర్హుడు; సాధారణ మాటలతో స్తుతించినా ఇష్టపడతాడు. తనను స్తుతించేవారిని తానే పొగుడుతాడు. స్నేహితులను కాపాడటానికి సంతోషంగా యుద్ధం చేస్తాడు. ఆయనకు ఏదీ అవసరం లేదు, అయినా అందరి కోరికలు తీరుస్తాడు. ఆయన కీర్తి పాడితే మనం పవిత్రులమవుతాం, జీవిత దుఃఖం తగ్గుతుంది.", "विष्णु सारी स्तुति के योग्य हैं, और वे किसी भी शब्दों में, सरल शब्दों में भी, स्तुति से प्रसन्न होते हैं। वे अपनी स्तुति करने वालों की स्वयं प्रशंसा करते हैं। वे मित्रों की रक्षा के लिए खुशी से लड़ते हैं। उन्हें कुछ नहीं चाहिए, फिर भी वे सबकी इच्छाएँ पूरी करते हैं। उनकी महिमा गाने से हम पवित्र होते हैं और जीवन का दुख मिटता है।"]},
74:{"w": [["मनोजवः", "Ma-no-ja-vah", "Swift as thought to help", "సహాయానికి మనసంత వేగంగా వచ్చేవాడు", "मदद के लिए मन की गति से आने वाले"], ["तीर्थकरः", "Teer-tha-ka-rah", "Makes holy places holy", "పుణ్యక్షేత్రాలకు పవిత్రత ఇచ్చేవాడు", "तीर्थों को पवित्र बनाने वाले"], ["वसुरेताः", "Va-su-re-taah", "Source of divine light", "దివ్య కాంతికి మూలం", "दिव्य तेज के स्रोत"], ["वसुप्रदः", "Va-su-pra-dah", "Gave Himself as a treasure (as Devaki's son)", "దేవకికి కొడుకుగా తననే నిధిగా ఇచ్చినవాడు", "देवकी के पुत्र बनकर स्वयं को खजाने की तरह देने वाले"], ["वसुप्रदः", "Va-su-pra-dah", "Gave His parents great honour", "తన తల్లిదండ్రులకు గొప్ప గౌరవం ఇచ్చినవాడు", "अपने माता-पिता को बड़ा सम्मान देने वाले"], ["वासुदेवः", "Vaa-su-de-vah", "Son of Vasudeva", "వసుదేవుని కుమారుడు", "वसुदेव के पुत्र"], ["वसुः", "Va-suh", "Lives in the ocean of milk", "పాలసముద్రంలో నివసించేవాడు", "क्षीरसागर में रहने वाले"], ["वसुमनाः", "Va-su-ma-naah", "His heart is always with His devotees", "ఆయన మనసు ఎప్పుడూ భక్తులతో ఉంటుంది", "जिनका मन सदा भक्तों के साथ है"], ["हविः", "Ha-vih", "Handed over to Nanda and Yashoda for safety", "రక్షణ కోసం నందయశోదలకు అప్పగించబడినవాడు", "सुरक्षा के लिए नंद-यशोदा को सौंपे गए"]], "v": ["Vishnu comes to help as fast as thought, and He makes holy places holy. As Krishna, He gave Himself as a treasure to Devaki and Vasudeva by becoming their son, and gave them great honour. Though He lives in the ocean of milk, His heart is always with His devotees. He was handed to Nanda and Yashoda to keep Him safe.", "విష్ణువు సహాయానికి మనసంత వేగంగా వస్తాడు; పుణ్యక్షేత్రాలకు పవిత్రత ఇస్తాడు. కృష్ణుడిగా దేవకీ వసుదేవులకు కొడుకై, తననే నిధిగా ఇచ్చి, వారికి గొప్ప గౌరవం ఇచ్చాడు. పాలసముద్రంలో ఉన్నా, ఆయన మనసు ఎప్పుడూ భక్తులతోనే. రక్షణ కోసం నందయశోదలకు అప్పగించబడ్డాడు.", "विष्णु मदद के लिए मन की गति से आते हैं, और तीर्थों को पवित्र बनाते हैं। कृष्ण बनकर उन्होंने देवकी और वसुदेव का पुत्र बनकर स्वयं को खजाने की तरह दिया, और उन्हें बड़ा सम्मान दिया। क्षीरसागर में रहकर भी उनका मन सदा भक्तों के साथ है। सुरक्षा के लिए उन्हें नंद और यशोदा को सौंपा गया।"]},
75:{"w": [["सद्गतिः", "Sad-ga-tih", "Protector of the good", "సజ్జనులను కాపాడేవాడు", "सज्जनों के रक्षक"], ["सत्कृतिः", "Sat-kri-tih", "Whose childhood play is lovely", "ఆయన బాల్య లీలలు మనోహరమైనవి", "जिनकी बाल लीलाएँ मनोहर हैं"], ["सत्ता", "Sat-taa", "The very existence of all things", "అన్నింటి ఉనికి తానే", "सबका अस्तित्व स्वयं"], ["सद्भूतिः", "Sad-bhoo-tih", "Everything to the good: friend, family, helper", "సజ్జనులకు స్నేహితుడు, బంధువు, సహాయకుడు, సర్వస్వం", "सज्जनों के मित्र, परिवार, सहायक, सब कुछ"], ["सत्परायणः", "Sat-pa-raa-ya-nah", "The final support of the good", "సజ్జనులకు చివరి ఆధారం", "सज्जनों का अंतिम सहारा"], ["शूरसेनः", "Shoo-ra-se-nah", "Leader of a brave army", "వీరసైన్యానికి నాయకుడు", "वीर सेना के नायक"], ["यदुश्रेष्ठः", "Ya-du-shresh-thah", "The best of the Yadu family", "యదువంశంలో శ్రేష్ఠుడు", "यदु वंश में श्रेष्ठ"], ["सन्निवासः", "San-ni-vaa-sah", "Resting place of saints", "సాధువులకు విశ్రాంతి స్థానం", "संतों का विश्राम स्थान"], ["सुयामुनः", "Su-yaa-mu-nah", "Played joyfully by the Yamuna river", "యమునా తీరంలో ఆనందంగా ఆడినవాడు", "यमुना किनारे आनंद से खेलने वाले"]], "v": ["Vishnu protects the good, and His childhood play as Krishna is a joy to remember. He is the existence of everything. For good people He is everything: friend, family and helper, and their final support. He led a brave army, was the best of the Yadus, gives rest to saints, and played happily by the Yamuna.", "విష్ణువు సజ్జనులను కాపాడతాడు; కృష్ణుడిగా ఆయన బాల్య లీలలు గుర్తుచేసుకుంటేనే ఆనందం. అన్నింటి ఉనికి ఆయనే. మంచివారికి స్నేహితుడు, బంధువు, సహాయకుడు, అన్నీ ఆయనే; వారికి చివరి ఆధారం. వీరసైన్యానికి నాయకుడు, యదువంశంలో శ్రేష్ఠుడు, సాధువులకు విశ్రాంతి, యమునా తీరంలో ఆనందంగా ఆడినవాడు.", "विष्णु सज्जनों की रक्षा करते हैं, और कृष्ण रूप में उनकी बाल लीलाएँ याद करना ही आनंद है। सबका अस्तित्व वही हैं। अच्छे लोगों के लिए वे मित्र, परिवार, सहायक, सब कुछ हैं, और उनका अंतिम सहारा हैं। वे वीर सेना के नायक, यदु वंश में श्रेष्ठ, संतों के विश्राम स्थान हैं, और यमुना किनारे आनंद से खेले।"]},
76:{"w": [["भूतावासः", "Bhoo-taa-vaa-sah", "Home of all beings", "అన్ని జీవులకు నివాసం", "सब जीवों का निवास"], ["वासुदेवः", "Vaa-su-de-vah", "Lord of the Vasudeva mantra", "వాసుదేవ మంత్రానికి అధిదేవత", "वासुदेव मंत्र के देवता"], ["सर्वासुनिलयः", "Sar-vaa-su-ni-la-yah", "Support of every life", "ప్రతి ప్రాణానికి ఆధారం", "हर प्राण का आधार"], ["अनलः", "A-na-lah", "Never feels He has done enough for devotees", "భక్తులకు చేసినది చాలదని భావించేవాడు", "भक्तों के लिए किया कभी काफ़ी न मानने वाले"], ["दर्पहा", "Dar-pa-haa", "Removes pride", "గర్వాన్ని తొలగించేవాడు", "घमंड दूर करने वाले"], ["दर्पदः", "Dar-pa-dah", "Gives honour to His own", "తనవారికి గౌరవం ఇచ్చేవాడు", "अपनों को सम्मान देने वाले"], ["दृप्तः", "Drip-tah", "Joyful in His mother's love", "తల్లి ప్రేమలో ఆనందించేవాడు", "माँ के प्रेम में आनंदित"], ["दुर्धरः", "Dur-dha-rah", "Too lively to be held (as little Krishna)", "(చిన్ని కృష్ణుడిగా) పట్టుకోలేనంత చురుకైనవాడు", "(नन्हे कृष्ण के रूप में) पकड़ में न आने वाले"], ["अपराजितः", "A-pa-raa-ji-tah", "Never defeated", "ఎప్పుడూ ఓడిపోనివాడు", "कभी न हारने वाले"]], "v": ["Vishnu is the home of all beings and the support of every life. He never feels He has done enough for those who love Him. He removes pride from the proud and gives honour to His own. As little Krishna He was joyful in His mother's love and too lively to be held, and He is never defeated.", "విష్ణువు అన్ని జీవులకు నివాసం, ప్రతి ప్రాణానికి ఆధారం. ప్రేమించేవారికి ఎంత చేసినా చాలదని భావిస్తాడు. గర్వించేవారి గర్వం తొలగిస్తాడు, తనవారికి గౌరవం ఇస్తాడు. చిన్ని కృష్ణుడిగా తల్లి ప్రేమలో ఆనందించాడు, పట్టుకోలేనంత చురుకుగా ఉండేవాడు; ఆయన ఎప్పుడూ ఓడిపోడు.", "विष्णु सब जीवों का घर और हर प्राण का आधार हैं। जो उनसे प्रेम करते हैं, उनके लिए वे कितना भी करें, कभी काफ़ी नहीं मानते। वे घमंडी का घमंड दूर करते हैं और अपनों को सम्मान देते हैं। नन्हे कृष्ण बनकर वे माँ के प्रेम में आनंदित रहे और इतने चंचल थे कि पकड़ में न आते, और वे कभी नहीं हारते।"]},
77:{"w": [["विश्वमूर्तिः", "Vish-va-moor-tih", "The whole universe is His body", "విశ్వమంతా ఆయన శరీరం", "पूरा विश्व जिनका शरीर है"], ["महामूर्तिः", "Ma-haa-moor-tih", "Of a vast form that holds everything", "అన్నింటినీ నిలిపే విశాల రూపం కలవాడు", "सब कुछ धारण करने वाले विशाल रूप वाले"], ["दीप्तमूर्तिः", "Deep-ta-moor-tih", "Of a shining form; all glory comes from Him", "ప్రకాశించే రూపం; అన్ని వైభవాలు ఆయన నుండే", "तेजस्वी रूप; सारी शोभा उन्हीं से"], ["अमूर्तिमान्", "A-moor-ti-maan", "Lord of formless things too", "రూపం లేని వాటికి కూడా ప్రభువు", "निराकार चीज़ों के भी स्वामी"], ["अनेकमूर्तिः", "A-ne-ka-moor-tih", "Of many forms", "అనేక రూపాలు కలవాడు", "अनेक रूपों वाले"], ["अव्यक्तः", "A-vyak-tah", "Hides His true greatness", "తన నిజ మహిమను దాచుకునేవాడు", "अपनी सच्ची महिमा छिपाने वाले"], ["शतमूर्तिः", "Sha-ta-moor-tih", "Of hundreds of forms", "వందలాది రూపాలు కలవాడు", "सैकड़ों रूपों वाले"], ["शताननः", "Sha-taa-na-nah", "Of hundreds of faces", "వందలాది ముఖాలు కలవాడు", "सैकड़ों मुखों वाले"]], "v": ["The whole universe is Vishnu's body, and His form is vast enough to hold everything. Every bit of glory in the world comes from His shining form. He is Lord even of things without form. He takes many forms, sometimes hundreds at once, with hundreds of faces, yet He hides His true greatness when He comes among us.", "విశ్వమంతా విష్ణువు శరీరం; అన్నింటినీ నిలిపేంత విశాల రూపం ఆయనది. లోకంలోని ప్రతి వైభవం ఆయన ప్రకాశించే రూపం నుండే వస్తుంది. రూపం లేని వాటికి కూడా ఆయనే ప్రభువు. అనేక రూపాలు ధరిస్తాడు, ఒక్కసారే వందలాది రూపాలు, వందలాది ముఖాలతో; అయినా మన మధ్యకు వచ్చినప్పుడు తన నిజ మహిమను దాచుకుంటాడు.", "पूरा विश्व विष्णु का शरीर है, और उनका रूप इतना विशाल है कि सब कुछ धारण करता है। संसार की हर शोभा उनके तेजस्वी रूप से आती है। वे निराकार चीज़ों के भी स्वामी हैं। वे अनेक रूप लेते हैं, कभी एक साथ सैकड़ों, सैकड़ों मुखों के साथ, फिर भी हमारे बीच आकर अपनी सच्ची महिमा छिपा लेते हैं।"]},
78:{"w": [["एकः", "E-kah", "The one and only; no one is like Him", "ఒక్కడే; ఆయనలాంటి వారు లేరు", "एकमात्र; उनके जैसा कोई नहीं"], ["नैकः", "Nai-kah", "Also many, with endless glories", "అంతులేని వైభవాలతో అనేకుడు కూడా", "अनंत महिमाओं के साथ अनेक भी"], ["सवः", "Sa-vah", "Makes Himself known, and lives in all", "తనను తెలియజేసి, అందరిలో ఉండేవాడు", "स्वयं को प्रकट कर सबमें रहने वाले"], ["कः", "Kah", "Shines brightly, always pure", "ఎప్పుడూ పవిత్రంగా ప్రకాశించేవాడు", "सदा पवित्र, उज्ज्वल चमकने वाले"], ["किम्", "Kim", "The one we should seek and ask about", "మనం వెతకవలసిన, తెలుసుకోవలసినవాడు", "जिन्हें खोजना और जानना चाहिए"], ["यत्", "Yat", "Works hard to protect His devotees", "భక్తులను కాపాడటానికి శ్రమించేవాడు", "भक्तों की रक्षा के लिए प्रयत्न करने वाले"], ["तत्", "Tat", "Makes our knowledge grow", "మన జ్ఞానాన్ని పెంచేవాడు", "हमारा ज्ञान बढ़ाने वाले"], ["पदमनुत्तमम्", "Pa-da-ma-nut-ta-mam", "The highest goal", "అత్యున్నత గమ్యం", "सर्वोच्च लक्ष्य"], ["लोकबन्धुः", "Lo-ka-ban-dhuh", "Friend and family of the whole world", "లోకమంతటికీ బంధువు, స్నేహితుడు", "पूरे संसार के बंधु और मित्र"], ["लोकनाथः", "Lo-ka-naa-thah", "Protector of the world", "లోకాన్ని కాపాడేవాడు", "संसार के रक्षक"], ["माधवः", "Maa-dha-vah", "Husband of Lakshmi", "లక్ష్మీపతి", "लक्ष्मी जी के पति"], ["भक्तवत्सलः", "Bhak-ta-vat-sa-lah", "Full of love for His devotees", "భక్తులపై ప్రేమ నిండినవాడు", "भक्तों पर प्रेम से भरे"]], "v": ["Vishnu is one and only; no one is like Him, yet His glories are endless. He makes Himself known, lives in everyone, and shines pure. He is the one worth seeking, works hard to protect His devotees, and helps their wisdom grow. He is the highest goal, the friend and protector of the world, Lakshmi's husband, and full of love for His devotees.", "విష్ణువు ఒక్కడే; ఆయనలాంటి వారు లేరు, అయినా ఆయన వైభవాలు అంతులేనివి. తనను తెలియజేసి, అందరిలో ఉంటూ, పవిత్రంగా ప్రకాశిస్తాడు. వెతకవలసినది ఆయననే; భక్తులను కాపాడటానికి శ్రమిస్తాడు, వారి జ్ఞానాన్ని పెంచుతాడు. అత్యున్నత గమ్యం, లోకానికి స్నేహితుడు, రక్షకుడు, లక్ష్మీపతి, భక్తులపై ప్రేమ నిండినవాడు.", "विष्णु एकमात्र हैं; उनके जैसा कोई नहीं, फिर भी उनकी महिमा अनंत है। वे स्वयं को प्रकट करते हैं, सबमें रहते हैं और पवित्र चमकते हैं। खोजने योग्य वही हैं; वे भक्तों की रक्षा के लिए प्रयत्न करते हैं और उनका ज्ञान बढ़ाते हैं। वे सर्वोच्च लक्ष्य, संसार के मित्र और रक्षक, लक्ष्मी जी के पति, और भक्तों पर प्रेम से भरे हैं।"]},
79:{"w": [["सुवर्णवर्णः", "Su-var-na-var-nah", "Shining like gold", "బంగారంలా ప్రకాశించేవాడు", "सोने जैसे चमकने वाले"], ["हेमाङ्गः", "He-maan-gah", "Of golden limbs", "బంగారు అవయవాలు కలవాడు", "स्वर्णिम अंगों वाले"], ["वराङ्गः", "Va-raan-gah", "Of a magnificent body", "అద్భుతమైన శరీరం కలవాడు", "भव्य शरीर वाले"], ["चन्दनाङ्गदी", "Chan-da-naan-ga-dee", "Wears beautiful armlets", "అందమైన భుజకీర్తులు ధరించేవాడు", "सुंदर बाजूबंद पहनने वाले"], ["वीरहा", "Vee-ra-haa", "Defeated mighty demons, even as a baby", "పసిబిడ్డగానే బలమైన రాక్షసులను ఓడించినవాడు", "बचपन में ही बलवान राक्षसों को हराने वाले"], ["विषमः", "Vi-sha-mah", "Gentle to the good, fierce to the wicked", "మంచివారికి సౌమ్యుడు, దుష్టులకు భయంకరుడు", "सज्जनों के लिए कोमल, दुष्टों के लिए कठोर"], ["शून्यः", "Shoon-yah", "Free from every fault", "ఏ దోషమూ లేనివాడు", "हर दोष से मुक्त"], ["घृताशीः", "Ghri-taa-sheeh", "Wishes the world well; loved butter in Gokula", "లోకానికి మేలు కోరేవాడు; గోకులంలో వెన్న ఇష్టపడేవాడు", "संसार का भला चाहने वाले; गोकुल में माखन प्रिय"], ["अचलः", "A-cha-lah", "Unshakable", "ఎవరూ కదిలించలేనివాడు", "अटल"], ["चलः", "Cha-lah", "Moves to save His devotees, even breaking His own vow", "భక్తులను కాపాడటానికి తన మాటను కూడా వదిలేవాడు", "भक्तों को बचाने अपना वचन भी छोड़ने वाले"]], "v": ["Vishnu shines like gold, with golden limbs, a magnificent body and beautiful armlets. Even as baby Krishna He defeated mighty demons. He is gentle to the good and fierce to the wicked, and has no fault at all. He wishes the world well and loved butter in Gokula. No one can shake Him, yet He rushes to save His devotees, even breaking His own vow for them.", "విష్ణువు బంగారంలా ప్రకాశిస్తాడు; బంగారు అవయవాలు, అద్భుత శరీరం, అందమైన భుజకీర్తులు కలవాడు. చిన్ని కృష్ణుడిగానే బలమైన రాక్షసులను ఓడించాడు. మంచివారికి సౌమ్యుడు, దుష్టులకు భయంకరుడు; ఏ దోషమూ లేనివాడు. లోకానికి మేలు కోరతాడు, గోకులంలో వెన్న ఇష్టపడ్డాడు. ఎవరూ కదిలించలేనివాడైనా, భక్తుల కోసం తన మాటను కూడా వదిలి పరుగెత్తుకొస్తాడు.", "विष्णु सोने जैसे चमकते हैं; स्वर्णिम अंग, भव्य शरीर और सुंदर बाजूबंद वाले। नन्हे कृष्ण बनकर ही उन्होंने बलवान राक्षसों को हराया। वे सज्जनों के लिए कोमल और दुष्टों के लिए कठोर हैं, और उनमें कोई दोष नहीं। वे संसार का भला चाहते हैं और गोकुल में उन्हें माखन प्रिय था। उन्हें कोई हिला नहीं सकता, फिर भी भक्तों के लिए वे अपना वचन छोड़कर भी दौड़ पड़ते हैं।"]},
80:{"w": [["अमानी", "A-maa-nee", "Without pride", "గర్వం లేనివాడు", "अभिमान रहित"], ["मानदः", "Maa-na-dah", "Gives honour to others", "ఇతరులకు గౌరవం ఇచ్చేవాడు", "दूसरों को सम्मान देने वाले"], ["मान्यः", "Maan-yah", "Worthy of love and honour", "ప్రేమకు, గౌరవానికి అర్హుడు", "प्रेम और सम्मान के योग्य"], ["लोकस्वामी", "Lo-ka-svaa-mee", "Master of the world", "లోకానికి ప్రభువు", "संसार के स्वामी"], ["त्रिलोकधृक्", "Tri-lo-ka-dhrik", "Holds up the three worlds", "మూడు లోకాలను మోసేవాడు", "तीनों लोकों को धारण करने वाले"], ["सुमेधाः", "Su-me-dhaah", "Always thinks of His devotees' good", "భక్తుల మేలు గురించే ఆలోచించేవాడు", "सदा भक्तों का भला सोचने वाले"], ["मेधजः", "Me-dha-jah", "Born from Devaki's prayers", "దేవకి ప్రార్థనల ఫలంగా పుట్టినవాడు", "देवकी की प्रार्थना से जन्मे"], ["धन्यः", "Dhan-yah", "Felt blessed to be Devaki's son", "దేవకి కొడుకుగా పుట్టడం భాగ్యంగా భావించినవాడు", "देवकी का पुत्र होना सौभाग्य मानने वाले"], ["सत्यमेधाः", "Sat-ya-me-dhaah", "Truly felt one with the cowherds", "గోపాలురలో ఒకడినని నిజంగా భావించినవాడు", "ग्वालों में से एक होना सच में मानने वाले"], ["धराधरः", "Dha-raa-dha-rah", "Held up the Govardhana hill", "గోవర్ధన గిరిని ఎత్తినవాడు", "गोवर्धन पर्वत उठाने वाले"]], "v": ["Vishnu has no pride; He even went as a messenger for His devotees, and He gives honour to others. He is loved and honoured by all, the master of the world who holds up the three worlds. He always thinks of His devotees' good. As Krishna He felt truly blessed to be Devaki's son and one of the cowherds, and He lifted Govardhana hill to protect them.", "విష్ణువుకు గర్వం లేదు; భక్తుల కోసం దూతగా కూడా వెళ్ళాడు; ఇతరులకు గౌరవం ఇస్తాడు. అందరూ ప్రేమించి గౌరవించేవాడు, లోకానికి ప్రభువు, మూడు లోకాలను మోసేవాడు. ఎప్పుడూ భక్తుల మేలే ఆలోచిస్తాడు. కృష్ణుడిగా దేవకి కొడుకుగా, గోపాలురలో ఒకడిగా ఉండటాన్ని భాగ్యంగా భావించాడు; వారిని కాపాడటానికి గోవర్ధన గిరిని ఎత్తాడు.", "विष्णु में अभिमान नहीं; भक्तों के लिए वे दूत बनकर भी गए, और दूसरों को सम्मान देते हैं। सब उनसे प्रेम और उनका सम्मान करते हैं; वे संसार के स्वामी हैं और तीनों लोकों को धारण करते हैं। वे सदा भक्तों का भला सोचते हैं। कृष्ण बनकर उन्होंने देवकी का पुत्र और ग्वालों में से एक होना सच्चा सौभाग्य माना, और उनकी रक्षा के लिए गोवर्धन पर्वत उठाया।"]},
81:{"w": [["तेजोवृषः", "Te-jo-vri-shah", "Showers protection on the good", "సజ్జనులపై రక్షణ కురిపించేవాడు", "सज्जनों पर रक्षा बरसाने वाले"], ["द्युतिधरः", "Dyu-ti-dha-rah", "Full of majesty", "మహిమతో నిండినవాడు", "तेज और महिमा से भरे"], ["सर्वशस्त्रभृतां वरः", "Sar-va-shas-tra-bhri-taam Va-rah", "Best of all warriors", "యోధులందరిలో శ్రేష్ఠుడు", "सभी योद्धाओं में श्रेष्ठ"], ["प्रग्रहः", "Pra-gra-hah", "Held the reins as Arjuna's charioteer", "అర్జునుని సారథిగా పగ్గాలు పట్టినవాడు", "अर्जुन के सारथी बनकर लगाम थामने वाले"], ["निग्रहः", "Ni-gra-hah", "Overcame the enemies", "శత్రువులను అణచినవాడు", "शत्रुओं को वश में करने वाले"], ["व्यग्रः", "Vyag-rah", "Eager to protect His devotees", "భక్తులను కాపాడాలని ఆరాటపడేవాడు", "भक्तों की रक्षा को उत्सुक"], ["नैकशृङ्गः", "Nai-ka-shrin-gah", "Used many clever ways to win", "గెలవడానికి ఎన్నో ఉపాయాలు వాడినవాడు", "जीत के लिए अनेक उपाय अपनाने वाले"], ["गदाग्रजः", "Ga-daa-gra-jah", "Elder brother of Gada", "గదునికి అన్న", "गद के बड़े भाई"]], "v": ["Vishnu showers protection on the good and is full of majesty; He is the best of all warriors. As Krishna He held the reins as Arjuna's charioteer, overcame the enemies, and was always eager to protect His devotees, using many clever ways to win. He is also the elder brother of Gada.", "విష్ణువు సజ్జనులపై రక్షణ కురిపిస్తాడు, మహిమతో నిండినవాడు; యోధులందరిలో శ్రేష్ఠుడు. కృష్ణుడిగా అర్జునుని సారథిగా పగ్గాలు పట్టాడు, శత్రువులను అణచాడు; భక్తులను కాపాడాలని ఎప్పుడూ ఆరాటపడుతూ, గెలవడానికి ఎన్నో ఉపాయాలు వాడాడు. గదునికి అన్న కూడా.", "विष्णु सज्जनों पर रक्षा बरसाते हैं और महिमा से भरे हैं; वे सभी योद्धाओं में श्रेष्ठ हैं। कृष्ण बनकर उन्होंने अर्जुन के सारथी बन लगाम थामी, शत्रुओं को वश में किया, और भक्तों की रक्षा को सदा उत्सुक रहकर जीत के लिए अनेक उपाय अपनाए। वे गद के बड़े भाई भी हैं।"]},
82:{"w": [["चतुर्मूर्तिः", "Cha-tur-moor-tih", "Has four divine forms", "నాలుగు దివ్య రూపాలు కలవాడు", "चार दिव्य रूपों वाले"], ["चतुर्बाहुः", "Cha-tur-baa-huh", "Four-armed", "నాలుగు భుజాలు కలవాడు", "चार भुजाओं वाले"], ["चतुर्व्यूहः", "Cha-tur-vyoo-hah", "Appears as Vasudeva, Sankarshana, Pradyumna and Aniruddha", "వాసుదేవ, సంకర్షణ, ప్రద్యుమ్న, అనిరుద్ధ రూపాలుగా ఉండేవాడు", "वासुदेव, संकर्षण, प्रद्युम्न, अनिरुद्ध रूपों में प्रकट"], ["चतुर्गतिः", "Cha-tur-ga-tih", "Gives the four goals of life", "జీవితంలోని నాలుగు పురుషార్థాలను ఇచ్చేవాడు", "जीवन के चार पुरुषार्थ देने वाले"], ["चतुरात्मा", "Cha-tu-raat-maa", "Appears in four ways to those who meditate", "ధ్యానించేవారికి నాలుగు విధాలుగా కనిపించేవాడు", "ध्यान करने वालों को चार प्रकार से दिखने वाले"], ["चतुर्भावः", "Cha-tur-bhaa-vah", "Does four great works: create, sustain, protect, teach", "సృష్టి, పోషణ, రక్షణ, బోధన అనే నాలుగు పనులు చేసేవాడు", "सृष्टि, पालन, रक्षा, शिक्षा के चार कार्य करने वाले"], ["चतुर्वेदवित्", "Cha-tur-ve-da-vit", "Known by those who know the four Vedas", "నాలుగు వేదాలు తెలిసినవారికి తెలిసేవాడు", "चारों वेद जानने वालों से जाने जाने वाले"], ["एकपात्", "E-ka-paat", "Even His avatar is only a small part of Him", "ఆయన అవతారం కూడా ఆయనలో ఒక చిన్న భాగమే", "उनका अवतार भी उनका छोटा-सा अंश है"]], "v": ["Vishnu has four divine forms and four arms. He gives the four goals of life: doing right, wealth, happiness and freedom, to each person as they seek. He does four great works: creating, sustaining, protecting and teaching. Those who know the four Vedas know Him, and even His avatar as Krishna is only a small part of His full greatness.", "విష్ణువుకు నాలుగు దివ్య రూపాలు, నాలుగు భుజాలు. ధర్మం, సంపద, సుఖం, మోక్షం అనే నాలుగు పురుషార్థాలను ఎవరు కోరితే వారికి ఇస్తాడు. సృష్టి, పోషణ, రక్షణ, బోధన అనే నాలుగు గొప్ప పనులు చేస్తాడు. నాలుగు వేదాలు తెలిసినవారు ఆయనను తెలుసుకుంటారు; కృష్ణావతారం కూడా ఆయన పూర్తి మహిమలో ఒక చిన్న భాగమే.", "विष्णु के चार दिव्य रूप और चार भुजाएँ हैं। वे धर्म, धन, सुख और मोक्ष, ये चार पुरुषार्थ, जो जैसा चाहे उसे देते हैं। वे सृष्टि, पालन, रक्षा और शिक्षा के चार महान कार्य करते हैं। चारों वेद जानने वाले उन्हें जानते हैं, और कृष्ण अवतार भी उनकी पूरी महिमा का एक छोटा-सा अंश है।"]},
83:{"w": [["समावर्तः", "Sa-maa-var-tah", "Comes again and again (as avatars)", "మళ్ళీ మళ్ళీ అవతరించేవాడు", "बार-बार अवतार लेने वाले"], ["निवृत्तात्मा", "Ni-vrit-taat-maa", "His mind is untouched by the world", "ఆయన మనసు లోకానికి అంటనిది", "जिनका मन संसार से अछूता है"], ["दुर्जयः", "Dur-ja-yah", "Cannot be conquered", "ఎవరూ జయించలేనివాడు", "जिन्हें कोई जीत न सके"], ["दुरतिक्रमः", "Du-ra-ti-kra-mah", "No one can do without Him; the only refuge", "ఆయన లేకుండా ఎవరూ ఉండలేరు; ఏకైక ఆశ్రయం", "जिनके बिना कोई नहीं रह सकता; एकमात्र आश्रय"], ["दुर्लभः", "Dur-la-bhah", "Hard to reach without devotion", "భక్తి లేకుండా అందనివాడు", "भक्ति के बिना कठिनाई से मिलने वाले"], ["दुर्गमः", "Dur-ga-mah", "Hard to see, like the midday sun for weak eyes", "బలహీన కళ్ళకు మధ్యాహ్న సూర్యుడిలా చూడలేనివాడు", "कमज़ोर आँखों को दोपहर के सूरज जैसे कठिन"], ["दुर्गः", "Dur-gah", "Cannot be reached through ignorance", "అజ్ఞానంతో చేరలేనివాడు", "अज्ञान से न पहुँचे जा सकने वाले"], ["दुरावासः", "Du-raa-vaa-sah", "His home is hard to reach", "ఆయన నివాసం చేరడం కష్టం", "जिनका धाम पाना कठिन है"], ["दुरारिहा", "Du-raa-ri-haa", "Removes the wicked", "దుష్టులను తొలగించేవాడు", "दुष्टों को दूर करने वाले"]], "v": ["Vishnu comes to us again and again as avatars, yet His mind stays untouched by the world. No one can conquer Him, and no one can do without Him; He is our only true refuge. Without devotion He is hard to reach and hard to see, like the midday sun for weak eyes, and His home is hard to reach. He removes the wicked.", "విష్ణువు మళ్ళీ మళ్ళీ అవతారాలుగా మన దగ్గరకు వస్తాడు, అయినా ఆయన మనసు లోకానికి అంటదు. ఎవరూ ఆయనను జయించలేరు, ఆయన లేకుండా ఎవరూ ఉండలేరు; ఆయనే మన నిజమైన ఆశ్రయం. భక్తి లేకుంటే ఆయన అందడు, కనిపించడు, బలహీన కళ్ళకు మధ్యాహ్న సూర్యుడిలా; ఆయన నివాసం చేరడం కష్టం. దుష్టులను తొలగిస్తాడు.", "विष्णु बार-बार अवतार बनकर हमारे पास आते हैं, फिर भी उनका मन संसार से अछूता रहता है। उन्हें कोई जीत नहीं सकता, और उनके बिना कोई रह नहीं सकता; वही हमारे सच्चे आश्रय हैं। भक्ति के बिना वे कठिनाई से मिलते और दिखते हैं, जैसे कमज़ोर आँखों को दोपहर का सूरज, और उनका धाम पाना कठिन है। वे दुष्टों को दूर करते हैं।"]},
84:{"w": [["शुभाङ्गः", "Shu-bhaan-gah", "Of a beautiful, auspicious form", "శుభమైన అందమైన రూపం కలవాడు", "सुंदर, मंगलमय रूप वाले"], ["लोकसारङ्गः", "Lo-ka-saa-ran-gah", "Shows what truly matters in life", "జీవితంలో నిజంగా ముఖ్యమైనది చూపించేవాడు", "जीवन में सच में ज़रूरी चीज़ दिखाने वाले"], ["सुतन्तुः", "Su-tan-tuh", "Holds the world together like a fine thread", "చక్కని దారంలా లోకాన్ని కలిపి ఉంచేవాడు", "सुंदर धागे की तरह संसार को जोड़े रखने वाले"], ["तन्तुवर्धनः", "Tan-tu-var-dha-nah", "Keeps the world growing", "లోకాన్ని పెరిగేలా చేసేవాడు", "संसार को बढ़ाते रहने वाले"], ["इन्द्रकर्मा", "In-dra-kar-maa", "Acts to help Indra and the gods", "ఇంద్రునికి, దేవతలకు సహాయంగా పనిచేసేవాడు", "इंद्र और देवताओं की सहायता करने वाले"], ["महाकर्मा", "Ma-haa-kar-maa", "Of great deeds", "గొప్ప పనులు చేసేవాడు", "महान कर्म करने वाले"], ["कृतकर्मा", "Kri-ta-kar-maa", "Has nothing left to do; all is done", "చేయవలసినదేదీ మిగలనివాడు", "जिनका कुछ करना बाकी नहीं"], ["कृतागमः", "Kri-taa-ga-mah", "Gave us the holy teachings", "పవిత్ర బోధలను మనకు ఇచ్చినవాడు", "हमें पवित्र शिक्षाएँ देने वाले"]], "v": ["Vishnu has a beautiful, auspicious form and shows us what truly matters in life. He holds the world together like a fine thread and keeps it growing. He acts to help Indra and the gods, and His deeds are great. He has nothing left to achieve, yet He gave us the holy teachings to guide us.", "విష్ణువు శుభమైన అందమైన రూపం కలవాడు; జీవితంలో నిజంగా ముఖ్యమైనది మనకు చూపిస్తాడు. చక్కని దారంలా లోకాన్ని కలిపి ఉంచి, పెరిగేలా చేస్తాడు. ఇంద్రునికి, దేవతలకు సహాయంగా పనిచేస్తాడు; ఆయన పనులు గొప్పవి. ఆయనకు సాధించవలసినదేదీ లేదు, అయినా మనల్ని నడిపించడానికి పవిత్ర బోధలను ఇచ్చాడు.", "विष्णु का रूप सुंदर और मंगलमय है, और वे हमें दिखाते हैं कि जीवन में सच में क्या ज़रूरी है। वे सुंदर धागे की तरह संसार को जोड़े रखते हैं और उसे बढ़ाते रहते हैं। वे इंद्र और देवताओं की सहायता करते हैं, और उनके कर्म महान हैं। उन्हें कुछ पाना बाकी नहीं, फिर भी हमें राह दिखाने के लिए उन्होंने पवित्र शिक्षाएँ दीं।"]},
85:{"w": [["उद्भवः", "Ud-bha-vah", "Takes birth by His own wish", "తన ఇష్టంతో అవతరించేవాడు", "अपनी इच्छा से जन्म लेने वाले"], ["सुन्दरः", "Sun-da-rah", "The most beautiful", "అందరికంటే అందమైనవాడు", "सबसे सुंदर"], ["सुन्दः", "Sun-dah", "Kind and gentle to all", "అందరిపై దయ చూపేవాడు", "सब पर दया करने वाले"], ["रत्ननाभः", "Rat-na-naa-bhah", "His navel is lovely like a jewel", "రత్నం వంటి అందమైన నాభి కలవాడు", "रत्न जैसी सुंदर नाभि वाले"], ["सुलोचनः", "Su-lo-cha-nah", "Has beautiful eyes", "అందమైన కళ్ళు కలవాడు", "सुंदर नेत्रों वाले"], ["अर्कः", "Ar-kah", "Worshipped by all", "అందరూ పూజించేవాడు", "सबके पूजनीय"], ["वाजसनः", "Vaa-ja-sa-nah", "Gives food to all", "అందరికీ ఆహారం ఇచ్చేవాడు", "सबको अन्न देने वाले"], ["शृङ्गी", "Shrin-gee", "Came as the fish with a horn (Matsya)", "కొమ్ము ఉన్న చేపగా (మత్స్యుడిగా) వచ్చినవాడు", "सींग वाली मछली (मत्स्य) बनकर आने वाले"], ["जयन्तः", "Ja-yan-tah", "Always wins over enemies", "శత్రువులను ఎప్పుడూ జయించేవాడు", "शत्रुओं पर सदा विजय पाने वाले"], ["सर्वविज्जयी", "Sar-va-vij-ja-yee", "Knows everything and wins over all", "అన్నీ తెలిసినవాడు, అందరినీ జయించేవాడు", "सब जानने वाले और सब पर विजयी"]], "v": ["Vishnu takes birth by His own wish. He is the most beautiful, kind and gentle to all, with a jewel-like navel and lovely eyes. Everyone worships Him, and He feeds every being. He came as the horned fish to save the Vedas. He always wins, because He knows everything.", "విష్ణువు తన ఇష్టంతోనే అవతరిస్తాడు. ఆయన అందరికంటే అందమైనవాడు, అందరిపై దయ చూపేవాడు; రత్నం వంటి నాభి, అందమైన కళ్ళు కలవాడు. అందరూ ఆయనను పూజిస్తారు, ఆయన ప్రతి జీవికీ ఆహారం ఇస్తాడు. వేదాలను కాపాడటానికి కొమ్ము ఉన్న చేపగా వచ్చాడు. అన్నీ తెలిసినవాడు కాబట్టి ఎప్పుడూ జయిస్తాడు.", "विष्णु अपनी इच्छा से जन्म लेते हैं। वे सबसे सुंदर हैं, सब पर दया करते हैं, उनकी नाभि रत्न जैसी और आँखें सुंदर हैं। सब उनकी पूजा करते हैं, और वे हर प्राणी को अन्न देते हैं। वेदों को बचाने के लिए वे सींग वाली मछली बनकर आए। वे सब कुछ जानते हैं, इसलिए सदा विजयी रहते हैं।"]},
86:{"w": [["सुवर्णबिन्दुः", "Su-var-na-bin-duh", "Shines like gold", "బంగారంలా ప్రకాశించేవాడు", "सोने जैसे चमकने वाले"], ["अक्षोभ्यः", "Ak-sho-bhyah", "Never upset or shaken", "ఎప్పుడూ కలత చెందనివాడు", "कभी विचलित न होने वाले"], ["सर्ववागीश्वरेश्वरः", "Sar-va-vaa-gee-shva-re-shva-rah", "Lord even of the masters of speech and wisdom", "వాక్కుకు, జ్ఞానానికి అధిపతులైనవారికీ ప్రభువు", "वाणी और ज्ञान के स्वामियों के भी स्वामी"], ["महाह्रदः", "Ma-haa-hra-dah", "Like a great cool lake of joy", "ఆనందం నిండిన గొప్ప చల్లని సరస్సు వంటివాడు", "आनंद से भरी बड़ी शीतल झील जैसे"], ["महागर्तः", "Ma-haa-gar-tah", "His maya is deep like a chasm, hard to cross", "లోతైన గొయ్యిలా దాటలేని మాయ కలవాడు", "गहरी खाई जैसी अपार माया वाले"], ["महाभूतः", "Ma-haa-bhoo-tah", "Great and beyond time", "కాలానికి అతీతమైన గొప్పవాడు", "काल से परे महान"], ["महानिधिः", "Ma-haa-ni-dhih", "The greatest treasure", "అన్నిటికంటే గొప్ప నిధి", "सबसे बड़ा खज़ाना"]], "v": ["Vishnu shines like gold and is never shaken. He is Lord even over the masters of speech and wisdom. He is like a great cool lake where devotees bathe in joy, yet His maya is deep like a chasm and hard to cross. He is great beyond time, the greatest treasure of all.", "విష్ణువు బంగారంలా ప్రకాశిస్తాడు, ఎప్పుడూ కలత చెందడు. వాక్కుకు, జ్ఞానానికి అధిపతులైనవారికీ ఆయనే ప్రభువు. భక్తులు ఆనందంలో మునిగే గొప్ప చల్లని సరస్సు వంటివాడు; అయినా ఆయన మాయ లోతైన గొయ్యిలా దాటడం కష్టం. కాలానికి అతీతమైన గొప్పవాడు, అన్నిటికంటే గొప్ప నిధి.", "विष्णु सोने जैसे चमकते हैं और कभी विचलित नहीं होते। वे वाणी और ज्ञान के स्वामियों के भी स्वामी हैं। वे एक बड़ी शीतल झील जैसे हैं जिसमें भक्त आनंद में नहाते हैं, फिर भी उनकी माया गहरी खाई जैसी है, जिसे पार करना कठिन है। वे काल से परे महान और सबसे बड़ा खज़ाना हैं।"]},
87:{"w": [["कुमुदः", "Ku-mu-dah", "Brings joy to the earth", "భూమికి ఆనందం ఇచ్చేవాడు", "पृथ्वी को आनंद देने वाले"], ["कुन्दरः", "Kun-da-rah", "Gives pure blessings", "స్వచ్ఛమైన వరాలు ఇచ్చేవాడు", "शुद्ध वर देने वाले"], ["कुन्दः", "Kun-dah", "Pure and lovely like the jasmine flower", "మల్లెపువ్వులా స్వచ్ఛమైనవాడు, అందమైనవాడు", "कुंद फूल जैसे शुद्ध और सुंदर"], ["पर्जन्यः", "Par-jan-yah", "Like a rain cloud, pours blessings", "మేఘంలా వరాల వర్షం కురిపించేవాడు", "बादल की तरह कृपा बरसाने वाले"], ["पावनः", "Paa-va-nah", "Makes us pure", "మనల్ని పవిత్రం చేసేవాడు", "हमें पवित्र करने वाले"], ["अनिलः", "A-ni-lah", "Always awake and watchful", "ఎప్పుడూ మేల్కొని కాపాడేవాడు", "सदा जागकर रक्षा करने वाले"], ["अमृताशः", "A-mri-taa-shah", "Enjoys the nectar of His own bliss", "తన ఆనందమనే అమృతాన్ని అనుభవించేవాడు", "अपने आनंद रूपी अमृत का भोग करने वाले"], ["अमृतवपुः", "A-mri-ta-va-puh", "His form never dies", "ఎప్పటికీ నశించని రూపం కలవాడు", "कभी न मिटने वाले रूप वाले"], ["सर्वज्ञः", "Sar-vaj-nah", "Knows everything", "అన్నీ తెలిసినవాడు", "सब कुछ जानने वाले"], ["सर्वतोमुखः", "Sar-va-to-mu-khah", "Faces every way; we can reach Him from anywhere", "అన్ని వైపులా ముఖం కలవాడు; ఎక్కడినుంచైనా చేరగలవాడు", "हर ओर मुख वाले; कहीं से भी पहुँचने योग्य"]], "v": ["Vishnu brings joy to the earth and gives pure blessings. He is pure and lovely like the jasmine flower. Like a rain cloud He pours blessings, and He makes us pure. He is always awake and watchful. He enjoys the nectar of His own bliss, and His form never dies. He knows everything, and we can reach Him from anywhere.", "విష్ణువు భూమికి ఆనందం ఇస్తాడు, స్వచ్ఛమైన వరాలు ఇస్తాడు. మల్లెపువ్వులా స్వచ్ఛమైనవాడు, అందమైనవాడు. మేఘంలా వరాల వర్షం కురిపిస్తాడు, మనల్ని పవిత్రం చేస్తాడు. ఎప్పుడూ మేల్కొని కాపాడుతాడు. తన ఆనందమనే అమృతాన్ని అనుభవిస్తాడు, ఆయన రూపం ఎప్పటికీ నశించదు. అన్నీ తెలిసినవాడు; ఎక్కడినుంచైనా ఆయనను చేరవచ్చు.", "विष्णु पृथ्वी को आनंद देते हैं और शुद्ध वर देते हैं। वे कुंद फूल जैसे शुद्ध और सुंदर हैं। बादल की तरह कृपा बरसाते हैं और हमें पवित्र करते हैं। वे सदा जागकर रक्षा करते हैं। अपने आनंद रूपी अमृत का भोग करते हैं, और उनका रूप कभी नहीं मिटता। वे सब जानते हैं, और उन तक कहीं से भी पहुँचा जा सकता है।"]},
88:{"w": [["सुलभः", "Su-la-bhah", "Easy to reach with simple devotion", "సాధారణ భక్తితో సులభంగా దొరికేవాడు", "सरल भक्ति से आसानी से मिलने वाले"], ["सुव्रतः", "Su-vra-tah", "Keeps His promise to protect", "రక్షిస్తానన్న మాట నిలబెట్టుకునేవాడు", "रक्षा का वचन निभाने वाले"], ["सिद्धः", "Sid-dhah", "Always complete; needs nothing", "ఎప్పుడూ పరిపూర్ణుడు; ఏదీ అవసరం లేనివాడు", "सदा पूर्ण; जिन्हें कुछ नहीं चाहिए"], ["शत्रुजित्", "Sha-tru-jit", "Wins over enemies", "శత్రువులను జయించేవాడు", "शत्रुओं को जीतने वाले"], ["शत्रुतापनः", "Sha-tru-taa-pa-nah", "Punishes those who hurt good people", "మంచివారిని బాధించేవారిని శిక్షించేవాడు", "सज्जनों को सताने वालों को दंड देने वाले"], ["न्यग्रोधः", "Nyag-ro-dhah", "Like the banyan tree, gives shelter to all", "మర్రిచెట్టులా అందరికీ నీడ ఇచ్చేవాడు", "बरगद की तरह सबको छाया देने वाले"], ["उदुम्बरः", "U-dum-ba-rah", "Above all, and gives food to all", "అందరికంటే పైనున్నవాడు, అందరికీ ఆహారం ఇచ్చేవాడు", "सबसे ऊपर, और सबको अन्न देने वाले"], ["अश्वत्थः", "Ash-vat-thah", "Like the holy peepal tree", "పవిత్రమైన రావిచెట్టు వంటివాడు", "पवित्र पीपल वृक्ष जैसे"], ["चाणूरान्ध्रनिषूदनः", "Chaa-noo-raan-dhra-ni-shoo-da-nah", "As Krishna, defeated the wrestler Chanura", "కృష్ణుడిగా మల్లుడైన చాణూరుని సంహరించినవాడు", "कृष्ण रूप में पहलवान चाणूर का वध करने वाले"]], "v": ["Vishnu is easy to reach with simple devotion, and He keeps His promise to protect us. He is always complete and needs nothing. He wins over enemies and punishes those who hurt good people. Like the banyan, the fig and the holy peepal tree, He gives shelter and food to all. As Krishna, He defeated the wrestler Chanura.", "విష్ణువు సాధారణ భక్తితోనే సులభంగా దొరుకుతాడు, రక్షిస్తానన్న మాట నిలబెట్టుకుంటాడు. ఎప్పుడూ పరిపూర్ణుడు, ఆయనకు ఏదీ అవసరం లేదు. శత్రువులను జయిస్తాడు, మంచివారిని బాధించేవారిని శిక్షిస్తాడు. మర్రి, మేడి, రావి చెట్లలా అందరికీ నీడ, ఆహారం ఇస్తాడు. కృష్ణుడిగా మల్లుడైన చాణూరుని సంహరించాడు.", "विष्णु सरल भक्ति से आसानी से मिल जाते हैं, और रक्षा का अपना वचन निभाते हैं। वे सदा पूर्ण हैं, उन्हें कुछ नहीं चाहिए। वे शत्रुओं को जीतते हैं और सज्जनों को सताने वालों को दंड देते हैं। बरगद, गूलर और पीपल की तरह वे सबको छाया और अन्न देते हैं। कृष्ण रूप में उन्होंने पहलवान चाणूर का वध किया।"]},
89:{"w": [["सहस्रार्चिः", "Sa-has-raar-chih", "Shines with a thousand rays", "వేల కిరణాలతో ప్రకాశించేవాడు", "हज़ारों किरणों से चमकने वाले"], ["सप्तजिह्वः", "Sap-ta-jih-vah", "Is the fire with seven flames", "ఏడు జ్వాలల అగ్ని రూపుడు", "सात लपटों वाली अग्नि रूप"], ["सप्तैधाः", "Sap-tai-dhaah", "Shines in seven ways", "ఏడు విధాలుగా ప్రకాశించేవాడు", "सात प्रकार से दीप्त"], ["सप्तवाहनः", "Sap-ta-vaa-ha-nah", "As the sun, rides seven horses", "సూర్యుడిగా ఏడు గుర్రాల రథం ఎక్కేవాడు", "सूर्य रूप में सात घोड़ों पर चलने वाले"], ["अमूर्तिः", "A-moor-tih", "Has no body made by karma", "కర్మతో ఏర్పడిన శరీరం లేనివాడు", "कर्म से बने शरीर से रहित"], ["अनघः", "A-na-ghah", "No sin can touch Him", "ఏ పాపమూ అంటనివాడు", "जिन्हें कोई पाप छू न सके"], ["अचिन्त्यः", "A-chin-tyah", "Beyond our thinking", "మన ఆలోచనకు అందనివాడు", "हमारी सोच से परे"], ["भयकृत्", "Bha-ya-krit", "Brings fear to the wicked", "దుష్టులకు భయం కలిగించేవాడు", "दुष्टों में भय पैदा करने वाले"], ["भयनाशनः", "Bha-ya-naa-sha-nah", "Removes the fear of good people", "మంచివారి భయాన్ని పోగొట్టేవాడు", "सज्जनों का भय मिटाने वाले"]], "v": ["Vishnu shines with a thousand rays. He is the sacred fire with seven flames, and as the sun He rides seven horses. He has no body made by karma, no sin can touch Him, and He is beyond our thinking. He brings fear to the wicked and removes the fear of good people.", "విష్ణువు వేల కిరణాలతో ప్రకాశిస్తాడు. ఏడు జ్వాలల పవిత్ర అగ్ని ఆయనే; సూర్యుడిగా ఏడు గుర్రాల రథం ఎక్కుతాడు. కర్మతో ఏర్పడిన శరీరం ఆయనకు లేదు, ఏ పాపమూ ఆయనను అంటదు, మన ఆలోచనకు అందడు. దుష్టులకు భయం కలిగిస్తాడు, మంచివారి భయాన్ని పోగొడతాడు.", "विष्णु हज़ारों किरणों से चमकते हैं। वे सात लपटों वाली पवित्र अग्नि हैं, और सूर्य रूप में सात घोड़ों पर चलते हैं। उनका शरीर कर्म से नहीं बना, कोई पाप उन्हें छू नहीं सकता, और वे हमारी सोच से परे हैं। वे दुष्टों में भय पैदा करते हैं और सज्जनों का भय मिटाते हैं।"]},
90:{"w": [["अणुः", "A-nuh", "Smaller than the smallest", "అతి చిన్నదానికంటే చిన్నవాడు", "सूक्ष्म से भी सूक्ष्म"], ["बृहत्", "Bri-hat", "Bigger than the biggest", "అతి పెద్దదానికంటే పెద్దవాడు", "बड़े से भी बड़े"], ["कृशः", "Kri-shah", "Light and slender", "తేలికైనవాడు, సన్నని రూపం కలవాడు", "हल्के और पतले"], ["स्थूलः", "Sthoo-lah", "Huge; the whole world we see", "స్థూలమైనవాడు; కనిపించే జగత్తంతా ఆయనే", "स्थूल; पूरा दिखने वाला जगत"], ["गुणभृत्", "Gu-na-bhrit", "Holds all good qualities", "అన్ని మంచి గుణాలు కలవాడు", "सभी अच्छे गुणों को धारण करने वाले"], ["निर्गुणः", "Nir-gu-nah", "Has no bad qualities", "ఏ చెడు గుణమూ లేనివాడు", "किसी बुरे गुण से रहित"], ["महान्", "Ma-haan", "Truly great", "నిజంగా గొప్పవాడు", "सचमुच महान"], ["अधृतः", "A-dhri-tah", "Needs no one to hold Him up", "ఎవరి ఆధారమూ అవసరం లేనివాడు", "जिन्हें किसी सहारे की ज़रूरत नहीं"], ["स्वधृतः", "Sva-dhri-tah", "Holds Himself up", "తనను తానే నిలుపుకునేవాడు", "स्वयं को स्वयं धारण करने वाले"], ["स्वास्यः", "Svaas-yah", "Has a beautiful face; taught the Vedas", "అందమైన ముఖం కలవాడు; వేదాలు బోధించినవాడు", "सुंदर मुख वाले; वेदों का उपदेश करने वाले"], ["प्राग्वंशः", "Praag-vam-shah", "From the oldest family line of all", "అతి ప్రాచీన వంశం కలవాడు", "सबसे प्राचीन वंश वाले"], ["वंशवर्धनः", "Vam-sha-var-dha-nah", "Makes families grow", "వంశాన్ని వృద్ధి చేసేవాడు", "वंश को बढ़ाने वाले"]], "v": ["Vishnu is smaller than the smallest and bigger than the biggest. He can be light and slender, or huge as the whole world we see. He has every good quality and no bad ones; He is truly great. No one holds Him up; He holds Himself. His face is beautiful, and He taught the Vedas. He comes from the oldest line of all and makes families grow.", "విష్ణువు అతి చిన్నదానికంటే చిన్నవాడు, అతి పెద్దదానికంటే పెద్దవాడు. తేలికగా సన్నగానూ ఉండగలడు, కనిపించే జగత్తంతా అంత పెద్దగానూ ఉండగలడు. అన్ని మంచి గుణాలు ఉన్నాయి, ఏ చెడు గుణమూ లేదు; నిజంగా గొప్పవాడు. ఆయనను ఎవరూ నిలపరు; తనను తానే నిలుపుకుంటాడు. అందమైన ముఖం కలవాడు, వేదాలు బోధించాడు. అతి ప్రాచీన వంశం కలవాడు, వంశాలను వృద్ధి చేస్తాడు.", "विष्णु सूक्ष्म से भी सूक्ष्म और बड़े से भी बड़े हैं। वे हल्के और पतले भी हो सकते हैं, और पूरे दिखने वाले जगत जितने विशाल भी। उनमें सब अच्छे गुण हैं, कोई बुरा गुण नहीं; वे सचमुच महान हैं। उन्हें कोई नहीं थामता; वे स्वयं को थामते हैं। उनका मुख सुंदर है, और उन्होंने वेदों का उपदेश दिया। वे सबसे प्राचीन वंश के हैं और वंशों को बढ़ाते हैं।"]},
91:{"w": [["भारभृत्", "Bhaa-ra-bhrit", "Carries the weight of the world", "లోక భారాన్ని మోసేవాడు", "संसार का भार उठाने वाले"], ["कथितः", "Ka-thi-tah", "Praised in all the scriptures", "అన్ని శాస్త్రాలలో కీర్తించబడినవాడు", "सभी शास्त्रों में वर्णित"], ["योगी", "Yo-gee", "Reached through yoga", "యోగం ద్వారా అందేవాడు", "योग से प्राप्त होने वाले"], ["योगीशः", "Yo-gee-shah", "Lord of the yogis", "యోగులకు ప్రభువు", "योगियों के स्वामी"], ["सर्वकामदः", "Sar-va-kaa-ma-dah", "Fulfils every good wish", "అన్ని మంచి కోరికలు తీర్చేవాడు", "सभी शुभ इच्छाएँ पूरी करने वाले"], ["आश्रमः", "Aa-shra-mah", "A resting place for all", "అందరికీ విశ్రాంతి స్థానం", "सबका विश्राम स्थान"], ["श्रमणः", "Shra-ma-nah", "Corrects those who go the wrong way", "తప్పు దారిలో వెళ్ళేవారిని సరిదిద్దేవాడు", "गलत राह पर चलने वालों को सुधारने वाले"], ["क्षामः", "Kshaa-mah", "At the end, takes everything back into Himself", "ప్రళయంలో అన్నిటినీ తనలో చేర్చుకునేవాడు", "प्रलय में सबको अपने में समा लेने वाले"], ["सुपर्णः", "Su-par-nah", "Like a tree whose lovely leaves are the Vedas", "వేదాలనే అందమైన ఆకులు గల చెట్టు వంటివాడు", "वेद रूपी सुंदर पत्तों वाले वृक्ष जैसे"], ["वायुवाहनः", "Vaa-yu-vaa-ha-nah", "Makes even the wind move", "గాలిని కూడా నడిపించేవాడు", "वायु को भी चलाने वाले"]], "v": ["Vishnu carries the weight of the world, and all the scriptures praise Him. He is reached through yoga and is Lord of the yogis. He fulfils every good wish and is a resting place for all. He corrects those who go the wrong way, and at the end He takes everything back into Himself. He is like a tree whose leaves are the Vedas, and He makes even the wind move.", "విష్ణువు లోక భారాన్ని మోస్తాడు, అన్ని శాస్త్రాలు ఆయనను కీర్తిస్తాయి. యోగం ద్వారా అందుతాడు, యోగులకు ప్రభువు. అన్ని మంచి కోరికలు తీరుస్తాడు, అందరికీ విశ్రాంతి స్థానం. తప్పు దారిలో వెళ్ళేవారిని సరిదిద్దుతాడు, చివరికి అన్నిటినీ తనలో చేర్చుకుంటాడు. వేదాలనే ఆకులు గల చెట్టు వంటివాడు, గాలిని కూడా ఆయనే నడిపిస్తాడు.", "विष्णु संसार का भार उठाते हैं, और सभी शास्त्र उनकी स्तुति करते हैं। वे योग से प्राप्त होते हैं और योगियों के स्वामी हैं। वे हर शुभ इच्छा पूरी करते हैं और सबका विश्राम स्थान हैं। गलत राह पर चलने वालों को सुधारते हैं, और अंत में सबको अपने में समा लेते हैं। वे वेद रूपी पत्तों वाले वृक्ष जैसे हैं, और वायु को भी वही चलाते हैं।"]},
92:{"w": [["धनुर्धरः", "Dha-nur-dha-rah", "Holds the bow (as Rama)", "విల్లు ధరించినవాడు (రాముడిగా)", "धनुष धारण करने वाले (राम रूप में)"], ["धनुर्वेदः", "Dha-nur-ve-dah", "Knows the art of archery", "విలువిద్య తెలిసినవాడు", "धनुर्विद्या जानने वाले"], ["दण्डः", "Dan-dah", "Punishes wrongdoing", "తప్పు చేసినవారిని శిక్షించేవాడు", "गलत काम का दंड देने वाले"], ["दमयिता", "Da-ma-yi-taa", "Keeps people under control", "ప్రజలను అదుపులో ఉంచేవాడు", "लोगों को नियंत्रण में रखने वाले"], ["दमः", "Da-mah", "Is self-control itself", "నిగ్రహమే ఆయన", "स्वयं संयम रूप"], ["अपराजितः", "A-pa-raa-ji-tah", "Never defeated", "ఎప్పుడూ ఓడిపోనివాడు", "कभी न हारने वाले"], ["सर्वसहः", "Sar-va-sa-hah", "Patient with everything", "అన్నిటినీ ఓర్పుతో భరించేవాడు", "सब कुछ धैर्य से सहने वाले"], ["नियन्ता", "Ni-yan-taa", "Guides everyone in their duty", "అందరినీ వారి ధర్మంలో నడిపించేవాడు", "सबको उनके कर्तव्य में चलाने वाले"], ["अनियमः", "A-ni-ya-mah", "No one can control Him", "ఆయనను ఎవరూ నియంత్రించలేరు", "जिन्हें कोई नियंत्रित न कर सके"], ["अयमः", "A-ya-mah", "Beyond death", "మృత్యువుకు అతీతుడు", "मृत्यु से परे"]], "v": ["As Rama, Vishnu holds the bow and knows the art of archery. He punishes wrongdoing and keeps people under control; He is self-control itself. He is never defeated and is patient with everything. He guides everyone in their duty, yet no one can control Him, and He is beyond death.", "రాముడిగా విష్ణువు విల్లు ధరిస్తాడు, విలువిద్య తెలిసినవాడు. తప్పు చేసినవారిని శిక్షిస్తాడు, ప్రజలను అదుపులో ఉంచుతాడు; నిగ్రహమే ఆయన. ఎప్పుడూ ఓడిపోడు, అన్నిటినీ ఓర్పుతో భరిస్తాడు. అందరినీ వారి ధర్మంలో నడిపిస్తాడు, కానీ ఆయనను ఎవరూ నియంత్రించలేరు; మృత్యువుకు అతీతుడు.", "राम रूप में विष्णु धनुष धारण करते हैं और धनुर्विद्या जानते हैं। वे गलत काम का दंड देते हैं और लोगों को नियंत्रण में रखते हैं; वे स्वयं संयम हैं। वे कभी नहीं हारते और सब कुछ धैर्य से सहते हैं। वे सबको उनके कर्तव्य में चलाते हैं, पर उन्हें कोई नियंत्रित नहीं कर सकता, और वे मृत्यु से परे हैं।"]},
93:{"w": [["सत्त्ववान्", "Sat-tva-vaan", "Full of strength and courage", "బలం, ధైర్యం నిండినవాడు", "बल और साहस से भरे"], ["सात्त्विकः", "Saat-tvi-kah", "Pure and calm by nature", "స్వభావంతో స్వచ్ఛమైన, శాంతమైనవాడు", "स्वभाव से शुद्ध और शांत"], ["सत्यः", "Sat-yah", "Truth itself; good to the good", "సత్యమే ఆయన; మంచివారికి మంచివాడు", "स्वयं सत्य; सज्जनों के हितैषी"], ["सत्यधर्मपरायणः", "Sat-ya-dhar-ma-pa-raa-ya-nah", "Devoted to truth and dharma", "సత్యానికి, ధర్మానికి అంకితమైనవాడు", "सत्य और धर्म के प्रति समर्पित"], ["अभिप्रायः", "A-bhi-praa-yah", "The one everyone longs for", "అందరూ కోరుకునేవాడు", "जिन्हें सब चाहते हैं"], ["प्रियार्हः", "Pri-yaar-hah", "Worthy of our dearest offerings", "మనకు ఇష్టమైనవి సమర్పించదగినవాడు", "हमारी प्रिय वस्तुएँ अर्पण करने योग्य"], ["अर्हः", "Ar-hah", "Worthy of worship", "పూజించదగినవాడు", "पूजा के योग्य"], ["प्रियकृत्", "Pri-ya-krit", "Does good for His devotees", "భక్తులకు మేలు చేసేవాడు", "भक्तों का भला करने वाले"], ["प्रीतिवर्धनः", "Pree-ti-var-dha-nah", "Makes love and devotion grow", "ప్రేమను, భక్తిని పెంచేవాడు", "प्रेम और भक्ति बढ़ाने वाले"]], "v": ["Vishnu is full of strength and courage, yet pure and calm by nature. He is truth itself and is devoted to truth and dharma. Everyone longs for Him; He is worthy of our dearest offerings and of worship. He does good for His devotees and makes their love and devotion grow.", "విష్ణువు బలం, ధైర్యం నిండినవాడు; అయినా స్వభావంతో స్వచ్ఛమైన, శాంతమైనవాడు. సత్యమే ఆయన, సత్యానికి, ధర్మానికి అంకితమైనవాడు. అందరూ ఆయనను కోరుకుంటారు; మనకు ఇష్టమైనవి సమర్పించదగినవాడు, పూజించదగినవాడు. భక్తులకు మేలు చేస్తాడు, వారి ప్రేమను, భక్తిని పెంచుతాడు.", "विष्णु बल और साहस से भरे हैं, फिर भी स्वभाव से शुद्ध और शांत हैं। वे स्वयं सत्य हैं और सत्य व धर्म के प्रति समर्पित हैं। सब उन्हें चाहते हैं; वे हमारी प्रिय वस्तुओं के अर्पण और पूजा के योग्य हैं। वे भक्तों का भला करते हैं और उनका प्रेम व भक्ति बढ़ाते हैं।"]},
