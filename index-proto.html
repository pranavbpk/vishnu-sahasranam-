var DHY=[{"sa": ["क्षीरोदन्वत्प्रदेशे शुचिमणिविलसत्सैकते मौक्तिकानां", "मालाकॢप्तासनस्थः स्फटिकमणिनिभैर्मौक्तिकैर्मण्डिताङ्गः ।", "शुभ्रैरभ्रैरदभ्रैरुपरिविरचितैर्मुक्तपीयूषवर्षैः", "आनन्दी नः पुनीयादरिनलिनगदाशङ्खपाणिर्मुकुन्दः ॥१॥"], "tr": "Kshīrodanvat-pradeshe shuchi-mani-vilasat-saikate mauktikānām, mālā-kluptāsana-sthah sphatika-mani-nibhair mauktikair manditāngah, shubhrair abhrair adabhrair upari-virachitair mukta-pīyūsha-varshaih, ānandī nah punīyād ari-nalina-gadā-shankha-pānir mukundah.", "m": {"en": "On the shore of the milk ocean, seated on a throne of pearls, adorned with pearls, under white clouds raining nectar, may joyful Mukunda, holding the discus, lotus, mace and conch, make us pure.", "te": "పాలసముద్ర తీరంలో, ముత్యాల ఆసనంపై కూర్చుని, ముత్యాలతో అలంకరించబడి, అమృతం కురిపించే తెల్లని మేఘాల కింద, చక్రం, పద్మం, గద, శంఖం ధరించిన ఆనందమయుడైన ముకుందుడు మనల్ని పవిత్రం చేయుగాక.", "hi": "क्षीर सागर के तट पर, मोतियों के आसन पर बैठे, मोतियों से सजे, अमृत बरसाते श्वेत बादलों के नीचे, चक्र, कमल, गदा और शंख धारण किए आनंदमय मुकुंद हमें पवित्र करें।"}}, {"sa": ["भूः पादौ यस्य नाभिर्वियदसुरनिलश्चन्द्रसूर्यौ च नेत्रे", "कर्णावाशाः शिरो द्यौर्मुखमपि दहनो यस्य वास्तेयमब्धिः ।", "अन्तःस्थं यस्य विश्वं सुरनरखगगोभोगिगन्धर्वदैत्यैः", "चित्रं रंरम्यते तं त्रिभुवनवपुषं विष्णुमीशं नमामि ॥२॥"], "tr": "Bhūh pādau yasya nābhir viyad asur anilash chandra-sūryau cha netre, karnāv āshāh shiro dyaur mukham api dahano yasya vāsteyam abdhih, antah-stham yasya vishvam sura-nara-khaga-go-bhogi-gandharva-daityaih, chitram ram-ramyate tam tri-bhuvana-vapusham vishnum īsham namāmi.", "m": {"en": "The earth is His feet, the sky His navel, the wind His breath, the sun and moon His eyes, the directions His ears, the heavens His head, fire His mouth, the ocean His belly. The whole world, with gods, people, birds, animals and all beings, plays within Him. I bow to Vishnu, whose body is the three worlds.", "te": "భూమి ఆయన పాదాలు, ఆకాశం నాభి, గాలి ప్రాణం, సూర్యచంద్రులు కళ్ళు, దిక్కులు చెవులు, స్వర్గం శిరస్సు, అగ్ని ముఖం, సముద్రం ఉదరం. దేవతలు, మనుషులు, పక్షులు, జంతువులు, అన్ని జీవులతో విశ్వమంతా ఆయనలో ఆడుకుంటుంది. మూడు లోకాలే శరీరమైన విష్ణువుకు నమస్కరిస్తున్నాను.", "hi": "धरती उनके चरण हैं, आकाश नाभि, वायु प्राण, सूर्य और चंद्र आँखें, दिशाएँ कान, स्वर्ग सिर, अग्नि मुख, सागर उदर। देवता, मनुष्य, पक्षी, पशु और सब जीवों सहित पूरा संसार उनमें खेलता है। तीनों लोक जिनका शरीर हैं, उन विष्णु को नमस्कार।"}}, {"sa": ["शान्ताकारं भुजगशयनं पद्मनाभं सुरेशं", "विश्वाधारं गगनसदृशं मेघवर्णं शुभाङ्गम् ।", "लक्ष्मीकान्तं कमलनयनं योगिहृद्ध्यानगम्यं", "वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम् ॥३॥"], "tr": "Shāntākāram bhujaga-shayanam padma-nābham suresham, vishvādhāram gagana-sadrisham megha-varnam shubhāngam, lakshmī-kāntam kamala-nayanam yogi-hrid-dhyāna-gamyam, vande vishnum bhava-bhaya-haram sarva-lokaika-nātham.", "m": {"en": "Peaceful in form, resting on the serpent, with a lotus at His navel, Lord of the gods, support of the universe, vast like the sky, dark like a rain cloud, beautiful, beloved of Lakshmi, lotus-eyed, reached by yogis in meditation, remover of the fear of worldly life, the one Lord of all worlds: I bow to Vishnu.", "te": "శాంత స్వరూపుడు, శేషుడిపై పవళించేవాడు, నాభిలో పద్మం కలవాడు, దేవతల ప్రభువు, విశ్వానికి ఆధారం, ఆకాశంలా విశాలుడు, మేఘవర్ణుడు, శుభాంగుడు, లక్ష్మీదేవి ప్రియుడు, కమలనయనుడు, యోగులు ధ్యానంలో చేరేవాడు, సంసార భయం తొలగించేవాడు, సర్వలోకాలకూ ఏకైక నాథుడు అయిన విష్ణువుకు నమస్కారం.", "hi": "शांत रूप वाले, शेषनाग पर शयन करने वाले, नाभि में कमल वाले, देवताओं के स्वामी, विश्व के आधार, आकाश जैसे विशाल, मेघ जैसे श्याम, सुंदर अंगों वाले, लक्ष्मी के प्रिय, कमल नयन, योगियों के ध्यान में मिलने वाले, संसार का भय हरने वाले, सब लोकों के एक स्वामी विष्णु को मैं प्रणाम करता हूँ।"}}, {"sa": ["मेघश्यामं पीतकौशेयवासं", "श्रीवत्साङ्कं कौस्तुभोद्भासिताङ्गम् ।", "पुण्योपेतं पुण्डरीकायताक्षं", "विष्णुं वन्दे सर्वलोकैकनाथम् ॥४॥"], "tr": "Megha-shyāmam pīta-kausheya-vāsam, shrīvatsānkam kaustubhodbhāsitāngam, punyopetam pundarīkāyatāksham, vishnum vande sarva-lokaika-nātham.", "m": {"en": "Dark like a rain cloud, dressed in yellow silk, with the Shrivatsa mark and the shining Kaustubha jewel, full of goodness, with long lotus eyes: I bow to Vishnu, the one Lord of all worlds.", "te": "మేఘంలా నల్లనివాడు, పచ్చని పట్టు వస్త్రం ధరించినవాడు, శ్రీవత్స చిహ్నం, మెరిసే కౌస్తుభ మణి కలవాడు, పుణ్యమయుడు, పొడవైన కమల నేత్రాలవాడు, సర్వలోకనాథుడైన విష్ణువుకు నమస్కారం.", "hi": "मेघ जैसे श्याम, पीले रेशमी वस्त्र पहने, श्रीवत्स चिह्न और चमकती कौस्तुभ मणि वाले, पुण्यमय, लंबे कमल नयनों वाले, सब लोकों के एक स्वामी विष्णु को प्रणाम।"}}, {"sa": ["नमः समस्तभूतानामादिभूताय भूभृते ।", "अनेकरूपरूपाय विष्णवे प्रभविष्णवे ॥५॥"], "tr": "Namah samasta-bhūtānām ādi-bhūtāya bhū-bhrite, aneka-rūpa-rūpāya vishnave prabha-vishnave.", "m": {"en": "Salutations to Vishnu, the origin of all beings, who holds up the earth, who takes many forms, the all-powerful Lord.", "te": "అన్ని జీవులకూ మూలమైనవాడు, భూమిని ధరించేవాడు, అనేక రూపాలు ధరించేవాడు, సర్వశక్తిమంతుడైన విష్ణువుకు నమస్కారం.", "hi": "सब प्राणियों के मूल, धरती को धारण करने वाले, अनेक रूपों वाले, सर्वशक्तिमान विष्णु को नमस्कार।"}}, {"sa": ["सशङ्खचक्रं सकिरीटकुण्डलं", "सपीतवस्त्रं सरसीरुहेक्षणम् ।", "सहारवक्षःस्थलशोभिकौस्तुभं", "नमामि विष्णुं शिरसा चतुर्भुजम् ॥६॥"], "tr": "Sa-shankha-chakram sa-kirīta-kundalam, sa-pīta-vastram sarasīruhekshanam, sa-hāra-vakshah-sthala-shobhi-kaustubham, namāmi vishnum shirasā chatur-bhujam.", "m": {"en": "With conch and discus, crown and earrings, yellow robe and lotus eyes, a garland and the Kaustubha jewel shining on His chest: I bow my head to four-armed Vishnu.", "te": "శంఖ చక్రాలు, కిరీట కుండలాలు, పచ్చని వస్త్రం, కమల నేత్రాలు, వక్షస్థలంపై హారం, మెరిసే కౌస్తుభం కలిగిన చతుర్భుజుడైన విష్ణువుకు శిరసు వంచి నమస్కరిస్తున్నాను.", "hi": "शंख और चक्र, मुकुट और कुंडल, पीले वस्त्र, कमल नयन, छाती पर हार और चमकती कौस्तुभ मणि वाले चार भुजाओं वाले विष्णु को मैं सिर झुकाकर प्रणाम करता हूँ।"}}, {"sa": ["छायायां पारिजातस्य हेमसिंहासनोपरि ।", "आसीनमम्बुदश्याममायताक्षमलंकृतम् ॥७॥"], "tr": "Chhāyāyām pārijātasya hema-simhāsanopari, āsīnam ambuda-shyāmam āyatāksham alankritam.", "m": {"en": "In the shade of the Parijata tree, seated on a golden throne, dark like a cloud, with long eyes, beautifully adorned.", "te": "పారిజాత వృక్షపు నీడలో, బంగారు సింహాసనంపై కూర్చున్న, మేఘంలా నల్లని, పొడవైన కళ్ళు కలిగిన, అందంగా అలంకరించబడిన స్వామి.", "hi": "पारिजात वृक्ष की छाया में, सोने के सिंहासन पर बैठे, मेघ जैसे श्याम, लंबे नयनों वाले, सुंदर ढंग से सजे प्रभु।"}}, {"sa": ["चन्द्राननं चतुर्बाहुं श्रीवत्साङ्कितवक्षसम् ।", "रुक्मिणीसत्यभामाभ्यां सहितं कृष्णमाश्रये ॥८॥"], "tr": "Chandrānanam chatur-bāhum shrīvatsānkita-vakshasam, rukminī-satyabhāmābhyām sahitam krishnam āshraye.", "m": {"en": "With a face like the moon, four arms, and the Shrivatsa mark on His chest, together with Rukmini and Satyabhama: I take refuge in Krishna.", "te": "చంద్రుని వంటి ముఖం, నాలుగు భుజాలు, వక్షస్థలంపై శ్రీవత్స చిహ్నం కలిగి, రుక్మిణి సత్యభామలతో కూడిన శ్రీకృష్ణుడిని శరణు వేడుతున్నాను.", "hi": "चंद्रमा जैसे मुख, चार भुजाओं और छाती पर श्रीवत्स चिह्न वाले, रुक्मिणी और सत्यभामा के साथ विराजमान श्रीकृष्ण की मैं शरण लेता हूँ।"}}];
var STO={"parashurama": {"v": 61, "ic": "🪓", "t": {"en": "Parashurama, the axe-bearer", "te": "పరశురాముడు, గొడ్డలి ధరించినవాడు", "hi": "परशुराम, फरसा धारण करने वाले"}, "s": {"en": "Long ago, some kings became proud and cruel. They forgot that a king's duty is to protect people, not to hurt them.\n\nThe Lord was born as Parashurama, the son of the sage Jamadagni. Though born in a family of sages, he carried a great axe, given by Lord Shiva. He fought the cruel kings and set the world right again.\n\nWhen his work was done, Parashurama put down his weapons and went to the mountains to live a quiet life of prayer. He did not want power for himself.\n\nThe lesson: strength is good only when it protects the weak. And when the work is done, let go of pride.", "te": "చాలా కాలం క్రితం కొందరు రాజులు గర్వంతో, క్రూరంగా మారారు. ప్రజలను బాధించడం కాదు, కాపాడటమే రాజు ధర్మం అని మర్చిపోయారు.\n\nస్వామి జమదగ్ని మహర్షి కుమారుడిగా పరశురాముడిగా అవతరించాడు. ఋషుల వంశంలో పుట్టినా, శివుడు ఇచ్చిన గొప్ప గొడ్డలిని ధరించాడు. క్రూరులైన రాజులతో పోరాడి లోకాన్ని మళ్ళీ సరిదిద్దాడు.\n\nపని పూర్తయ్యాక పరశురాముడు ఆయుధాలు వదిలి, ప్రార్థనతో ప్రశాంతంగా జీవించడానికి పర్వతాలకు వెళ్ళిపోయాడు. తనకోసం అధికారం కోరుకోలేదు.\n\nనీతి: బలహీనులను కాపాడినప్పుడే బలం మంచిది. పని అయ్యాక గర్వాన్ని వదిలెయ్యాలి.", "hi": "बहुत समय पहले कुछ राजा घमंडी और क्रूर हो गए। वे भूल गए कि राजा का धर्म लोगों की रक्षा करना है, उन्हें दुख देना नहीं।\n\nप्रभु ऋषि जमदग्नि के पुत्र परशुराम बनकर आए। ऋषियों के कुल में जन्म लेकर भी उन्होंने भगवान शिव का दिया महान फरसा धारण किया। उन्होंने क्रूर राजाओं से लड़कर संसार को फिर से ठीक किया।\n\nकाम पूरा होने पर परशुराम ने अस्त्र रख दिए और प्रार्थना का शांत जीवन जीने पर्वतों पर चले गए। उन्होंने अपने लिए सत्ता नहीं चाही।\n\nसीख: बल तभी अच्छा है जब वह कमज़ोरों की रक्षा करे। और काम पूरा होने पर घमंड छोड़ दो।"}}, "dhanvantari": {"v": 62, "ic": "🏺", "t": {"en": "Dhanvantari and the pot of nectar", "te": "ధన్వంతరి, అమృత కలశం", "hi": "धन्वंतरि और अमृत कलश"}, "s": {"en": "The gods and the demons once churned the great ocean of milk together, hoping to find amrita, the nectar of immortality. They used the mountain Mandara as the churning rod and the serpent Vasuki as the rope. Vishnu, as a giant tortoise, held the mountain on His back.\n\nMany wonders came up from the ocean. At last, a shining figure rose from the waves, holding a golden pot. It was Dhanvantari, the Lord as the divine physician, carrying the nectar.\n\nDhanvantari is honoured as the father of Ayurveda, the science of healing. Doctors in India still pray to him.\n\nThe lesson: good things come after patient, shared effort. And the Lord cares for our health, of body and of mind.", "te": "ఒకసారి దేవతలు, రాక్షసులు కలిసి అమృతం కోసం పాలసముద్రాన్ని చిలికారు. మందర పర్వతాన్ని కవ్వంగా, వాసుకి సర్పాన్ని తాడుగా వాడారు. విష్ణువు పెద్ద తాబేలుగా (కూర్మం) పర్వతాన్ని వీపుపై మోశాడు.\n\nసముద్రం నుండి ఎన్నో అద్భుతాలు వచ్చాయి. చివరకు అలల నుండి బంగారు కలశం పట్టుకుని ఒక ప్రకాశించే రూపం పైకి వచ్చింది. ఆయనే ధన్వంతరి, దివ్య వైద్యుడిగా స్వామి, అమృతాన్ని తెచ్చాడు.\n\nధన్వంతరిని ఆయుర్వేదానికి మూలపురుషుడిగా పూజిస్తారు. భారతదేశంలో వైద్యులు ఇప్పటికీ ఆయనను ప్రార్థిస్తారు.\n\nనీతి: ఓపికతో, కలిసి చేసే ప్రయత్నం తర్వాతే మంచి ఫలం వస్తుంది. స్వామి మన శరీర, మనసుల ఆరోగ్యాన్ని పట్టించుకుంటాడు.", "hi": "एक बार देवताओं और असुरों ने मिलकर अमृत पाने के लिए क्षीर सागर का मंथन किया। मंदर पर्वत को मथानी और वासुकि नाग को रस्सी बनाया। विष्णु ने विशाल कछुआ (कूर्म) बनकर पर्वत को अपनी पीठ पर थामा।\n\nसागर से कई अद्भुत चीज़ें निकलीं। अंत में लहरों से सोने का कलश लिए एक तेजस्वी रूप प्रकट हुआ। वे धन्वंतरि थे, दिव्य वैद्य के रूप में प्रभु, जो अमृत लेकर आए।\n\nधन्वंतरि को आयुर्वेद का जनक माना जाता है। भारत में वैद्य आज भी उनकी प्रार्थना करते हैं।\n\nसीख: अच्छी चीज़ें धैर्य और मिलकर किए प्रयास के बाद मिलती हैं। और प्रभु हमारे तन और मन के स्वास्थ्य का ध्यान रखते हैं।"}}, "govardhana": {"v": 63, "ic": "⛰️", "t": {"en": "Krishna lifts Govardhana hill", "te": "గోవర్ధన గిరిని ఎత్తిన కృష్ణుడు", "hi": "कृष्ण ने गोवर्धन उठाया"}, "s": {"en": "Every year, the people of Vrindavan held a big festival for Indra, the king of the gods, so that he would send rain. Little Krishna asked, 'Why not thank Govardhana hill instead? It gives grass to our cows and water to our fields.' The people agreed.\n\nIndra became angry and sent a terrible storm. Rain poured for days. The cows and the people were frightened.\n\nKrishna smiled, walked to Govardhana, and lifted the whole hill on the little finger of his left hand, like an umbrella. Everyone, with their cows and calves, sheltered under it for seven days. At last Indra understood, and bowed to Krishna.\n\nThe lesson: the Lord protects those who trust Him, and He cares for every cow and calf, not just for people.", "te": "ప్రతి సంవత్సరం బృందావన వాసులు వర్షం కురవాలని దేవరాజు ఇంద్రుడికి పెద్ద ఉత్సవం చేసేవారు. చిన్ని కృష్ణుడు అడిగాడు, 'దానికి బదులు గోవర్ధన గిరికి కృతజ్ఞత చెప్పుకుందాం. అదే మన ఆవులకు గడ్డి, పొలాలకు నీరు ఇస్తుంది.' అందరూ ఒప్పుకున్నారు.\n\nఇంద్రుడికి కోపం వచ్చి భయంకరమైన తుఫాను పంపాడు. రోజుల తరబడి వర్షం కురిసింది. ఆవులు, ప్రజలు భయపడ్డారు.\n\nకృష్ణుడు నవ్వుతూ గోవర్ధనం దగ్గరకు వెళ్ళి, ఎడమ చేతి చిటికెన వేలిపై గొడుగులా కొండనంతా ఎత్తాడు. అందరూ ఆవులు, దూడలతో సహా ఏడు రోజులు దాని కింద తలదాచుకున్నారు. చివరకు ఇంద్రుడు అర్థం చేసుకుని కృష్ణుడికి నమస్కరించాడు.\n\nనీతి: తనను నమ్మినవారిని స్వామి కాపాడతాడు. మనుషులనే కాదు, ప్రతి ఆవునూ దూడనూ చూసుకుంటాడు.", "hi": "हर साल वृंदावन के लोग देवराज इंद्र के लिए बड़ा उत्सव करते थे, ताकि वे वर्षा भेजें। नन्हे कृष्ण ने पूछा, 'इसके बजाय गोवर्धन पर्वत को धन्यवाद क्यों न दें? वही हमारी गायों को घास और खेतों को पानी देता है।' सब मान गए।\n\nइंद्र को गुस्सा आया और उन्होंने भयंकर तूफ़ान भेजा। कई दिनों तक वर्षा होती रही। गायें और लोग डर गए।\n\nकृष्ण मुस्कुराए, गोवर्धन के पास गए, और पूरे पर्वत को बाएँ हाथ की छोटी उँगली पर छाते की तरह उठा लिया। सब लोग अपनी गायों और बछड़ों के साथ सात दिन उसके नीचे रहे। अंत में इंद्र समझ गए और कृष्ण को प्रणाम किया।\n\nसीख: प्रभु उन पर भरोसा करने वालों की रक्षा करते हैं, और केवल लोगों की नहीं, हर गाय और बछड़े की भी।"}}, "sudama": {"v": 66, "ic": "🍚", "t": {"en": "Sudama's handful of rice", "te": "సుదాముడి అటుకులు", "hi": "सुदामा के चिवड़े"}, "s": {"en": "Sudama and Krishna studied together as boys in the ashram of their guru. Krishna became a king in Dwaraka. Sudama stayed a poor man, so poor that his children often went hungry.\n\nHis wife said, 'Go and see your friend Krishna.' Sudama had nothing to bring, so she tied a small handful of beaten rice in a cloth.\n\nAt the palace, Krishna ran to meet him, hugged him, and washed his tired feet with his own hands. When he saw the little bundle, Krishna took it happily and ate the rice as if it were the finest food in the world.\n\nSudama was too shy to ask for anything. But when he returned home, his hut had become a beautiful house, and his family was safe and happy.\n\nThe lesson: the Lord does not look at the size of our gift. He looks at the love in our heart.", "te": "సుదాముడు, కృష్ణుడు చిన్నప్పుడు గురువు గారి ఆశ్రమంలో కలిసి చదువుకున్నారు. కృష్ణుడు ద్వారకకు రాజయ్యాడు. సుదాముడు పేదవాడిగానే ఉండిపోయాడు, ఎంత పేదరికం అంటే పిల్లలు తరచూ ఆకలితో ఉండేవారు.\n\nఅతని భార్య, 'మీ స్నేహితుడు కృష్ణుడిని చూసి రండి' అంది. తీసుకెళ్ళడానికి ఏమీ లేదు, అందుకే ఆమె గుడ్డలో పిడికెడు అటుకులు కట్టి ఇచ్చింది.\n\nరాజభవనంలో కృష్ణుడు పరుగున వచ్చి, కౌగిలించుకుని, అలసిన అతని పాదాలను తన చేతులతో కడిగాడు. చిన్న మూట చూసి, సంతోషంగా తీసుకుని, ఆ అటుకులను లోకంలోనే గొప్ప ఆహారంలా తిన్నాడు.\n\nసుదాముడు సిగ్గుతో ఏమీ అడగలేదు. కానీ ఇంటికి తిరిగి వచ్చేసరికి అతని గుడిసె అందమైన ఇల్లుగా మారింది, కుటుంబం సుఖంగా ఉంది.\n\nనీతి: స్వామి మన కానుక ఎంత పెద్దదో చూడడు. మన హృదయంలోని ప్రేమను చూస్తాడు.", "hi": "सुदामा और कृष्ण बचपन में गुरु के आश्रम में साथ पढ़े थे। कृष्ण द्वारका के राजा बन गए। सुदामा गरीब ही रहे, इतने गरीब कि उनके बच्चे अक्सर भूखे रहते।\n\nउनकी पत्नी ने कहा, 'अपने मित्र कृष्ण से मिल आइए।' ले जाने को कुछ नहीं था, इसलिए उन्होंने एक कपड़े में मुट्ठी भर चिवड़ा बाँध दिया।\n\nमहल में कृष्ण दौड़कर आए, उन्हें गले लगाया, और अपने हाथों से उनके थके पैर धोए। छोटी पोटली देखकर उन्होंने खुशी से ली और चिवड़ा ऐसे खाया जैसे वह दुनिया का सबसे अच्छा भोजन हो।\n\nसुदामा संकोच से कुछ माँग न सके। पर घर लौटे तो उनकी झोपड़ी सुंदर घर बन चुकी थी, और परिवार सुखी था।\n\nसीख: प्रभु हमारे उपहार का आकार नहीं देखते। वे हमारे मन का प्रेम देखते हैं।"}}, "vamana": {"v": 68, "ic": "☂️", "t": {"en": "Vamana and King Bali", "te": "వామనుడు, బలి చక్రవర్తి", "hi": "वामन और राजा बलि"}, "s": {"en": "King Bali was strong and generous, but he had taken over heaven and become proud. The gods prayed to Vishnu for help.\n\nThe Lord was born as Vamana, a small boy-priest with an umbrella. He came to Bali's great yajna. Bali, known for never refusing a gift, said, 'Ask for anything.' Vamana smiled: 'Just three steps of land, measured by my own small feet.'\n\nBali laughed and agreed. Then Vamana began to grow, bigger and bigger, until he filled the sky. With one step he covered the earth. With the second, the heavens. 'Where shall I put my third step?' he asked.\n\nBali understood who stood before him. He bowed and said, 'Place it on my head.' The Lord blessed him and made him king of a beautiful world below, and promised to guard his door Himself.\n\nThe lesson: give with an open heart, and let go of pride. Even a defeat can become a blessing.", "te": "బలి చక్రవర్తి బలవంతుడు, దానశీలి, కానీ స్వర్గాన్ని ఆక్రమించి గర్వం పెంచుకున్నాడు. దేవతలు సహాయం కోసం విష్ణువును ప్రార్థించారు.\n\nస్వామి గొడుగు పట్టుకున్న చిన్న బాల బ్రాహ్మణుడు వామనుడిగా అవతరించాడు. బలి చేస్తున్న గొప్ప యజ్ఞానికి వచ్చాడు. ఎప్పుడూ దానం కాదనని బలి, 'ఏదైనా అడుగు' అన్నాడు. వామనుడు నవ్వి, 'నా చిన్న పాదాలతో కొలిచిన మూడు అడుగుల నేల చాలు' అన్నాడు.\n\nబలి నవ్వి ఒప్పుకున్నాడు. అప్పుడు వామనుడు పెరుగుతూ, పెరుగుతూ ఆకాశమంతా నిండిపోయాడు. ఒక అడుగుతో భూమిని, రెండో అడుగుతో స్వర్గాన్ని కొలిచాడు. 'మూడో అడుగు ఎక్కడ పెట్టను?' అని అడిగాడు.\n\nఎదురుగా ఉన్నది ఎవరో బలికి అర్థమైంది. నమస్కరించి, 'నా తలపై పెట్టండి' అన్నాడు. స్వామి అతన్ని ఆశీర్వదించి, కింద ఒక అందమైన లోకానికి రాజుగా చేసి, తానే అతని ద్వారం కాపాడతానని మాట ఇచ్చాడు.\n\nనీతి: మనస్ఫూర్తిగా ఇవ్వు, గర్వాన్ని వదులు. ఓటమి కూడా వరంగా మారవచ్చు.", "hi": "राजा बलि बलवान और दानी थे, पर उन्होंने स्वर्ग पर कब्ज़ा कर लिया था और घमंडी हो गए थे। देवताओं ने सहायता के लिए विष्णु से प्रार्थना की।\n\nप्रभु छाता लिए एक छोटे बालक ब्राह्मण वामन बनकर आए। वे बलि के महान यज्ञ में पहुँचे। कभी दान से मना न करने वाले बलि ने कहा, 'कुछ भी माँग लो।' वामन मुस्कुराए: 'बस मेरे छोटे पैरों से नापी तीन कदम ज़मीन।'\n\nबलि हँसे और मान गए। तब वामन बढ़ने लगे, बड़े और बड़े, यहाँ तक कि आकाश भर गया। एक कदम में धरती नापी, दूसरे में स्वर्ग। 'तीसरा कदम कहाँ रखूँ?' उन्होंने पूछा।\n\nबलि समझ गए कि सामने कौन है। उन्होंने सिर झुकाकर कहा, 'मेरे सिर पर रखिए।' प्रभु ने उन्हें आशीर्वाद दिया, नीचे एक सुंदर लोक का राजा बनाया, और स्वयं उनके द्वार की रक्षा करने का वचन दिया।\n\nसीख: खुले मन से दो, और घमंड छोड़ दो। हार भी आशीर्वाद बन सकती है।"}}, "keshi": {"v": 69, "ic": "🐎", "t": {"en": "Krishna and the horse demon Keshi", "te": "కృష్ణుడు, కేశి రాక్షసుడు", "hi": "कृष्ण और केशी असुर"}, "s": {"en": "The cruel king Kamsa was afraid of little Krishna, so he kept sending demons to Vrindavan to harm him. One day he sent Keshi, a demon in the shape of a huge, wild horse.\n\nKeshi galloped into the village, kicking up dust, neighing loudly, and scaring everyone. People ran into their houses. The cowherd boys hid behind the trees.\n\nKrishna did not run. He stood calmly in the open, smiling. When Keshi charged at him with his mouth wide open, Krishna pushed his arm into the demon's mouth. Keshi could not bite or breathe, and soon he fell down, defeated. The village was safe again.\n\nThat is why Krishna is called Keshava, slayer of Keshi.\n\nThe lesson: when trouble comes rushing at us, we can stay calm and call His name. Fear grows when we run; it shrinks when we stand with Him.", "te": "క్రూరుడైన కంసుడు చిన్ని కృష్ణుడంటే భయపడి, అతనికి హాని చేయడానికి బృందావనానికి రాక్షసులను పంపుతూ ఉండేవాడు. ఒకరోజు పెద్ద అడవి గుర్రం రూపంలో ఉన్న కేశి అనే రాక్షసుడిని పంపాడు.\n\nకేశి దుమ్ము రేపుతూ, గట్టిగా సకిలిస్తూ, అందరినీ భయపెడుతూ ఊళ్ళోకి దూసుకొచ్చాడు. ప్రజలు ఇళ్ళలోకి పరుగెత్తారు. గోపబాలురు చెట్ల వెనక దాక్కున్నారు.\n\nకృష్ణుడు పారిపోలేదు. బహిరంగంగా ప్రశాంతంగా నవ్వుతూ నిలబడ్డాడు. కేశి నోరు తెరుచుకుని మీదకు దూకినప్పుడు, కృష్ణుడు తన చేతిని రాక్షసుడి నోట్లోకి తోశాడు. కేశి కొరకలేక, ఊపిరి ఆడక, కాసేపటికే పడిపోయాడు. ఊరు మళ్ళీ క్షేమంగా ఉంది.\n\nఅందుకే కృష్ణుడిని కేశవుడు, కేశిని సంహరించినవాడు అంటారు.\n\nనీతి: కష్టం దూసుకొచ్చినప్పుడు ప్రశాంతంగా ఉండి ఆయన నామం పలకవచ్చు. పారిపోతే భయం పెరుగుతుంది; ఆయనతో నిలబడితే తగ్గుతుంది.", "hi": "क्रूर राजा कंस नन्हे कृष्ण से डरता था, इसलिए उन्हें हानि पहुँचाने के लिए वृंदावन में असुर भेजता रहता था। एक दिन उसने केशी को भेजा, जो एक विशाल जंगली घोड़े के रूप में असुर था।\n\nकेशी धूल उड़ाते, ज़ोर से हिनहिनाते, सबको डराते गाँव में घुस आया। लोग घरों में भाग गए। ग्वाल-बाल पेड़ों के पीछे छिप गए।\n\nकृष्ण नहीं भागे। वे खुले में शांत खड़े मुस्कुराते रहे। जब केशी मुँह खोलकर उन पर झपटा, कृष्ण ने अपनी बाँह उसके मुँह में डाल दी। केशी न काट सका, न साँस ले सका, और जल्द ही गिरकर हार गया। गाँव फिर से सुरक्षित हो गया।\n\nइसीलिए कृष्ण को केशव, केशी का वध करने वाला, कहते हैं।\n\nसीख: जब मुसीबत हम पर दौड़ती आए, हम शांत रहकर उनका नाम ले सकते हैं। भागने से डर बढ़ता है; उनके साथ खड़े होने से घटता है।"}}};
