94:{"w": [["विहायसगतिः", "Vi-haa-ya-sa-ga-tih", "Moves across the sky (as the sun)", "ఆకాశంలో సంచరించేవాడు (సూర్యుడిగా)", "आकाश में चलने वाले (सूर्य रूप में)"], ["ज्योतिः", "Jyo-tih", "Light itself", "స్వయంగా వెలుగు", "स्वयं प्रकाश"], ["सुरुचिः", "Su-ru-chih", "Shines beautifully", "అందంగా ప్రకాశించేవాడు", "सुंदर कांति वाले"], ["हुतभुक्", "Hu-ta-bhuk", "Receives what is offered in the sacred fire", "అగ్నిలో అర్పించినది స్వీకరించేవాడు", "अग्नि में अर्पित को ग्रहण करने वाले"], ["विभुः", "Vi-bhuh", "Present everywhere", "అంతటా ఉన్నవాడు", "सब जगह व्याप्त"], ["रविः", "Ra-vih", "The sun", "సూర్యుడు", "सूर्य"], ["विरोचनः", "Vi-ro-cha-nah", "Shines in many ways", "అనేక విధాలుగా ప్రకాశించేవాడు", "अनेक प्रकार से चमकने वाले"], ["सूर्यः", "Soor-yah", "The sun who gives life and wealth", "జీవాన్ని, సంపదను ఇచ్చే సూర్యుడు", "जीवन और धन देने वाले सूर्य"], ["सविता", "Sa-vi-taa", "Brings all beings to life", "అన్ని జీవులను పుట్టించేవాడు", "सब प्राणियों को उत्पन्न करने वाले"], ["रविलोचनः", "Ra-vi-lo-cha-nah", "The sun is His eye", "సూర్యుడే ఆయన కన్ను", "सूर्य जिनकी आँख है"]], "v": ["As the sun, Vishnu moves across the sky. He is light itself and shines beautifully. He receives what is offered in the sacred fire, and He is present everywhere. He is the sun that shines in many ways and gives life and wealth. He brings all beings to life, and the sun is His eye.", "సూర్యుడిగా విష్ణువు ఆకాశంలో సంచరిస్తాడు. స్వయంగా వెలుగు ఆయన, అందంగా ప్రకాశిస్తాడు. పవిత్ర అగ్నిలో అర్పించినది స్వీకరిస్తాడు, అంతటా ఉన్నాడు. అనేక విధాలుగా ప్రకాశించి జీవాన్ని, సంపదను ఇచ్చే సూర్యుడు ఆయనే. అన్ని జీవులను పుట్టిస్తాడు; సూర్యుడే ఆయన కన్ను.", "सूर्य रूप में विष्णु आकाश में चलते हैं। वे स्वयं प्रकाश हैं और सुंदर चमकते हैं। पवित्र अग्नि में अर्पित को ग्रहण करते हैं, और सब जगह व्याप्त हैं। वे अनेक प्रकार से चमकने वाले, जीवन और धन देने वाले सूर्य हैं। वे सब प्राणियों को उत्पन्न करते हैं, और सूर्य उनकी आँख है।"]},
95:{"w": [["अनन्तः", "A-nan-tah", "Endless", "అంతం లేనివాడు", "अनंत"], ["हुतभुक्", "Hu-ta-bhuk", "Accepts what is offered with love", "ప్రేమతో అర్పించినది స్వీకరించేవాడు", "प्रेम से अर्पित को स्वीकार करने वाले"], ["भोक्ता", "Bhok-taa", "Enjoys and looks after the world", "లోకాన్ని అనుభవించి కాపాడేవాడు", "संसार का भोग और पालन करने वाले"], ["सुखदः", "Su-kha-dah", "Gives happiness", "సుఖాన్ని ఇచ్చేవాడు", "सुख देने वाले"], ["नैकजः", "Nai-ka-jah", "Born many times (as avatars)", "అనేక సార్లు అవతరించినవాడు", "अनेक बार अवतार लेने वाले"], ["अग्रजः", "Ag-ra-jah", "The first, before all", "అందరికంటే ముందు ఉన్నవాడు", "सबसे पहले प्रकट"], ["अनिर्विण्णः", "A-nir-vin-nah", "Never tired or upset", "ఎప్పుడూ అలసిపోనివాడు, విసుగు చెందనివాడు", "कभी न थकने, न ऊबने वाले"], ["सदामर्षी", "Sa-daa-mar-shee", "Always forgives", "ఎప్పుడూ క్షమించేవాడు", "सदा क्षमा करने वाले"], ["लोकाधिष्ठानम्", "Lo-kaa-dhish-thaa-nam", "The ground on which the world rests", "లోకాలకు ఆధారం", "संसार का आधार"], ["अद्भुतः", "Ad-bhu-tah", "Full of wonder", "అద్భుతమైనవాడు", "अद्भुत"]], "v": ["Vishnu is endless. He accepts what we offer with love, and He enjoys and looks after the world. He gives happiness. He was born many times as avatars, yet He was there before all. He never gets tired or upset, and He always forgives. The whole world rests on Him; He is full of wonder.", "విష్ణువు అంతం లేనివాడు. ప్రేమతో అర్పించినది స్వీకరిస్తాడు, లోకాన్ని అనుభవించి కాపాడుతాడు. సుఖాన్ని ఇస్తాడు. అనేక సార్లు అవతరించాడు, అయినా అందరికంటే ముందు ఉన్నాడు. ఎప్పుడూ అలసిపోడు, విసుగు చెందడు, ఎప్పుడూ క్షమిస్తాడు. లోకమంతా ఆయనపైనే నిలిచి ఉంది; ఆయన అద్భుతమైనవాడు.", "विष्णु अनंत हैं। वे प्रेम से अर्पित को स्वीकार करते हैं, और संसार का भोग व पालन करते हैं। वे सुख देते हैं। उन्होंने अनेक बार अवतार लिया, फिर भी वे सबसे पहले थे। वे कभी नहीं थकते, न ऊबते हैं, और सदा क्षमा करते हैं। पूरा संसार उन पर टिका है; वे अद्भुत हैं।"]},
96:{"w": [["सनात्", "Sa-naat", "Eternal; time itself", "శాశ్వతుడు; కాలమే ఆయన", "सनातन; स्वयं काल"], ["सनातनतमः", "Sa-naa-ta-na-ta-mah", "The most ancient of all", "అందరికంటే ప్రాచీనుడు", "सबसे प्राचीन"], ["कपिलः", "Ka-pi-lah", "Came as the sage Kapila", "కపిల మహర్షిగా వచ్చినవాడు", "कपिल मुनि रूप में आने वाले"], ["कपिः", "Ka-pih", "The sun, who draws up the waters", "నీటిని పైకి లాగే సూర్యుడు", "जल खींचने वाले सूर्य"], ["अव्ययः", "Av-ya-yah", "Never decays", "ఎప్పుడూ క్షీణించనివాడు", "कभी नष्ट न होने वाले"], ["स्वस्तिदः", "Svas-ti-dah", "Gives auspiciousness", "శుభం ఇచ్చేవాడు", "मंगल देने वाले"], ["स्वस्तिकृत्", "Svas-ti-krit", "Does what is good for us", "మనకు మంచి చేసేవాడు", "हमारा भला करने वाले"], ["स्वस्ति", "Svas-ti", "Goodness itself", "శుభమే ఆయన", "स्वयं मंगल"], ["स्वस्तिभुक्", "Svas-ti-bhuk", "Protects our good fortune", "మన శుభాన్ని కాపాడేవాడు", "हमारे मंगल की रक्षा करने वाले"], ["स्वस्तिदक्षिणः", "Svas-ti-dak-shi-nah", "Quick to give good things", "శుభాన్ని త్వరగా ఇచ్చేవాడు", "शीघ्र मंगल देने वाले"]], "v": ["Vishnu is eternal, the most ancient of all. He came as the sage Kapila, and He is the sun who draws up the waters. He never decays. He gives auspiciousness and does what is good for us; He is goodness itself. He protects our good fortune and is quick to give good things.", "విష్ణువు శాశ్వతుడు, అందరికంటే ప్రాచీనుడు. కపిల మహర్షిగా వచ్చాడు; నీటిని పైకి లాగే సూర్యుడు ఆయనే. ఎప్పుడూ క్షీణించడు. శుభం ఇస్తాడు, మనకు మంచి చేస్తాడు; శుభమే ఆయన. మన శుభాన్ని కాపాడుతాడు, శుభాన్ని త్వరగా ఇస్తాడు.", "विष्णु सनातन हैं, सबसे प्राचीन। वे कपिल मुनि के रूप में आए, और वही जल खींचने वाले सूर्य हैं। वे कभी नष्ट नहीं होते। वे मंगल देते हैं और हमारा भला करते हैं; वे स्वयं मंगल हैं। वे हमारे मंगल की रक्षा करते हैं और शीघ्र मंगल देते हैं।"]},
97:{"w": [["अरौद्रः", "A-rau-drah", "Never harsh or angry", "కఠినత్వం, కోపం లేనివాడు", "कभी कठोर या क्रोधी नहीं"], ["कुण्डली", "Kun-da-lee", "Wears shining earrings", "ప్రకాశించే కుండలాలు ధరించినవాడు", "चमकते कुंडल पहनने वाले"], ["चक्री", "Chak-ree", "Holds the discus", "చక్రం ధరించినవాడు", "चक्र धारण करने वाले"], ["विक्रमी", "Vik-ra-mee", "Full of courage and valour", "పరాక్రమం కలవాడు", "पराक्रमी"], ["ऊर्जितशासनः", "Oor-ji-ta-shaa-sa-nah", "His word is strong and firm", "ఆయన ఆజ్ఞ బలమైనది, స్థిరమైనది", "जिनकी आज्ञा दृढ़ और प्रबल है"], ["शब्दातिगः", "Shab-daa-ti-gah", "Beyond all words", "మాటలకు అందనివాడు", "शब्दों से परे"], ["शब्दसहः", "Shab-da-sa-hah", "Praised by all the Vedas", "వేదాలన్నీ కీర్తించేవాడు", "सभी वेद जिनकी स्तुति करते हैं"], ["शिशिरः", "Shi-shi-rah", "Cool and comforting", "చల్లగా ఓదార్చేవాడు", "शीतल और सुखद"], ["शर्वरीकरः", "Shar-va-ree-ka-rah", "Makes night and day", "రాత్రిని, పగలును కల్పించేవాడు", "रात और दिन बनाने वाले"]], "v": ["Vishnu is never harsh or angry. He wears shining earrings, holds the discus, and is full of valour; His word is strong and firm. He is beyond all words, yet all the Vedas praise Him. He is cool and comforting to those who suffer, and He makes night and day.", "విష్ణువు కఠినంగా, కోపంగా ఉండడు. ప్రకాశించే కుండలాలు ధరిస్తాడు, చక్రం పట్టుకుంటాడు, పరాక్రమం కలవాడు; ఆయన ఆజ్ఞ బలమైనది, స్థిరమైనది. మాటలకు అందడు, అయినా వేదాలన్నీ ఆయనను కీర్తిస్తాయి. బాధపడేవారికి చల్లగా ఓదార్పు ఇస్తాడు, రాత్రిని, పగలును కల్పిస్తాడు.", "विष्णु कभी कठोर या क्रोधी नहीं होते। वे चमकते कुंडल पहनते हैं, चक्र धारण करते हैं, और पराक्रमी हैं; उनकी आज्ञा दृढ़ और प्रबल है। वे शब्दों से परे हैं, फिर भी सभी वेद उनकी स्तुति करते हैं। दुखियों के लिए वे शीतल और सुखद हैं, और रात व दिन बनाते हैं।"]},
98:{"w": [["अक्रूरः", "Ak-roo-rah", "Never cruel", "క్రూరత్వం లేనివాడు", "कभी क्रूर नहीं"], ["पेशलः", "Pe-sha-lah", "Gentle and charming", "సౌమ్యుడు, మనోహరుడు", "कोमल और मनोहर"], ["दक्षः", "Dak-shah", "Quick and skilful", "చురుకైనవాడు, నేర్పరి", "फुर्तीले और कुशल"], ["दक्षिणः", "Dak-shi-nah", "Kind and generous", "దయగలవాడు, ఉదారుడు", "दयालु और उदार"], ["क्षमिणां वरः", "Ksha-mi-naam Va-rah", "The most patient of all the patient", "ఓర్పు గలవారిలో శ్రేష్ఠుడు", "क्षमाशीलों में श्रेष्ठ"], ["विद्वत्तमः", "Vid-vat-ta-mah", "The wisest of all", "అందరిలో గొప్ప జ్ఞాని", "सबसे बड़े ज्ञानी"], ["वीतभयः", "Vee-ta-bha-yah", "Free from all fear", "ఏ భయమూ లేనివాడు", "सभी भय से मुक्त"], ["पुण्यश्रवणकीर्तनः", "Pun-ya-shra-va-na-keer-ta-nah", "Hearing and singing about Him brings goodness", "ఆయన గురించి వినడం, పాడడం పుణ్యం ఇస్తుంది", "जिनके बारे में सुनना और गाना पुण्य देता है"]], "v": ["Vishnu is never cruel; He is gentle and charming. He is quick and skilful, kind and generous, and the most patient of all. He is the wisest of all and free from every fear. Just hearing about Him and singing His names brings goodness into our lives.", "విష్ణువు క్రూరుడు కాదు; సౌమ్యుడు, మనోహరుడు. చురుకైనవాడు, నేర్పరి, దయగలవాడు, ఉదారుడు, ఓర్పు గలవారిలో శ్రేష్ఠుడు. అందరిలో గొప్ప జ్ఞాని, ఏ భయమూ లేనివాడు. ఆయన గురించి వినడం, ఆయన నామాలు పాడడం మన జీవితంలోకి పుణ్యాన్ని తెస్తుంది.", "विष्णु कभी क्रूर नहीं; वे कोमल और मनोहर हैं। वे फुर्तीले और कुशल, दयालु और उदार, और सबसे अधिक क्षमाशील हैं। वे सबसे बड़े ज्ञानी हैं और हर भय से मुक्त हैं। उनके बारे में सुनना और उनके नाम गाना ही हमारे जीवन में पुण्य लाता है।"]},
99:{"w": [["उत्तारणः", "Ut-taa-ra-nah", "Carries us across the sea of life", "సంసార సముద్రాన్ని దాటించేవాడు", "संसार सागर से पार उतारने वाले"], ["दुष्कृतिहा", "Dush-kri-ti-haa", "Destroys bad deeds", "చెడు కర్మలను నశింపజేసేవాడు", "बुरे कर्मों का नाश करने वाले"], ["पुण्यः", "Pun-yah", "Pure and holy", "పవిత్రుడు", "पवित्र"], ["दुःस्वप्ननाशनः", "Duh-svap-na-naa-sha-nah", "Removes bad dreams", "చెడు కలలను పోగొట్టేవాడు", "बुरे सपनों को दूर करने वाले"], ["वीरहा", "Vee-ra-haa", "Frees us from the cycle of birth and death", "జనన మరణ చక్రం నుండి విడిపించేవాడు", "जन्म-मरण के चक्र से छुड़ाने वाले"], ["रक्षणः", "Rak-sha-nah", "Protects", "రక్షించేవాడు", "रक्षा करने वाले"], ["सन्तः", "San-tah", "Lives in good people", "సజ్జనులలో నివసించేవాడు", "सज्जनों में बसने वाले"], ["जीवनः", "Jee-va-nah", "Gives life to all", "అందరికీ జీవం ఇచ్చేవాడు", "सबको जीवन देने वाले"], ["पर्यवस्थितः", "Par-ya-vas-thi-tah", "Is all around us", "మన చుట్టూ అంతటా ఉన్నవాడు", "हमारे चारों ओर विद्यमान"]], "v": ["Vishnu carries us across the sea of life and destroys our bad deeds. He is pure and holy, and He removes bad dreams. He frees us from the cycle of birth and death and protects us. He lives in good people, gives life to all, and is all around us.", "విష్ణువు సంసార సముద్రాన్ని దాటిస్తాడు, మన చెడు కర్మలను నశింపజేస్తాడు. పవిత్రుడు, చెడు కలలను పోగొడతాడు. జనన మరణ చక్రం నుండి విడిపించి రక్షిస్తాడు. సజ్జనులలో నివసిస్తాడు, అందరికీ జీవం ఇస్తాడు, మన చుట్టూ అంతటా ఉన్నాడు.", "विष्णु हमें संसार सागर से पार उतारते हैं और हमारे बुरे कर्मों का नाश करते हैं। वे पवित्र हैं और बुरे सपनों को दूर करते हैं। वे जन्म-मरण के चक्र से छुड़ाकर हमारी रक्षा करते हैं। वे सज्जनों में बसते हैं, सबको जीवन देते हैं, और हमारे चारों ओर विद्यमान हैं।"]},
100:{"w": [["अनन्तरूपः", "A-nan-ta-roo-pah", "Has endless forms", "అనంత రూపాలు కలవాడు", "अनंत रूपों वाले"], ["अनन्तश्रीः", "A-nan-ta-shreeh", "Has endless glory", "అనంత శోభ కలవాడు", "अनंत शोभा वाले"], ["जितमन्युः", "Ji-ta-man-yuh", "Has conquered anger", "కోపాన్ని జయించినవాడు", "क्रोध को जीतने वाले"], ["भयापहः", "Bha-yaa-pa-hah", "Takes away fear", "భయాన్ని తొలగించేవాడు", "भय दूर करने वाले"], ["चतुरश्रः", "Cha-tu-rash-rah", "Fair and just to all", "అందరికీ న్యాయం చేసేవాడు", "सबके साथ न्याय करने वाले"], ["गभीरात्मा", "Ga-bhee-raat-maa", "Deep; hard to fully know", "లోతైనవాడు; పూర్తిగా తెలియరానివాడు", "गहन; जिन्हें पूरा जानना कठिन"], ["विदिशः", "Vi-di-shah", "Gives each person different gifts", "ఒక్కొక్కరికి వేర్వేరు వరాలు ఇచ్చేవాడు", "हर किसी को अलग-अलग फल देने वाले"], ["व्यादिशः", "Vyaa-di-shah", "Gives orders even to the gods", "దేవతలకు కూడా ఆజ్ఞలు ఇచ్చేవాడు", "देवताओं को भी आज्ञा देने वाले"], ["दिशः", "Di-shah", "Shows us the right way", "సరైన మార్గం చూపించేవాడు", "सही राह दिखाने वाले"]], "v": ["Vishnu has endless forms and endless glory. He has conquered anger and takes away our fear. He is fair and just to all, and He is so deep that no one can fully know Him. He gives each person different gifts, gives orders even to the gods, and shows us the right way.", "విష్ణువుకు అనంత రూపాలు, అనంత శోభ ఉన్నాయి. కోపాన్ని జయించాడు, మన భయాన్ని తొలగిస్తాడు. అందరికీ న్యాయం చేస్తాడు; ఎవరూ పూర్తిగా తెలుసుకోలేనంత లోతైనవాడు. ఒక్కొక్కరికి వేర్వేరు వరాలు ఇస్తాడు, దేవతలకు కూడా ఆజ్ఞలు ఇస్తాడు, మనకు సరైన మార్గం చూపిస్తాడు.", "विष्णु के अनंत रूप और अनंत शोभा है। उन्होंने क्रोध को जीत लिया है और हमारा भय दूर करते हैं। वे सबके साथ न्याय करते हैं, और इतने गहन हैं कि उन्हें कोई पूरा नहीं जान सकता। वे हर किसी को अलग-अलग फल देते हैं, देवताओं को भी आज्ञा देते हैं, और हमें सही राह दिखाते हैं।"]},
101:{"w": [["अनादिः", "A-naa-dih", "Has no beginning", "ఆది లేనివాడు", "जिनका कोई आरंभ नहीं"], ["भूर्भुवः", "Bhoor-bhu-vah", "The support even of the earth", "భూమికి కూడా ఆధారమైనవాడు", "पृथ्वी के भी आधार"], ["लक्ष्मीः", "Lak-shmeeh", "The beauty and wealth of the world", "లోకానికి శోభ, సంపద", "संसार की शोभा और संपत्ति"], ["सुवीरः", "Su-vee-rah", "The great hero", "గొప్ప వీరుడు", "महान वीर"], ["रुचिराङ्गदः", "Ru-chi-raan-ga-dah", "Wears lovely armlets", "అందమైన భుజకీర్తులు ధరించినవాడు", "सुंदर बाजूबंद पहनने वाले"], ["जननः", "Ja-na-nah", "Gives birth to all beings", "అన్ని జీవులను పుట్టించేవాడు", "सब प्राणियों को जन्म देने वाले"], ["जनजन्मादिः", "Ja-na-jan-maa-dih", "The root of every birth", "అందరి జన్మకు మూలం", "सबके जन्म का मूल"], ["भीमः", "Bhee-mah", "Fearsome to the wicked", "దుష్టులకు భయంకరుడు", "दुष्टों के लिए भयंकर"], ["भीमपराक्रमः", "Bhee-ma-pa-raa-kra-mah", "Of awesome strength", "భయంకరమైన పరాక్రమం కలవాడు", "भयंकर पराक्रम वाले"]], "v": ["Vishnu has no beginning, and He holds up even the earth. He is the beauty and wealth of the world. He is the great hero who wears lovely armlets. He gives birth to all beings and is the root of every birth. To the wicked He is fearsome, with awesome strength.", "విష్ణువుకు ఆది లేదు, భూమిని కూడా ఆయనే నిలుపుతాడు. లోకానికి శోభ, సంపద ఆయనే. అందమైన భుజకీర్తులు ధరించిన గొప్ప వీరుడు. అన్ని జీవులను పుట్టిస్తాడు, అందరి జన్మకు మూలం ఆయనే. దుష్టులకు భయంకరుడు, భయంకరమైన పరాక్రమం కలవాడు.", "विष्णु का कोई आरंभ नहीं, और वे पृथ्वी को भी थामते हैं। वे संसार की शोभा और संपत्ति हैं। वे सुंदर बाजूबंद पहनने वाले महान वीर हैं। वे सब प्राणियों को जन्म देते हैं और हर जन्म का मूल हैं। दुष्टों के लिए वे भयंकर हैं, भयंकर पराक्रम वाले।"]},
102:{"w": [["आधारनिलयः", "Aa-dhaa-ra-ni-la-yah", "The support of all supports", "అన్ని ఆధారాలకు ఆధారం", "सभी आधारों का आधार"], ["अधाता", "A-dhaa-taa", "No one created Him", "ఆయనను ఎవరూ సృష్టించలేదు", "जिन्हें किसी ने नहीं बनाया"], ["पुष्पहासः", "Push-pa-haa-sah", "Smiles like a blooming flower", "విరిసిన పువ్వులా నవ్వేవాడు", "खिले फूल जैसी मुस्कान वाले"], ["प्रजागरः", "Pra-jaa-ga-rah", "Always awake, watching over us", "ఎప్పుడూ మేల్కొని మనల్ని కాపాడేవాడు", "सदा जागकर हमारी रक्षा करने वाले"], ["ऊर्ध्वगः", "Oor-dhva-gah", "Above all", "అందరికంటే పైనున్నవాడు", "सबसे ऊपर"], ["सत्पथाचारः", "Sat-pa-thaa-chaa-rah", "Walks the right path", "సన్మార్గంలో నడిచేవాడు", "सन्मार्ग पर चलने वाले"], ["प्राणदः", "Praa-na-dah", "Gives the breath of life", "ప్రాణం ఇచ్చేవాడు", "प्राण देने वाले"], ["प्रणवः", "Pra-na-vah", "Is Om itself", "ఓంకారమే ఆయన", "स्वयं ॐकार"], ["पणः", "Pa-nah", "Rewards every good deed", "ప్రతి మంచి పనికి ఫలం ఇచ్చేవాడు", "हर अच्छे काम का फल देने वाले"]], "v": ["Vishnu is the support of all supports, and no one created Him. He smiles like a blooming flower and is always awake, watching over us. He is above all, yet walks the right path to show us how. He gives the breath of life, He is Om itself, and He rewards every good deed.", "విష్ణువు అన్ని ఆధారాలకు ఆధారం; ఆయనను ఎవరూ సృష్టించలేదు. విరిసిన పువ్వులా నవ్వుతాడు, ఎప్పుడూ మేల్కొని మనల్ని కాపాడుతాడు. అందరికంటే పైనున్నవాడు, అయినా మనకు చూపించడానికి సన్మార్గంలో నడుస్తాడు. ప్రాణం ఇస్తాడు, ఓంకారమే ఆయన, ప్రతి మంచి పనికి ఫలం ఇస్తాడు.", "विष्णु सभी आधारों का आधार हैं, और उन्हें किसी ने नहीं बनाया। वे खिले फूल जैसे मुस्कुराते हैं और सदा जागकर हमारी रक्षा करते हैं। वे सबसे ऊपर हैं, फिर भी हमें दिखाने के लिए सन्मार्ग पर चलते हैं। वे प्राण देते हैं, स्वयं ॐकार हैं, और हर अच्छे काम का फल देते हैं।"]},
103:{"w": [["प्रमाणम्", "Pra-maa-nam", "The proof of all truth; knowledge itself", "సత్యానికి ప్రమాణం; జ్ఞానమే ఆయన", "सत्य का प्रमाण; स्वयं ज्ञान"], ["प्राणनिलयः", "Praa-na-ni-la-yah", "The home of all life", "అన్ని ప్రాణాలకు నిలయం", "सभी प्राणों का घर"], ["प्राणभृत्", "Praa-na-bhrit", "Nourishes all life", "ప్రాణాలను పోషించేవాడు", "प्राणों का पोषण करने वाले"], ["प्राणजीवनः", "Praa-na-jee-va-nah", "Keeps all beings alive", "అందరినీ బ్రతికించేవాడు", "सब प्राणियों को जीवित रखने वाले"], ["तत्त्वम्", "Tat-tvam", "The real truth", "నిజమైన తత్త్వం", "वास्तविक तत्व"], ["तत्त्ववित्", "Tat-tva-vit", "Knows the truth fully", "సత్యాన్ని పూర్తిగా తెలిసినవాడు", "सत्य को पूरी तरह जानने वाले"], ["एकात्मा", "E-kaat-maa", "The one Self in all", "అందరిలో ఉన్న ఒకే ఆత్మ", "सब में एक आत्मा"], ["जन्ममृत्युजरातिगः", "Jan-ma-mrit-yu-ja-raa-ti-gah", "Beyond birth, death and old age", "పుట్టుక, మరణం, ముసలితనం లేనివాడు", "जन्म, मृत्यु और बुढ़ापे से परे"]], "v": ["Vishnu is the proof of all truth; He is knowledge itself. He is the home of all life; He nourishes it and keeps every being alive. He is the real truth and knows it fully. He is the one Self living in all, beyond birth, death and old age.", "విష్ణువు సత్యానికి ప్రమాణం; జ్ఞానమే ఆయన. అన్ని ప్రాణాలకు నిలయం; వాటిని పోషిస్తాడు, ప్రతి జీవిని బ్రతికిస్తాడు. నిజమైన తత్త్వం ఆయనే, దానిని పూర్తిగా తెలిసినవాడు. అందరిలో ఉన్న ఒకే ఆత్మ; పుట్టుక, మరణం, ముసలితనం లేనివాడు.", "विष्णु सत्य का प्रमाण हैं; वे स्वयं ज्ञान हैं। वे सभी प्राणों का घर हैं; उनका पोषण करते हैं और हर प्राणी को जीवित रखते हैं। वे वास्तविक तत्व हैं और उसे पूरी तरह जानते हैं। वे सब में बसने वाली एक आत्मा हैं, जन्म, मृत्यु और बुढ़ापे से परे।"]},
104:{"w": [["भूर्भुवःस्वस्तरुः", "Bhoor-bhu-vah-svas-ta-ruh", "Like a tree that shelters all three worlds", "మూడు లోకాలకూ నీడనిచ్చే చెట్టు వంటివాడు", "तीनों लोकों को छाया देने वाले वृक्ष जैसे"], ["तारः", "Taa-rah", "Takes us across the sea of life", "సంసారాన్ని దాటించేవాడు", "संसार से पार ले जाने वाले"], ["सविता", "Sa-vi-taa", "The father of all", "అందరికీ తండ్రి", "सबके पिता"], ["प्रपितामहः", "Pra-pi-taa-ma-hah", "Great-grandfather of all (father of Brahma)", "అందరికీ ముత్తాత (బ్రహ్మకు తండ్రి)", "सबके परदादा (ब्रह्मा के पिता)"], ["यज्ञः", "Yaj-nah", "Is the sacred offering (yajna) itself", "యజ్ఞమే ఆయన", "स्वयं यज्ञ"], ["यज्ञपतिः", "Yaj-na-pa-tih", "Lord of all yajnas", "యజ్ఞాలకు ప్రభువు", "यज्ञों के स्वामी"], ["यज्वा", "Yaj-vaa", "Performs the yajna Himself", "తానే యజ్ఞం చేసేవాడు", "स्वयं यज्ञ करने वाले"], ["यज्ञाङ्गः", "Yaj-naan-gah", "Came as the Boar (Varaha), His body made of yajna", "యజ్ఞమే శరీరంగా వరాహుడిగా వచ్చినవాడు", "यज्ञमय शरीर वाले वराह बनकर आने वाले"], ["यज्ञवाहनः", "Yaj-na-vaa-ha-nah", "Keeps the yajnas going", "యజ్ఞాలను నడిపించేవాడు", "यज्ञों को चलाने वाले"]], "v": ["Vishnu is like a great tree that shelters all three worlds, and He takes us across the sea of life. He is the father of all, even the father of Brahma. He is the yajna itself, its Lord and the one who performs it. He came as the Boar whose body is yajna, and He keeps the yajnas going.", "విష్ణువు మూడు లోకాలకూ నీడనిచ్చే గొప్ప చెట్టు వంటివాడు; సంసారాన్ని దాటిస్తాడు. అందరికీ తండ్రి, బ్రహ్మకు కూడా తండ్రి. యజ్ఞమే ఆయన, యజ్ఞాలకు ప్రభువు, యజ్ఞం చేసేవాడూ ఆయనే. యజ్ఞమే శరీరంగా వరాహుడిగా వచ్చాడు, యజ్ఞాలను నడిపిస్తాడు.", "विष्णु तीनों लोकों को छाया देने वाले विशाल वृक्ष जैसे हैं, और हमें संसार से पार ले जाते हैं। वे सबके पिता हैं, ब्रह्मा के भी पिता। वे स्वयं यज्ञ हैं, यज्ञ के स्वामी और करने वाले भी। वे यज्ञमय शरीर वाले वराह बनकर आए, और यज्ञों को चलाते हैं।"]},
105:{"w": [["यज्ञभृत्", "Yaj-na-bhrit", "Protects the yajna", "యజ్ఞాన్ని కాపాడేవాడు", "यज्ञ की रक्षा करने वाले"], ["यज्ञकृत्", "Yaj-na-krit", "Created the yajna", "యజ్ఞాన్ని సృష్టించినవాడు", "यज्ञ की रचना करने वाले"], ["यज्ञी", "Yaj-nee", "Every yajna is for Him", "అన్ని యజ్ఞాలు ఆయన కోసమే", "सभी यज्ञ जिनके लिए हैं"], ["यज्ञभुक्", "Yaj-na-bhuk", "Receives the yajna", "యజ్ఞ ఫలాన్ని స్వీకరించేవాడు", "यज्ञ को ग्रहण करने वाले"], ["यज्ञसाधनः", "Yaj-na-saa-dha-nah", "Yajna is a way to reach Him", "యజ్ఞం ఆయనను చేరే మార్గం", "यज्ञ जिन तक पहुँचने का साधन है"], ["यज्ञान्तकृत्", "Yaj-naan-ta-krit", "Gives the fruit at the end of the yajna", "యజ్ఞం చివర ఫలం ఇచ్చేవాడు", "यज्ञ के अंत में फल देने वाले"], ["यज्ञगुह्यम्", "Yaj-na-guh-yam", "The secret of the yajna", "యజ్ఞ రహస్యం", "यज्ञ का रहस्य"], ["अन्नम्", "An-nam", "The food we enjoy", "మనం అనుభవించే ఆహారం", "हमारा भोजन"], ["अन्नादः", "An-naa-dah", "Enjoys the food", "ఆహారాన్ని స్వీకరించేవాడు", "भोजन को ग्रहण करने वाले"]], "v": ["Vishnu protects the yajna and created it, and every yajna is for Him. He receives it, it is a way to reach Him, and He gives its fruit at the end. He is the secret of the yajna. He is the food we enjoy, and He is also the one who enjoys it.", "విష్ణువు యజ్ఞాన్ని కాపాడుతాడు, దానిని సృష్టించాడు, అన్ని యజ్ఞాలు ఆయన కోసమే. యజ్ఞాన్ని ఆయనే స్వీకరిస్తాడు, యజ్ఞం ఆయనను చేరే మార్గం, చివరికి ఫలం ఇచ్చేదీ ఆయనే. యజ్ఞ రహస్యం ఆయనే. మనం అనుభవించే ఆహారం ఆయనే, దానిని స్వీకరించేవాడూ ఆయనే.", "विष्णु यज्ञ की रक्षा करते हैं, उसकी रचना उन्होंने की, और हर यज्ञ उन्हीं के लिए है। वही यज्ञ को ग्रहण करते हैं, यज्ञ उन तक पहुँचने का साधन है, और अंत में फल भी वही देते हैं। वे यज्ञ का रहस्य हैं। वे हमारा भोजन हैं, और उसे ग्रहण करने वाले भी वही हैं।"]},
106:{"w": [["आत्मयोनिः", "Aat-ma-yo-nih", "He is His own source", "తనకు తానే మూలం", "स्वयं अपना मूल"], ["स्वयंजातः", "Sva-yam-jaa-tah", "Born by His own will", "తన ఇష్టంతోనే జన్మించినవాడు", "अपनी इच्छा से जन्म लेने वाले"], ["वैखानः", "Vai-khaa-nah", "Dug deep into the earth (as Varaha)", "భూమిని లోతుగా తవ్వినవాడు (వరాహుడిగా)", "पृथ्वी को गहराई तक खोदने वाले (वराह रूप में)"], ["सामगायनः", "Saa-ma-gaa-ya-nah", "Sings the Sama Veda", "సామవేదం గానం చేసేవాడు", "सामवेद गाने वाले"], ["देवकीनन्दनः", "De-va-kee-nan-da-nah", "The dear son of Devaki", "దేవకి ప్రియ పుత్రుడు", "देवकी के प्रिय पुत्र"], ["स्रष्टा", "Srash-taa", "The creator", "సృష్టికర్త", "सृष्टि करने वाले"], ["क्षितीशः", "Kshi-tee-shah", "Lord of the earth", "భూమికి ప్రభువు", "पृथ्वी के स्वामी"], ["पापनाशनः", "Paa-pa-naa-sha-nah", "Destroys sins", "పాపాలను నశింపజేసేవాడు", "पापों का नाश करने वाले"]], "v": ["Vishnu is His own source, born only by His own will. As the Boar, He dug deep to lift the earth, and He sings the Sama Veda. He is Krishna, the dear son of Devaki. He is the creator and the Lord of the earth, and He destroys our sins.", "విష్ణువు తనకు తానే మూలం, తన ఇష్టంతోనే జన్మిస్తాడు. వరాహుడిగా భూమిని పైకి ఎత్తడానికి లోతుగా తవ్వాడు, సామవేదం గానం చేస్తాడు. దేవకి ప్రియ పుత్రుడైన కృష్ణుడు ఆయనే. సృష్టికర్త, భూమికి ప్రభువు, మన పాపాలను నశింపజేస్తాడు.", "विष्णु स्वयं अपना मूल हैं, केवल अपनी इच्छा से जन्म लेते हैं। वराह रूप में उन्होंने पृथ्वी को उठाने के लिए गहराई तक खोदा, और वे सामवेद गाते हैं। वे देवकी के प्रिय पुत्र कृष्ण हैं। वे सृष्टि करने वाले और पृथ्वी के स्वामी हैं, और हमारे पापों का नाश करते हैं।"]},
107:{"w": [["शङ्खभृत्", "Shan-kha-bhrit", "Holds the conch (Panchajanya)", "శంఖం (పాంచజన్యం) ధరించినవాడు", "शंख (पांचजन्य) धारण करने वाले"], ["नन्दकी", "Nan-da-kee", "Holds the sword Nandaka", "నందకం అనే ఖడ్గం ధరించినవాడు", "नंदक तलवार धारण करने वाले"], ["चक्री", "Chak-ree", "Holds the discus (Sudarshana)", "సుదర్శన చక్రం ధరించినవాడు", "सुदर्शन चक्र धारण करने वाले"], ["शार्ङ्गधन्वा", "Shaarn-ga-dhan-vaa", "Holds the bow Sharnga", "శార్ఙ్గం అనే విల్లు ధరించినవాడు", "शार्ङ्ग धनुष धारण करने वाले"], ["गदाधरः", "Ga-daa-dha-rah", "Holds the mace (Kaumodaki)", "గద (కౌమోదకి) ధరించినవాడు", "गदा (कौमोदकी) धारण करने वाले"], ["रथाङ्गपाणिः", "Ra-thaan-ga-paa-nih", "Holds the wheel in His hand", "చేతిలో చక్రం పట్టినవాడు", "हाथ में चक्र लिए हुए"], ["अक्षोभ्यः", "Ak-sho-bhyah", "Never shaken", "ఎప్పుడూ చలించనివాడు", "कभी विचलित न होने वाले"], ["सर्वप्रहरणायुधः", "Sar-va-pra-ha-ra-naa-yu-dhah", "Has every weapon to protect us", "మనల్ని రక్షించడానికి అన్ని ఆయుధాలు కలవాడు", "हमारी रक्षा के लिए सब आयुधों वाले"]], "v": ["Vishnu holds the conch, the sword, the discus, the bow and the mace. With the wheel in His hand, He is never shaken. He has every weapon needed to protect His devotees.", "విష్ణువు శంఖం, ఖడ్గం, చక్రం, విల్లు, గద ధరిస్తాడు. చేతిలో చక్రం పట్టి ఎప్పుడూ చలించడు. భక్తులను రక్షించడానికి కావలసిన అన్ని ఆయుధాలు ఆయన దగ్గర ఉన్నాయి.", "विष्णु शंख, तलवार, चक्र, धनुष और गदा धारण करते हैं। हाथ में चक्र लिए वे कभी विचलित नहीं होते। भक्तों की रक्षा के लिए उनके पास सभी आयुध हैं।"]},
108:{"w": [["वनमाली", "Va-na-maa-lee", "Wears a garland of forest flowers", "వనమాల ధరించినవాడు", "वनमाला पहनने वाले"], ["गदी", "Ga-dee", "With the mace", "గద కలవాడు", "गदा वाले"], ["शार्ङ्गी", "Shaarn-gee", "With the bow", "విల్లు కలవాడు", "धनुष वाले"], ["शङ्खी", "Shan-khee", "With the conch", "శంఖం కలవాడు", "शंख वाले"], ["चक्री", "Chak-ree", "With the discus", "చక్రం కలవాడు", "चक्र वाले"], ["नन्दकी", "Nan-da-kee", "With the sword", "ఖడ్గం కలవాడు", "तलवार वाले"], ["श्रीमान्", "Shree-maan", "Glorious, with Lakshmi", "శ్రీ (లక్ష్మి) తో కూడినవాడు", "श्री (लक्ष्मी) सहित, महिमावान"], ["नारायणः", "Naa-raa-ya-nah", "The home of all beings", "అన్ని జీవులకు నిలయం", "सब प्राणियों का आश्रय"], ["विष्णुः", "Vish-nuh", "Present everywhere", "అంతటా వ్యాపించినవాడు", "सर्वव्यापी"], ["वासुदेवः", "Vaa-su-de-vah", "Lives in all, and all live in Him", "అందరిలో ఉండేవాడు, అందరూ ఆయనలో ఉంటారు", "सबमें बसने वाले, सब जिनमें बसते हैं"], ["अभिरक्षतु", "A-bhi-rak-sha-tu", "May He protect us", "మనల్ని రక్షించుగాక", "हमारी रक्षा करें"]], "v": ["May the glorious Lord Narayana, Vishnu, Vasudeva protect us: He who wears the garland of forest flowers and holds the mace, the bow, the conch, the discus and the sword.", "వనమాల ధరించి, గద, విల్లు, శంఖం, చక్రం, ఖడ్గం పట్టుకున్న శ్రీమన్నారాయణుడు, విష్ణువు, వాసుదేవుడు మనల్ని రక్షించుగాక.", "वनमाला पहने, गदा, धनुष, शंख, चक्र और तलवार धारण करने वाले श्रीमान नारायण, विष्णु, वासुदेव हमारी रक्षा करें।"]}
};

T.ex={en:["Fear leaves: the stotram says the devoted reciter is not afraid anywhere.","Strength and radiance: it promises vigour, brightness, health and good qualities.","Relief in trouble: the sick are freed from illness, the distressed from distress, the sorrowful from sorrow.","A calm mind: devotees are said to stay free from anger, jealousy and greed."],
te:["భయం తొలగుతుంది: భక్తితో పఠించేవారికి ఎక్కడా భయం ఉండదని స్తోత్రం చెబుతుంది.","బలం, తేజస్సు: శక్తి, కాంతి, ఆరోగ్యం, సద్గుణాలు కలుగుతాయి.","కష్టంలో ఉపశమనం: రోగులు రోగం నుండి, ఆపదలో ఉన్నవారు ఆపద నుండి, దుఃఖంలో ఉన్నవారు దుఃఖం నుండి విముక్తులవుతారు.","ప్రశాంత మనస్సు: భక్తులకు కోపం, అసూయ, లోభం, చెడు ఆలోచనలు కలగవని చెబుతారు."],
hi:["भय दूर होता है: श्रद्धा से पाठ करने वाले को कहीं भय नहीं रहता।","बल और तेज: शक्ति, कांति, स्वास्थ्य और सद्गुण मिलते हैं।","कष्ट में राहत: रोगी रोग से, संकट में पड़े संकट से और दुखी दुख से मुक्त होते हैं।","शांत मन: भक्तों में क्रोध, ईर्ष्या, लोभ और बुरे विचार नहीं आते, ऐसा कहा गया है।"]};
T.cnt={en:"While learning: say each new verse 3 times a day, then revise older verses. Traditional practice: chant the full stotram once daily, and many take a resolution (sankalpa) for 48 days. Counts differ by family, so follow your guru.",
te:"నేర్చుకునేటప్పుడు: ప్రతి కొత్త శ్లోకాన్ని రోజుకు 3 సార్లు చెప్పండి, పాత శ్లోకాలను పునశ్చరణ చేయండి. సంప్రదాయం: రోజూ పూర్తి స్తోత్రాన్ని ఒకసారి పఠించడం; చాలామంది 48 రోజుల సంకల్పం చేస్తారు. కుటుంబ సంప్రదాయాన్ని బట్టి మారుతుంది, గురువును అనుసరించండి.",
hi:"सीखते समय: हर नया श्लोक दिन में 3 बार बोलें, फिर पुराने श्लोकों का दोहराव करें। परंपरा: रोज़ पूरा स्तोत्र एक बार पढ़ना; कई लोग 48 दिन का संकल्प लेते हैं। परिवार के अनुसार भिन्न होता है, गुरु का अनुसरण करें।"};
T.h={ex:{en:"What it can give you",te:"ఇది ఇచ్చేవి",hi:"इससे क्या मिलता है"},ct:{en:"How many times",te:"ఎన్ని సార్లు",hi:"कितनी बार"}};
M[61].v=["God holds a fine bow and a sharp axe. He is firm with those who do wrong and gives wealth to those who need it. He sees everything, gave us the Vedas as Vyasa, is the master of speech, and was never born from a mother's womb.","భగవంతుడు మంచి విల్లు, పదునైన గొడ్డలి ధరించాడు. తప్పు చేసేవారిపై కఠినంగా ఉంటాడు, అవసరమైనవారికి సంపద ఇస్తాడు. అన్నీ చూస్తాడు, వ్యాసునిగా వేదాలను మనకు అందించాడు, మాటకు అధిపతి, తల్లి గర్భం నుండి పుట్టనివాడు.","भगवान के पास उत्तम धनुष और तेज़ परशु है। वे गलत करने वालों के लिए कठोर हैं और ज़रूरतमंदों को धन देते हैं। वे सब कुछ देखते हैं, व्यास रूप में उन्होंने वेद दिए, वे वाणी के स्वामी हैं और माँ के गर्भ से जन्म नहीं लेते।"];
M[62].v=["He is the one the three Sama chants praise. He is peace and freedom from all suffering. Like a doctor with the right medicine, he heals the pain of life. He gives calm to the mind, and in him everyone finally finds rest.","మూడు సామాలు ఆయనను స్తుతిస్తాయి. ఆయన శాంతి, అన్ని బాధల నుండి విముక్తి. సరైన మందు ఇచ్చే వైద్యుని వలె జీవితపు బాధను తగ్గిస్తాడు. మనసుకు ప్రశాంతతనిస్తాడు, చివరికి అందరూ ఆయనలోనే విశ్రాంతి పొందుతారు.","तीन साम उन्हीं की स्तुति करते हैं। वे शांति और हर दुख से मुक्ति हैं। सही दवा देने वाले वैद्य की तरह वे जीवन का कष्ट दूर करते हैं। वे मन को शांति देते हैं और अंत में सब उन्हीं में विश्राम पाते हैं।"];
M[63].v=["He is beautiful and gives peace. He created everything and looks after cows and all living beings. His kind eyes grant what is good for us, and he loves dharma, the right way to live.","ఆయన సుందరుడు, శాంతిని ఇచ్చేవాడు. అన్నింటినీ సృష్టించి, గోవులను, సమస్త జీవులను కాపాడతాడు. ఆయన కరుణ చూపు మనకు మేలు కలిగిస్తుంది, ధర్మమంటే ఆయనకు ప్రేమ.","वे सुंदर हैं और शांति देते हैं। उन्होंने सब कुछ रचा और वे गायों तथा सब प्राणियों की रक्षा करते हैं। उनकी करुणा भरी दृष्टि हमें मंगल देती है और उन्हें धर्म प्रिय है।"];

function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(){try{localStorage.setItem('sp2',JSON.stringify(S))}catch(e){}}

S.lang=S.lang||'en';S.main=S.main||'sa';S.learned=S.learned||[];S.steps=S.steps||{};S.sc=S.sc||{};
var listenCount={};
var $=function(i){return document.getElementById(i)};
function dstr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function tdy(){return dstr(new Date())}
function addDay(){if(S.days.indexOf(tdy())<0){S.days.push(tdy())}sv()}
function setStep(k,on){var a=S.steps[tdy()]||[0,0,0,0,0];a[k]=on?1:0;S.steps[tdy()]=a;sv()}
function streak(){var n=0,d=new Date();if(S.days.indexOf(dstr(d))<0)d.setDate(d.getDate()-1);while(S.days.indexOf(dstr(d))>=0){n++;d.setDate(d.getDate()-1)}return n}
var view='home',vi=0,tab='say',selW=0,LST=[],notice='',transMsg='';
S.rev=S.rev||{};if(S.vset!==2){(function(){var O=[1,2,3,4,5];for(var q=61;q<=108;q++)O.push(q);var p=S.pos||0;S.pos=p>=O.length?V.length:Math.max(0,vIdx(O[p]));S.vset=2;sv()})()}if(S.themeV!==2){S.theme='mayur';S.themeV=2}if((S.learned.length||(S.days&&S.days.length))&&!S.setupDone)S.setupDone=true;
function vIdx(n){for(var i=0;i<V.length;i++)if(V[i].n===n)return i;return -1}
function dnum(x){var p=String(x).split('-');return (+p[0])*10000+(+p[1])*100+(+p[2])}
function dueVerses(){var td=tdy(),out=[];Object.keys(S.rev).forEach(function(k){if(dnum(S.rev[k].due)<=dnum(td))out.push(+k)});out.sort(function(a,b){return a-b});return out}
function mkList(){var L=[],e=Math.min(S.pos+S.pace,V.length),seen={};
 dueVerses().forEach(function(n){var i=vIdx(n);if(i>=0){L.push({i:i,r:1,rt:'due'});seen[n]=1}});
 for(var j=S.pos;j<e;j++)if(!seen[V[j].n]&&S.learned.indexOf(V[j].n)<0)L.push({i:j,r:0});
 return L}
function recapList(){return S.learned.slice().sort(function(a,b){return a-b}).map(function(n){return {i:vIdx(n),r:1,rt:'recap'}}).filter(function(x){return x.i>=0})}
function advanceRev(n){var r=S.rev[n];if(!r){S.rev[n]={stage:0,due:addDays(1)};return}
 var step=[1,3,7],d=new Date();
 if(r.stage>=step.length-1){delete S.rev[n]}
 else{r.stage++;r.due=addDays(step[r.stage])}}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return dstr(d)}
function lab(a,b){var n=[];for(var i=a;i<b;i++)n.push(V[i].n);return(n.length>1?'Verses ':'Verse ')+n.join(', ')}
function weekDots(){var d=new Date(),dow=(d.getDay()+6)%7,s='';d.setDate(d.getDate()-dow);var nm='MTWTFSS';
 for(var k=0;k<7;k++){var x=new Date(d);x.setDate(d.getDate()+k);s+='<span class="'+(S.days.indexOf(dstr(x))>=0?'on':'')+'">'+nm[k]+'</span>'}return s}
function chipsLang(){return '<div class="chips">'+[['en','English'],['te','తెలుగు'],['hi','हिन्दी']].map(function(x){return '<button class="chip" data-act="lang" data-v="'+x[0]+'" aria-pressed="'+(S.lang===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'}
function syl(s,mn){
 if(mn==='en')return s;
 var b=mn==='te'?0xC00:0x900,out='',cur='',pv=false;
 for(var i=0;i<s.length;i++){var o=s.charCodeAt(i)-b,ch=s[i];
  var cons=o>=0x15&&o<=0x39,ind=o>=0x05&&o<=0x14,mk=(o>=0x01&&o<=0x03)||(o>=0x3E&&o<=0x4C)||o===0x4D||o===0x3C;
  if(cons||ind){if(pv){cur+=ch}else{if(cur)out+=cur+'-';cur=ch}pv=false}
  else if(mk){cur+=ch;pv=(o===0x4D)}
  else{out+=cur+ch;cur='';pv=false}}
 return out+cur}
function eta(){var left=Math.max(0,TOTAL-S.learned.length);if(!left)return 'All done';var d=Math.ceil(left/S.pace),f=new Date();f.setDate(f.getDate()+d-1);return d+' days left at '+S.pace+' a day, finishing about '+f.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function lastGap(){if(!S.days.length)return -1;var l=0;S.days.forEach(function(s){var t=parseD(s).getTime();if(t>l)l=t});var t0=new Date();t0.setHours(0,0,0,0);return Math.round((t0.getTime()-l)/864e5)}
function bestStreak(){var a=S.days.map(function(s){return parseD(s).getTime()}).sort(function(x,y){return x-y}),b=0,c=0,p=null;a.forEach(function(t){if(p!==null&&Math.round((t-p)/864e5)===1)c++;else c=1;p=t;if(c>b)b=c});return b}
function monthDays(){var d=new Date(),n=0;S.days.forEach(function(s){var x=parseD(s);if(x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth())n++});return n}
function nudgeCard(){var g=lastGap(),n=S.learned.length;
 if(g>=2)return '<div class="welcome"><b>Welcome back \ud83d\ude4f</b><br>Missing a day is okay. '+(n?'Your '+n+' learned verses are safe. ':'')+'Your streak starts fresh today. One small practice is enough to begin again.</div>';
 if(g===1&&streak()>0)return '<div class="welcome keep"><b>\ud83d\udd25 '+streak()+'-day streak</b><br>Practise today to keep it going.</div>';
 return ''}

function cheer(){S.cheered=S.cheered||{};var o=null,n=S.learned.length,st=streak();
 MS_L.forEach(function(m){if(n>=m[0]&&!S.cheered['l'+m[0]])o={i:m[1],t:m[2]}});

 var d=new Date(),p=function(n){return('0'+n).slice(-2)},ds=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()),stp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',u=location.href.split('#')[0];

function stats(){var left=Math.max(0,TOTAL-S.learned.length),d=Math.ceil(left/S.pace),f=new Date();f.setDate(f.getDate()+d-1);

function paceChips(){var left=Math.max(0,TOTAL-S.learned.length);

ne ends with one, hold that half-beat a little longer so the line carries well.", "te": "ఇటాలిక్ అక్షరం తరువాత రెండు చుక్కలు ఉంటే అది హలంతు (అచ్చు లేని అక్షరం), అంటే అర్ధ మాత్ర. పంక్తి దానితో ముగిస్తే, లయ బాగుండేలా ఆ అర్ధ మాత్రను కొద్దిగా పొడిగించి పలకండి.", "hi": "इटैलिक अक्षर के बाद दो बिंदु हों तो वह हलंत (स्वर रहित) अक्षर है, यानी आधी मात्रा। यदि पंक्ति उसी पर समाप्त हो, तो लय बनाए रखने के लिए उस आधी मात्रा को थोड़ा खींचकर बोलें।"}}, {"ic": "ं", "t": {"en": "The dot on top (anusvara)", "te": "సున్నా (అనుస్వారం)", "hi": "अनुस्वार (ं)"}, "d": {"en": "It has no sound of its own and changes with the letter that follows: before k-group letters it sounds like ṅ, ch-group like ñ, ṭ-group like ṇ, t-group like n, p-group like m. Before ya to ha (except la) it is a soft m; before la it sounds like l.", "te": "సున్నాకు స్వంత ఉచ్చారణ లేదు; తరువాత వచ్చే అక్షరాన్ని బట్టి మారుతుంది: క-వర్గం ముందు “ఙ్”, చ-వర్గం ముందు “ఞ్”, ట-వర్గం ముందు “ణ్”, త-వర్గం ముందు “న్”, ప-వర్గం ముందు “మ్”. య నుండి హ వరకు (ల తప్ప) “మ్”; ల ముందు “ల్”.", "hi": "इसकी अपनी ध्वनि नहीं होती; आगे के अक्षर के अनुसार बदलती है: क-वर्ग से पहले “ङ्”, च-वर्ग से पहले “ञ्”, ट-वर्ग से पहले “ण्”, त-वर्ग से पहले “न्”, प-वर्ग से पहले “म्”। य से ह तक (ल को छोड़कर) “म्”; ल से पहले “ल्”।"}}, {"ic": "ः", "t": {"en": "The two dots (visarga)", "te": "విసర్గ", "hi": "विसर्ग"}, "d": {"en": "If the next word starts with a k-group letter (k, kh, g, gh), say the visarga as a short \"ha\" echo. If the next word starts with kṣa, say the visarga fully with no change (for example verse 41: udbhavaḥ kṣobhaṇaḥ).", "te": "తరువాతి పదం క-వర్గ అక్షరంతో మొదలైతే విసర్గను చిన్న “హ” ప్రతిధ్వనిగా పలకండి. క్ష తో మొదలైతే విసర్గను ఏ మార్పూ లేకుండా పూర్తిగా పలకండి (ఉదా: శ్లోకం 41 — ఉద్భవః క్షోభణః).", "hi": "अगला शब्द क-वर्ग के अक्षर से शुरू हो तो विसर्ग को छोटी “ह” की गूँज की तरह बोलें। क्ष से शुरू हो तो विसर्ग को बिना बदलाव पूरा बोलें (जैसे श्लोक 41: उद्भवः क्षोभणः)।"}}, {"ic": "व्ष", "t": {"en": "Joined letters", "te": "సంయుక్తాక్షరాలు", "hi": "संयुक्ताक्षर"}, "d": {"en": "In a joined letter, say the first letter first and clearly: viṣṇu = vi-ṣ-ṇu, sarva = sar-va. With ha: brahmā is said bra-m-ha, vahni is va-n-hi, jahnu is ja-n-hu.", "te": "సంయుక్తాక్షరంలో ముందు వ్రాసిన అక్షరాన్ని ముందు స్పష్టంగా పలకండి: విష్ణు = వి-ష్-ణు, సర్వ = సర్-వ. “హ” తో: బ్రహ్మా = బ్ర-మ్-హా, వహ్ని = వ-న్-హి, జహ్ను = జ-న్-హు.", "hi": "संयुक्त अक्षर में पहले अक्षर को पहले और साफ बोलें: विष्णु = वि-ष्-णु, सर्व = सर्-व। “ह” के साथ: ब्रह्मा = ब्र-म्-हा, वह्नि = व-न्-हि, जह्नु = ज-न्-हु।"}}, {"ic": "ऽ", "t": {"en": "The curl (avagraha)", "te": "అవగ్రహం", "hi": "अवग्रह"}, "d": {"en": "It stands for a silent \"a\". Say the vowel before it a little longer so the a-sound joins in. Two in a row mean the same, twice. Example: after nyagrodho in verse 88.", "te": "ఇది నిశ్శబ్ద “అ” ను సూచిస్తుంది. దాని ముందు అక్షరాన్ని కొంచెం దీర్ఘంగా పలికితే “అ” ధ్వని కలిసి వస్తుంది. వరుసగా రెండు ఉంటే అదే రెండు సార్లు. ఉదా: శ్లోకం 88 లో “న్యగ్రోధో” తరువాత.", "hi": "यह मौन “अ” का संकेत है। इसके पहले के स्वर को थोड़ा लंबा बोलें ताकि “अ” की ध्वनि मिल जाए। लगातार दो हों तो वही दो बार। उदाहरण: श्लोक 88 में “न्यग्रोधो” के बाद।"}}, {"ic": "★", "t": {"en": "A star", "te": "నక్షత్రం", "hi": "तारा"}, "d": {"en": "A star beside a word means a footnote gives another accepted way to read it. Follow your own guru's way.", "te": "పదం పక్కన ★ ఉంటే, దానిని ఇలా కూడా చదవవచ్చని కింద చిన్న గమనిక ఇవ్వబడుతుంది. మీ గురువు చెప్పినట్లు చదవండి.", "hi": "शब्द के पास ★ हो तो नीचे टिप्पणी में उसे पढ़ने का दूसरा मान्य तरीका दिया होता है। अपने गुरु के अनुसार पढ़ें।"}}, {"ic": "🙏", "t": {"en": "Starting and ending prayer", "te": "ప్రారంభ / చివరి ప్రార్థన", "hi": "आरंभ और समापन प्रार्थना"}, "d": {"en": "Said three times at the start and at the end: \"Shree Raama Raama Raameti, Rame Raame Manorame, Sahasra-naama tat-tulyam, Raama-naama Varaanane.\"", "te": "ప్రారంభంలో మరియు చివర మూడు సార్లు చెప్పండి: “శ్రీ రామ రామ రామేతి రమే రామే మనోరమే | సహస్ర నామ తత్తుల్యం రామ నామ వరాననే.”", "hi": "आरंभ और अंत में  Object.keys(M).forEach(function(n){(M[n].w||[]).forEach(function(w){if(mnorm(w[1]).indexOf(q)>=0||mnorm(w[0]).indexOf(q)>=0||(ql.length>2&&(w[2+k]||'').toLowerCase().indexOf(ql)>=0))out.push([+n,w])})});return out}

 if(!h.length)return '<div class="mute">No name found. Try another spelling, like "govinda" or "keshava".</div>';

var GX={"61": {"en": "Child, this verse begins with the Lord as a warrior. Sudhanvā: He holds the great bow Shārnga. Khanda-parashuh: as Parashurama, He carried the axe. Dārunah: He is stern, but only with evil. To the good He is Dravina-pradah, the giver of wealth. Like a father who is strict with a bully but gentle with his own children.\n\nThen He grows bigger in our eyes. Divas-prik: He touches the heavens. Sarva-drik: nothing is hidden from Him. Then He becomes our teacher. As Vyāsa He arranged the Vedas so that people like us could learn them. Vāchaspatih: He is the Lord of speech, so every word we chant is His gift. And Ayonijah: He was not born the way we are born. He comes by His own wish, out of love.\n\nSo before you chant, remember: the One who gave the Vedas is listening to you.", "te": "నాయనా, ఈ శ్లోకం స్వామిని వీరుడిగా చూపిస్తుంది. సుధన్వా: ఆయన శార్ఙ్గమనే గొప్ప విల్లు ధరిస్తాడు. ఖండపరశుః: పరశురాముడిగా గొడ్డలి పట్టాడు. దారుణః: ఆయన కఠినంగా ఉండేది చెడుపైన మాత్రమే. మంచివారికి ఆయన ద్రవిణప్రదః, సంపద ఇచ్చేవాడు. రౌడీతో కఠినంగా, తన పిల్లలతో మృదువుగా ఉండే తండ్రిలా.\n\nతర్వాత ఆయన మన కళ్ళకు ఇంకా పెద్దగా కనిపిస్తాడు. దివస్పృక్: ఆకాశాన్ని తాకేవాడు. సర్వదృక్: ఆయనకు ఏదీ దాగదు. ఆపై మనకు గురువవుతాడు. వ్యాసుడిగా వేదాలను విభజించి, మనలాంటి వారు నేర్చుకునేలా చేశాడు. వాచస్పతిః: మాటకు అధిపతి, కాబట్టి మనం పలికే ప్రతి మాట ఆయన ఇచ్చిన వరమే. అయోనిజః: ఆయన మనలా పుట్టలేదు. ప్రేమతో, తన ఇష్టంతో వస్తాడు.\n\nకాబట్టి పఠించే ముందు గుర్తుంచుకో: వేదాలు ఇచ్చిన స్వామి నువ్వు చెప్పేది వింటున్నాడు.", "hi": "बेटा, यह श्लोक प्रभु को एक वीर के रूप में दिखाता है। सुधन्वा: वे शार्ङ्ग नाम का महान धनुष धारण करते हैं। खण्डपरशुः: परशुराम बनकर उन्होंने फरसा उठाया। दारुणः: वे कठोर हैं, पर केवल बुराई के लिए। अच्छे लोगों के लिए वे द्रविणप्रदः हैं, धन देने वाले। जैसे पिता गुंडे से सख़्त, पर अपने बच्चों से कोमल होता है।\n\nफिर वे हमारी आँखों में और बड़े हो जाते हैं। दिवस्पृक्: आकाश को छूने वाले। सर्वदृक्: उनसे कुछ छिपा नहीं। फिर वे हमारे गुरु बनते हैं। व्यास बनकर उन्होंने वेदों को बाँटा, ताकि हम जैसे लोग सीख सकें। वाचस्पतिः: वाणी के स्वामी, इसलिए हमारा हर शब्द उन्हीं का दिया है। अयोनिजः: वे हमारी तरह जन्म नहीं लेते। प्रेम से, अपनी इच्छा से आते हैं।\n\nइसलिए पाठ से पहले याद रखो: वेद देने वाले प्रभु तुम्हें सुन रहे हैं।"}, "62": {"en": "Child, this verse is full of music and healing. Tri-sāmā, Sāmagah, Sāma: He is praised in the Sama Veda, He sings it, and He is that song. When the priests chant Sama in a yajna, they are singing Him.\n\nNow listen to two lovely names: Bheshajam and Bhishak, the medicine and the doctor. Our real sickness is not only fever. It is worry, fear, anger, and going round and round in this world. For that sickness, He is the doctor who knows what we need, and He is also the medicine. As Dhanvantari He even came holding the pot of amrita.\n\nThen comes peace, again and again: Shamah, Shāntah, Shāntih. He gives calm, He is calm, He is peace itself. And Parāyanam: the final place every soul reaches, like rivers reaching the ocean.\n\nWhen your mind is restless, chant this verse slowly. Let Him be your medicine.", "te": "నాయనా, ఈ శ్లోకం సంగీతంతో, వైద్యంతో నిండి ఉంది. త్రిసామా, సామగః, సామ: సామవేదంలో ఆయనను స్తుతిస్తారు, ఆయనే దాన్ని గానం చేస్తాడు, ఆ గానం కూడా ఆయనే. యజ్ఞంలో పండితులు సామం పాడితే, వాళ్ళు ఆయననే పాడుతున్నారు.\n\nఇప్పుడు రెండు అందమైన నామాలు విను: భేషజం, భిషక్. మందు, వైద్యుడు. మన అసలు జబ్బు జ్వరం ఒక్కటే కాదు. చింత, భయం, కోపం, ఈ సంసారంలో తిరుగుతూ ఉండటం. ఆ జబ్బుకు మనకేం కావాలో తెలిసిన వైద్యుడు ఆయనే, మందు కూడా ఆయనే. ధన్వంతరిగా అమృత కలశం పట్టుకుని వచ్చాడు కూడా.\n\nతర్వాత శాంతి మళ్ళీ మళ్ళీ వస్తుంది: శమః, శాంతః, శాంతిః. శాంతి ఇస్తాడు, శాంతంగా ఉంటాడు, శాంతి స్వరూపమే ఆయన. పరాయణం: నదులు సముద్రాన్ని చేరినట్టు, ప్రతి ఆత్మ చివరకు చేరే చోటు.\n\nమనసు అశాంతిగా ఉన్నప్పుడు ఈ శ్లోకం నెమ్మదిగా చదువు. ఆయనే నీకు మందు అవ్వనీ.", "hi": "बेटा, यह श्लोक संगीत और इलाज से भरा है। त्रिसामा, सामगः, साम: सामवेद में उनकी स्तुति होती है, वे उसे गाते हैं, और वह गीत भी वही हैं। यज्ञ में जब पंडित साम गाते हैं, तो वे उन्हीं को गा रहे होते हैं।\n\nअब दो प्यारे नाम सुनो: भेषजम् और भिषक्, दवा और डॉक्टर। हमारी असली बीमारी केवल बुख़ार नहीं। चिंता, डर, गुस्सा, और इस संसार में घूमते रहना। उस बीमारी के लिए वे डॉक्टर हैं जो जानते हैं हमें क्या चाहिए, और दवा भी वही हैं। धन्वंतरि बनकर वे अमृत का कलश लेकर भी आए।\n\nफिर शांति बार-बार आती है: शमः, शान्तः, शान्तिः। वे शांति देते हैं, शांत हैं, स्वयं शांति हैं। परायणम्: जैसे नदियाँ सागर तक पहुँचती हैं, वैसे हर आत्मा अंत में उन्हीं तक पहुँचती है।\n\nजब मन बेचैन हो, यह श्लोक धीरे-धीरे पढ़ो। उन्हें अपनी दवा बनने दो।"}, "63": {"en": "Child, this verse shows the Lord as a loving cowherd. First, Shubhāngah: His form is beautiful. Shānti-dah: just seeing Him gives peace. Srashtā: He made this whole world.\n\nKumudah: He rejoices on the earth, among us. Kuvaleshayah: He also rests on the great waters, on Adisesha. So He is both far and near.\n\nNow the sweetest part: Go-hitah, Go-patih, Goptā. He cares for the cows, He is their master, and He protects them. Think of little Krishna in Vrindavan, taking the cows out every morning, knowing each one by name, bringing them home safely every evening. In the same way, He looks after every one of us.\n\nVrishabhākshah: His eyes shower blessings like rain. Vrisha-priyah: He loves those who follow dharma.\n\nSo be kind to animals and to all beings. When you care for them, you are doing His work.", "te": "నాయనా, ఈ శ్లోకం స్వామిని ప్రేమగల గోపాలుడిగా చూపిస్తుంది. ముందుగా శుభాంగః: ఆయన రూపం అందమైనది. శాంతిదః: ఆయనను చూస్తేనే శాంతి కలుగుతుంది. స్రష్టా: ఈ లోకమంతా సృష్టించినవాడు.\n\nకుముదః: మన మధ్య భూమిపై ఆనందించేవాడు. కువలేశయః: మహా జలాలపై, ఆదిశేషుడిపై విశ్రాంతి తీసుకునేవాడు. అంటే ఆయన దూరంగానూ ఉంటాడు, దగ్గరగానూ ఉంటాడు.\n\nఇప్పుడు మధురమైన భాగం: గోహితః, గోపతిః, గోప్తా. ఆవులను ప్రేమగా చూసుకుంటాడు, వాటికి యజమాని, వాటిని రక్షిస్తాడు. బృందావనంలో చిన్ని కృష్ణుడిని తలచుకో. ప్రతి ఉదయం ఆవులను తోలుకెళ్ళి, ఒక్కొక్కదాన్నీ పేరుతో గుర్తుపట్టి, సాయంత్రం క్షేమంగా ఇంటికి తెచ్చేవాడు. అలాగే మనలో ప్రతి ఒక్కరినీ చూసుకుంటాడు.\n\nవృషభాక్షః: ఆయన కళ్ళు వానలా ఆశీస్సులు కురిపిస్తాయి. వృషప్రియః: ధర్మంగా నడిచేవారంటే ఆయనకు ప్రేమ.\n\nకాబట్టి జంతువులపట్ల, అన్ని జీవులపట్ల దయగా ఉండు. వాటిని చూసుకుంటే, నువ్వు ఆయన పనే చేస్తున్నావు.", "hi": "बेटा, यह श्लोक प्रभु को प्रेम करने वाले ग्वाले के रूप में दिखाता है। पहले शुभाङ्गः: उनका रूप सुंदर है। शान्तिदः: उन्हें देखते ही शांति मिलती है। स्रष्टा: उन्होंने यह पूरा संसार बनाया।\n\nकुमुदः: वे धरती पर, हमारे बीच आनंद लेते हैं। कुवलेशयः: वे महा-जल पर, आदिशेष पर भी विश्राम करते हैं। यानी वे दूर भी हैं और पास भी।\n\nअब सबसे मीठा भाग: गोहितः, गोपतिः, गोप्ता। वे गायों का भला करते हैं, उनके स्वामी हैं, उनकी रक्षा करते हैं। वृंदावन के नन्हे कृष्ण को याद करो। हर सुबह गायों को चराने ले जाते, हर एक को नाम से पहचानते, और शाम को सुरक्षित घर लाते। वैसे ही वे हम सबका ध्यान रखते हैं।\n\nवृषभाक्षः: उनकी आँखें बारिश की तरह आशीर्वाद बरसाती हैं। वृषप्रियः: धर्म पर चलने वाले उन्हें प्रिय हैं।\n\nइसलिए जानवरों और सब जीवों पर दया करो। उनकी देखभाल करोगे तो उन्हीं का काम कर रहे होगे।"}, "64": {"en": "Child, this verse shows how wise the Lord is with each of us. Anivartī and Nivrittātmā: to the one who still wants worldly happiness, He gives it, and lets them enjoy it. To the one who has turned away from worldly wants, He becomes dear as life itself. Sanksheptā: He gives deep wisdom slowly, only when we are ready. Like a good mother who does not give a baby hard food too soon.\n\nKshema-krit: He removes the obstacles of those who seek Him. Shivah: He is good to everyone, without exception.\n\nThen the verse turns to Mother Lakshmi. Shrīvatsa-vakshāh: on His chest is the Shrivatsa mark, the sign of her love. Shrī-vāsah, Shrī-patih: she lives in Him, and He is her Lord. They are never apart.\n\nSo do not be impatient. Pray sincerely, and trust that He will give you what is right, at the right time.", "te": "నాయనా, ఈ శ్లోకం స్వామి మనలో ప్రతి ఒక్కరితో ఎంత జ్ఞానంగా ఉంటాడో చూపిస్తుంది. అనివర్తీ, నివృత్తాత్మా: ఇంకా లోక సుఖాలు కోరుకునేవారికి అవి ఇచ్చి, అనుభవించనిస్తాడు. లోక కోరికలు వదిలినవారికి ప్రాణంకంటే ప్రియమవుతాడు. సంక్షేప్తా: లోతైన జ్ఞానాన్ని నెమ్మదిగా, మనం సిద్ధమైనప్పుడే ఇస్తాడు. పసిబిడ్డకు గట్టి ఆహారం తొందరగా పెట్టని మంచి తల్లిలా.\n\nక్షేమకృత్: తనను వెతికేవారి అడ్డంకులు తొలగిస్తాడు. శివః: అందరికీ, ఎవరినీ వదలకుండా మేలు చేసేవాడు.\n\nతర్వాత శ్లోకం లక్ష్మీదేవి వైపు తిరుగుతుంది. శ్రీవత్సవక్షాః: ఆయన వక్షస్థలంపై శ్రీవత్స చిహ్నం, ఆమె ప్రేమకు గుర్తు. శ్రీవాసః, శ్రీపతిః: ఆమె ఆయనలో నివసిస్తుంది, ఆయన ఆమెకు పతి. వాళ్ళు ఎప్పుడూ విడిపోరు.\n\nకాబట్టి తొందరపడకు. మనస్ఫూర్తిగా ప్రార్థించు. సరైనది, సరైన సమయంలో ఆయన ఇస్తాడని నమ్ము.", "hi": "बेटा, यह श्लोक दिखाता है कि प्रभु हम सबके साथ कितनी समझदारी से पेश आते हैं। अनिवर्ती और निवृत्तात्मा: जो अभी भी संसार का सुख चाहता है, उसे वे सुख देते हैं और भोगने देते हैं। जिसने संसार की इच्छाएँ छोड़ दीं, उसके लिए वे प्राणों से भी प्रिय हो जाते हैं। संक्षेप्ता: गहरा ज्ञान वे धीरे-धीरे, तभी देते हैं जब हम तैयार हों। जैसे अच्छी माँ छोटे बच्चे को कड़ा खाना जल्दी नहीं देती।\n\nक्षेमकृत्: उन्हें खोजने वालों की बाधाएँ दूर करते हैं। शिवः: वे सबका भला करते हैं, बिना किसी भेद के।\n\nफिर श्लोक माँ लक्ष्मी की ओर मुड़ता है। श्रीवत्सवक्षाः: उनकी छाती पर श्रीवत्स का चिह्न है, लक्ष्मी के प्रेम की निशानी। श्रीवासः, श्रीपतिः: लक्ष्मी उनमें रहती हैं, और वे उनके स्वामी हैं। दोनों कभी अलग नहीं होते।\n\nइसलिए अधीर मत हो। सच्चे मन से प्रार्थना करो, और भरोसा रखो कि वे सही चीज़, सही समय पर देंगे।"}, "65": {"en": "Child, almost every name in this verse begins with Shrī, Mother Lakshmi. That tells us something beautiful: the Lord and the Mother are never apart.\n\nShrī-dah: He gives her glory. Shrī-shah: He is her Lord. Shrī-nivāsah: she lives in Him always. Shrī-dharah: He holds her close, the way the moon holds its moonlight. You cannot separate moonlight from the moon.\n\nShrī-karah: whenever He comes to earth, she comes too. When He was Rama, she was Sita. When He was Krishna, she was Rukmini. Even in the temple at Tirumala, she lives on His chest.\n\nShreyah: He is the highest good we can ever have. And Loka-trayāshrayah: He is the shelter of all three worlds.\n\nSo when we pray, we go to both of them together. The Mother is kind and speaks for us; the Lord listens. True wealth is not only money. It is having them in our home.", "te": "నాయనా, ఈ శ్లోకంలో దాదాపు ప్రతి నామం శ్రీతో, అంటే లక్ష్మీదేవితో మొదలవుతుంది. అది మనకు ఒక అందమైన విషయం చెబుతుంది: స్వామి, అమ్మవారు ఎప్పుడూ విడిపోరు.\n\nశ్రీదః: ఆమెకు వైభవం ఇచ్చేవాడు. శ్రీశః: ఆమెకు ప్రభువు. శ్రీనివాసః: ఆమె ఎప్పుడూ ఆయనలోనే ఉంటుంది. శ్రీధరః: చంద్రుడు వెన్నెలను పట్టుకున్నట్టు ఆమెను దగ్గరగా పట్టుకుంటాడు. చంద్రుడి నుండి వెన్నెలను వేరు చేయలేం.\n\nశ్రీకరః: ఆయన భూమికి వచ్చినప్పుడల్లా ఆమె కూడా వస్తుంది. ఆయన రాముడైతే ఆమె సీత. ఆయన కృష్ణుడైతే ఆమె రుక్మిణి. తిరుమలలో కూడా ఆమె ఆయన వక్షస్థలంపై ఉంటుంది.\n\nశ్రేయః: మనకు దొరికే అత్యున్నత మేలు ఆయనే. లోకత్రయాశ్రయః: మూడు లోకాలకూ ఆశ్రయం ఆయనే.\n\nకాబట్టి ప్రార్థించేటప్పుడు ఇద్దరి దగ్గరకూ కలిసి వెళ్తాం. అమ్మ దయగలది, మన తరఫున మాట్లాడుతుంది; స్వామి వింటాడు. నిజమైన సంపద డబ్బు ఒక్కటే కాదు. వాళ్ళిద్దరూ మన ఇంట్లో ఉండటమే.", "hi": "बेटा, इस श्लोक में लगभग हर नाम श्री से, यानी माँ लक्ष्मी से शुरू होता है। यह हमें एक सुंदर बात बताता है: प्रभु और माँ कभी अलग नहीं होते।\n\nश्रीदः: वे लक्ष्मी को वैभव देते हैं। श्रीशः: वे उनके स्वामी हैं। श्रीनिवासः: लक्ष्मी सदा उनमें रहती हैं। श्रीधरः: जैसे चंद्रमा अपनी चाँदनी को थामे रहता है, वैसे वे उन्हें पास रखते हैं। चाँदनी को चंद्रमा से अलग नहीं किया जा सकता।\n\nश्रीकरः: जब भी वे धरती पर आते हैं, लक्ष्मी भी आती हैं। जब वे राम थे, वे सीता थीं। जब वे कृष्ण थे, वे रुक्मिणी थीं। तिरुमला के मंदिर में भी वे उनकी छाती पर विराजती हैं।\n\nश्रेयः: हमारे लिए सबसे ऊँचा भला वही हैं। लोकत्रयाश्रयः: तीनों लोकों का आश्रय वही हैं।\n\nइसलिए प्रार्थना में हम दोनों के पास साथ जाते हैं। माँ दयालु हैं और हमारी ओर से बात करती हैं; प्रभु सुनते हैं। सच्चा धन केवल पैसा नहीं। सच्चा धन है उनका हमारे घर में होना।"}, "66": {"en": "Child, this verse is about how the great Lord lets love win Him. Svakshah, Svangah: beautiful eyes, beautiful form. Shatānandah, Nandih: He is full of endless joy. Jyotir-ganeshvarah: He is Lord of all the shining heavenly beings.\n\nBut now see the next two names. Vijitātmā: His heart is won by His devotees. Vidheyātmā: He lovingly does what they ask. The Lord of the gods lets simple people win Him! Remember Sudama, the poor friend who brought Krishna only a handful of beaten rice. Krishna ate it with tears of joy. Remember Vidura, at whose humble home Krishna chose to eat, instead of the king's palace.\n\nSat-kīrtih: His fame is true and good. Chhinna-samshayah: He cuts away all doubts, just as He cleared Arjuna's confusion on the battlefield with the Gita.\n\nSo you do not need to be rich or great. Bring Him your love, even a little. That is what wins Him.", "te": "నాయనా, ఈ శ్లోకం గొప్ప స్వామి ప్రేమకు ఎలా లొంగిపోతాడో చెబుతుంది. స్వక్షః, స్వంగః: అందమైన కళ్ళు, అందమైన రూపం. శతానందః, నందిః: అంతులేని ఆనందంతో నిండినవాడు. జ్యోతిర్గణేశ్వరః: ప్రకాశించే దేవతలందరికీ ప్రభువు.\n\nకానీ తర్వాతి రెండు నామాలు చూడు. విజితాత్మా: భక్తులు ఆయన హృదయాన్ని గెలుచుకుంటారు. విధేయాత్మా: వాళ్ళు అడిగింది ప్రేమగా చేస్తాడు. దేవతల ప్రభువు సామాన్యులకు లొంగిపోతాడు! పిడికెడు అటుకులు మాత్రమే తెచ్చిన పేద స్నేహితుడు సుదాముడిని గుర్తుచేసుకో. కృష్ణుడు వాటిని ఆనంద బాష్పాలతో తిన్నాడు. రాజభవనం వదిలి విదురుడి చిన్న ఇంట్లో భోజనం చేశాడు.\n\nసత్కీర్తిః: ఆయన కీర్తి నిజమైనది, మంచిది. ఛిన్నసంశయః: యుద్ధభూమిలో గీతతో అర్జునుడి సందేహాలు తీర్చినట్టు, మన సందేహాలన్నీ తొలగిస్తాడు.\n\nకాబట్టి నువ్వు ధనవంతుడివో గొప్పవాడివో కానక్కర్లేదు. కొంచెమైనా ప్రేమ తీసుకెళ్ళు. ఆయనను గెలిచేది అదే.", "hi": "बेटा, यह श्लोक बताता है कि महान प्रभु प्रेम के आगे कैसे हार जाते हैं। स्वक्षः, स्वङ्गः: सुंदर आँखें, सुंदर रूप। शतानन्दः, नन्दिः: वे अनंत आनंद से भरे हैं। ज्योतिर्गणेश्वरः: वे सभी चमकते देवताओं के स्वामी हैं।\n\nपर अगले दो नाम देखो। विजितात्मा: भक्त उनका हृदय जीत लेते हैं। विधेयात्मा: वे प्रेम से वही करते हैं जो भक्त कहें। देवताओं के स्वामी साधारण लोगों से हार जाते हैं! गरीब मित्र सुदामा को याद करो, जो कृष्ण के लिए बस मुट्ठी भर चिवड़ा लाए थे। कृष्ण ने उसे खुशी के आँसुओं के साथ खाया। विदुर को याद करो, जिनके छोटे घर में कृष्ण ने राजमहल छोड़कर भोजन किया।\n\nसत्कीर्तिः: उनकी कीर्ति सच्ची और अच्छी है। छिन्नसंशयः: जैसे युद्धभूमि में गीता से उन्होंने अर्जुन का भ्रम दूर किया, वैसे हमारे सब संदेह मिटाते हैं।\n\nइसलिए तुम्हें अमीर या बड़ा होने की ज़रूरत नहीं। थोड़ा-सा प्रेम लेकर जाओ। वही उन्हें जीतता है।"}, "67": {"en": "Child, look at the first two names, Udīrnah and Sarvatash-chakshuh. They mean He is clearly seen, by everyone's eyes. The Lord is beyond the universe, yet He chose to be seen: as Rama walking in Ayodhya, as Krishna playing in Vrindavan, and today, as the deity in our temple. He did not stay far away; He came close so that even a child could see Him.\n\nThen comes Anīshah: He does not act as a master over His devotees. Think how Krishna drove Arjuna's chariot and carried messages like a servant. Love makes Him humble. Shāshvata-sthirah: He is always there, steady.\n\nBhūshayah: He rests on the earth, in temples, waiting for us. Bhūshanah: He brings beauty to every home He enters. Bhūtih: He is the real wealth of those who love Him.\n\nThe last names, Vishokah and Shoka-nāshanah: He has no sorrow, and He removes ours. So when you feel sad, remember this verse. He is near, and He is waiting.", "te": "నాయనా, మొదటి రెండు నామాలు చూడు: ఉదీర్ణః, సర్వతశ్చక్షుః. అంటే ఆయన అందరి కళ్ళకూ స్పష్టంగా కనిపిస్తాడు. స్వామి విశ్వానికి అతీతుడు, అయినా కనిపించాలనే నిర్ణయించుకున్నాడు: అయోధ్యలో నడిచిన రాముడిగా, బృందావనంలో ఆడిన కృష్ణుడిగా, ఈరోజు మన గుడిలోని మూర్తిగా. దూరంగా ఉండిపోలేదు; పసిపిల్లలు కూడా చూడగలిగేంత దగ్గరకు వచ్చాడు.\n\nతర్వాత అనీశః: భక్తులపై యజమానిలా ఉండడు. కృష్ణుడు అర్జునుడి రథం నడిపి, సేవకుడిలా దూతగా వెళ్ళాడు. ప్రేమ ఆయనను వినయంగా చేస్తుంది. శాశ్వతస్థిరః: ఎప్పుడూ, స్థిరంగా ఉంటాడు.\n\nభూశయః: మన కోసం భూమిపై, ఆలయాలలో వేచి ఉంటాడు. భూషణః: ఏ ఇంట్లో అడుగుపెడితే ఆ ఇంటికి అందం తెస్తాడు. భూతిః: ప్రేమించేవారి నిజమైన సంపద ఆయనే.\n\nచివరి నామాలు విశోకః, శోకనాశనః: ఆయనకు దుఃఖం లేదు, మన దుఃఖం తొలగిస్తాడు. కాబట్టి బాధగా అనిపించినప్పుడు ఈ శ్లోకం గుర్తుచేసుకో. ఆయన దగ్గరే ఉన్నాడు, ఎదురుచూస్తున్నాడు.", "hi": "बेटा, पहले दो नाम देखो: उदीर्णः और सर्वतश्चक्षुः। यानी वे सबकी आँखों को साफ़ दिखते हैं। प्रभु ब्रह्मांड से परे हैं, फिर भी उन्होंने दिखना चुना: अयोध्या में चलते राम बनकर, वृंदावन में खेलते कृष्ण बनकर, और आज हमारे मंदिर की मूर्ति बनकर। वे दूर नहीं रहे; इतने पास आए कि बच्चा भी उन्हें देख सके।\n\nफिर अनीशः: वे भक्तों पर मालिक नहीं बनते। सोचो, कृष्ण ने अर्जुन का रथ चलाया और सेवक की तरह संदेश लेकर गए। प्रेम उन्हें विनम्र बना देता है। शाश्वतस्थिरः: वे सदा, स्थिर होकर साथ हैं।\n\nभूशयः: वे हमारे लिए धरती पर, मंदिरों में प्रतीक्षा करते हैं। भूषणः: जिस घर में आते हैं, उसे सुंदर बना देते हैं। भूतिः: प्रेम करने वालों का असली धन वही हैं।\n\nआख़िरी नाम विशोकः और शोकनाशनः: उन्हें कोई दुख नहीं, और वे हमारा दुख मिटाते हैं। इसलिए जब उदास हो, यह श्लोक याद करना। वे पास हैं, और प्रतीक्षा कर रहे हैं।"}, "68": {"en": "Child, this verse is about light and purity. Archishmān: He shines with divine light, brighter than the sun. Architah: He is worshipped in holy shrines everywhere. Kumbhah: everyone longs for Him, the way a thirsty person longs for a pot of water.\n\nVishuddhātmā and Vishodhanah: He is pure, and He makes us pure. However many mistakes we have made, when we come to Him sincerely, He forgives and cleans our heart, like the Ganga washing away dust.\n\nThe next names are special forms of the Lord. Aniruddhah: no one can stop Him. Pradyumnah: He makes every soul shine. Apratirathah: no one can stand against Him.\n\nAnd Amita-vikramah: His steps are without measure. Remember Vamana, the little boy who asked King Bali for just three steps of land, then grew so big that two steps covered earth and sky, and the third rested on Bali's head as a blessing.\n\nSo never think you are too small or too far gone. His light reaches everyone.", "te": "నాయనా, ఈ శ్లోకం కాంతి, పవిత్రత గురించి. అర్చిష్మాన్: సూర్యుడికంటే ప్రకాశమైన దివ్య కాంతితో వెలిగేవాడు. అర్చితః: అన్ని పుణ్యక్షేత్రాలలో పూజింపబడేవాడు. కుంభః: దాహంతో ఉన్నవాడు నీటి కుండ కోసం ఎదురుచూసినట్టు, అందరూ ఆయన కోసం ఆరాటపడతారు.\n\nవిశుద్ధాత్మా, విశోధనః: ఆయన పవిత్రుడు, మనల్ని పవిత్రం చేస్తాడు. మనం ఎన్ని తప్పులు చేసినా, మనస్ఫూర్తిగా ఆయన దగ్గరకు వెళ్తే, గంగ ధూళిని కడిగినట్టు క్షమించి మన హృదయాన్ని శుద్ధి చేస్తాడు.\n\nతర్వాతి నామాలు స్వామి ప్రత్యేక రూపాలు. అనిరుద్ధః: ఆయనను ఎవరూ ఆపలేరు. ప్రద్యుమ్నః: ప్రతి ఆత్మనూ ప్రకాశింపజేస్తాడు. అప్రతిరథః: ఆయనకు ఎదురు నిలిచేవారు లేరు.\n\nఅమితవిక్రమః: ఆయన అడుగులకు కొలత లేదు. వామనుడిని గుర్తుచేసుకో. బలి చక్రవర్తిని మూడు అడుగుల నేల మాత్రమే అడిగిన చిన్న బాలుడు, రెండు అడుగుల్లో భూమి, ఆకాశం కప్పేసి, మూడో అడుగు ఆశీర్వాదంగా బలి తలపై పెట్టాడు.\n\nకాబట్టి నేను చాలా చిన్నవాడిని, చాలా దూరం వెళ్ళిపోయాను అని ఎప్పుడూ అనుకోకు. ఆయన కాంతి అందరినీ చేరుతుంది.", "hi": "बेटा, यह श्लोक प्रकाश और पवित्रता के बारे में है। अर्चिष्मान्: वे सूरज से भी उज्ज्वल दिव्य प्रकाश से चमकते हैं। अर्चितः: हर पवित्र तीर्थ में उनकी पूजा होती है। कुम्भः: जैसे प्यासा पानी के घड़े के लिए तरसता है, वैसे सब उनके लिए तरसते हैं।\n\nविशुद्धात्मा और विशोधनः: वे शुद्ध हैं, और हमें शुद्ध करते हैं। हमने कितनी भी गलतियाँ की हों, जब सच्चे मन से उनके पास जाते हैं, वे क्षमा करते हैं और हमारा मन साफ़ कर देते हैं, जैसे गंगा धूल धो देती है।\n\nअगले नाम प्रभु के विशेष रूप हैं। अनिरुद्धः: उन्हें कोई रोक नहीं सकता। प्रद्युम्नः: वे हर आत्मा को चमका देते हैं। अप्रतिरथः: उनके सामने कोई टिक नहीं सकता।\n\nऔर अमितविक्रमः: उनके कदमों का कोई माप नहीं। वामन को याद करो, वह छोटा बालक जिसने राजा बलि से बस तीन कदम ज़मीन माँगी, फिर इतना बड़ा हुआ कि दो कदमों में धरती और आकाश नाप लिए, और तीसरा कदम आशीर्वाद बनकर बलि के सिर पर रखा।\n\nइसलिए कभी मत सोचना कि तुम बहुत छोटे हो या बहुत दूर चले गए हो। उनका प्रकाश सब तक पहुँचता है।"}, "69": {"en": "Child, this verse is full of brave deeds. Kālanemi-nihā: He destroyed the demon Kalanemi in the great war between gods and demons. The old teachers say Kalanemi also means the wheel of time and ignorance that keeps turning in our minds. He breaks that too.\n\nVīrah: the brave hero. Shaurih: born as Krishna in the family of Shura. Shūra-janeshvarah: He leads all the brave.\n\nTrilokātmā, Trilokeshah: He moves through the three worlds to bless them, and He rules them all.\n\nKeshavah: He has beautiful hair, and He removes our distress. Keshihā: when the demon Keshi came to Vrindavan as a wild horse, scaring everyone, little Krishna stood calmly and defeated him. And then Harih: the one who takes away our troubles and our sins.\n\nSo when you are afraid, call Him Hari. The same Krishna who stood calmly before Keshi will stand beside you.", "te": "నాయనా, ఈ శ్లోకం వీర కార్యాలతో నిండి ఉంది. కాలనేమినిహా: దేవతలకూ రాక్షసులకూ జరిగిన మహా యుద్ధంలో కాలనేమి అనే రాక్షసుడిని సంహరించాడు. కాలనేమి అంటే మన మనసులో తిరుగుతూ ఉండే కాల చక్రం, అజ్ఞానం అని కూడా పెద్దలు చెబుతారు. దాన్ని కూడా ఆయన విరగ్గొడతాడు.\n\nవీరః: ధైర్యవంతుడైన వీరుడు. శౌరిః: శూరుడి వంశంలో కృష్ణుడిగా పుట్టినవాడు. శూరజనేశ్వరః: వీరులందరికీ నాయకుడు.\n\nత్రిలోకాత్మా, త్రిలోకేశః: మూడు లోకాలలో సంచరించి ఆశీర్వదిస్తాడు, అన్నింటినీ పాలిస్తాడు.\n\nకేశవః: అందమైన కేశాలు కలవాడు, మన బాధలు తొలగిస్తాడు. కేశిహా: కేశి అనే రాక్షసుడు అడవి గుర్రంలా బృందావనానికి వచ్చి అందరినీ భయపెట్టినప్పుడు, చిన్ని కృష్ణుడు ప్రశాంతంగా నిలబడి వాడిని ఓడించాడు. హరిః: మన కష్టాలను, పాపాలను హరించేవాడు.\n\nకాబట్టి భయమేసినప్పుడు హరీ అని పిలువు. కేశి ముందు ప్రశాంతంగా నిలబడిన కృష్ణుడే నీ పక్కన నిలబడతాడు.", "hi": "बेटा, यह श्लोक वीर कामों से भरा है। कालनेमिनिहा: देवताओं और असुरों के महायुद्ध में उन्होंने कालनेमि नाम के असुर का वध किया। पुराने आचार्य कहते हैं कि कालनेमि का अर्थ समय का वह चक्र और अज्ञान भी है जो हमारे मन में घूमता रहता है। वे उसे भी तोड़ देते हैं।\n\nवीरः: बहादुर वीर। शौरिः: शूर के कुल में कृष्ण बनकर जन्मे। शूरजनेश्वरः: वे सभी वीरों के नेता हैं।\n\nत्रिलोकात्मा, त्रिलोकेशः: वे तीनों लोकों में घूमकर आशीर्वाद देते हैं, और सब पर राज करते हैं।\n\nकेशवः: सुंदर बालों वाले, जो हमारा कष्ट दूर करते हैं। केशिहा: जब केशी नाम का असुर जंगली घोड़ा बनकर वृंदावन आया और सबको डराया, तो नन्हे कृष्ण शांत खड़े रहे और उसे हरा दिया। और फिर हरिः: जो हमारे कष्ट और पाप हर लेते हैं।\n\nइसलिए जब डर लगे, उन्हें हरि कहकर पुकारो। जो कृष्ण केशी के सामने शांत खड़े रहे, वही तुम्हारे साथ खड़े होंगे।"}, "70": {"en": "Child, this verse tells us what kind of giver the Lord is. Kāma-devah: He fulfils good wishes. Kāma-pālah: and He protects what He has given, so it is not lost. Kāmī: He already has everything, so He gives only for our sake. Kāntah: He is lovely to look at.\n\nKritāgamah: He gave us the holy scriptures, like a parent writing a guidebook for a child going on a long journey.\n\nAnirdeshya-vapuh: His forms cannot be fully described in words. Vishnuh: He is present everywhere, inside everything. Vīrah: brave, protecting the good. Anantah: He has no end.\n\nAnd Dhananjayah: the one who is greater than all wealth. In the Gita, Krishna says, 'Among the Pandavas, I am Dhananjaya', Arjuna's name. Arjuna won great riches, yet his real treasure was Krishna's friendship.\n\nSo ask Him for good things, but remember: the best thing He can give you is Himself.", "te": "నాయనా, ఈ శ్లోకం స్వామి ఎలాంటి దాతో చెబుతుంది. కామదేవః: మంచి కోరికలు తీరుస్తాడు. కామపాలః: ఇచ్చినదాన్ని పోకుండా కాపాడతాడు కూడా. కామీ: ఆయన దగ్గర అన్నీ ఉన్నాయి, కాబట్టి మన కోసమే ఇస్తాడు. కాంతః: చూడటానికి మనోహరుడు.\n\nకృతాగమః: దూర ప్రయాణానికి వెళ్ళే బిడ్డ కోసం తల్లిదండ్రులు మార్గదర్శిని రాసినట్టు, మనకు పవిత్ర శాస్త్రాలు ఇచ్చాడు.\n\nఅనిర్దేశ్యవపుః: ఆయన రూపాలను మాటలతో పూర్తిగా వర్ణించలేం. విష్ణుః: అంతటా, అన్నింటిలో ఉంటాడు. వీరః: ధైర్యవంతుడు, మంచివారిని కాపాడతాడు. అనంతః: ఆయనకు అంతం లేదు.\n\nధనంజయః: అన్ని సంపదలకంటే గొప్పవాడు. గీతలో కృష్ణుడు 'పాండవులలో నేను ధనంజయుడిని' అంటాడు, అది అర్జునుడి పేరు. అర్జునుడు ఎంతో సంపద గెలిచాడు, కానీ అతని నిజమైన నిధి కృష్ణుడి స్నేహమే.\n\nకాబట్టి ఆయనను మంచివి అడుగు, కానీ గుర్తుంచుకో: ఆయన నీకు ఇవ్వగల అత్యుత్తమమైనది ఆయనే.", "hi": "बेटा, यह श्लोक बताता है कि प्रभु कैसे दाता हैं। कामदेवः: वे अच्छी इच्छाएँ पूरी करते हैं। कामपालः: और जो देते हैं उसकी रक्षा भी करते हैं, ताकि वह खो न जाए। कामी: उनके पास सब कुछ पहले से है, इसलिए वे केवल हमारे लिए देते हैं। कान्तः: वे देखने में मनोहर हैं।\n\nकृतागमः: उन्होंने हमें पवित्र शास्त्र दिए, जैसे माता-पिता लंबी यात्रा पर जाते बच्चे के लिए मार्गदर्शिका लिखते हैं।\n\nअनिर्देश्यवपुः: उनके रूपों का पूरा वर्णन शब्दों में नहीं हो सकता। विष्णुः: वे हर जगह, हर चीज़ के भीतर हैं। वीरः: बहादुर, अच्छे लोगों की रक्षा करने वाले। अनन्तः: उनका कोई अंत नहीं।\n\nऔर धनञ्जयः: जो सारे धन से भी बड़े हैं। गीता में कृष्ण कहते हैं, 'पांडवों में मैं धनंजय हूँ', जो अर्जुन का नाम है। अर्जुन ने बहुत धन जीता, पर उनका असली ख़ज़ाना कृष्ण की मित्रता थी।\n\nइसलिए उनसे अच्छी चीज़ें माँगो, पर याद रखो: वे तुम्हें जो सबसे अच्छी चीज़ दे सकते हैं, वह वे स्वयं हैं।"}};
var WHY={"en": [["What it is", "Vishnu Sahasranamam means the thousand names of Lord Vishnu. It comes from the Mahabharata, in the Anushasana Parva. After the great war, Bhishma lay on his bed of arrows. Yudhishthira asked him: who is the one God, and what should we chant to be free from sorrow? Bhishma answered with these thousand names, while Krishna Himself stood listening.\n\nEach name describes one quality of the Lord: His kindness, His strength, His beauty, His care for us. Chanting them is like slowly getting to know Him, one name at a time."], ["Why we chant: the purpose", "The main purpose is simple: to remember God, and to grow close to Him through His names. A name we repeat with love slowly fills the mind.\n\nOur elders teach that in this age, chanting the Lord's names is the simplest path. It needs no money, no special place, and no special skill. A child, an elder, a busy parent: anyone can chant.\n\nThe guru-shishya way adds one more thing. We learn the sound first, carefully, from a teacher. Then we learn the meaning. Correct sound and a loving heart together make the chanting complete."], ["What the stotram itself promises", "The closing verses of the Sahasranamam, called the phala-shruti, say that one who hears or chants it with faith:\n\n- is not troubled by fear\n- gains strength, brightness and good health\n- is freed from illness, distress and sorrow\n- finds a calm mind, free from anger, jealousy and greed\n\nThis is the traditional promise, and it rests on faith. It is not medical advice, and chanting does not replace a doctor."], ["What people actually notice", "Those who chant daily often say:\n\n- the mind feels calmer, especially in the morning or before sleep\n- focus and memory improve, because a long text is learned bit by bit\n- Sanskrit pronunciation becomes clearer\n- the day gets a steady, peaceful rhythm\n- families who chant together feel closer\n\nThese changes come slowly, with regular practice. A few minutes every day helps more than a long session once a week."], ["How to chant", "**The order of the full chant**\n- Opening prayers\n- Yudhishthira's questions and Bhishma's answer\n- Dhyānam (picture the Lord)\n- The 108 verses\n- The closing verses (phala-shruti)\n- End with *Kāyena vācā* and \"Sarvaṁ Śrī Kṛṣṇārpaṇam astu\" (I offer it all to the Lord)\n\n**How to say it**\n- Slow and clear. Clear sound matters more than speed.\n- Pause a little at the middle of a verse (|) and a little longer at the end (||).\n- Never break a name in the middle; the dash lines show where each name ends.\n- Say long and short sounds as written.\n\n**Time and place**\n- Morning or evening is traditional, but any regular time is good.\n- A clean, quiet place, in front of a lamp or a picture of the Lord.\n\n**For beginners**\n- Start with a few verses a day, as this app does. Add the opening and closing later.\n- Listening with faith also counts.\n- Do not worry about strict rules. Sincerity matters most, and your guru's way comes first."], ["Special benefits by verse", "Some verses are traditionally chanted for particular needs. Tap a verse number below to practise it."]], "te": [["ఇది ఏమిటి", "విష్ణు సహస్రనామం అంటే శ్రీ మహావిష్ణువు యొక్క వెయ్యి నామాలు. ఇది మహాభారతంలోని అనుశాసన పర్వంలో ఉంది. మహాయుద్ధం తర్వాత భీష్ముడు అంపశయ్యపై ఉన్నాడు. ధర్మరాజు ఆయనను అడిగాడు: ఒకే దైవం ఎవరు, దుఃఖం నుండి విముక్తి పొందడానికి ఏమి జపించాలి? భీష్ముడు ఈ వెయ్యి నామాలతో జవాబిచ్చాడు, శ్రీకృష్ణుడే అక్కడ నిలబడి వింటుండగా.\n\nప్రతి నామం స్వామి యొక్క ఒక గుణాన్ని చెబుతుంది: ఆయన దయ, బలం, అందం, మనపట్ల ఆయన శ్రద్ధ. వీటిని జపించడం అంటే ఒక్కో నామంతో ఆయనను నెమ్మదిగా తెలుసుకోవడం."], ["ఎందుకు పఠించాలి: ప్రయోజనం", "ముఖ్య ప్రయోజనం సులభమైనది: భగవంతుడిని స్మరించడం, ఆయన నామాల ద్వారా ఆయనకు దగ్గరవడం. ప్రేమతో మళ్ళీ మళ్ళీ చెప్పే నామం నెమ్మదిగా మనసును నింపుతుంది.\n\nఈ యుగంలో భగవన్నామ జపమే సులభమైన మార్గమని పెద్దలు చెబుతారు. దానికి డబ్బు, ప్రత్యేక స్థలం, ప్రత్యేక నైపుణ్యం అక్కర్లేదు. పిల్లలు, పెద్దలు, బిజీగా ఉండే తల్లిదండ్రులు: ఎవరైనా జపించవచ్చు.\n\nగురు-శిష్య పద్ధతి ఇంకొకటి జోడిస్తుంది. ముందు గురువు దగ్గర శబ్దాన్ని జాగ్రత్తగా నేర్చుకుంటాం. తర్వాత అర్థం నేర్చుకుంటాం. సరైన ఉచ్చారణ, ప్రేమగల హృదయం కలిస్తేనే పఠనం సంపూర్ణం."], ["స్తోత్రం స్వయంగా ఏమి చెబుతుంది", "సహస్రనామం చివరి శ్లోకాలు (ఫలశ్రుతి) ఇలా చెబుతాయి: భక్తితో వినేవారు లేదా పఠించేవారు:\n\n- భయంతో బాధపడరు\n- బలం, తేజస్సు, మంచి ఆరోగ్యం పొందుతారు\n- రోగం, ఆపద, దుఃఖం నుండి విముక్తులవుతారు\n- కోపం, అసూయ, లోభం లేని ప్రశాంత మనస్సు పొందుతారు\n\nఇది సంప్రదాయ వాగ్దానం, విశ్వాసం మీద ఆధారపడినది. ఇది వైద్య సలహా కాదు; పఠనం డాక్టర్‌కు బదులు కాదు."], ["ప్రజలు నిజంగా గమనించేది", "రోజూ పఠించేవారు తరచుగా ఇలా చెబుతారు:\n\n- మనసు ప్రశాంతంగా ఉంటుంది, ముఖ్యంగా ఉదయం లేదా నిద్రకు ముందు\n- పెద్ద పాఠాన్ని కొంచెం కొంచెంగా నేర్చుకోవడం వల్ల ఏకాగ్రత, జ్ఞాపకశక్తి పెరుగుతాయి\n- సంస్కృత ఉచ్చారణ స్పష్టమవుతుంది\n- రోజుకు ఒక స్థిరమైన, ప్రశాంతమైన లయ వస్తుంది\n- కలిసి పఠించే కుటుంబాలు మరింత దగ్గరవుతాయి\n\nఈ మార్పులు క్రమం తప్పని సాధనతో నెమ్మదిగా వస్తాయి. వారానికి ఒకసారి ఎక్కువసేపు కంటే, రోజూ కొన్ని నిమిషాలు ఎక్కువ మేలు చేస్తాయి."], ["ఎలా పఠించాలి", "**పూర్తి పఠనం క్రమం**\n- ప్రారంభ ప్రార్థనలు\n- ధర్మరాజు ప్రశ్నలు, భీష్ముడి జవాబు\n- ధ్యానం (స్వామిని మనసులో చూడటం)\n- 108 శ్లోకాలు\n- ముగింపు శ్లోకాలు (ఫలశ్రుతి)\n- *కాయేన వాచా*, \"సర్వం శ్రీకృష్ణార్పణమస్తు\"తో ముగించండి (అంతా స్వామికి అర్పిస్తున్నాను)\n\n**ఎలా పలకాలి**\n- నెమ్మదిగా, స్పష్టంగా. వేగం కంటే స్పష్టమైన ఉచ్చారణ ముఖ్యం.\n- శ్లోకం మధ్యలో (|) కొంచెం ఆగండి, చివర (||) ఇంకొంచెం ఆగండి.\n- ఏ నామాన్నీ మధ్యలో విరచకండి; డాష్ లైన్లు ప్రతి నామం ఎక్కడ ముగుస్తుందో చూపిస్తాయి.\n- దీర్ఘ, హ్రస్వ శబ్దాలను రాసినట్టే పలకండి.\n\n**సమయం, స్థలం**\n- ఉదయం లేదా సాయంత్రం సంప్రదాయం, కానీ రోజూ ఒకే సమయం ఏదైనా మంచిదే.\n- శుభ్రమైన, ప్రశాంతమైన చోటు, దీపం లేదా స్వామి పటం ముందు.\n\n**కొత్తవారికి**\n- ఈ యాప్ లాగే రోజుకు కొన్ని శ్లోకాలతో మొదలుపెట్టండి. ప్రారంభ, ముగింపు భాగాలు తర్వాత చేర్చండి.\n- భక్తితో వినడం కూడా పుణ్యమే.\n- కఠిన నియమాల గురించి చింతించకండి. నిష్కపటమైన మనసే ముఖ్యం, మీ గురువు పద్ధతే ముందు."], ["శ్లోకాల వారీగా ప్రత్యేక ప్రయోజనాలు", "కొన్ని శ్లోకాలను సంప్రదాయంగా ప్రత్యేక అవసరాల కోసం పఠిస్తారు. సాధన చేయడానికి కింద శ్లోక సంఖ్యను నొక్కండి."]], "hi": [["यह क्या है", "विष्णु सहस्रनाम का अर्थ है भगवान विष्णु के एक हज़ार नाम। यह महाभारत के अनुशासन पर्व में है। महायुद्ध के बाद भीष्म बाणों की शय्या पर लेटे थे। युधिष्ठिर ने उनसे पूछा: एक ईश्वर कौन है, और दुख से मुक्ति के लिए क्या जपें? भीष्म ने इन हज़ार नामों से उत्तर दिया, जब स्वयं श्रीकृष्ण वहाँ खड़े सुन रहे थे।\n\nहर नाम प्रभु के एक गुण को बताता है: उनकी दया, उनका बल, उनकी सुंदरता, हमारे लिए उनकी चिंता। इन्हें जपना ऐसा है जैसे एक-एक नाम से उन्हें धीरे-धीरे जानना।"], ["क्यों पाठ करें: प्रयोजन", "मुख्य प्रयोजन सरल है: भगवान को याद करना, और उनके नामों से उनके करीब आना। प्रेम से बार-बार लिया गया नाम धीरे-धीरे मन को भर देता है।\n\nहमारे बड़े कहते हैं कि इस युग में भगवान का नाम जपना सबसे सरल मार्ग है। इसके लिए न पैसा चाहिए, न कोई विशेष जगह, न कोई विशेष कौशल। बच्चा, बुज़ुर्ग, व्यस्त माता-पिता: कोई भी जप सकता है।\n\nगुरु-शिष्य परंपरा एक बात और जोड़ती है। पहले हम गुरु से ध्वनि ध्यान से सीखते हैं। फिर अर्थ सीखते हैं। सही उच्चारण और प्रेम भरा मन मिलकर ही पाठ को पूरा करते हैं।"], ["स्तोत्र स्वयं क्या कहता है", "सहस्रनाम के अंतिम श्लोक, जिन्हें फलश्रुति कहते हैं, बताते हैं कि जो श्रद्धा से इसे सुनता या पढ़ता है:\n\n- वह भय से परेशान नहीं होता\n- उसे बल, तेज और अच्छा स्वास्थ्य मिलता है\n- वह रोग, संकट और दुख से मुक्त होता है\n- उसका मन शांत रहता है, क्रोध, ईर्ष्या और लोभ से दूर\n\nयह परंपरागत वचन है, जो श्रद्धा पर आधारित है। यह चिकित्सा सलाह नहीं है, और पाठ डॉक्टर की जगह नहीं लेता।"], ["लोग वास्तव में क्या अनुभव करते हैं", "रोज़ पाठ करने वाले अक्सर कहते हैं:\n\n- मन शांत रहता है, ख़ासकर सुबह या सोने से पहले\n- लंबा पाठ थोड़ा-थोड़ा सीखने से ध्यान और याददाश्त बढ़ती है\n- संस्कृत का उच्चारण साफ़ होता है\n- दिन को एक स्थिर, शांत लय मिलती है\n- साथ पाठ करने वाले परिवार और करीब आते हैं\n\nये बदलाव नियमित अभ्यास से धीरे-धीरे आते हैं। हफ़्ते में एक बार लंबे समय से ज़्यादा, रोज़ के कुछ मिनट फ़ायदा करते हैं।"], ["कैसे पाठ करें", "**पूरे पाठ का क्रम**\n- आरंभिक प्रार्थनाएँ\n- युधिष्ठिर के प्रश्न और भीष्म का उत्तर\n- ध्यान (प्रभु का चित्र मन में)\n- 108 श्लोक\n- समापन श्लोक (फलश्रुति)\n- *कायेन वाचा* और \"सर्वं श्रीकृष्णार्पणमस्तु\" से समाप्त करें (सब कुछ प्रभु को अर्पित)\n\n**कैसे बोलें**\n- धीरे और साफ़। गति से ज़्यादा साफ़ उच्चारण ज़रूरी है।\n- श्लोक के बीच (|) थोड़ा रुकें, और अंत में (||) थोड़ा ज़्यादा।\n- किसी नाम को बीच में न तोड़ें; डैश लाइनें दिखाती हैं कि हर नाम कहाँ खत्म होता है।\n- दीर्घ और ह्रस्व ध्वनियाँ जैसे लिखी हैं, वैसे बोलें।\n\n**समय और स्थान**\n- सुबह या शाम परंपरागत है, पर रोज़ का कोई भी तय समय अच्छा है।\n- साफ़, शांत जगह, दीपक या प्रभु के चित्र के सामने।\n\n**नए लोगों के लिए**\n- इस ऐप की तरह रोज़ कुछ श्लोकों से शुरू करें। आरंभ और समापन बाद में जोड़ें।\n- श्रद्धा से सुनना भी पुण्य है।\n- कड़े नियमों की चिंता न करें। सच्चा मन ही मायने रखता है, और आपके गुरु का तरीका पहले है।"], ["श्लोक के अनुसार विशेष लाभ", "कुछ श्लोक परंपरा से विशेष ज़रूरतों के लिए पढ़े जाते हैं। अभ्यास के लिए नीचे श्लोक संख्या दबाएँ।"]]};
