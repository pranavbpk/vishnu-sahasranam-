var VS={"1":{"n":1,"sa":["विश्वं विष्णुर्वषट्कारो भूतभव्यभवत्प्रभुः ।","भूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः ॥१॥"],"pr":["Vish-vam Vish-nur Va-shat-kaa-ro Bhoo-ta-bhav-ya-bha-vat-pra-bhuh","Bhoo-ta-krid Bhoo-ta-bhrid Bhaa-vo Bhoo-taat-maa Bhoo-ta-bhaa-va-nah"],"tip":"Va-shat-kaa-ro: say the sh softly, then a short t. Bhoo is a breathy b with a long oo.","tipSay":"Vashatkaaro: say the sh softly, then a short t. Bhoo is a breathy b with a long oo.","cut":6.9,"t":[3.78,10.7],"dur":13.95,"one":"The Lord is the whole universe. He was, is and will be, and He looks after every being.","full":"Vishnu is the whole universe and is present everywhere. He is worshipped in every yajna. He is Lord of the past, the future and the present. He creates all beings, looks after them and helps them grow. He is everything that exists, and the soul inside every being.","names":[["विश्वम्","Vish-vam","Is the whole universe"],["विष्णुः","Vish-nuh","Present everywhere"],["वषट्कारः","Va-shat-kaa-rah","Worshipped with the sacred call in yajnas"],["भूतभव्यभवत्प्रभुः","Bhoo-ta-bhav-ya-bha-vat-pra-bhuh","Lord of the past, the future and the present"],["भूतकृत्","Bhoo-ta-krit","Creates all beings"],["भूतभृत्","Bhoo-ta-bhrit","Looks after all beings"],["भावः","Bhaa-vah","Is everything that exists"],["भूतात्मा","Bhoo-taat-maa","The soul inside every being"],["भूतभावनः","Bhoo-ta-bhaa-va-nah","Helps every being grow"]],"carry":0,"pic":"img/mean/v001.jpg","kid":{"w":0,"piece":0,"say":"He is the whole world!","words":["Vishvam","Vishnur","Vashatkaaro"],"pic":"img/mean/v001.jpg","story":null}},"61":{"n":61,"sa":["सुधन्वा खंडपरशुर् दारुणो द्रविणप्रदः ।","दिवस्पृक् सर्वदृग् व्यासो वाचस्पतिरयोनिजः ॥६१॥"],"pr":["Su-dhan-vaa Khan-da-pa-ra-shur Daa-ru-no Dra-vi-na-pra-dah","Di-vas-prik Sar-va-drig Vyaa-so Vaa-chas-pa-ti-ra-yo-ni-jah"],"tip":"Dra-vi-na: the r is a light tap. Vyaa-so: vy is said together, like vya. Vaa-chas-pa-ti: ch like the ch in chair.","tipSay":"Dravina: the r is a light tap. Vyaaso: vy is said together, like vya. Vaachaspati: ch like the ch in chair.","cut":7.12,"t":[3.71,10.8],"dur":14.1,"one":"The Lord holds a mighty bow and an axe. He is stern with evil, kind to the good, and sees everything.","full":"Vishnu holds a mighty bow and an axe. He is stern with evil, but gives wealth to the good. He reaches up to the heavens and sees everything. As Vyasa, He gave us the Vedas. He is the master of all speech, and He was never born like us.","names":[["सुधन्वा","Su-dhan-vaa","One with the excellent bow (Sharnga)"],["खंडपरशुः","Khan-da-pa-ra-shuh","Wielder of the cutting axe"],["दारुणः","Daa-ru-nah","Stern toward the wicked"],["द्रविणप्रदः","Dra-vi-na-pra-dah","Giver of wealth"],["दिवस्पृक्","Di-vas-prik","One who touches the heavens"],["सर्वदृक्","Sar-va-drik","The all-seeing"],["व्यासः","Vyaa-sah","Vyasa, who arranged the Vedas"],["वाचस्पतिः","Vaa-chas-pa-tih","Lord of speech"],["अयोनिजः","A-yo-ni-jah","Not born from a womb"]],"carry":7,"pic":"img/mean/v061.jpg","kid":{"w":1,"piece":0,"say":"The one with the axe!","words":["Sudhanvaa","Khandaparashur"],"pic":"img/mean/v061.jpg","story":{"t":"Parashurama, the axe-bearer","s":"Long ago, some kings became proud and cruel. They forgot that a king's duty is to protect people, not to hurt them.\n\nThe Lord was born as Parashurama, the son of the sage Jamadagni. Though born in a family of sages, he carried a great axe, given by Lord Shiva. He fought the cruel kings and set the world right again.\n\nWhen his work was done, Parashurama put down his weapons and went to the mountains to live a quiet life of prayer. He did not want power for himself.\n\nThe lesson: strength is good only when it protects the weak. And when the work is done, let go of pride.","pic":"img/story/parashurama.jpg"}}},"62":{"n":62,"sa":["त्रिसामा सामगस् साम निर्वाणं भेषजं भिषक् ।","संन्यासकृच् छमश् शांतो निष्ठा शांतिः परायणम् ॥६२॥"],"pr":["Tri-saa-maa Saa-ma-gas Saa-ma Nir-vaa-nam Bhe-sha-jam Bhi-shak","San-nyaa-sa-krich Chha-mash Shaan-to Nish-thaa Shaan-tif Pa-raa-ya-nam"],"tip":"San-nyaa-sa: the n is said twice (san-nya). Chha is ch with a puff of air. Shaan-tih: sh like ship, with a long aa.","tipSay":"Sannyaasa: the n is said twice (sannya). Chha is ch with a puff of air. Shaantih: sh like ship, with a long aa.","cut":7.78,"t":[3.97,12.07],"dur":15.9,"one":"The Lord is the sacred music, the doctor and the medicine, and the peace every soul is looking for.","full":"Vishnu is praised in the sacred Sama chants, and He is that music too. He is both the doctor and the medicine for the sickness of worldly life. He is calm and peaceful, gives peace to others, and is the final place where every soul finds rest.","names":[["त्रिसामा","Tri-saa-maa","Praised by the three Sama chants"],["सामगः","Saa-ma-gah","The singer of Sama"],["साम","Saa-ma","The Sama Veda itself"],["निर्वाणम्","Nir-vaa-nam","Liberation, final peace"],["भेषजम्","Bhe-sha-jam","The medicine for worldly suffering"],["भिषक्","Bhi-shak","The physician"],["संन्यासकृत्","San-nyaa-sa-krit","Who set up the path of renunciation"],["शमः","Sha-mah","Who gives calm to the mind"],["शान्तः","Shaan-tah","The peaceful one"],["निष्ठा","Nish-thaa","The final resting place of all"],["शान्तिः","Shaan-tih","Peace itself"],["परायणम्","Pa-raa-ya-nam","The highest refuge"]],"carry":10,"pic":"img/mean/v062.jpg","kid":{"w":5,"piece":1,"say":"The doctor who makes everyone well!","words":["Nirvaanam","Bheshajam","Bhishak"],"pic":"img/mean/v062.jpg","story":{"t":"Dhanvantari and the pot of nectar","s":"The gods and the demons once churned the great ocean of milk together, hoping to find amrita, the nectar of immortality. They used the mountain Mandara as the churning rod and the serpent Vasuki as the rope. Vishnu, as a giant tortoise, held the mountain on His back.\n\nMany wonders came up from the ocean. At last, a shining figure rose from the waves, holding a golden pot. It was Dhanvantari, the Lord as the divine physician, carrying the nectar.\n\nDhanvantari is honoured as the father of Ayurveda, the science of healing. Doctors in India still pray to him.\n\nThe lesson: good things come after patient, shared effort. And the Lord cares for our health, of body and of mind.","pic":"img/story/dhanvantari.jpg"}}},"63":{"n":63,"sa":["शुभांगश् शांतिदस् स्रष्टा कुमुदः कुवलेशयः ।","गोहितो गोपतिर् गोप्ता वृषभाक्षो वृषप्रियः ॥६३॥"],"pr":["Shu-bhaan-gash Shaan-ti-das Srash-taa Ku-mu-dah Ku-va-le-sha-yah","Go-hi-to Go-pa-tir Gop-taa Vri-sha-bhaak-sho Vri-sha-pri-yah"],"tip":"Srash-taa: s and r run together, then sh. Vri-sha-bhaak-sho: bh is a breathy b, ksh is k and sh together. Shu-bhaan-gash ends with sh, not s.","tipSay":"Srashtaa: s and r run together, then sh. Vrishabhaaksho: bh is a breathy b, ksh is k and sh together. Shubhaangash ends with sh, not s.","cut":7.97,"t":[4.5,11.94],"dur":15.5,"one":"The Lord is beautiful and gives peace. Like a loving cowherd, He protects every being.","full":"Vishnu has a beautiful form, gives peace, and created the world. He delights in the earth and rests on the cosmic waters. Like a loving cowherd, He cares for and protects all beings. His eyes shower blessings, and He loves those who do right.","names":[["शुभांगः","Shu-bhaan-gah","Of beautiful form"],["शान्तिदः","Shaan-ti-dah","Giver of peace"],["स्रष्टा","Srash-taa","The Creator"],["कुमुदः","Ku-mu-dah","Who rejoices on the earth"],["कुवलेशयः","Ku-va-le-sha-yah","Who rests on the waters"],["गोहितः","Go-hi-tah","Friend of the cows and all beings"],["गोपतिः","Go-pa-tih","Lord of the cows"],["गोप्ता","Gop-taa","The protector"],["वृषभाक्षः","Vri-sha-bhaak-shah","Whose gaze showers blessings"],["वृषप्रियः","Vri-sha-pri-yah","Lover of dharma"]],"carry":7,"pic":"img/mean/v063.jpg","kid":{"w":6,"piece":2,"say":"The loving cowherd who looks after the cows!","words":["Gohito","Gopatir","Goptaa"],"pic":"img/mean/v063.jpg","story":{"t":"Krishna lifts Govardhana hill","s":"Every year, the people of Vrindavan held a big festival for Indra, the king of the gods, so that he would send rain. Little Krishna asked, 'Why not thank Govardhana hill instead? It gives grass to our cows and water to our fields.' The people agreed.\n\nIndra became angry and sent a terrible storm. Rain poured for days. The cows and the people were frightened.\n\nKrishna smiled, walked to Govardhana, and lifted the whole hill on the little finger of his left hand, like an umbrella. Everyone, with their cows and calves, sheltered under it for seven days. At last Indra understood, and bowed to Krishna.\n\nThe lesson: the Lord protects those who trust Him, and He cares for every cow and calf, not just for people.","pic":"img/story/govardhana.jpg"}}}};

 else if(a==='cmpgo'){compare();return}

 else if(a==='sayc'){var c=VS[CUR].names[VS[CUR].carry];say(c[1].replace(/-/g,'')+'. '+c[2]);return}
 else if(a==='finish'){finish();return}
 else if(a==='share'){var t='Today I chanted Vishnu Sahasranamam 🙏';if(navigator.share)navigator.share({text:t}).catch(function(){});else MSG='Sharing opens the phone\'s share sheet.'}
 else if(a==='more'){var n=nextV();if(n){start(n);return}MSG='All 4 preview verses are done. Tap ↺ Reset to try again.'}
 else if(a==='khear'){kHear();return}
 else if(a==='ksay'){KV='ksay';KS={ph:'',r:0};draw();kSay();return}
 else if(a==='kstory'){stopA();KV='kstory'}
 else if(a==='kstorysay'){var s=kv().kid.story;if(s)say(s.t+'. '+s.s);return}
 else if(a==='kgame'){stopA();++RUN;KV='kgame';KS={pick:[],sh:shuf(kv().kid.words.length),bad:-1}}
 else if(a==='kw'){var i=+v;if(i===KS.pick.length){KS.pick.push(i);KS.bad=-1;if(KS.pick.length===kv().kid.words.length&&!ST.kdone[kv().n]){ST.kdone[kv().n]=1;ST.lot++;save()}}else{KS.bad=i;setTimeout(function(){KS.bad=-1},400)}}
 else if(a==='kback'){stopA();++RUN;KV='khome'}
 else if(a==='knext'){stopA();ST.kidx++;save();KV='khome'}
 draw()});
if(!ST.setup)VIEW='setup';else VIEW=ST.who==='kid'?'khome':'home';
draw();
