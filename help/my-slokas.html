<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My slokas · how to set up a sloka</title>
<style>
body{margin:0;background:#faf5ea;color:#2a2416;font:16px/1.6 -apple-system,"Segoe UI",Roboto,"Noto Sans Telugu","Noto Sans Devanagari",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 16px 60px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.back{color:#0f6b6b;font-weight:700;text-decoration:none;margin-right:auto}
.lg button{font:inherit;font-size:.9rem;border:1.5px solid #e8c779;background:#fff;border-radius:16px;padding:3px 11px;margin-left:4px;cursor:pointer}

.step ul{margin:4px 0;padding-left:20px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:.93rem}

<div class="top"><a class="back" href="javascript:history.back()" id="bk">‹ Back</a><span class="lg"><button data-l="en">English</button><button data-l="te">తెలుగు</button><button data-l="hi">हिन्दी</button></span></div>

</main>
<script>
var IMG=function(n,alt){return '<img src="img/ms-'+n+'.jpg" alt="'+alt+'">'};
var EX='<div class="ex"><div><b>1</b> shuklaambaradharam vishnum shashivarnam chaturbhujam ↵</div><div><b>2</b> prasanna vadanam dhyaayet sarva vighnopashaantaye</div></div>';
var T={
en:{back:'‹ Back',h:'My slokas: set up a sloka',lead:'Add the sound and the words once. Then you hear and repeat one part at a time, and the words light up. Example: Shuklambaradharam (2 lines).',
rule:'<b>One rule:</b> type the words with <b>one line for each breath</b>. Where the chanter pauses, press Enter. Check that no line is missing.',
s1:['Add the sloka','<ul><li><b class="k">＋ Add a sloka</b></li><li><b>Sound:</b> <b class="k">Record</b> (play the recording near the phone, or chant it) or <b class="k">Audio file</b>.</li><li><b>Words:</b> a name, then paste the words, one line per breath:</li></ul>'+EX+'<ul><li>Tap <b class="k">Save</b>.</li></ul>'],
s2:['Check the parts (only if needed)','After Save the app splits the sound at the chanter’s breaths by itself, and you can start straight away. If something sounds off, tap <b class="k">Check them ›</b> on the player.<ul><li><b class="k">▶ Hear part 1</b>, 2, 3… to check each part. <b>Tap a word</b> to hear just that word.</li><li>A part should start one word later or earlier? Tap <b class="k">✂</b> between two words to start a new part there; tap <b class="k">✂ join</b> to put two parts together.</li><li>Words right but the sound starts a little off? <b class="k">◀ ▶</b> moves that part to the pause before or after.</li><li>Too many or too few parts? <b class="k">－ Fewer</b> / <b class="k">＋ More</b>.</li><li>Tap <b class="k">Save</b>. Done: words and sound match.</li></ul>'],
s3:['Practise','Open the sloka → <b class="k">Learn with guru</b>: hear line 1, say it twice, then line 2, then the whole sloka. Or press ▶ to just listen.'],
fixH:'Something not right?',fixL:'Open the sloka → ⚙️ → <b class="k">Edit sloka</b>. Easiest fix: <b class="k">Set up the parts → Start</b>, and listen once again. For small fixes: <b class="k">Lines in the sound → Check</b>. Green at the top = all good.',
a:['A word is in the wrong line','Tap the word → <b class="k">⬇ Move to line 2</b> (or ⬆ to the line above). Example: you hear <b>chaturbhujam</b> at the start of line 2 → tap it → Move to line 2.'],
b:['More fixes in the ⋯ menu','<ul><li><b class="k">✂ Split the sound in two</b>: one line’s sound has two lines of words.</li><li><b class="k">Join with next line</b>: one line of words is spread over two sound lines.</li><li><b class="k">Leave out</b>: talk or noise you don’t want.</li><li><b class="k">🧩 Learn in 2 small pieces</b>: a long, hard line. You learn piece 1, piece 2, then the full line.</li></ul>'],
e:['Starts a little early or late','Tap <b class="k">◀ earlier</b> or <b class="k">later ▶</b> under the line. It moves 0.2 seconds and plays again.'],
tH:'Which fix when',t:[['Off from some line onward','A line of words is missing: add it, then Set up the parts again'],['A word in the wrong line','Tap the word → Move'],['Sound line has 2 lines of words','⋯ → Split the sound in two'],['Words spread over 2 sound lines','⋯ → Join with next line'],['Starts early or late','◀ earlier / later ▶'],['Line too long to learn','⋯ → Learn in 2 small pieces'],['New recording','Edit sloka → Sound → Change, then Set up the parts']]},
te:{back:'‹ వెనక్కి',h:'నా శ్లోకాలు: శ్లోకాన్ని సిద్ధం చేయడం',lead:'శబ్దం, పదాలు ఒక్కసారి చేర్చండి. తర్వాత ఒక్కో భాగం విని, మళ్ళీ చెప్పవచ్చు; పదాలు వెలుగుతాయి. ఉదాహరణ: శుక్లాంబరధరం (2 పంక్తులు).',
rule:'<b>ఒకే నియమం:</b> <b>ప్రతి శ్వాసకు ఒక పంక్తి</b>గా పదాలు రాయండి. పఠించేవారు ఆగిన చోట Enter నొక్కండి. ఏ పంక్తీ తప్పిపోలేదని చూసుకోండి.',
s1:['శ్లోకాన్ని చేర్చండి','<ul><li><b class="k">＋ Add a sloka</b></li><li><b>శబ్దం:</b> <b class="k">Record</b> (రికార్డింగ్‌ను ఫోన్ దగ్గర ప్లే చేయండి, లేదా మీరే పఠించండి) లేదా <b class="k">Audio file</b>.</li><li><b>పదాలు:</b> పేరు, తర్వాత పదాలు, శ్వాసకు ఒక పంక్తి:</li></ul>'+EX+'<ul><li><b class="k">Save</b> నొక్కండి.</li></ul>'],
s2:['భాగాలు సరిచూడండి (అవసరమైతే మాత్రమే)','Save తర్వాత యాప్ శ్వాస తీసుకునే చోట్ల శబ్దాన్ని తనంతట తానే విభజిస్తుంది, వెంటనే మొదలుపెట్టవచ్చు. ఏదైనా తేడాగా వినిపిస్తే, ప్లేయర్‌లో <b class="k">Check them ›</b> నొక్కండి.<ul><li>ప్రతి భాగాన్ని <b class="k">▶ Hear part</b> తో వినండి. <b>ఒక పదాన్ని నొక్కితే</b> ఆ పదం మాత్రమే వినిపిస్తుంది.</li><li>భాగం ఒక పదం ముందు/తర్వాత మొదలవ్వాలా? రెండు పదాల మధ్య <b class="k">✂</b> నొక్కండి; రెండు భాగాలు కలపడానికి <b class="k">✂ join</b>.</li><li>పదాలు సరే, శబ్దం కొంచెం తేడానా? <b class="k">◀ ▶</b> ఆ భాగాన్ని ముందు/తర్వాత ఆగిన చోటుకి జరుపుతుంది.</li><li>భాగాలు ఎక్కువ/తక్కువా? <b class="k">－ Fewer</b> / <b class="k">＋ More</b>.</li><li><b class="k">Save</b> నొక్కండి. పదాలు, శబ్దం సరిపోతాయి.</li></ul>'],
s3:['అభ్యాసం','శ్లోకం తెరిచి → <b class="k">Learn with guru</b>: 1వ పంక్తి విని రెండుసార్లు చెప్పండి, తర్వాత 2వ పంక్తి, తర్వాత పూర్తి శ్లోకం. లేదా ▶ నొక్కి వినండి.'],
fixH:'ఏదైనా సరిగా లేదా?',fixL:'శ్లోకం తెరిచి → ⚙️ → <b class="k">Edit sloka</b>. సులభమైన మార్గం: <b class="k">Set up the parts → Start</b>, మళ్ళీ ఒక్కసారి వినండి. చిన్న సవరణలకు: <b class="k">Lines in the sound → Check</b>. పైన ఆకుపచ్చ = అంతా సరే.',
a:['ఒక పదం తప్పు పంక్తిలో ఉంది','ఆ పదాన్ని నొక్కండి → <b class="k">⬇ Move to line 2</b> (లేదా ⬆ పై పంక్తికి). ఉదాహరణ: <b>chaturbhujam</b> 2వ పంక్తి మొదట్లో వినిపిస్తే → దాన్ని నొక్కి → Move to line 2.'],
b:['⋯ మెనూలో మరిన్ని','<ul><li><b class="k">✂ Split the sound in two</b>: ఒక పంక్తి శబ్దంలో రెండు పంక్తుల పదాలు ఉంటే.</li><li><b class="k">Join with next line</b>: ఒక పంక్తి పదాలు రెండు శబ్ద పంక్తులలో ఉంటే.</li><li><b class="k">Leave out</b>: అక్కర్లేని మాటలు, శబ్దం.</li><li><b class="k">🧩 Learn in 2 small pieces</b>: పొడవైన, కష్టమైన పంక్తి. 1వ భాగం, 2వ భాగం, తర్వాత పూర్తి పంక్తి.</li></ul>'],
e:['కొంచెం ముందు లేదా ఆలస్యంగా మొదలవుతుంది','పంక్తి కింద <b class="k">◀ earlier</b> లేదా <b class="k">later ▶</b> నొక్కండి. 0.2 సెకన్లు జరిగి మళ్ళీ వినిపిస్తుంది.'],
tH:'ఎప్పుడు ఏ సవరణ',t:[['ఒక పంక్తి నుంచి అన్నీ తప్పుగా','ఒక పంక్తి పదాలు తప్పిపోయాయి: చేర్చి, మళ్ళీ Set up the parts'],['పదం తప్పు పంక్తిలో','పదాన్ని నొక్కి → Move'],['ఒక శబ్ద పంక్తిలో 2 పంక్తుల పదాలు','⋯ → Split the sound in two'],['పదాలు 2 శబ్ద పంక్తులలో','⋯ → Join with next line'],['ముందు/ఆలస్యంగా మొదలు','◀ earlier / later ▶'],['పంక్తి చాలా పొడవు','⋯ → Learn in 2 small pieces'],['కొత్త రికార్డింగ్','Edit sloka → Sound → Change, తర్వాత Set up the parts']]},
hi:{back:'‹ वापस',h:'मेरे श्लोक: श्लोक तैयार करें',lead:'आवाज़ और शब्द एक बार जोड़ें। फिर एक-एक भाग सुनकर दोहराएँ; शब्द चमकते हैं। उदाहरण: शुक्लाम्बरधरं (2 पंक्तियाँ)।',
rule:'<b>एक नियम:</b> शब्द <b>हर साँस के लिए एक पंक्ति</b> में लिखें। जहाँ पढ़ने वाले रुकते हैं, वहाँ Enter दबाएँ। देखें कि कोई पंक्ति छूटी न हो।',
s1:['श्लोक जोड़ें','<ul><li><b class="k">＋ Add a sloka</b></li><li><b>आवाज़:</b> <b class="k">Record</b> (रिकॉर्डिंग फ़ोन के पास चलाएँ, या ख़ुद पढ़ें) या <b class="k">Audio file</b>।</li><li><b>शब्द:</b> नाम, फिर शब्द, हर साँस की एक पंक्ति:</li></ul>'+EX+'<ul><li><b class="k">Save</b> दबाएँ।</li></ul>'],
s2:['भाग जाँचें (सिर्फ़ ज़रूरत हो तो)','Save के बाद ऐप साँस लेने की जगहों पर आवाज़ खुद बाँट देता है, आप तुरंत शुरू कर सकते हैं। कुछ अलग लगे तो प्लेयर में <b class="k">Check them ›</b> दबाएँ।<ul><li>हर भाग <b class="k">▶ Hear part</b> से सुनें। <b>किसी शब्द को दबाएँ</b> तो सिर्फ़ वही शब्द सुनाई देगा।</li><li>भाग एक शब्द पहले/बाद में शुरू होना चाहिए? दो शब्दों के बीच <b class="k">✂</b> दबाएँ; दो भाग जोड़ने के लिए <b class="k">✂ join</b>।</li><li>शब्द ठीक, पर आवाज़ थोड़ी हटकर? <b class="k">◀ ▶</b> उस भाग को पिछली/अगली रुकने की जगह पर ले जाता है।</li><li>भाग ज़्यादा/कम? <b class="k">－ Fewer</b> / <b class="k">＋ More</b>।</li><li><b class="k">Save</b> दबाएँ। शब्द और आवाज़ मेल खाते हैं।</li></ul>'],
s3:['अभ्यास','श्लोक खोलें → <b class="k">Learn with guru</b>: पंक्ति 1 सुनें, दो बार बोलें, फिर पंक्ति 2, फिर पूरा श्लोक। या ▶ दबाकर बस सुनें।'],
fixH:'कुछ ठीक नहीं?',fixL:'श्लोक खोलें → ⚙️ → <b class="k">Edit sloka</b>। सबसे आसान: <b class="k">Set up the parts → Start</b>, और एक बार फिर सुनें। छोटे सुधार: <b class="k">Lines in the sound → Check</b>। ऊपर हरा = सब ठीक।',
a:['कोई शब्द ग़लत पंक्ति में है','शब्द दबाएँ → <b class="k">⬇ Move to line 2</b> (या ⬆ ऊपर की पंक्ति में)। उदाहरण: <b>chaturbhujam</b> पंक्ति 2 की शुरुआत में सुनाई दे → उसे दबाएँ → Move to line 2।'],
b:['⋯ मेनू में और','<ul><li><b class="k">✂ Split the sound in two</b>: एक पंक्ति की आवाज़ में दो पंक्तियों के शब्द हों।</li><li><b class="k">Join with next line</b>: एक पंक्ति के शब्द दो आवाज़-पंक्तियों में हों।</li><li><b class="k">Leave out</b>: बातचीत या शोर जो नहीं चाहिए।</li><li><b class="k">🧩 Learn in 2 small pieces</b>: लंबी, कठिन पंक्ति। भाग 1, भाग 2, फिर पूरी पंक्ति।</li></ul>'],
e:['थोड़ा पहले या देर से शुरू होता है','पंक्ति के नीचे <b class="k">◀ earlier</b> या <b class="k">later ▶</b> दबाएँ। 0.2 सेकंड खिसककर फिर बजता है।'],
tH:'कब कौन-सा सुधार',t:[['किसी पंक्ति से आगे सब ग़लत','शब्दों की एक पंक्ति छूटी है: जोड़ें, फिर Set up the parts'],['शब्द ग़लत पंक्ति में','शब्द दबाएँ → Move'],['एक आवाज़-पंक्ति में 2 पंक्तियों के शब्द','⋯ → Split the sound in two'],['शब्द 2 आवाज़-पंक्तियों में','⋯ → Join with next line'],['पहले/देर से शुरू','◀ earlier / later ▶'],['पंक्ति बहुत लंबी','⋯ → Learn in 2 small pieces'],['नई रिकॉर्डिंग','Edit sloka → Sound → Change, फिर Set up the parts']]}};
function show(l){if(!T[l])l='en';var t=T[l],st=function(n,a,img){return '<div class="step"><h3><i>'+n+'</i>'+a[0]+'</h3>'+a[1]+(img||'')+'</div>'};
 document.documentElement.lang=l;document.getElementById('bk').textContent=t.back;
 document.querySelectorAll('.lg button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l)});
 document.getElementById('c').innerHTML='<h1>'+t.h+'</h1><p class="lead">'+t.lead+'</p><div class="rule">'+t.rule+'</div>'
 +st(1,t.s1,IMG('a_add','Add a sloka'))+st(2,t.s2,IMG('b_tap','Set up the parts'))+st(3,t.s3)
 +'<h2>'+t.fixH+'</h2><p>'+t.fixL+'</p>'
 +st('a',t.a,IMG('e_word','Move a word'))+st('b',t.b,IMG('f_menu','The ⋯ menu'))+st('c',t.e,IMG('d_lines','earlier and later'))
 +'<h2>'+t.tH+'</h2><table>'+t.t.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('')+'</table>'}
document.querySelector('.lg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.l)});
show((location.search.match(/[?&]l=(\w+)/)||[])[1]||'en');
</script></body></html>
