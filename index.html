<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vishnu Sahasranamam Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Tiro+Devanagari+Sanskrit&family=Noto+Serif+Telugu:wght@400;700&display=swap">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1b2340;--mute:#4a5378;--line:#d9deea;--acc:#26357a;--acc-ink:#fff;--sf:#e8890c;--sf-ink:#1b2340;--soft:#e4e8f2;--gold-bg:#fff3d1;--rec:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142b;--card:#1b1e3f;--ink:#eef0fb;--mute:#a7acd0;--line:#33376a;--acc:#8fa3ff;--acc-ink:#0d1030;--soft:#262a55;--gold-bg:#3a2f10;--rec:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12142b;--card:#1b1e3f;--ink:#eef0fb;--mute:#a7acd0;--line:#33376a;--acc:#8fa3ff;--acc-ink:#0d1030;--soft:#262a55;--gold-bg:#3a2f10;--rec:#ff7b6b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px;display:flex;flex-direction:column;gap:14px}
button,select{font:inherit;color:inherit}
h1{font-size:1.5rem;margin:0}
.mute{color:var(--mute);font-size:.92rem}
.hero{background:var(--acc);color:var(--acc-ink);border-radius:18px;padding:18px}
.hero .mute{color:inherit;opacity:.85}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wk{display:flex;justify-content:space-between;margin:14px 0 4px}
.wk span{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;background:rgba(255,255,255,.2)}
.wk .on{background:var(--sf);color:var(--sf-ink);font-weight:700}
.bar,.pb{height:7px;background:var(--soft);border-radius:9px;overflow:hidden}
.hero .bar{background:rgba(255,255,255,.25)}
.bar i,.pb i{display:block;height:100%;background:var(--sf);border-radius:9px;transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h2{font-size:1.1rem;margin:0 0 8px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;cursor:pointer;min-height:56px}
.step:first-of-type{border-top:0}
.ck{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.step[aria-pressed="true"] .ck{background:var(--acc);color:var(--acc-ink)}
.btn{border:0;border-radius:14px;font-weight:700;min-height:56px;width:100%;font-size:1.05rem;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
.btn.sf{background:var(--sf);color:var(--sf-ink)}
.btn.ghost{background:transparent;border:2px solid var(--acc);color:var(--acc)}
.btn:disabled{opacity:.5}
.back{border:0;background:var(--soft);border-radius:50%;width:44px;height:44px;font-size:1.2rem;cursor:pointer}
.vtop{display:flex;align-items:center;gap:12px}
.vnum{color:var(--mute);margin-top:4px}
.sa{font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.75rem;line-height:1.55}
.prb{font-weight:700;color:var(--acc);font-size:1.05rem;word-spacing:.15em}
.te{font-family:'Noto Serif Telugu',serif;font-size:1.2rem;line-height:1.7}
.hid{filter:blur(9px);cursor:pointer}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:44px;font-weight:700;color:var(--acc);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip.w{font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.15rem}
.plain{background:var(--gold-bg);border-radius:14px;padding:12px 14px;font-size:1.05rem}
.wc .sa{font-size:2rem}
.wc .m{font-size:1.25rem}
audio{width:100%}
ul{margin:6px 0 0;padding-left:20px}
li{margin:6px 0}
details summary{cursor:pointer;font-weight:700}
.tip{background:var(--gold-bg);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.95rem}
.msg{color:var(--sf);min-height:1.2em;font-size:.92rem}
.btn.rec{background:var(--rec);color:#fff}
.dn{position:sticky;bottom:0;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
:focus-visible{outline:3px solid var(--sf);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i,.pb i{transition:none}}

:root{--ov:rgba(243,245,249,.84)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ov:rgba(18,20,43,.86)}}
:root[data-theme="dark"]{--ov:rgba(18,20,43,.86)}
body{background-image:linear-gradient(var(--ov),var(--ov)),url(images/vishnu.jpg);background-size:cover;background-position:center top;background-attachment:fixed}
.hero{position:relative;overflow:hidden}
.hero>*{position:relative}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:170px;height:170px;opacity:.16;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='white' stroke-width='2'><circle cx='50' cy='50' r='46'/><circle cx='50' cy='50' r='32' stroke-dasharray='4 5'/><circle cx='50' cy='50' r='12'/><path d='M50 4V38M50 62V96M4 50H38M62 50H96M17 17L40 40M83 17L60 40M17 83L40 60M83 83L60 60'/></g></svg>") center/contain no-repeat}
input[type=time]{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:48px}
.btn.lnk{text-decoration:none;display:flex;align-items:center;justify-content:center;flex:1;width:auto;padding:0 14px}
.ill{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.ill svg{display:block;width:100%;height:auto}
.ill .mute{padding:10px 14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var V=[
{sa:["विश्वं विष्णुर्वषट्कारो भूतभव्यभवत्प्रभुः ।","भूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः ॥१॥"],pr:["Vish-vam Vish-nur Va-shat-kaa-ro Bhoo-ta-bhav-ya-bha-vat-pra-bhuh","Bhoo-ta-krid-bhoo-ta-bhrid-bhaa-vo Bhoo-taat-maa Bhoo-ta-bhaa-va-nah"],en:["Vishvam Vishnur Vashatkaro Bhoota-Bhavya-Bhavat-Prabhuh","Bhoota-krid Bhoota-bhrid Bhavo Bhootatma Bhoota-bhavanah"],te:["విశ్వం విష్ణుర్వషట్కారో భూతభవ్యభవత్ప్రభుః |","భూతకృద్భూతభృద్భావో భూతాత్మా భూతభావనః ||"],tip:"Va-shat-kaa-ro: say the sh softly, then a short t. Bhoo is a breathy b with a long oo."},
{sa:["पूतात्मा परमात्मा च मुक्तानां परमा गतिः ।","अव्ययः पुरुषः साक्षी क्षेत्रज्ञोऽक्षर एव च ॥२॥"],pr:["Poo-taat-maa Pa-ra-maat-maa cha Muk-taa-naam Pa-ra-maa Ga-tih","A-vya-yah Pu-ru-shah Saa-kshee Kshe-tra-gyo Ak-sha-ra e-va cha"],en:["Pootatma Paramatma cha Muktanam Parama Gatih","Avyayah Purushah Sakshi Kshetrajno Akshara eva cha"],te:["పూతాత్మా పరమాత్మా చ ముక్తానాం పరమా గతిః |","అవ్యయః పురుషః సాక్షీ క్షేత్రజ్ఞోఽక్షర ఏవ చ ||"],tip:"Kshe-tra-gyo: ksh is k and sh said together. jn is usually said gya in chanting. cha is like the ch in chair."},
{sa:["योगो योगविदां नेता प्रधानपुरुषेश्वरः ।","नारसिंहवपुः श्रीमान् केशवः पुरुषोत्तमः ॥३॥"],pr:["Yo-go Yo-ga-vi-daam Ne-taa Pra-dhaa-na-pu-ru-shesh-va-rah","Naa-ra-sim-ha-va-puh Shree-maan Ke-sha-vah Pu-ru-shot-ta-mah"],en:["Yogo Yogavidam Neta Pradhana-Purusheshvarah","Narasimha-vapuh Shriman Keshavah Purushottamah"],te:["యోగో యోగవిదాం నేతా ప్రధానపురుషేశ్వరః |","నారసింహవపుః శ్రీమాన్ కేశవః పురుషోత్తమః ||"],tip:"Sim-ha: keep the h soft. Shree-maan has a long ee and a long aa. Ke-sha-vah ends with a light echo of a."},
{sa:["सर्वः शर्वः शिवः स्थाणुर्भूतादिर्निधिरव्ययः ।","सम्भवो भावनो भर्ता प्रभवः प्रभुरीश्वरः ॥४॥"],pr:["Sar-vah Shar-vah Shi-vah Sthaa-nur Bhoo-taa-dir Ni-dhir A-vya-yah","Sam-bha-vo Bhaa-va-no Bhar-taa Pra-bha-vah Pra-bhur Eesh-va-rah"],en:["Sarvah Sharvah Shivah Sthanur Bhootadir Nidhir Avyayah","Sambhavo Bhavano Bharta Prabhavah Prabhur Ishvarah"],te:["సర్వః శర్వః శివః స్థాణుర్భూతాదిర్నిధిరవ్యయః |","సంభవో భావనో భర్తా ప్రభవః ప్రభురీశ్వరః ||"],tip:"Sthaa-nur: s then a breathy t, then a long aa. Sar-vah and Shar-vah differ: s versus sh."},
{sa:["स्वयम्भूः शम्भुरादित्यः पुष्कराक्षो महास्वनः ।","अनादिनिधनो धाता विधाता धातुरुत्तमः ॥५॥"],pr:["Sva-yam-bhooh Sham-bhur Aa-di-tyah Push-ka-raak-sho Ma-haa-sva-nah","A-naa-di-ni-dha-no Dhaa-taa Vi-dhaa-taa Dhaa-tu-rut-ta-mah"],en:["Svayambhooh Shambhur Adityah Pushkaraksho Mahasvanah","Anadi-nidhano Dhata Vidhata Dhaturuttamah"],te:["స్వయంభూః శంభురాదిత్యః పుష్కరాక్షో మహాస్వనః |","అనాదినిధనో ధాతా విధాతా ధాతురుత్తమః ||"],tip:"Push-ka-raak-sho: ksh again, then a long o. Dhaa is a breathy d. Aa-di-tyah: the ty is quick."},
{n:61,sa:["सुधन्वा खंडपरशुर् दारुणो द्रविणप्रदः ।","दिवस्पृक् सर्वदृग् व्यासो वाचस्पतिरयोनिजः ॥६१॥"],pr:["Su-dhan-vaa Khan-da-pa-ra-shur Daa-ru-no Dra-vi-na-pra-dah","Di-vas-prik Sar-va-drig Vyaa-so Vaa-chas-pa-ti-ra-yo-ni-jah"],en:["Sudhanva Khandaparashur Daruno Dravinapradah","Divasprik Sarvadrig Vyaso Vachaspatir Ayonijah"],te:["సుధన్వా ఖండపరశుర్ దారుణో ద్రవిణప్రదః |","దివస్పృక్ సర్వదృగ్ వ్యాసో వాచస్పతిరయోనిజః ||"],tip:"Dra-vi-na: the r is a light tap. Vyaa-so: vy is said together, like vya. Vaa-chas-pa-ti: ch like the ch in chair."},
{n:62,sa:["त्रिसामा सामगस् साम निर्वाणं भेषजं भिषक् ।","संन्यासकृच् छमश् शांतो निष्ठा शांतिः परायणम् ॥६२॥"],pr:["Tri-saa-maa Saa-ma-gas Saa-ma Nir-vaa-nam Bhe-sha-jam Bhi-shak","San-nyaa-sa-krich Chha-mash Shaan-to Nish-thaa Shaan-tih Pa-raa-ya-nam"],en:["Trisama Samagas Sama Nirvanam Bheshajam Bhishak","Sannyasakrich Chhamash Shanto Nishtha Shantih Parayanam"],te:["త్రిసామా సామగస్ సామ నిర్వాణం భేషజం భిషక్ |","సంన్యాసకృచ్ ఛమశ్ శాంతో నిష్ఠా శాంతిః పరాయణమ్ ||"],tip:"San-nyaa-sa: the n is said twice (san-nya). Chha is ch with a puff of air. Shaan-tih: sh like ship, with a long aa."},
{n:63,sa:["शुभांगश् शांतिदस् स्रष्टा कुमुदः कुवलेशयः ।","गोहितो गोपतिर् गोप्ता वृषभाक्षो वृषप्रियः ॥६३॥"],pr:["Shu-bhaan-gash Shaan-ti-das Srash-taa Ku-mu-dah Ku-va-le-sha-yah","Go-hi-to Go-pa-tir Gop-taa Vri-sha-bhaak-sho Vri-sha-pri-yah"],en:["Shubhangash Shantidas Srashta Kumudah Kuvaleshayah","Gohito Gopatir Gopta Vrishabhaksho Vrishapriyah"],te:["శుభాంగశ్ శాంతిదస్ స్రష్టా కుముదః కువలేశయః |","గోహితో గోపతిర్ గోప్తా వృషభాక్షో వృషప్రియః ||"],tip:"Srash-taa: s and r run together, then sh. Vri-sha-bhaak-sho: bh is a breathy b, ksh is k and sh together. Shu-bhaan-gash ends with sh, not s."}
];

var TAB=0,TOTAL=108;
var T={
why:{en:"Vishnu Sahasranamam is the thousand names of Lord Vishnu, taught by Bhishma to Yudhishthira in the Mahabharata. Each name describes a quality of the Lord. Chanting or listening to it daily is traditionally said to bring peace, strength, freedom from fear, and wellbeing.",
te:"విష్ణు సహస్రనామం మహాభారతంలో భీష్ముడు ధర్మరాజుకు ఉపదేశించిన విష్ణువు యొక్క వెయ్యి నామాలు. ప్రతి నామం భగవంతుని ఒక గుణాన్ని తెలియజేస్తుంది. ప్రతిరోజూ పఠించడం లేదా వినడం వల్ల శాంతి, బలం, భయం నుండి విముక్తి, శ్రేయస్సు కలుగుతాయని సంప్రదాయం చెబుతుంది.",
hi:"विष्णु सहस्रनाम महाभारत में भीष्म द्वारा युधिष्ठिर को बताए गए भगवान विष्णु के एक हज़ार नाम हैं। हर नाम प्रभु के एक गुण को बताता है। रोज़ पाठ करने या सुनने से शांति, बल, भय से मुक्ति और कल्याण मिलता है, ऐसी परंपरागत मान्यता है।"},
whyT:{en:"Why chant it?",te:"ఎందుకు పఠించాలి?",hi:"क्यों पाठ करें?"},
gen:{en:"The closing verses of the stotram say that whoever hears or recites it with faith meets no harm and is freed from fear, finds strength and brightness, the sick are freed from illness, the troubled from trouble, and the sorrowful from sorrow. This is a traditional belief, not medical advice.",
te:"స్తోత్రం చివరి శ్లోకాలు (ఫలశ్రుతి) ఇలా చెబుతాయి: భక్తితో వినేవారికి లేదా పఠించేవారికి అశుభం కలగదు, భయం తొలగుతుంది, బలం, తేజస్సు కలుగుతాయి; రోగులు రోగం నుండి, ఆపదలో ఉన్నవారు ఆపద నుండి విముక్తులవుతారు. ఇది సంప్రదాయ విశ్వాసం, వైద్య సలహా కాదు.",
hi:"स्तोत्र के अंतिम श्लोक (फलश्रुति) कहते हैं कि श्रद्धा से सुनने या पाठ करने वाले को अशुभ नहीं मिलता, भय दूर होता है, बल और तेज मिलता है, रोगी रोग से और संकट में पड़े संकट से मुक्त होते हैं। यह परंपरागत मान्यता है, चिकित्सा सलाह नहीं।"},
none:{en:"No special purpose is listed for this verse in the Visvas booklet. The general benefits below apply.",te:"ఈ శ్లోకానికి విశ్వాస్ పుస్తకంలో ప్రత్యేక ప్రయోజనం ఇవ్వబడలేదు. కింది సాధారణ ఫలాలు వర్తిస్తాయి.",hi:"विश्वास पुस्तिका में इस श्लोक का कोई विशेष प्रयोजन नहीं दिया गया है। नीचे दिए सामान्य फल लागू होते हैं।"},
soon:{en:"Meaning for this verse is coming soon.",te:"ఈ శ్లోకం యొక్క అర్థం త్వరలో చేర్చబడుతుంది.",hi:"इस श्लोक का अर्थ जल्द जोड़ा जाएगा।"},
draft:{en:"Draft meanings. Please check with a guru before relying on them.",te:"ఇవి ముసాయిదా అర్థాలు. ఆధారపడే ముందు గురువుతో సరిచూసుకోండి.",hi:"ये प्रारूप अर्थ हैं। भरोसा करने से पहले गुरु से जाँच लें।"}
};

61:{w:[["सुधन्वा","Su-dhan-vaa","One with the excellent bow (Sharnga)","మంచి ధనుస్సు (శార్ఙ్గం) కలవాడు","उत्तम धनुष (शार्ङ्ग) वाले"],

v:["The Lord with the excellent bow and the cutting axe, stern toward evil, giver of wealth. He touches the heavens, sees everything, divided the Vedas as Vyasa, is lord of speech, and is not born from a womb.","మంచి ధనుస్సు, ఖండించే గొడ్డలి కలవాడు; దుష్టులకు కఠినుడు; సంపదనిచ్చువాడు. ఆకాశాన్ని తాకువాడు, సర్వము చూచువాడు, వ్యాసునిగా వేదాలను విభజించినవాడు, వాక్కుకు అధిపతి, గర్భజన్మ లేనివాడు.","उत्तम धनुष और खंडन करने वाला परशु धारण करने वाले, दुष्टों के लिए कठोर, धन देने वाले। वे आकाश को छूते हैं, सब कुछ देखते हैं, व्यास रूप में वेदों का विभाजन किया, वाणी के स्वामी हैं और योनि से जन्म नहीं लेते।"]},

v:["He is praised in the three Samas, sings Sama and is Sama itself; he is liberation, the medicine and the physician. He set up the path of renunciation, gives calm, is peaceful, is the final resting place, peace itself and the highest refuge.","మూడు సామాలతో స్తుతింపబడువాడు, సామగానం చేయువాడు, సామవేద స్వరూపుడు; మోక్షం, ఔషధం, వైద్యుడు. సన్యాసాశ్రమాన్ని నిర్దేశించినవాడు, శాంతిని ఇచ్చువాడు, శాంతస్వరూపుడు, అందరికీ అంతిమ ఆధారం, శాంతి స్వరూపం, పరమాశ్రయం.","तीन सामों से स्तुत, सामगान करने वाले और सामवेद स्वरूप; वे मोक्ष, औषधि और वैद्य हैं। संन्यास के प्रवर्तक, शांति देने वाले, शांत, सबके अंतिम आधार, शांति स्वरूप और परम आश्रय हैं।"]},

T.ex={en:["Fear leaves: the stotram says the devoted reciter is not afraid anywhere.","Strength and radiance: it promises vigour, brightness, health and good qualities.","Relief in trouble: the sick are freed from illness, the distressed from distress, the sorrowful from sorrow.","A calm mind: devotees are said to stay free from anger, jealousy and greed."],
te:["భయం తొలగుతుంది: భక్తితో పఠించేవారికి ఎక్కడా భయం ఉండదని స్తోత్రం చెబుతుంది.","బలం, తేజస్సు: శక్తి, కాంతి, ఆరోగ్యం, సద్గుణాలు కలుగుతాయి.","కష్టంలో ఉపశమనం: రోగులు రోగం నుండి, ఆపదలో ఉన్నవారు ఆపద నుండి, దుఃఖంలో ఉన్నవారు దుఃఖం నుండి విముక్తులవుతారు.","ప్రశాంత మనస్సు: భక్తులకు కోపం, అసూయ, లోభం, చెడు ఆలోచనలు కలగవని చెబుతారు."],
hi:["भय दूर होता है: श्रद्धा से पाठ करने वाले को कहीं भय नहीं रहता।","बल और तेज: शक्ति, कांति, स्वास्थ्य और सद्गुण मिलते हैं।","कष्ट में राहत: रोगी रोग से, संकट में पड़े संकट से और दुखी दुख से मुक्त होते हैं।","शांत मन: भक्तों में क्रोध, ईर्ष्या, लोभ और बुरे विचार नहीं आते, ऐसा कहा गया है।"]};
T.cnt={en:"While learning: say each new verse 3 times a day, then revise older verses. Traditional practice: chant the full stotram once daily, and many take a resolution (sankalpa) for 48 days. Counts differ by family, so follow your guru.",
te:"నేర్చుకునేటప్పుడు: ప్రతి కొత్త శ్లోకాన్ని రోజుకు 3 సార్లు చెప్పండి, పాత శ్లోకాలను పునశ్చరణ చేయండి. సంప్రదాయం: రోజూ పూర్తి స్తోత్రాన్ని ఒకసారి పఠించడం; చాలామంది 48 రోజుల సంకల్పం చేస్తారు. కుటుంబ సంప్రదాయాన్ని బట్టి మారుతుంది, గురువును అనుసరించండి.",
hi:"सीखते समय: हर नया श्लोक दिन में 3 बार बोलें, फिर पुराने श्लोकों का दोहराव करें। परंपरा: रोज़ पूरा स्तोत्र एक बार पढ़ना; कई लोग 48 दिन का संकल्प लेते हैं। परिवार के अनुसार भिन्न होता है, गुरु का अनुसरण करें।"};

M[61].v=["God holds a fine bow and a sharp axe. He is firm with those who do wrong and gives wealth to those who need it. He sees everything, gave us the Vedas as Vyasa, is the master of speech, and was never born from a mother's womb.","భగవంతుడు మంచి విల్లు, పదునైన గొడ్డలి ధరించాడు. తప్పు చేసేవారిపై కఠినంగా ఉంటాడు, అవసరమైనవారికి సంపద ఇస్తాడు. అన్నీ చూస్తాడు, వ్యాసునిగా వేదాలను మనకు అందించాడు, మాటకు అధిపతి, తల్లి గర్భం నుండి పుట్టనివాడు.","भगवान के पास उत्तम धनुष और तेज़ परशु है। वे गलत करने वालों के लिए कठोर हैं और ज़रूरतमंदों को धन देते हैं। वे सब कुछ देखते हैं, व्यास रूप में उन्होंने वेद दिए, वे वाणी के स्वामी हैं और माँ के गर्भ से जन्म नहीं लेते।"];
M[62].v=["He is the one the three Sama chants praise. He is peace and freedom from all suffering. Like a doctor with the right medicine, he heals the pain of life. He gives calm to the mind, and in him everyone finally finds rest.","మూడు సామాలు ఆయనను స్తుతిస్తాయి. ఆయన శాంతి, అన్ని బాధల నుండి విముక్తి. సరైన మందు ఇచ్చే వైద్యుని వలె జీవితపు బాధను తగ్గిస్తాడు. మనసుకు ప్రశాంతతనిస్తాడు, చివరికి అందరూ ఆయనలోనే విశ్రాంతి పొందుతారు.","तीन साम उन्हीं की स्तुति करते हैं। वे शांति और हर दुख से मुक्ति हैं। सही दवा देने वाले वैद्य की तरह वे जीवन का कष्ट दूर करते हैं। वे मन को शांति देते हैं और अंत में सब उन्हीं में विश्राम पाते हैं।"];
M[63].v=["He is beautiful and gives peace. He created everything and looks after cows and all living beings. His kind eyes grant what is good for us, and he loves dharma, the right way to live.","ఆయన సుందరుడు, శాంతిని ఇచ్చేవాడు. అన్నింటినీ సృష్టించి, గోవులను, సమస్త జీవులను కాపాడతాడు. ఆయన కరుణ చూపు మనకు మేలు కలిగిస్తుంది, ధర్మమంటే ఆయనకు ప్రేమ.","वे सुंदर हैं और शांति देते हैं। उन्होंने सब कुछ रचा और वे गायों तथा सब प्राणियों की रक्षा करते हैं। उनकी करुणा भरी दृष्टि हमें मंगल देती है और उन्हें धर्म प्रिय है।"];

 for(var k=0;k<7;k++){var x=new Date(d);x.setDate(d.getDate()+k);s+='<span class="'+(S.days.indexOf(dstr(x))>=0?'on':'')+'">'+nm[k]+'</span>'}return s}
function chipsLang(){return '<div class="chips">'+[['en','English'],['te','తెలుగు'],['hi','हिन्दी']].map(function(x){return '<button class="chip" data-act="lang" data-v="'+x[0]+'" aria-pressed="'+(S.lang===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'}
var ILL='<div class="ill"><svg viewBox="0 0 360 190" role="img" aria-label="A teacher and a student sitting beside a lamp, learning to chant from a book"><rect width="360" height="190" fill="#fdebc8"/><circle cx="180" cy="122" r="94" fill="#ffd37a"/><circle cx="180" cy="122" r="68" fill="#ffe3a3"/><path d="M0 150Q90 134 180 148T360 142V190H0Z" fill="#26357a" opacity=".12"/><text x="180" y="52" text-anchor="middle" font-family="Tiro Devanagari Sanskrit,serif" font-size="34" fill="#b8651a">\u0950</text><ellipse cx="180" cy="170" rx="156" ry="14" fill="#e8890c"/><path d="M163 154h34c-2 10-9 14-17 14s-15-4-17-14z" fill="#b8651a"/><path d="M180 126c7 8 8 16 0 24-8-8-7-16 0-24z" fill="#f0b429"/><path d="M180 136c3 4 3 8 0 12-3-4-3-8 0-12z" fill="#fff3d1"/><path d="M62 170q0-50 30-54q30 4 30 54z" fill="#fff"/><path d="M62 170q0-30 14-46l16 10l-6 36z" fill="#e8890c"/><circle cx="92" cy="88" r="17" fill="#c68b59"/><path d="M75 92q17 32 34 0q-3 24-17 28q-14-4-17-28z" fill="#f5f0e6"/><path d="M75 84q17-24 34 0q-10-8-17-8t-17 8z" fill="#f5f0e6"/><path d="M114 134q16-6 22-24" stroke="#c68b59" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="137" cy="106" r="5" fill="#c68b59"/><path d="M240 170q0-40 28-44q28 4 28 44z" fill="#2c8f9a"/><circle cx="268" cy="106" r="14" fill="#c68b59"/><path d="M254 102q14-18 28 0q-14-6-28 0z" fill="#1b2340"/><circle cx="268" cy="140" r="6" fill="#c68b59"/><path d="M222 160l24-6l24 6v10l-24 6l-24-6z" fill="#fff" stroke="#26357a" stroke-width="1.5"/><path d="M246 154v22M230 162l12-3M230 167l12-3M250 159l12 3M250 164l12 3" stroke="#26357a" stroke-width="1.2"/></svg><div class="mute">Learn it the way it has always been taught: listen, repeat, understand.</div></div>';
function icsHref(){
 var t=(S.rt||'05:30').split(':'),d=new Date(),p=function(n){return('0'+n).slice(-2)};
 var ds=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()),stp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',u=location.href.split('#')[0];
 var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sahasranama Practice//EN','BEGIN:VEVENT','UID:sahasranama-daily@'+(location.host||'local'),'DTSTAMP:'+stp,'DTSTART:'+ds+'T'+t[0]+t[1]+'00','DURATION:PT15M','RRULE:FREQ=DAILY','SUMMARY:Vishnu Sahasranamam practice','DESCRIPTION:About 10 minutes. Listen then chant then record. '+u,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Time for Vishnu Sahasranamam practice','END:VALARM','END:VEVENT','END:VCALENDAR'];
 return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(L.join('\r\n'))}
function home(){
 var fin=S.pos>=V.length,e=Math.min(S.pos+S.pace,V.length),st=S.steps[tdy()]||[0,0,0,0,0];
 var h='<div class="hero"><div class="row"><div><h1>Vishnu Sahasranamam</h1><div class="mute">Namaste. A little every day.</div></div><b>'+streak()+'-day streak</b></div><div class="wk">'+weekDots()+'</div>';
 h+='<div class="mute">'+S.learned.length+' of '+TOTAL+' verses learned</div><div class="bar"><i style="width:'+(S.learned.length/TOTAL*100)+'%"></i></div></div>'+ILL;
 if(notice){h+='<div class="plain">'+notice+'</div>';notice=''}
 h+='<div class="card"><h2>Today\'s practice</h2><div class="mute">'+(fin?'All added verses are finished':lab(S.pos,e)+' \u00b7 about 10 minutes, early morning is best')+'</div>';
 STEPS.forEach(function(s,k){h+='<button class="step" data-act="step" data-k="'+k+'" aria-pressed="'+!!st[k]+'"><span class="ck">'+(st[k]?'\u2713':k+1)+'</span><span><b>'+s[0]+'</b><br><span class="mute">'+s[1]+'</span></span></button>'});
 h+='</div><button class="btn sf" data-act="start"'+(fin?' disabled':'')+'>Start today\'s verses</button>';
 h+='<div class="card"><h2>Daily reminder</h2><div class="mute">Pick a time. Your phone calendar will remind you every day.</div><div class="row" style="margin-top:10px"><input type="time" data-act="rt" value="'+(S.rt||'05:30')+'" aria-label="Reminder time"><a class="btn lnk" download="sahasranama-reminder.ics" href="'+icsHref()+'">Add to my calendar</a></div></div>';
 h+='<details class="card"><summary>'+T.whyT[S.lang]+'</summary>'+chipsLang()+'<p>'+T.why[S.lang]+'</p></details>';
 h+='<details class="card"><summary>Settings</summary><p><label>Verses a day <select data-act="pace">'+[1,2,3].map(function(n){return '<option value="'+n+'"'+(S.pace===n?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label></p><p><label>Go to verse <select data-act="goto">'+V.map(function(v,i){return '<option value="'+i+'"'+(Math.min(S.pos,V.length-1)===i?' selected':'')+'>'+v.n+'</option>'}).join('')+'</select></label></p></details>';
 h+='<details class="card"><summary>My recordings</summary><div id="mine" class="mute">Loading...</div></details>';
 return h}
function verse(){
 var it=LST[vi],v=V[it.i],m=M[v.n],k=LI[S.lang],last=vi===LST.length-1;
 var h='<div class="vtop"><button class="back" data-act="home" aria-label="Back to home">\u2190</button><span>'+(it.r?'Revise':'Today')+', verse '+(vi+1)+' of '+LST.length+'</span></div><div class="pb"><i style="width:'+((vi+1)/LST.length*100)+'%"></i></div>';
 h+='<div class="vnum">Verse '+v.n+'</div>';
 var hc=S.hide?' hid" data-act="peek':'';
 h+='<div class="sa'+hc+'">'+v.sa[0]+'<br>'+v.sa[1]+'</div><div class="prb'+hc+'">'+v.pr[0]+'<br>'+v.pr[1]+'</div>';
 h+='<div class="seg">'+[['say','Say it'],['meaning','Meaning'],['benefit','Benefit']].map(function(x){return '<button data-act="tab" data-v="'+x[0]+'" aria-pressed="'+(tab===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
 if(tab==='say'){
  h+='<div class="chips"><button class="chip" data-act="sc" data-v="en" aria-pressed="'+!!S.sc.en+'">English</button><button class="chip" data-act="sc" data-v="te" aria-pressed="'+!!S.sc.te+'">తెలుగు</button><button class="chip" data-act="hide" aria-pressed="'+!!S.hide+'">Hide text to test myself</button></div>';
  if(S.sc.en)h+='<div class="mute">'+v.en[0]+'<br>'+v.en[1]+'</div>';
  if(S.sc.te)h+='<div class="te">'+v.te[0]+'<br>'+v.te[1]+'</div>';
  var b='audio/v'+('00'+v.n).slice(-3);
  h+='<div class="card"><b>Listen to the guide</b><audio controls preload="metadata" src="'+b+'.m4a" onerror="aerr(this)"></audio></div>';
  h+='<button class="btn rec" data-act="rec">Record yourself</button><audio id="playback" controls hidden></audio><div class="msg" id="recMsg" aria-live="polite"></div>';
  h+='<details class="card"><summary>Pronunciation tip</summary><div class="tip">'+v.tip+'</div></details>';
 }else if(tab==='meaning'){
  h+=chipsLang();
  if(!m){h+='<div class="card">'+T.soon[S.lang]+'</div>'}
  else{h+='<div class="plain">'+m.v[k]+'</div><div class="mute">Tap a word</div><div class="chips">'+m.w.map(function(w,i){return '<button class="chip w" data-act="word" data-v="'+i+'" aria-pressed="'+(selW===i)+'">'+w[0]+'</button>'}).join('')+'</div>';
   var w=m.w[Math.min(selW,m.w.length-1)];h+='<div class="card wc"><div class="sa">'+w[0]+'</div><div class="prb">'+w[1]+'</div><div class="m">'+w[2+k]+'</div></div><div class="mute">'+T.draft[S.lang]+'</div>'}
 }else{
  h+=chipsLang()+'<div class="card">'+T.none[S.lang]+'</div><div class="card"><h2>'+T.h.ex[S.lang]+'</h2><ul>'+T.ex[S.lang].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><p class="mute">'+T.gen[S.lang]+'</p></div><div class="card"><h2>'+T.h.ct[S.lang]+'</h2>'+T.cnt[S.lang]+'</div>';
 }
 h+='<div class="dn"><button class="btn" data-act="next">'+(last?'Finish today':'Done, next verse')+'</button></div>';
 return h}
function aerr(a){if(!a.dataset.t){a.dataset.t=1;a.src=a.src.replace('.m4a','.mp3')}else{var d=document.createElement('div');d.className='mute';d.textContent='Guide audio for this verse is coming soon.';a.replaceWith(d)}}
function render(top){$('app').innerHTML=view==='home'?home():verse();if(view==='home')showMine();if(top)window.scrollTo(0,0)}
function dbo(){return new Promise(function(res,rej){var r=indexedDB.open('sp_rec',1);r.onupgradeneeded=function(){r.result.createObjectStore('r',{keyPath:'t'})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function rp(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function saveRec(o){return dbo().then(function(d){var t=d.transaction('r','readwrite');t.objectStore('r').put(o);return new Promise(function(res,rej){t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function showMine(){
 var el=$('mine');
 try{dbo().then(function(d){return rp(d.transaction('r').objectStore('r').getAll())}).then(function(a){
  a.sort(function(x,y){return y.t-x.t});
  var old=a.slice(7);if(old.length)dbo().then(function(d){var s=d.transaction('r','readwrite').objectStore('r');old.forEach(function(o){s.delete(o.t)})});
  el.innerHTML='';if(!a.length){el.textContent='No recordings yet.';return}
  a.slice(0,7).forEach(function(o){var d=document.createElement('div');d.className='rec1';d.innerHTML='<div class="note"></div>';d.firstChild.textContent=new Date(o.t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+' · '+o.l;var u=document.createElement('audio');u.controls=true;u.src=URL.createObjectURL(o.b);d.appendChild(u);el.appendChild(d)})
 }).catch(function(){el.textContent='Recordings cannot be shown on this browser.'})}catch(e){el.textContent='Recordings cannot be shown on this browser.'}}

var mr=null,ch=[],st=null;
async function recToggle(btn){
 var m=$('recMsg'),a=$('playback');
 if(mr&&mr.state==='recording'){mr.stop();btn.textContent='Record yourself';return}
 try{st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st);ch=[];var label='Verse '+V[LST[vi].i].n;
  mr.ondataavailable=function(e){ch.push(e.data)};
  mr.onstop=function(){var blob=new Blob(ch,{type:mr.mimeType});a.src=URL.createObjectURL(blob);a.hidden=false;st.getTracks().forEach(function(t){t.stop()});addDay();setStep(3,1);m.textContent='Saved. Press play to hear yourself, then compare with the guide.';saveRec({t:Date.now(),b:blob,l:label}).catch(function(){m.textContent='Recorded, but it could not be saved on this device. It plays until you leave the page.'})};
  mr.start();btn.textContent='Stop recording';m.textContent='Recording...';
 }catch(e){m.textContent='Microphone not available. Allow microphone access for this page in your browser settings.'}}
var app=$('app');
app.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,v=t.dataset.v;
 if(a==='step'){var k=+t.dataset.k,s=S.steps[tdy()]||[0,0,0,0,0];setStep(k,!s[k]);render()}
 else if(a==='start'){LST=mkList();vi=0;tab='say';selW=0;view='verse';render(1)}
 else if(a==='home'){view='home';render(1)}
 else if(a==='lang'){S.lang=v;sv();render()}
 else if(a==='tab'){tab=v;selW=0;render()}
 else if(a==='word'){selW=+v;render()}
 else if(a==='sc'){S.sc[v]=S.sc[v]?0:1;sv();render()}
 else if(a==='hide'&&t.tagName==='BUTTON'){S.hide=S.hide?0:1;sv();render()}
 else if(a==='peek'){t.classList.toggle('hid');if(t.nextElementSibling&&t.nextElementSibling.classList.contains('prb'))t.nextElementSibling.classList.toggle('hid')}
 else if(a==='rec'){recToggle(t)}
 else if(a==='next'){
  var it=LST[vi];if(!it.r){var n=V[it.i].n;if(S.learned.indexOf(n)<0)S.learned.push(n)}
  if(vi<LST.length-1){vi++;tab='say';selW=0;render(1)}
  else{addDay();setStep(0,1);setStep(1,1);setStep(2,1);setStep(4,1);S.pos=Math.min(S.pos+S.pace,V.length);sv();view='home';notice='Well done. Today\'s practice is complete. Your next verses are ready tomorrow.';render(1)}}
});
app.addEventListener('change',function(e){var t=e.target;
 if(t.dataset.act==='pace'){S.pace=+t.value;sv();render()}
 else if(t.dataset.act==='goto'){S.pos=+t.value;sv();render()}
 else if(t.dataset.act==='rt'){S.rt=t.value||'05:30';sv();render()}});
render();
</script>
