<style>

body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wk{display:flex;justify-content:space-between;margin:14px 0 4px}

.vtop{display:flex;align-items:center;gap:12px}
.vnum{color:var(--mute);margin-top:4px}
.sa{font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.75rem;line-height:1.55}
.prb{font-weight:700;color:var(--acc);font-size:1.05rem;word-spacing:.15em}
.te{font-family:'Noto Serif Telugu',serif;font-size:1.2rem;line-height:1.7}
.hid{filter:blur(9px);cursor:pointer}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip.w{font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.15rem}
.plain{background:var(--gold-bg);border-radius:14px;padding:12px 14px;font-size:1.05rem}
.wc .sa{font-size:2rem}
.wc .m{font-size:1.25rem}
audio{width:100%}
ul{margin:6px 0 0;padding-left:20px}
li{margin:6px 0}
details summary{cursor:pointer;font-weight:700}
.msg{color:var(--sf);min-height:1.2em;font-size:.92rem}
.btn.rec{background:var(--rec);color:#fff}
.dn{margin-top:18px;padding:14px 0 8px;border-top:2px dashed var(--line)}
:focus-visible{outline:3px solid var(--sf);outline-offset:2px}

<script>
var V=[
{sa:["विश्वं विष्णुर्वषट्कारो भूतभव्यभवत्प्रभुः ।","भूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः ॥१॥"],pr:["Vish-vam Vish-nur Va-shat-kaa-ro Bhoo-ta-bhav-ya-bha-vat-pra-bhuh","Bhoo-ta-krid-bhoo-ta-bhrid-bhaa-vo Bhoo-taat-maa Bhoo-ta-bhaa-va-nah"],en:["Vishvam Vishnur Vashatkaro Bhoota-Bhavya-Bhavat-Prabhuh","Bhoota-krid Bhoota-bhrid Bhavo Bhootatma Bhoota-bhavanah"],te:["విశ్వం విష్ణుర్వషట్కారో భూతభవ్యభవత్ప్రభుః |","భూతకృద్భూతభృద్భావో భూతాత్మా భూతభావనః ||"],tip:"Va-shat-kaa-ro: say the sh softly, then a short t. Bhoo is a breathy b with a long oo."},
{sa:["पूतात्मा परमात्मा च मुक्तानां परमा गतिः ।","अव्ययः पुरुषः साक्षी क्षेत्रज्ञोऽक्षर एव च ॥२॥"],pr:["Poo-taat-maa Pa-ra-maat-maa cha Muk-taa-naam Pa-ra-maa Ga-tih","A-vya-yah Pu-ru-shah Saa-kshee Kshe-tra-gyo Ak-sha-ra e-va cha"],en:["Pootatma Paramatma cha Muktanam Parama Gatih","Avyayah Purushah Sakshi Kshetrajno Akshara eva cha"],te:["పూతాత్మా పరమాత్మా చ ముక్తానాం పరమా గతిః |","అవ్యయః పురుషః సాక్షీ క్షేత్రజ్ఞోఽక్షర ఏవ చ ||"],tip:"Kshe-tra-gyo: ksh is k and sh said together. jn is usually said gya in chanting. cha is like the ch in chair."},
{sa:["योगो योगविदां नेता प्रधानपुरुषेश्वरः ।","नारसिंहवपुः श्रीमान् केशवः पुरुषोत्तमः ॥३॥"],pr:["Yo-go Yo-ga-vi-daam Ne-taa Pra-dhaa-na-pu-ru-shesh-va-rah","Naa-ra-sim-ha-va-puh Shree-maan Ke-sha-vah Pu-ru-shot-ta-mah"],en:["Yogo Yogavidam Neta Pradhana-Purusheshvarah","Narasimha-vapuh Shriman Keshavah Purushottamah"],te:["యోగో యోగవిదాం నేతా ప్రధానపురుషేశ్వరః |","నారసింహవపుః శ్రీమాన్ కేశవః పురుషోత్తమః ||"],tip:"Sim-ha: keep the h soft. Shree-maan has a long ee and a long aa. Ke-sha-vah ends with a light echo of a."},
{sa:["सर्वः शर्वः शिवः स्थाणुर्भूतादिर्निधिरव्ययः ।","सम्भवो भावनो भर्ता प्रभवः प्रभुरीश्वरः ॥४॥"],pr:["Sar-vah Shar-vah Shi-vah Sthaa-nur Bhoo-taa-dir Ni-dhir A-vya-yah","Sam-bha-vo Bhaa-va-no Bhar-taa Pra-bha-vah Pra-bhur Eesh-va-rah"],en:["Sarvah Sharvah Shivah Sthanur Bhootadir Nidhir Avyayah","Sambhavo Bhavano Bharta Prabhavah Prabhur Ishvarah"],te:["సర్వః శర్వః శివః స్థాణుర్భూతాదిర్నిధిరవ్యయః |","సంభవో భావనో భర్తా ప్రభవః ప్రభురీశ్వరః ||"],tip:"Sthaa-nur: s then a breathy t, then a long aa. Sar-vah and Shar-vah differ: s versus sh."},
{sa:["स्वयम्भूः शम्भुरादित्यः पुष्कराक्षो महास्वनः ।","अनादिनिधनो धाता विधाता धातुरुत्तमः ॥५॥"],pr:["Sva-yam-bhooh Sham-bhur Aa-di-tyah Push-ka-raak-sho Ma-haa-sva-nah","A-naa-di-ni-dha-no Dhaa-taa Vi-dhaa-taa Dhaa-tu-rut-ta-mah"],en:["Svayambhooh Shambhur Adityah Pushkaraksho Mahasvanah","Anadi-nidhano Dhata Vidhata Dhaturuttamah"],te:["స్వయంభూః శంభురాదిత్యః పుష్కరాక్షో మహాస్వనః |","అనాదినిధనో ధాతా విధాతా ధాతురుత్తమః ||"],tip:"Push-ka-raak-sho: ksh again, then a long o. Dhaa is a breathy d. Aa-di-tyah: the ty is quick."},
{n:61,sa:["सुधन्वा खंडपरशुर् दारुणो द्रविणप्रदः ।","दिवस्पृक् सर्वदृग् व्यासो वाचस्पतिरयोनिजः ॥६१॥"],pr:["Su-dhan-vaa Khan-da-pa-ra-shur Daa-ru-no Dra-vi-na-pra-dah","Di-vas-prik Sar-va-drig Vyaa-so Vaa-chas-pa-ti-ra-yo-ni-jah"],en:["Sudhanva Khandaparashur Daruno Dravinapradah","Divasprik Sarvadrig Vyaso Vachaspatir Ayonijah"],te:["సుధన్వా ఖండపరశుర్ దారుణో ద్రవిణప్రదః |","దివస్పృక్ సర్వదృగ్ వ్యాసో వాచస్పతిరయోనిజః ||"],tip:"Dra-vi-na: the r is a light tap. Vyaa-so: vy is said together, like vya. Vaa-chas-pa-ti: ch like the ch in chair."},
{n:62,sa:["त्रिसामा सामगस् साम निर्वाणं भेषजं भिषक् ।","संन्यासकृच् छमश् शांतो निष्ठा शांतिः परायणम् ॥६२॥"],pr:["Tri-saa-maa Saa-ma-gas Saa-ma Nir-vaa-nam Bhe-sha-jam Bhi-shak","San-nyaa-sa-krich Chha-mash Shaan-to Nish-thaa Shaan-tih Pa-raa-ya-nam"],en:["Trisama Samagas Sama Nirvanam Bheshajam Bhishak","Sannyasakrich Chhamash Shanto Nishtha Shantih Parayanam"],te:["త్రిసామా సామగస్ సామ నిర్వాణం భేషజం భిషక్ |","సంన్యాసకృచ్ ఛమశ్ శాంతో నిష్ఠా శాంతిః పరాయణమ్ ||"],tip:"San-nyaa-sa: the n is said twice (san-nya). Chha is ch with a puff of air. Shaan-tih: sh like ship, with a long aa."},
{n:63,sa:["शुभांगश् शांतिदस् स्रष्टा कुमुदः कुवलेशयः ।","गोहितो गोपतिर् गोप्ता वृषभाक्षो वृषप्रियः ॥६३॥"],pr:["Shu-bhaan-gash Shaan-ti-das Srash-taa Ku-mu-dah Ku-va-le-sha-yah","Go-hi-to Go-pa-tir Gop-taa Vri-sha-bhaak-sho Vri-sha-pri-yah"],en:["Shubhangash Shantidas Srashta Kumudah Kuvaleshayah","Gohito Gopatir Gopta Vrishabhaksho Vrishapriyah"],te:["శుభాంగశ్ శాంతిదస్ స్రష్టా కుముదః కువలేశయః |","గోహితో గోపతిర్ గోప్తా వృషభాక్షో వృషప్రియః ||"],tip:"Srash-taa: s and r run together, then sh. Vri-sha-bhaak-sho: bh is a breathy b, ksh is k and sh together. Shu-bhaan-gash ends with sh, not s."},
{n:64,sa:["अनिवर्ती निवृत्तात्मा संक्षेप्ता क्षेमकृच्छिवः ।","श्रीवत्सवक्षाः श्रीवासः श्रीपतिः श्रीमतां वरः ॥६४॥"],pr:["A-ni-var-tee Ni-vrit-taat-maa San-kshep-taa Kshe-ma-krich-chhi-vah","Shree-vat-sa-vak-shaah Shree-vaa-sah Shree-pa-tih Shree-ma-taam Va-rah"],en:["Anivarti Nivrittatma Sankshepta Kshemakrichchhivah","Shrivatsavakshah Shrivasah Shripatih Shrimatam Varah"],te:["అనివర్తీ నివృత్తాత్మా సంక్షేప్తా క్షేమకృచ్ఛివః |","శ్రీవత్సవక్షాః శ్రీవాసః శ్రీపతిః శ్రీమతాం వరః ||"],tip:"San-kshep-taa: ksh is k and sh said together. The Shree lines hold a long ee. chh is ch with a puff of air."},
{n:65,sa:["श्रीदः श्रीशः श्रीनिवासः श्रीनिधिः श्रीविभावनः ।","श्रीधरः श्रीकरः श्रेयः श्रीमाँल्लोकत्रयाश्रयः ॥६५॥"],pr:["Shree-dah Shree-shah Shree-ni-vaa-sah Shree-ni-dhih Shree-vi-bhaa-va-nah","Shree-dha-rah Shree-ka-rah Shre-yah Shree-maan Lo-ka-tra-yaa-shra-yah"],en:["Shridah Shrishah Shrinivasah Shrinidhih Shrivibhavanah","Shridharah Shrikarah Shreyah Shrimaan Lokatrayashrayah"],te:["శ్రీదః శ్రీశః శ్రీనివాసః శ్రీనిధిః శ్రీవిభావనః |","శ్రీధరః శ్రీకరః శ్రేయః శ్రీమాఁల్లోకత్రయాశ్రయః ||"],tip:"Many names here begin with Shree, each time with a long ee. Shre-yah is short, not Shree-yah."},
{n:66,sa:["स्वक्षः स्वङ्गः शतानन्दो नन्दिर्ज्योतिर्गणेश्वरः ।","विजितात्मा विधेयात्मा सत्कीर्तिश्छिन्नसंशयः ॥६६॥"],pr:["Svak-shah Svan-gah Sha-taa-nan-do Nan-dir Jyo-tir Ga-ne-shva-rah","Vi-ji-taat-maa Vi-dhe-yaat-maa Sat-keer-tish Chhin-na-sam-sha-yah"],en:["Svakshah Svangah Shatanando Nandir Jyotir Ganeshvarah","Vijitatma Vidheyatma Satkirtish Chhinnasamshayah"],te:["స్వక్షః స్వఙ్గః శతానన్దో నన్దిర్జ్యోతిర్గణేశ్వరః |","విజితాత్మా విధేయాత్మా సత్కీర్తిశ్ఛిన్నసంశయః ||"],tip:"Jyo-tir: jy said together in one breath, like jyo. Chhin-na: ch with a puff of air, then a held n."},
{n:67,sa:["उदीर्णः सर्वतश्चक्षुरनीशः शाश्वतस्थिरः ।","भूशयो भूषणो भूतिर्विशोकः शोकनाशनः ॥६७॥"],pr:["U-deer-nah Sar-va-tash Chak-shu-ra-nee-shah Shaash-va-ta-sthi-rah","Bhoo-sha-yo Bhoo-sha-no Bhoo-tir Vi-sho-kah Sho-ka-naa-sha-nah"],en:["Udirnah Sarvatash Chakshuranishah Shashvatasthirah","Bhushayo Bhushano Bhutir Vishokah Shokanashanah"],te:["ఉదీర్ణః సర్వతశ్చక్షురనీశః శాశ్వతస్థిరః |","భూశయో భూషణో భూతిర్విశోకః శోకనాశనః ||"],tip:"Chak-shu-ra-nee-shah is chakshu (eye) joined with anishah. The Bhoo names are a breathy b with a long oo."},
{n:68,sa:["अर्चिष्मानर्चितः कुम्भो विशुद्धात्मा विशोधनः ।","अनिरुद्धोऽप्रतिरथः प्रद्युम्नोऽमितविक्रमः ॥६८॥"],pr:["Ar-chish-maan Ar-chi-tah Kum-bho Vi-shud-dhaat-maa Vi-sho-dha-nah","A-ni-rud-dho A-pra-ti-ra-thah Pra-dyum-no A-mi-ta-vik-ra-mah"],en:["Archishman Architah Kumbho Vishuddhatma Vishodhanah","Aniruddho Apratirathah Pradyumno Amitavikramah"],te:["అర్చిష్మానర్చితః కుమ్భో విశుద్ధాత్మా విశోధనః |","అనిరుద్ధోఽప్రతిరథః ప్రద్యుమ్నోఽమితవిక్రమః ||"],tip:"dd in Shud-dhaat-maa and Rud-dho is a breathy d held a moment. Pra-dyum-no: dy said together."},
{n:69,sa:["कालनेमिनिहा वीरः शौरिः शूरजनेश्वरः ।","त्रिलोकात्मा त्रिलोकेशः केशवः केशिहा हरिः ॥६९॥"],pr:["Kaa-la-ne-mi-ni-haa Vee-rah Shau-rih Shoo-ra-ja-ne-shva-rah","Tri-lo-kaat-maa Tri-lo-ke-shah Ke-sha-vah Ke-shi-haa Ha-rih"],en:["Kalaneminiha Virah Shaurih Shurajaneshvarah","Trilokatma Trilokeshah Keshavah Keshiha Harih"],te:["కాలనేమినిహా వీరః శౌరిః శూరజనేశ్వరః |","త్రిలోకాత్మా త్రిలోకేశః కేశవః కేశిహా హరిః ||"],tip:"Shau-rih: sh then an ow sound, like shout without the t. Tri-lo-kaat-maa: tri said quickly as one beat."},
{n:70,sa:["कामदेवः कामपालः कामी कान्तः कृतागमः ।","अनिर्देश्यवपुर्विष्णुर्वीरोऽनन्तो धनञ्जयः ॥७०॥"],pr:["Kaa-ma-de-vah Kaa-ma-paa-lah Kaa-mee Kaan-tah Kri-taa-ga-mah","A-nir-de-shya-va-pur Vish-nur Vee-ro A-nan-to Dha-nan-ja-yah"],en:["Kamadevah Kamapalah Kami Kantah Kritagamah","Anirdeshyavapur Vishnur Viro Ananto Dhananjayah"],te:["కామదేవః కామపాలః కామీ కాన్తః కృతాగమః |","అనిర్దేశ్యవపుర్విష్ణుర్వీరోఽనన్తో ధనఞ్జయః ||"],tip:"Kri-taa-ga-mah: kri is a short tap, not kree. Dha-nan-ja-yah: j as in jam."},
{n:71,sa:["ब्रह्मण्यो ब्रह्मकृद् ब्रह्मा ब्रह्म ब्रह्मविवर्धनः ।","ब्रह्मविद् ब्राह्मणो ब्रह्मी ब्रह्मज्ञो ब्राह्मणप्रियः ॥७१॥"],pr:["Brah-man-yo Brah-ma-krid Brah-maa Brah-ma Brah-ma-vi-var-dha-nah","Brah-ma-vid Braah-ma-no Brah-mee Brah-ma-jno Braah-ma-na-pri-yah"],en:["Brahmanyo Brahmakrid Brahma Brahma Brahmavivardhanah","Brahmavid Brahmano Brahmi Brahmajno Brahmanapriyah"],te:["బ్రహ్మణ్యో బ్రహ్మకృద్ బ్రహ్మా బ్రహ్మ బ్రహ్మవివర్ధనః |","బ్రహ్మవిద్ బ్రాహ్మణో బ్రహ్మీ బ్రహ్మజ్ఞో బ్రాహ్మణప్రియః ||"],tip:"Brah is one syllable: b, r and h blended together. jno is usually chanted as gyo."},
{n:72,sa:["महाक्रमो महाकर्मा महातेजा महोरगः ।","महाक्रतुर्महायज्वा महायज्ञो महाहविः ॥७२॥"],pr:["Ma-haa-kra-mo Ma-haa-kar-maa Ma-haa-te-jaa Ma-ho-ra-gah","Ma-haa-kra-tur Ma-haa-yaj-vaa Ma-haa-yaj-no Ma-haa-ha-vih"],en:["Mahakramo Mahakarma Mahateja Mahoragah","Mahakratur Mahayajva Mahayajno Mahahavih"],te:["మహాక్రమో మహాకర్మా మహాతేజా మహోరగః |","మహాక్రతుర్మహాయజ్వా మహాయజ్ఞో మహాహవిః ||"],tip:"Every name here starts with Ma-haa, meaning great, held with a long aa."},
{n:73,sa:["स्तव्यः स्तवप्रियः स्तोत्रं स्तुतिः स्तोता रणप्रियः ।","पूर्णः पूरयिता पुण्यः पुण्यकीर्तिरनामयः ॥७३॥"],pr:["Stav-yah Sta-va-pri-yah Sto-tram Stu-tih Sto-taa Ra-na-pri-yah","Poor-nah Poo-ra-yi-taa Pun-yah Pun-ya-keer-tir A-naa-ma-yah"],en:["Stavyah Stavapriyah Stotram Stutih Stota Ranapriyah","Purnah Purayita Punyah Punyakirtir Anamayah"],te:["స్తవ్యః స్తవప్రియః స్తోత్రం స్తుతిః స్తోతా రణప్రియః |","పూర్ణః పూరయితా పుణ్యః పుణ్యకీర్తిరనామయః ||"],tip:"St is said together at the start, like st in stop. Poor-nah holds a long oo."},
{n:74,sa:["मनोजवस्तीर्थकरो वसुरेता वसुप्रदः ।","वसुप्रदो वासुदेवो वसुर्वसुमना हविः ॥७४॥"],pr:["Ma-no-ja-vas Teer-tha-ka-ro Va-su-re-taa Va-su-pra-dah","Va-su-pra-do Vaa-su-de-vo Va-sur Va-su-ma-naa Ha-vih"],en:["Manojavas Tirthakaro Vasureta Vasupradah","Vasuprado Vasudevo Vasur Vasumana Havih"],te:["మనోజవస్తీర్థకరో వసురేతా వసుప్రదః |","వసుప్రదో వాసుదేవో వసుర్వసుమనా హవిః ||"],tip:"Teer-tha-ka-ro: th is t with a puff of air. Vaa-su-de-vo has its long aa only in the first syllable."},
{n:75,sa:["सद्गतिः सत्कृतिः सत्ता सद्भूतिः सत्परायणः ।","शूरसेनो यदुश्रेष्ठः सन्निवासः सुयामुनः ॥७५॥"],pr:["Sad-ga-tih Sat-kri-tih Sat-taa Sad-bhoo-tih Sat-pa-raa-ya-nah","Shoo-ra-se-no Ya-du-shresh-thah San-ni-vaa-sah Su-yaa-mu-nah"],en:["Sadgatih Satkritih Satta Sadbhutih Satparayanah","Shuraseno Yadushreshthah Sannivasah Suyamunah"],te:["సద్గతిః సత్కృతిః సత్తా సద్భూతిః సత్పరాయణః |","శూరసేనో యదుశ్రేష్ఠః సన్నివాసః సుయామునః ||"],tip:"Shresh-thah: sh then t with a puff of air. San-ni-vaa-sah holds the n twice."},
{n:76,sa:["भूतावासो वासुदेवः सर्वासुनिलयोऽनलः ।","दर्पहा दर्पदो दृप्तो दुर्धरोऽथापराजितः ॥७६॥"],pr:["Bhoo-taa-vaa-so Vaa-su-de-vah Sar-vaa-su-ni-la-yo A-na-lah","Dar-pa-haa Dar-pa-do Drip-to Dur-dha-ro A-thaa-pa-raa-ji-tah"],en:["Bhutavaso Vasudevah Sarvasunilayo Analah","Darpaha Darpado Dripto Durdharo Athaparajitah"],te:["భూతావాసో వాసుదేవః సర్వాసునిలయోఽనలః |","దర్పహా దర్పదో దృప్తో దుర్ధరోఽథాపరాజితః ||"],tip:"Drip-to: dr is a soft blend, then a short i. A-thaa-pa-raa-ji-tah is a-thaa joined with parajitah."},
{n:77,sa:["विश्वमूर्तिर्महामूर्तिर्दीप्तमूर्तिरमूर्तिमान् ।","अनेकमूर्तिरव्यक्तः शतमूर्तिः शताननः ॥७७॥"],pr:["Vish-va-moor-tir Ma-haa-moor-tir Deep-ta-moor-tir A-moor-ti-maan","A-ne-ka-moor-tir A-vyak-tah Sha-ta-moor-tih Sha-taa-na-nah"],en:["Vishvamurtir Mahamurtir Diptamurtir Amurtiman","Anekamurtir Avyaktah Shatamurtih Shatananah"],te:["విశ్వమూర్తిర్మహామూర్తిర్దీప్తమూర్తిరమూర్తిమాన్ |","అనేకమూర్తిరవ్యక్తః శతమూర్తిః శతాననః ||"],tip:"Moor-tir repeats through this verse: a long oo, then a light tir. Deep-ta holds only a short e."},
{n:78,sa:["एको नैकः सवः कः किं यत्तत्पदमनुत्तमम् ।","लोकबन्धुर्लोकनाथो माधवो भक्तवत्सलः ॥७८॥"],pr:["E-ko Nai-kah Sa-vah Kah Kim Yat-tat-pa-da-ma-nut-ta-mam","Lo-ka-ban-dhur Lo-ka-naa-tho Maa-dha-vo Bhak-ta-vat-sa-lah"],en:["Eko Naikah Savah Kah Kim Yattatpadamanuttamam","Lokabandhur Lokanatho Madhavo Bhaktavatsalah"],te:["ఏకో నైకః సవః కః కిం యత్తత్పదమనుత్తమమ్ |","లోకబన్ధుర్లోకనాథో మాధవో భక్తవత్సలః ||"],tip:"Nai-kah: ai is one long sound, like eye. Bhak-ta-vat-sa-lah: bh is a breathy b."},
{n:79,sa:["सुवर्णवर्णो हेमाङ्गो वराङ्गश्चन्दनाङ्गदी ।","वीरहा विषमः शून्यो घृताशीरचलश्चलः ॥७९॥"],pr:["Su-var-na-var-no He-maan-go Va-raan-gash Chan-da-naan-ga-dee","Vee-ra-haa Vi-sha-mah Shoon-yo Ghri-taa-sheer A-cha-lash Cha-lah"],en:["Suvarnavarno Hemango Varangash Chandanangadi","Viraha Vishamah Shunyo Ghritashir Achalash Chalah"],te:["సువర్ణవర్ణో హేమాఙ్గో వరాఙ్గశ్చన్దనాఙ్గదీ |","వీరహా విషమః శూన్యో ఘృతాశీరచలశ్చలః ||"],tip:"He-maan-go holds a long aa in the middle. Ghri-taa-sheer: gh is g with a puff of air."},
{n:80,sa:["अमानी मानदो मान्यो लोकस्वामी त्रिलोकधृक् ।","सुमेधा मेधजो धन्यः सत्यमेधा धराधरः ॥८०॥"],pr:["A-maa-nee Maa-na-do Maan-yo Lo-ka-svaa-mee Tri-lo-ka-dhrik","Su-me-dhaa Me-dha-jo Dhan-yah Sat-ya-me-dhaa Dha-raa-dha-rah"],en:["Amani Manado Manyo Lokasvami Trilokadhrik","Sumedha Medhajo Dhanyah Satyamedha Dharadharah"],te:["అమానీ మానదో మాన్యో లోకస్వామీ త్రిలోకధృక్ |","సుమేధా మేధజో ధన్యః సత్యమేధా ధరాధరః ||"],tip:"Dhrik ends in a light tap of r plus k, no vowel after. Dha-raa-dha-rah repeats a breathy dh twice."},
{n:81,sa:["तेजोवृषो द्युतिधरः सर्वशस्त्रभृतां वरः ।","प्रग्रहो निग्रहो व्यग्रो नैकशृङ्गो गदाग्रजः ॥८१॥"],pr:["Te-jo-vri-sho Dyu-ti-dha-rah Sar-va-shas-tra-bhri-taam Va-rah","Pra-gra-ho Ni-gra-ho Vyag-ro Nai-ka-shrin-go Ga-daa-gra-jah"],en:["Tejovrisho Dyutidharah Sarvashastrabhritam Varah","Pragraho Nigraho Vyagro Naikashringo Gadagrajah"],te:["తేజోవృషో ద్యుతిధరః సర్వశస్త్రభృతాం వరః |","ప్రగ్రహో నిగ్రహో వ్యగ్రో నైకశృఙ్గో గదాగ్రజః ||"],tip:"Dyu-ti-dha-rah: dy said together, like dyu in one go. Shrin-go blends shr, then a nasal before g."},
{n:82,sa:["चतुर्मूर्तिश्चतुर्बाहुश्चतुर्व्यूहश्चतुर्गतिः ।","चतुरात्मा चतुर्भावश्चतुर्वेदविदेकपात् ॥८२॥"],pr:["Cha-tur-moor-tish Cha-tur-baa-hush Cha-tur-vyoo-hash Cha-tur-ga-tih","Cha-tu-raat-maa Cha-tur-bhaa-vash Cha-tur-ve-da-vi-de-ka-paat"],en:["Chaturmurtish Chaturbahush Chaturvyuhash Chaturgatih","Chaturatma Chaturbhavash Chaturvedavidekapat"],te:["చతుర్మూర్తిశ్చతుర్బాహుశ్చతుర్వ్యూహశ్చతుర్గతిః |","చతురాత్మా చతుర్భావశ్చతుర్వేదవిదేకపాత్ ||"],tip:"Chatur, meaning four, repeats through this verse. Vyoo-hash: vy said together, then a long oo."},
{n:83,sa:["समावर्तोऽनिवृत्तात्मा दुर्जयो दुरतिक्रमः ।","दुर्लभो दुर्गमो दुर्गो दुरावासो दुरारिहा ॥८३॥"],pr:["Sa-maa-var-to A-ni-vrit-taat-maa Dur-ja-yo Du-ra-ti-kra-mah","Dur-la-bho Dur-ga-mo Dur-go Du-raa-vaa-so Du-raa-ri-haa"],en:["Samavarto Anivrittatma Durjayo Duratikramah","Durlabho Durgamo Durgo Duravaso Durariha"],te:["సమావర్తోఽనివృత్తాత్మా దుర్జయో దురతిక్రమః |","దుర్లభో దుర్గమో దుర్గో దురావాసో దురారిహా ||"],tip:"Dur, meaning hard to, repeats through this verse, said with a light tap of r."},

var T={
why:{en:"Vishnu Sahasranamam is the thousand names of Lord Vishnu, taught by Bhishma to Yudhishthira in the Mahabharata. Each name describes a quality of the Lord. Chanting or listening to it daily is traditionally said to bring peace, strength, freedom from fear, and wellbeing.",
te:"విష్ణు సహస్రనామం మహాభారతంలో భీష్ముడు ధర్మరాజుకు ఉపదేశించిన విష్ణువు యొక్క వెయ్యి నామాలు. ప్రతి నామం భగవంతుని ఒక గుణాన్ని తెలియజేస్తుంది. ప్రతిరోజూ పఠించడం లేదా వినడం వల్ల శాంతి, బలం, భయం నుండి విముక్తి, శ్రేయస్సు కలుగుతాయని సంప్రదాయం చెబుతుంది.",
hi:"विष्णु सहस्रनाम महाभारत में भीष्म द्वारा युधिष्ठिर को बताए गए भगवान विष्णु के एक हज़ार नाम हैं। हर नाम प्रभु के एक गुण को बताता है। रोज़ पाठ करने या सुनने से शांति, बल, भय से मुक्ति और कल्याण मिलता है, ऐसी परंपरागत मान्यता है।"},
whyT:{en:"Why chant it?",te:"ఎందుకు పఠించాలి?",hi:"क्यों पाठ करें?"},
gen:{en:"The closing verses of the stotram say that whoever hears or recites it with faith meets no harm and is freed from fear, finds strength and brightness, the sick are freed from illness, the troubled from trouble, and the sorrowful from sorrow. This is a traditional belief, not medical advice.",
te:"స్తోత్రం చివరి శ్లోకాలు (ఫలశ్రుతి) ఇలా చెబుతాయి: భక్తితో వినేవారికి లేదా పఠించేవారికి అశుభం కలగదు, భయం తొలగుతుంది, బలం, తేజస్సు కలుగుతాయి; రోగులు రోగం నుండి, ఆపదలో ఉన్నవారు ఆపద నుండి విముక్తులవుతారు. ఇది సంప్రదాయ విశ్వాసం, వైద్య సలహా కాదు.",
hi:"स्तोत्र के अंतिम श्लोक (फलश्रुति) कहते हैं कि श्रद्धा से सुनने या पाठ करने वाले को अशुभ नहीं मिलता, भय दूर होता है, बल और तेज मिलता है, रोगी रोग से और संकट में पड़े संकट से मुक्त होते हैं। यह परंपरागत मान्यता है, चिकित्सा सलाह नहीं।"},
none:{en:"No special purpose is listed for this verse in the Visvas booklet. The general benefits below apply.",te:"ఈ శ్లోకానికి విశ్వాస్ పుస్తకంలో ప్రత్యేక ప్రయోజనం ఇవ్వబడలేదు. కింది సాధారణ ఫలాలు వర్తిస్తాయి.",hi:"विश्वास पुस्तिका में इस श्लोक का कोई विशेष प्रयोजन नहीं दिया गया है। नीचे दिए सामान्य फल लागू होते हैं।"},
soon:{en:"Meaning for this verse is coming soon.",te:"ఈ శ్లోకం యొక్క అర్థం త్వరలో చేర్చబడుతుంది.",hi:"इस श्लोक का अर्थ जल्द जोड़ा जाएगा।"},
draft:{en:"Draft meanings. Please check with a guru before relying on them.",te:"ఇవి ముసాయిదా అర్థాలు. ఆధారపడే ముందు గురువుతో సరిచూసుకోండి.",hi:"ये प्रारूप अर्थ हैं। भरोसा करने से पहले गुरु से जाँच लें।"}

var M={
61:{w:[["सुधन्वा","Su-dhan-vaa","One with the excellent bow (Sharnga)","మంచి ధనుస్సు (శార్ఙ్గం) కలవాడు","उत्तम धनुष (शार्ङ्ग) वाले"],
["खंडपरशुः","Khan-da-pa-ra-shuh","Wielder of the cutting axe","ఖండించే గొడ్డలిని ధరించినవాడు","खंडन करने वाला परशु धारण करने वाले"],
["दारुणः","Daa-ru-nah","Stern toward the wicked","దుష్టులకు కఠినుడు","दुष्टों के लिए कठोर"],
["द्रविणप्रदः","Dra-vi-na-pra-dah","Giver of wealth","సంపదను ఇచ్చువాడు","धन देने वाले"],
["दिवस्पृक्","Di-vas-prik","One who touches the heavens","ఆకాశాన్ని (స్వర్గాన్ని) స్పృశించువాడు","आकाश को छूने वाले"],
["सर्वदृक्","Sar-va-drik","The all-seeing","సర్వము చూచువాడు","सब कुछ देखने वाले"],
["व्यासः","Vyaa-sah","Vyasa, who arranged the Vedas","వేదాలను విభజించిన వ్యాసుడు","वेदों का विभाजन करने वाले व्यास"],
["वाचस्पतिः","Vaa-chas-pa-tih","Lord of speech","వాక్కుకు అధిపతి","वाणी के स्वामी"],
["अयोनिजः","A-yo-ni-jah","Not born from a womb","గర్భం నుండి జన్మించనివాడు","योनि से जन्म न लेने वाले"]],
v:["The Lord with the excellent bow and the cutting axe, stern toward evil, giver of wealth. He touches the heavens, sees everything, divided the Vedas as Vyasa, is lord of speech, and is not born from a womb.","మంచి ధనుస్సు, ఖండించే గొడ్డలి కలవాడు; దుష్టులకు కఠినుడు; సంపదనిచ్చువాడు. ఆకాశాన్ని తాకువాడు, సర్వము చూచువాడు, వ్యాసునిగా వేదాలను విభజించినవాడు, వాక్కుకు అధిపతి, గర్భజన్మ లేనివాడు.","उत्तम धनुष और खंडन करने वाला परशु धारण करने वाले, दुष्टों के लिए कठोर, धन देने वाले। वे आकाश को छूते हैं, सब कुछ देखते हैं, व्यास रूप में वेदों का विभाजन किया, वाणी के स्वामी हैं और योनि से जन्म नहीं लेते।"]},
62:{w:[["त्रिसामा","Tri-saa-maa","Praised by the three Sama chants","మూడు సామాలతో స్తుతింపబడువాడు","तीन सामों से स्तुत"],
["सामगः","Saa-ma-gah","The singer of Sama","సామగానం చేయువాడు","सामगान करने वाले"],
["साम","Saa-ma","The Sama Veda itself","సామవేద స్వరూపుడు","सामवेद स्वरूप"],
["निर्वाणम्","Nir-vaa-nam","Liberation, final peace","నిర్వాణం (మోక్షం)","निर्वाण (मोक्ष)"],
["भेषजम्","Bhe-sha-jam","The medicine for worldly suffering","సంసార బాధకు ఔషధం","संसार के कष्ट की औषधि"],
["भिषक्","Bhi-shak","The physician","వైద్యుడు","वैद्य"],
["संन्यासकृत्","San-nyaa-sa-krit","Who set up the path of renunciation","సన్యాసాశ్రమాన్ని నిర్దేశించినవాడు","संन्यास के प्रवर्तक"],
["शमः","Sha-mah","Who gives calm to the mind","మనశ్శాంతిని ఇచ్చువాడు","मन को शांति देने वाले"],
["शान्तः","Shaan-tah","The peaceful one","శాంతస్వరూపుడు","शांत"],
["निष्ठा","Nish-thaa","The final resting place of all","అందరికీ అంతిమ ఆధారం","सबका अंतिम आधार"],
["शान्तिः","Shaan-tih","Peace itself","శాంతి స్వరూపం","शांति स्वरूप"],
["परायणम्","Pa-raa-ya-nam","The highest refuge","పరమాశ్రయం","परम आश्रय"]],
v:["He is praised in the three Samas, sings Sama and is Sama itself; he is liberation, the medicine and the physician. He set up the path of renunciation, gives calm, is peaceful, is the final resting place, peace itself and the highest refuge.","మూడు సామాలతో స్తుతింపబడువాడు, సామగానం చేయువాడు, సామవేద స్వరూపుడు; మోక్షం, ఔషధం, వైద్యుడు. సన్యాసాశ్రమాన్ని నిర్దేశించినవాడు, శాంతిని ఇచ్చువాడు, శాంతస్వరూపుడు, అందరికీ అంతిమ ఆధారం, శాంతి స్వరూపం, పరమాశ్రయం.","तीन सामों से स्तुत, सामगान करने वाले और सामवेद स्वरूप; वे मोक्ष, औषधि और वैद्य हैं। संन्यास के प्रवर्तक, शांति देने वाले, शांत, सबके अंतिम आधार, शांति स्वरूप और परम आश्रय हैं।"]},
63:{w:[["शुभांगः","Shu-bhaan-gah","Of beautiful form","సుందర రూపుడు","सुंदर अंगों वाले"],
["शान्तिदः","Shaan-ti-dah","Giver of peace","శాంతిని ఇచ్చువాడు","शांति देने वाले"],
["स्रष्टा","Srash-taa","The Creator","సృష్టికర్త","सृष्टिकर्ता"],
["कुमुदः","Ku-mu-dah","Who rejoices on the earth","భూమిపై ఆనందించువాడు","पृथ्वी पर आनंद करने वाले"],
["कुवलेशयः","Ku-va-le-sha-yah","Who rests on the waters","నీటిపై శయనించువాడు","जल पर शयन करने वाले"],
["गोहितः","Go-hi-tah","Friend of the cows and all beings","గోవులకు, జీవులకు హితుడు","गायों का हित करने वाले"],
["गोपतिः","Go-pa-tih","Lord of the cows","గోవులకు అధిపతి","गायों के स्वामी"],
["गोप्ता","Gop-taa","The protector","రక్షకుడు","रक्षक"],
["वृषभाक्षः","Vri-sha-bhaak-shah","Whose gaze showers blessings","కోరికలను వర్షించు చూపు కలవాడు","इच्छाओं की वर्षा करने वाली दृष्टि वाले"],
["वृषप्रियः","Vri-sha-pri-yah","Lover of dharma","ధర్మాన్ని ప్రేమించువాడు","धर्म से प्रेम करने वाले"]],
v:["Of beautiful form, giver of peace, the Creator. He rejoices on earth and rests on the waters, is friend, lord and protector of cows, his gaze showers blessings, and he loves dharma.","సుందర రూపుడు, శాంతిని ఇచ్చువాడు, సృష్టికర్త. భూమిపై ఆనందించువాడు, నీటిపై శయనించువాడు, గోవులకు హితుడు, అధిపతి, రక్షకుడు; ఆయన చూపు కోరికలను వర్షిస్తుంది, ధర్మాన్ని ప్రేమించువాడు.","सुंदर रूप वाले, शांति देने वाले, सृष्टिकर्ता। वे पृथ्वी पर आनंद करते हैं और जल पर शयन करते हैं, गायों के हितैषी, स्वामी और रक्षक हैं, उनकी दृष्टि इच्छाओं की वर्षा करती है और वे धर्म से प्रेम करते हैं।"]}
};

T.ex={en:["Fear leaves: the stotram says the devoted reciter is not afraid anywhere.","Strength and radiance: it promises vigour, brightness, health and good qualities.","Relief in trouble: the sick are freed from illness, the distressed from distress, the sorrowful from sorrow.","A calm mind: devotees are said to stay free from anger, jealousy and greed."],
te:["భయం తొలగుతుంది: భక్తితో పఠించేవారికి ఎక్కడా భయం ఉండదని స్తోత్రం చెబుతుంది.","బలం, తేజస్సు: శక్తి, కాంతి, ఆరోగ్యం, సద్గుణాలు కలుగుతాయి.","కష్టంలో ఉపశమనం: రోగులు రోగం నుండి, ఆపదలో ఉన్నవారు ఆపద నుండి, దుఃఖంలో ఉన్నవారు దుఃఖం నుండి విముక్తులవుతారు.","ప్రశాంత మనస్సు: భక్తులకు కోపం, అసూయ, లోభం, చెడు ఆలోచనలు కలగవని చెబుతారు."],
hi:["भय दूर होता है: श्रद्धा से पाठ करने वाले को कहीं भय नहीं रहता।","बल और तेज: शक्ति, कांति, स्वास्थ्य और सद्गुण मिलते हैं।","कष्ट में राहत: रोगी रोग से, संकट में पड़े संकट से और दुखी दुख से मुक्त होते हैं।","शांत मन: भक्तों में क्रोध, ईर्ष्या, लोभ और बुरे विचार नहीं आते, ऐसा कहा गया है।"]};
T.cnt={en:"While learning: say each new verse 3 times a day, then revise older verses. Traditional practice: chant the full stotram once daily, and many take a resolution (sankalpa) for 48 days. Counts differ by family, so follow your guru.",
te:"నేర్చుకునేటప్పుడు: ప్రతి కొత్త శ్లోకాన్ని రోజుకు 3 సార్లు చెప్పండి, పాత శ్లోకాలను పునశ్చరణ చేయండి. సంప్రదాయం: రోజూ పూర్తి స్తోత్రాన్ని ఒకసారి పఠించడం; చాలామంది 48 రోజుల సంకల్పం చేస్తారు. కుటుంబ సంప్రదాయాన్ని బట్టి మారుతుంది, గురువును అనుసరించండి.",
hi:"सीखते समय: हर नया श्लोक दिन में 3 बार बोलें, फिर पुराने श्लोकों का दोहराव करें। परंपरा: रोज़ पूरा स्तोत्र एक बार पढ़ना; कई लोग 48 दिन का संकल्प लेते हैं। परिवार के अनुसार भिन्न होता है, गुरु का अनुसरण करें।"};

M[61].v=["God holds a fine bow and a sharp axe. He is firm with those who do wrong and gives wealth to those who need it. He sees everything, gave us the Vedas as Vyasa, is the master of speech, and was never born from a mother's womb.","భగవంతుడు మంచి విల్లు, పదునైన గొడ్డలి ధరించాడు. తప్పు చేసేవారిపై కఠినంగా ఉంటాడు, అవసరమైనవారికి సంపద ఇస్తాడు. అన్నీ చూస్తాడు, వ్యాసునిగా వేదాలను మనకు అందించాడు, మాటకు అధిపతి, తల్లి గర్భం నుండి పుట్టనివాడు.","भगवान के पास उत्तम धनुष और तेज़ परशु है। वे गलत करने वालों के लिए कठोर हैं और ज़रूरतमंदों को धन देते हैं। वे सब कुछ देखते हैं, व्यास रूप में उन्होंने वेद दिए, वे वाणी के स्वामी हैं और माँ के गर्भ से जन्म नहीं लेते।"];
M[62].v=["He is the one the three Sama chants praise. He is peace and freedom from all suffering. Like a doctor with the right medicine, he heals the pain of life. He gives calm to the mind, and in him everyone finally finds rest.","మూడు సామాలు ఆయనను స్తుతిస్తాయి. ఆయన శాంతి, అన్ని బాధల నుండి విముక్తి. సరైన మందు ఇచ్చే వైద్యుని వలె జీవితపు బాధను తగ్గిస్తాడు. మనసుకు ప్రశాంతతనిస్తాడు, చివరికి అందరూ ఆయనలోనే విశ్రాంతి పొందుతారు.","तीन साम उन्हीं की स्तुति करते हैं। वे शांति और हर दुख से मुक्ति हैं। सही दवा देने वाले वैद्य की तरह वे जीवन का कष्ट दूर करते हैं। वे मन को शांति देते हैं और अंत में सब उन्हीं में विश्राम पाते हैं।"];
M[63].v=["He is beautiful and gives peace. He created everything and looks after cows and all living beings. His kind eyes grant what is good for us, and he loves dharma, the right way to live.","ఆయన సుందరుడు, శాంతిని ఇచ్చేవాడు. అన్నింటినీ సృష్టించి, గోవులను, సమస్త జీవులను కాపాడతాడు. ఆయన కరుణ చూపు మనకు మేలు కలిగిస్తుంది, ధర్మమంటే ఆయనకు ప్రేమ.","वे सुंदर हैं और शांति देते हैं। उन्होंने सब कुछ रचा और वे गायों तथा सब प्राणियों की रक्षा करते हैं। उनकी करुणा भरी दृष्टि हमें मंगल देती है और उन्हें धर्म प्रिय है।"];

function dstr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

function addDay(){if(S.days.indexOf(tdy())<0){S.days.push(tdy())}sv()}

function streak(){var n=0,d=new Date();if(S.days.indexOf(dstr(d))<0)d.setDate(d.getDate()-1);while(S.days.indexOf(dstr(d))>=0){n++;d.setDate(d.getDate()-1)}return n}

function vIdx(n){for(var i=0;i<V.length;i++)if(V[i].n===n)return i;return -1}
function dueVerses(){var td=tdy(),out=[];Object.keys(S.rev).forEach(function(k){if(S.rev[k].due<=td)out.push(+k)});out.sort(function(a,b){return a-b});return out}
function mkList(){var L=[],e=Math.min(S.pos+S.pace,V.length),seen={};
 dueVerses().forEach(function(n){var i=vIdx(n);if(i>=0){L.push({i:i,r:1,rt:'due'});seen[n]=1}});
 for(var j=S.pos;j<e;j++)if(!seen[V[j].n])L.push({i:j,r:0});
 return L}
function recapList(){return S.learned.slice().sort(function(a,b){return a-b}).map(function(n){return {i:vIdx(n),r:1,rt:'recap'}}).filter(function(x){return x.i>=0})}
function advanceRev(n){var r=S.rev[n];if(!r){S.rev[n]={stage:0,due:addDays(1)};return}
 var step=[1,3,7],d=new Date();
 if(r.stage>=step.length-1){delete S.rev[n]}
 else{r.stage++;r.due=addDays(step[r.stage])}}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return dstr(d)}
function lab(a,b){var n=[];for(var i=a;i<b;i++)n.push(V[i].n);return(n.length>1?'Verses ':'Verse ')+n.join(', ')}
function weekDots(){var d=new Date(),dow=(d.getDay()+6)%7,s='';d.setDate(d.getDate()-dow);var nm='MTWTFSS';
 for(var k=0;k<7;k++){var x=new Date(d);x.setDate(d.getDate()+k);s+='<span class="'+(S.days.indexOf(dstr(x))>=0?'on':'')+'">'+nm[k]+'</span>'}return s}
function chipsLang(){return '<div class="chips">'+[['en','English'],['te','తెలుగు'],['hi','हिन्दी']].map(function(x){return '<button class="chip" data-act="lang" data-v="'+x[0]+'" aria-pressed="'+(S.lang===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'}
function syl(s,mn){
 if(mn==='en')return s;
 var b=mn==='te'?0xC00:0x900,out='',cur='',pv=false;
 for(var i=0;i<s.length;i++){var o=s.charCodeAt(i)-b,ch=s[i];
  var cons=o>=0x15&&o<=0x39,ind=o>=0x05&&o<=0x14,mk=(o>=0x01&&o<=0x03)||(o>=0x3E&&o<=0x4C)||o===0x4D||o===0x3C;
  if(cons||ind){if(pv){cur+=ch}else{if(cur)out+=cur+'-';cur=ch}pv=false}
  else if(mk){cur+=ch;pv=(o===0x4D)}
  else{out+=cur+ch;cur='';pv=false}}
 return out+cur}
function eta(){var left=Math.max(0,TOTAL-S.learned.length);if(!left)return 'All done';var d=Math.ceil(left/S.pace),f=new Date();f.setDate(f.getDate()+d-1);return d+' days left at '+S.pace+' a day, finishing about '+f.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function lastGap(){if(!S.days.length)return -1;var l=0;S.days.forEach(function(s){var t=parseD(s).getTime();if(t>l)l=t});var t0=new Date();t0.setHours(0,0,0,0);return Math.round((t0.getTime()-l)/864e5)}
function bestStreak(){var a=S.days.map(function(s){return parseD(s).getTime()}).sort(function(x,y){return x-y}),b=0,c=0,p=null;a.forEach(function(t){if(p!==null&&Math.round((t-p)/864e5)===1)c++;else c=1;p=t;if(c>b)b=c});return b}
function monthDays(){var d=new Date(),n=0;S.days.forEach(function(s){var x=parseD(s);if(x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth())n++});return n}
function nudgeCard(){var g=lastGap(),n=S.learned.length;
 if(g>=2)return '<div class="welcome"><b>Welcome back \ud83d\ude4f</b><br>Missing a day is okay. '+(n?'Your '+n+' learned verses are safe. ':'')+'Your streak starts fresh today. One small practice is enough to begin again.</div>';
 if(g===1&&streak()>0)return '<div class="welcome keep"><b>\ud83d\udd25 '+streak()+'-day streak</b><br>Practise today to keep it going.</div>';
 return ''}

function stats(){var left=Math.max(0,TOTAL-S.learned.length),d=Math.ceil(left/S.pace),f=new Date();f.setDate(f.getDate()+d-1);

function paceChips(){var left=Math.max(0,TOTAL-S.learned.length);

ne ends with one, hold that half-beat a little longer so the line carries well.", "te": "ఇటాలిక్ అక్షరం తరువాత రెండు చుక్కలు ఉంటే అది హలంతు (అచ్చు లేని అక్షరం), అంటే అర్ధ మాత్ర. పంక్తి దానితో ముగిస్తే, లయ బాగుండేలా ఆ అర్ధ మాత్రను కొద్దిగా పొడిగించి పలకండి.", "hi": "इटैलिक अक्षर के बाद दो बिंदु हों तो वह हलंत (स्वर रहित) अक्षर है, यानी आधी मात्रा। यदि पंक्ति उसी पर समाप्त हो, तो लय बनाए रखने के लिए उस आधी मात्रा को थोड़ा खींचकर बोलें।"}}, {"ic": "ं", "t": {"en": "The dot on top (anusvara)", "te": "సున్నా (అనుస్వారం)", "hi": "अनुस्वार (ं)"}, "d": {"en": "It has no sound of its own and changes with the letter that follows: before k-group letters it sounds like ṅ, ch-group like ñ, ṭ-group like ṇ, t-group like n, p-group like m. Before ya to ha (except la) it is a soft m; before la it sounds like l.", "te": "సున్నాకు స్వంత ఉచ్చారణ లేదు; తరువాత వచ్చే అక్షరాన్ని బట్టి మారుతుంది: క-వర్గం ముందు “ఙ్”, చ-వర్గం ముందు “ఞ్”, ట-వర్గం ముందు “ణ్”, త-వర్గం ముందు “న్”, ప-వర్గం ముందు “మ్”. య నుండి హ వరకు (ల తప్ప) “మ్”; ల ముందు “ల్”.", "hi": "इसकी अपनी ध्वनि नहीं होती; आगे के अक्षर के अनुसार बदलती है: क-वर्ग से पहले “ङ्”, च-वर्ग से पहले “ञ्”, ट-वर्ग से पहले “ण्”, त-वर्ग से पहले “न्”, प-वर्ग से पहले “म्”। य से ह तक (ल को छोड़कर) “म्”; ल से पहले “ल्”।"}}, {"ic": "ः", "t": {"en": "The two dots (visarga)", "te": "విసర్గ", "hi": "विसर्ग"}, "d": {"en": "If the next word starts with a k-group letter (k, kh, g, gh), say the visarga as a short \"ha\" echo. If the next word starts with kṣa, say the visarga fully with no change (for example verse 41: udbhavaḥ kṣobhaṇaḥ).", "te": "తరువాతి పదం క-వర్గ అక్షరంతో మొదలైతే విసర్గను చిన్న “హ” ప్రతిధ్వనిగా పలకండి. క్ష తో మొదలైతే విసర్గను ఏ మార్పూ లేకుండా పూర్తిగా పలకండి (ఉదా: శ్లోకం 41 — ఉద్భవః క్షోభణః).", "hi": "अगला शब्द क-वर्ग के अक्षर से शुरू हो तो विसर्ग को छोटी “ह” की गूँज की तरह बोलें। क्ष से शुरू हो तो विसर्ग को बिना बदलाव पूरा बोलें (जैसे श्लोक 41: उद्भवः क्षोभणः)।"}}, {"ic": "व्ष", "t": {"en": "Joined letters", "te": "సంయుక్తాక్షరాలు", "hi": "संयुक्ताक्षर"}, "d": {"en": "In a joined letter, say the first letter first and clearly: viṣṇu = vi-ṣ-ṇu, sarva = sar-va. With ha: brahmā is said bra-m-ha, vahni is va-n-hi, jahnu is ja-n-hu.", "te": "సంయుక్తాక్షరంలో ముందు వ్రాసిన అక్షరాన్ని ముందు స్పష్టంగా పలకండి: విష్ణు = వి-ష్-ణు, సర్వ = సర్-వ. “హ” తో: బ్రహ్మా = బ్ర-మ్-హా, వహ్ని = వ-న్-హి, జహ్ను = జ-న్-హు.", "hi": "संयुक्त अक्षर में पहले अक्षर को पहले और साफ बोलें: विष्णु = वि-ष्-णु, सर्व = सर्-व। “ह” के साथ: ब्रह्मा = ब्र-म्-हा, वह्नि = व-न्-हि, जह्नु = ज-न्-हु।"}}, {"ic": "ऽ", "t": {"en": "The curl (avagraha)", "te": "అవగ్రహం", "hi": "अवग्रह"}, "d": {"en": "It stands for a silent \"a\". Say the vowel before it a little longer so the a-sound joins in. Two in a row mean the same, twice. Example: after nyagrodho in verse 88.", "te": "ఇది నిశ్శబ్ద “అ” ను సూచిస్తుంది. దాని ముందు అక్షరాన్ని కొంచెం దీర్ఘంగా పలికితే “అ” ధ్వని కలిసి వస్తుంది. వరుసగా రెండు ఉంటే అదే రెండు సార్లు. ఉదా: శ్లోకం 88 లో “న్యగ్రోధో” తరువాత.", "hi": "यह मौन “अ” का संकेत है। इसके पहले के स्वर को थोड़ा लंबा बोलें ताकि “अ” की ध्वनि मिल जाए। लगातार दो हों तो वही दो बार। उदाहरण: श्लोक 88 में “न्यग्रोधो” के बाद।"}}, {"ic": "★", "t": {"en": "A star", "te": "నక్షత్రం", "hi": "तारा"}, "d": {"en": "A star beside a word means a footnote gives another accepted way to read it. Follow your own guru's way.", "te": "పదం పక్కన ★ ఉంటే, దానిని ఇలా కూడా చదవవచ్చని కింద చిన్న గమనిక ఇవ్వబడుతుంది. మీ గురువు చెప్పినట్లు చదవండి.", "hi": "शब्द के पास ★ हो तो नीचे टिप्पणी में उसे पढ़ने का दूसरा मान्य तरीका दिया होता है। अपने गुरु के अनुसार पढ़ें।"}}, {"ic": "🙏", "t": {"en": "Starting and ending prayer", "te": "ప్రారంభ / చివరి ప్రార్థన", "hi": "आरंभ और समापन प्रार्थना"}, "d": {"en": "The Visvas booklet gives this as a starting and ending prayer, said three times: \"Shree Raama Raama Raameti, Rame Raame Manorame, Sahasra-naama tat-tulyam, Raama-naama Varaanane.\"", "te": "విశ్వాస్ పుస్తకం ప్రారంభ / చివరి ప్రార్థనగా దీనిని మూడు సార్లు ఇస్తుంది: “శ్రీ రామ రామ రామేతి రమే రామే మనోరమే
